const fmt = (n) => '$' + Number(n||0).toLocaleString();

const fmtDate = (raw) => {
  if (!raw) return '—';
  const s = String(raw).trim();
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const now = new Date();
  const today  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((today - target) / 86400000);
  const pad = (n) => String(n).padStart(2, '0');
  const hhmm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (diffDays === 0) return `今天 ${hhmm}`;
  if (diffDays === 1) return `昨天 ${hhmm}`;
  if (diffDays > 1 && diffDays <= 6) return `${diffDays} 天前`;
  if (d.getFullYear() !== now.getFullYear()) {
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hhmm}`;
  }
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hhmm}`;
};

const fmtTravelDate = (raw) => {
  if (!raw) return '未指定';
  const s = String(raw).trim();
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const pad = (n) => String(n).padStart(2, '0');
  const now = new Date();
  if (d.getFullYear() !== now.getFullYear()) {
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  }
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
};

// 用 URL hash 控制 view，重新整理保留位置、且不會觸發頁面跳轉
const readViewFromHash = () => {
  const h = (location.hash || '').replace(/^#\/?/, '');
  return h || '';
};

    active:   'bg-emerald-50 text-emerald-700 border border-emerald-200',
    pending:  'bg-amber-50  text-amber-600  border border-amber-200',
    rejected: 'bg-red-50    text-red-600    border border-red-200',
  };
  const labels = { approved:'已核准', active:'已啟用', pending:'待審核', rejected:'已拒絕' };
  return (
    <span className={`px-3 py-1 rounded-full text-[11px] font-black uppercase ${map[s] || map.pending}`}>
      {labels[s] || status}
    </span>
  );
};

      ...it,
      paymentMode:    it.paymentMode    || it.paymentmode    || 'deposit',
      depositRatio:   it.depositRatio   || it.depositratio   || 20,

      btn.innerHTML = '<span class="spin inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full"></span> AI 解析中…';
      try {
        const res = await fetch(`${WORKER_URL}/api/upload-dm`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ image: ev.target.result })
        });
        const result = await res.json();
        if (result.success) setData(prev => ({ ...prev, ...result.data }));
      } catch(err) { alert('AI 解析失敗：' + err.message); }
      btn.innerHTML = '🤖 AI 解析 DM';
    };
    reader.readAsDataURL(file);
  };

  const handleImageUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const res = await fetch(`${WORKER_URL}/api/upload-image`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ base64: ev.target.result, filename: file.name })
        });
        const result = await res.json();

        </div>
        <div>

function DistModal({ dist, onClose, onApprove, onReject }) {
  if (!dist) return null;
  const fields = [
    ['LINE UID',   dist.uid],
    ['姓名',       dist.name],
    ['電話',       dist.phone],
    ['公司/品牌',  dist.companyname  || dist.companyName],
    ['統一編號',   dist.taxid        || dist.taxId],
    ['LINE 個人',  dist.linelink     || dist.lineLink],
    ['LINE@',      dist.lineatlink   || dist.lineAtLink],
    ['Facebook',   dist.fblink       || dist.fbLink],
    ['網站',       dist.weblink      || dist.webLink],
    ['地圖連結',   dist.maplink      || dist.mapLink],
    ['佣金比例',   dist.commission   ? `${dist.commission}%` : '—'],
    ['累積業績',   (dist.salesrevenue||dist.salesRevenue) ? `$${Number(dist.salesrevenue||dist.salesRevenue).toLocaleString()}` : '$0'],
    ['加入時間',   fmtDate(dist.joindate || dist.joinDate)],
    ['推薦人 UID', dist.ref_uid],
    ['備註',       dist.note],
  ];
  return (
    <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="bg-white rounded-[2rem] w-full max-w-lg max-h-[90vh] overflow-y-auto anim">
        <div className="p-6 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white z-10">
          <div>
            <h3 className="font-black text-xl text-slate-900">{dist.name || '未填寫'}</h3>
            <StatusBadge status={dist.status} />
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
        </div>
        <div className="p-6 space-y-3">
          {fields.map(([label, val]) => val ? (
            <div key={label} className="flex gap-3">
              <span className="text-xs font-black text-slate-400 uppercase w-24 shrink-0 pt-0.5">{label}</span>
              <span className="text-sm font-medium text-slate-700 break-all">{String(val)}</span>
            </div>

        <div className="p-6 pt-0 flex gap-3">
          {String(dist.status).toLowerCase() !== 'approved' ? (
            <button onClick={() => onApprove(dist.uid)}
              className="flex-1 bg-emerald-600 text-white font-black py-3 rounded-2xl hover:bg-emerald-700 transition">
              ✅ 核准加入

          ) : (
            <button onClick={() => onReject(dist.uid)}
              className="flex-1 bg-slate-100 text-slate-500 font-black py-3 rounded-2xl hover:bg-red-50 hover:text-red-500 transition">
              撤銷資格

          <button onClick={onClose}
            className="px-6 bg-slate-100 text-slate-600 font-black py-3 rounded-2xl hover:bg-slate-200 transition">
            關閉
          </button>
        </div>
      </div>
    </div>
  );
}

              <a href={`tel:${order.customerphone}`} className="text-sm font-bold text-blue-600 hover:underline">{order.customerphone || '—'}</a></div>
            {order.customerlineuid && (
              <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">LINE UID</span>
                <span className="text-xs font-mono text-slate-500 break-all">{order.customerlineuid}</span></div>
            )}
            {order.note && (
              <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">備註</span>
                <span className="text-sm text-slate-700">{order.note}</span></div>
            )}
          </div>
        </div>

        {/* ★ v6：金流明細 */}
        <div className="p-6 border-b border-slate-100 bg-gradient-to-br from-amber-50/40 to-white">
          <p className="text-[10px] font-black text-amber-700 uppercase tracking-widest mb-3">💰 金流明細</p>
          {(() => {
            const paymentMode    = String(order.paymentmode || 'deposit').toLowerCase();
            const balanceCollect = String(order.balancecollect || 'online').toLowerCase();
            const depositStatus  = String(order.depositstatus || 'unpaid').toLowerCase();
            const balanceStatus  = String(order.balancestatus || (paymentMode === 'full' ? 'not_required' : 'unpaid')).toLowerCase();

            const PAYMENT_LABEL = {
              credit_card:'信用卡', linepay:'LINE Pay', vacc:'ATM', offline:'線下繳款',
            };
            const STATUS_BADGE = {
              unpaid:        { label:'未付款',  cls:'bg-slate-100 text-slate-500' },
              awaiting_atm:  { label:'等待 ATM 繳款', cls:'bg-amber-50 text-amber-700' },
              paid:          { label:'已付款',  cls:'bg-emerald-50 text-emerald-700' },
              paid_online:   { label:'線上已收', cls:'bg-emerald-50 text-emerald-700' },
              paid_offline:  { label:'線下已收', cls:'bg-emerald-50 text-emerald-700' },
              not_required:  { label:'無需繳尾款', cls:'bg-slate-100 text-slate-400' },
              failed:        { label:'付款失敗', cls:'bg-red-50 text-red-600' },
            };

            return (
              <div className="space-y-3">
                {/* 總額 */}
                <div className="grid grid-cols-3 gap-2 mb-2">
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <p className="text-[10px] font-bold text-slate-400 uppercase">總金額</p>
                    <p className="text-base font-black text-slate-900 mt-1">{fmt(order.totalamount || order.price)}</p>
                  </div>
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <p className="text-[10px] font-bold text-slate-400 uppercase">訂金</p>
                    <p className="text-base font-black text-red-600 mt-1">{fmt(order.depositamount)}</p>
                  </div>
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <p className="text-[10px] font-bold text-slate-400 uppercase">尾款</p>
                    <p className="text-base font-black text-amber-600 mt-1">{fmt(order.balanceamount)}</p>
                  </div>
                </div>

                {/* 訂金狀態 */}
                <div className="bg-white rounded-xl p-3 border border-slate-100">
                  <div className="flex items-center justify-between mb-2">
                    <p className="text-xs font-black text-slate-700">訂金</p>
                    <span className={`px-3 py-1 rounded-full text-[11px] font-black ${(STATUS_BADGE[depositStatus]||STATUS_BADGE.unpaid).cls}`}>
                      {(STATUS_BADGE[depositStatus]||STATUS_BADGE.unpaid).label}
                    </span>
                  </div>
                  {depositStatus === 'paid' && (
                    <div className="text-xs text-slate-500 space-y-0.5">
                      <p>方式：{PAYMENT_LABEL[order.depositmethod] || order.depositmethod || '—'}</p>
                      <p>時間：{order.depositpaidat || '—'}</p>
                      {order.deposittradeno && <p className="font-mono text-[10px]">交易號：{order.deposittradeno}</p>}
                    </div>
                  )}
                </div>

                {/* 尾款狀態 */}
                {paymentMode !== 'full' && (
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <div className="flex items-center justify-between mb-2">
                      <p className="text-xs font-black text-slate-700">
                        尾款
                        <span className="ml-2 text-[10px] font-bold text-slate-400">
                          ({balanceCollect === 'offline' ? '線下收取' : '線上補繳'})
                        </span>
                      </p>
                      <span className={`px-3 py-1 rounded-full text-[11px] font-black ${(STATUS_BADGE[balanceStatus]||STATUS_BADGE.unpaid).cls}`}>
                        {(STATUS_BADGE[balanceStatus]||STATUS_BADGE.unpaid).label}
                      </span>
                    </div>
                    {(balanceStatus === 'paid_online' || balanceStatus === 'paid_offline') && (
                      <div className="text-xs text-slate-500 space-y-0.5">
                        <p>方式：{PAYMENT_LABEL[order.balancemethod] || order.balancemethod || '—'}</p>
                        <p>時間：{order.balancepaidat || '—'}</p>
                        {order.balancetradeno && <p className="font-mono text-[10px]">交易號：{order.balancetradeno}</p>}
                      </div>
                    )}
                    {/* 管理員可標記「線下尾款已收」（balance_collect=offline 才顯示） */}
                    {canEditStatus && balanceCollect === 'offline' && balanceStatus === 'unpaid' && depositStatus === 'paid' && (
                      <button
                        onClick={async () => {
                          if (!confirm('確定標記尾款已收？此操作會自動觸發佣金結算。')) return;
                          setMarkingBalance(true);
                          await onMarkBalancePaid(order.orderid);
                          setMarkingBalance(false);
                        }}
                        disabled={markingBalance}
                        className="w-full mt-3 bg-emerald-600 text-white font-black py-2.5 rounded-xl hover:bg-emerald-700 transition disabled:opacity-50">
                        {markingBalance ? '處理中…' : '✅ 標記尾款已收（線下）'}
                      </button>
                    )}
                  </div>
                )}

                {/* 佣金狀態 */}
                <div className="bg-white rounded-xl p-3 border border-slate-100 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-black text-slate-700">佣金</p>
                    <p className="text-[11px] text-slate-500 mt-0.5">{fmt(order.commissionamount)}</p>
                  </div>
                  {(() => {
                    const cs = String(order.commissionstatus || 'pending').toLowerCase();
                    const map = {
                      pending:  { label:'尚未結算', cls:'bg-slate-100 text-slate-500' },
                      payable:  { label:'可請款',   cls:'bg-blue-50 text-blue-700' },
                      paid_out: { label:'已匯款',   cls:'bg-emerald-50 text-emerald-700' },
                    };
                    const cfg = map[cs] || map.pending;
                    return (
                      <span className={`px-3 py-1 rounded-full text-[11px] font-black ${cfg.cls}`}>
                        {cfg.label}
                      </span>
                    );
                  })()}
                </div>
              </div>
            );
          })()}
        </div>

        <div className="p-6 border-b border-slate-100">
          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">業務歸屬</p>
          <div className="space-y-2">
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">分銷商</span>
              <span className="text-xs font-mono text-slate-500 break-all">{order.distributoruid || '—'}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">應付佣金</span>
              <span className="text-sm font-black text-emerald-600">{fmt(order.commissionamount)}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">建立時間</span>
              <span className="text-xs text-slate-500">{fmtDate(order.createdat)}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">最後更新</span>
              <span className="text-xs text-slate-500">{fmtDate(order.updatedat)}</span></div>
          </div>
        </div>

        {canEditStatus && (
          <div className="p-6 bg-slate-50">
            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">變更訂單狀態</p>
            <div className="grid grid-cols-2 gap-2">
              {Object.entries(ORDER_STATUS).map(([key, cfg]) => {
                const isCurrent = String(order.status).toLowerCase() === key;
                return (
                  <button key={key} onClick={() => handleStatusChange(key)}
                    disabled={isCurrent || updating}
                    className={`py-3 rounded-xl font-black text-sm transition border-2 ${
                      isCurrent
                        ? 'bg-slate-200 text-slate-400 border-slate-200 cursor-default'
                        : 'bg-white border-slate-200 hover:border-blue-400 text-slate-700'
                    }`}>
                    {isCurrent ? '✓ ' : ''}{cfg.label}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div className="p-6 pt-3">
          <button onClick={onClose}
            className="w-full bg-slate-100 text-slate-600 font-black py-3 rounded-2xl hover:bg-slate-200 transition">
            關閉
          </button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// Sidebar / Bottom-tab 共用：選單項目定義
// ══════════════════════════════════════════════════════════════
function buildMenu({ isAdmin, canUpload, badges }) {
  const items = [
    { id:'overview',     icon:'📊', label:'總覽',       show:true },
    { id:'orders',       icon:'📦', label: isAdmin ? '訂單管理' : '我的訂單', show:true,
      badge: badges.pendingOrders },
    { id:'customers',    icon:'👤', label:'我的客戶',   show: !isAdmin },
    { id:'distributors', icon:'👥', label:'分銷商管理', show: isAdmin,
      badge: badges.pendingDist },
    { id:'mine',         icon:'🗂️', label: isAdmin ? '全部行程' : '我的行程',
      show: isAdmin || canUpload },
    { id:'review',       icon:'⚠️', label:'待審核行程', show: isAdmin,
      badge: badges.pendingReview },
    { id:'new',          icon:'📝', label: isAdmin ? '新增行程' : '上稿',
      show: isAdmin || canUpload, isAction:true },
  ];
  return items.filter(it => it.show);
}

// ══════════════════════════════════════════════════════════════
// 主 App
// ══════════════════════════════════════════════════════════════
function App() {
  // 身份
  const [authState, setAuthState] = useState('checking'); // checking | denied | ready
  const [profile,   setProfile]   = useState(null);
  const [isAdmin,   setIsAdmin]   = useState(false);
  const [canUpload, setCanUpload] = useState(false);
  const [isDistApproved, setIsDistApproved] = useState(false);
  const [distData,  setDistData]  = useState(null);

  // 載入
  const [loading, setLoading] = useState(true);

  // 資料（依角色拉，未拉到的 array 保持 [])
  const [stats,         setStats]         = useState(null);    // 業務 getMyStats
  const [orders,        setOrders]        = useState([]);      // 管理員=全部、業務=自己的
  const [distributors,  setDistributors]  = useState([]);      // 管理員
  const [myItems,       setMyItems]       = useState([]);      // 管理員=全部、業務=自己的
  const [pendingItems,  setPendingItems]  = useState([]);      // 管理員
  const [customers,     setCustomers]     = useState([]);      // 業務

  // 視圖狀態
  const [view, setView] = useState('overview');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // 上稿/編輯/審核
  const [editing,    setEditing]    = useState(null);
  const [creating,   setCreating]   = useState(false);
  const [reviewing,  setReviewing]  = useState(null);
  const [reviewNote, setReviewNote] = useState('');
  const [saving,     setSaving]     = useState(false);

  // CRM 篩選
  const [distFilter,    setDistFilter]    = useState('all');
  const [distSearch,    setDistSearch]    = useState('');
  const [orderFilter,   setOrderFilter]   = useState('all');
  const [orderSearch,   setOrderSearch]   = useState('');
  const [customerSearch,setCustomerSearch]= useState('');

  // Modal
  const [selDist,    setSelDist]    = useState(null);
  const [selOrder,   setSelOrder]   = useState(null);
  const [selCustomer,setSelCustomer]= useState(null);
  const [customerOrders,setCustomerOrders] = useState([]);
  const [loadingCustOrders,setLoadingCustOrders] = useState(false);

  // Toast
  const [toast, setToast] = useState(null);
  const showToast = (msg, type='success') => {
    setToast({ msg, type });
    setTimeout(()=>setToast(null), 3000);
  };

  // ── 初始化 ──
  useEffect(() => {
    (async () => {
      try {
        await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        const p = await liff.getProfile();
        setProfile(p);

        // 階段 1：身份檢查
        const statusRes = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${p.userId}`).then(r=>r.json());
        if (!statusRes.success) { setAuthState('denied'); return; }

        const _isAdmin   = !!statusRes.data.isAdmin;
        const _canUpload = !!statusRes.data.canUpload;
        const _isDist    = statusRes.data.role === 'distributor' && String(statusRes.data.status).toLowerCase() === 'approved';
        setIsAdmin(_isAdmin);
        setCanUpload(_canUpload);
        setIsDistApproved(_isDist);
        setDistData(statusRes.data.distributorData);

        if (!_isAdmin && !_isDist) { setAuthState('denied'); return; }

        // ★ URL hash → 視圖（深連結支援），但不能進到無權限的 view
        const initialView = readViewFromHash();
        const allowedViews = buildMenu({
          isAdmin: _isAdmin, canUpload: _canUpload,
          badges: { pendingOrders:0, pendingDist:0, pendingReview:0 }
        }).map(m => m.id);
        if (initialView && allowedViews.includes(initialView)) {
          setView(initialView);
        } else {
          setView('overview');
        }

        setAuthState('ready');

        // 階段 2：依角色並行拉資料
        if (_isAdmin) {
          const [pendingRes, allOrdersRes, distRes, allItemsRes] = await Promise.all([
            fetch(`${WORKER_URL}/api/itineraries?action=getPendingReviews`).then(r=>r.json()),
            fetch(`${WORKER_URL}/api/itineraries?action=getAllOrders`).then(r=>r.json()),
            fetch(`${WORKER_URL}/api/itineraries?action=getDistributors`).then(r=>r.json()),
            fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&all=1`).then(r=>r.json()),
          ]);
          setPendingItems(pendingRes?.data || []);
          setOrders(allOrdersRes?.data || []);
          setDistributors(Array.isArray(distRes) ? distRes : []);
          setMyItems(Array.isArray(allItemsRes) ? allItemsRes : []);
        } else {
          const tasks = [
            fetch(`${WORKER_URL}/api/itineraries?action=getMyStats&uid=${p.userId}`).then(r=>r.json()).catch(()=>({data:null})),
            fetch(`${WORKER_URL}/api/itineraries?action=getMyCustomers&uid=${p.userId}`).then(r=>r.json()).catch(()=>({data:[]})),
            fetch(`${WORKER_URL}/api/itineraries?action=getUserOrders&uid=${p.userId}`).then(r=>r.json()).catch(()=>({data:[]})),
          ];
          if (_canUpload) {
            tasks.push(fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&owner=${p.userId}`).then(r=>r.json()).catch(()=>[]));
          }
          const results = await Promise.all(tasks);
          setStats(results[0]?.data || null);
          setCustomers(results[1]?.data || []);
          const myOrders = (results[2]?.data || []).filter(o => String(o.distributoruid) === String(p.userId));
          setOrders(myOrders);
          if (_canUpload) setMyItems(Array.isArray(results[3]) ? results[3] : []);
        }

        setLoading(false);
      } catch(e) {
        console.error(e);
        setAuthState('denied');
      }
    })();
  }, []);

  // ── view 變動同步到 URL hash（瀏覽器歷史記錄/重整都保留）──
  useEffect(() => {
    if (authState === 'ready') {
      if (location.hash !== '#' + view) {
        // 用 replaceState 避免每次切 view 都產生歷史紀錄
        history.replaceState(null, '', '#' + view);
      }
    }
  }, [view, authState]);

  // ── 切 view 時自動關手機選單 ──
  const goView = (v) => {
    setView(v);
    setMobileMenuOpen(false);
  };

  // ── reload ──
  const reloadItineraries = async () => {
    if (!profile) return;
    if (isAdmin) {
      const [pendingRes, allItemsRes] = await Promise.all([
        fetch(`${WORKER_URL}/api/itineraries?action=getPendingReviews`).then(r=>r.json()),
        fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&all=1`).then(r=>r.json()),
      ]);
      setPendingItems(pendingRes?.data || []);
      setMyItems(Array.isArray(allItemsRes) ? allItemsRes : []);
    } else if (canUpload) {
      const myItemsRes = await fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&owner=${profile.userId}`).then(r=>r.json());
      setMyItems(Array.isArray(myItemsRes) ? myItemsRes : []);
    }
  };

  const handleRefreshAll = async () => {
    if (!profile) return;
    setLoading(true);
    try {
      if (isAdmin) {
        const [pendingRes, allOrdersRes, distRes, allItemsRes] = await Promise.all([
          fetch(`${WORKER_URL}/api/itineraries?action=getPendingReviews`).then(r=>r.json()),
          fetch(`${WORKER_URL}/api/itineraries?action=getAllOrders`).then(r=>r.json()),
          fetch(`${WORKER_URL}/api/itineraries?action=getDistributors`).then(r=>r.json()),
          fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&all=1`).then(r=>r.json()),
        ]);
        setPendingItems(pendingRes?.data || []);
        setOrders(allOrdersRes?.data || []);
        setDistributors(Array.isArray(distRes) ? distRes : []);
        setMyItems(Array.isArray(allItemsRes) ? allItemsRes : []);
      } else {
        const tasks = [
          fetch(`${WORKER_URL}/api/itineraries?action=getMyStats&uid=${profile.userId}`).then(r=>r.json()).catch(()=>({data:null})),
          fetch(`${WORKER_URL}/api/itineraries?action=getMyCustomers&uid=${profile.userId}`).then(r=>r.json()).catch(()=>({data:[]})),
          fetch(`${WORKER_URL}/api/itineraries?action=getUserOrders&uid=${profile.userId}`).then(r=>r.json()).catch(()=>({data:[]})),
        ];
        if (canUpload) tasks.push(fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&owner=${profile.userId}`).then(r=>r.json()).catch(()=>[]));
        const results = await Promise.all(tasks);
        setStats(results[0]?.data || null);
        setCustomers(results[1]?.data || []);
        const myOrders = (results[2]?.data || []).filter(o => String(o.distributoruid) === String(profile.userId));
        setOrders(myOrders);
        if (canUpload) setMyItems(Array.isArray(results[3]) ? results[3] : []);
      }
      showToast('✅ 已更新');
    } catch (e) { showToast('讀取失敗', 'error'); }
    setLoading(false);
  };

  // ── 行程：新增 / 編輯 / 刪除 / 審核 ──
  const handleSave = async (data) => {
    setSaving(true);
    try {
      const isEdit = !!editing;
      const body = {
        action: isEdit ? 'updateItinerary' : 'addItinerary',
        ...data,
        ownerUid: profile.userId,
        ownerName: profile.displayName,
        operatorUid: profile.userId,
      };
      if (isEdit) body.id = editing.id || editing.timestamp;
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const result = await res.json();
      if (result.success) {
        const msg = isAdmin
          ? (isEdit ? '行程已更新' : '行程已上架')
          : (isEdit ? '已修改，待管理員重新審核' : '已提交，待管理員審核');
        showToast('✅ ' + msg);
        setEditing(null);
        setCreating(false);
        await reloadItineraries();
      } else {
        showToast('儲存失敗：' + (result.error||''), 'error');
      }
    } catch(e) { showToast('網路錯誤', 'error'); }
    setSaving(false);
  };

  const handleDelete = async (item) => {
    if (!confirm(`確定刪除「${item.title}」？`)) return;
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'deleteItinerary', id: String(item.id||item.timestamp) })
      });
      const result = await res.json();
      if (result.success) { showToast('已刪除'); await reloadItineraries(); }
      else showToast('刪除失敗', 'error');
    } catch(e) { showToast('操作失敗', 'error'); }
  };

  const handleReview = async (status) => {
    if (!reviewing) return;
    setSaving(true);
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          action:'reviewItinerary',
          id: String(reviewing.id || reviewing.timestamp),
          reviewStatus: status,
          reviewNote: reviewNote || '',
          operatorUid: profile.userId,
        })
      });
      const result = await res.json();
      if (result.success) {
        showToast(status === 'published' ? '✅ 已核准上架' : '已駁回');
        setReviewing(null); setReviewNote('');
        await reloadItineraries();
      } else {
        showToast('審核失敗：' + (result.error||''), 'error');
      }
    } catch(e) { showToast('網路錯誤', 'error'); }
    setSaving(false);
  };

  // ── 分銷商 ──
  const handleApprove = async (uid) => {
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'updateDistributorStatus', uid, status:'approved' })
      });
      const result = await res.json();
      if (result.success) {
        setDistributors(prev => prev.map(d => d.uid === uid ? { ...d, status:'approved' } : d));
        setSelDist(null);
        showToast('✅ 已核准');
      } else showToast('更新失敗', 'error');
    } catch (e) { showToast('操作失敗', 'error'); }
  };

  const handleReject = async (uid) => {
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'updateDistributorStatus', uid, status:'pending' })
      });
      const result = await res.json();
      if (result.success) {
        setDistributors(prev => prev.map(d => d.uid === uid ? { ...d, status:'pending' } : d));
        setSelDist(null);
        showToast('已撤銷資格');
      }
    } catch (e) { showToast('操作失敗', 'error'); }
  };

  const handleToggleUpload = async (uid, canUp) => {
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'grantUploadPermission', uid, canUpload: canUp, operatorUid: profile?.userId || '' })
      });
      const result = await res.json();
      if (result.success) {
        showToast(canUp ? '✅ 已授權上稿' : '已撤銷上稿權');
        setDistributors(prev => prev.map(d =>
          d.uid === uid ? { ...d, canupload: canUp ? 'Y' : 'N', canUpload: canUp ? 'Y' : 'N' } : d
        ));
      } else showToast('操作失敗：' + (result.error || ''), 'error');
    } catch(e) { showToast('網路錯誤', 'error'); }
  };

  // ── 訂單狀態 ──
  const handleUpdateOrderStatus = async (orderId, newStatus) => {
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'updateOrderStatus', order_id: orderId, status: newStatus })
      });
      const result = await res.json();
      if (result.success) {
        showToast(`✅ 已更新為「${ORDER_STATUS[newStatus]?.label || newStatus}」`);
        const nowIso = new Date().toISOString().replace('T', ' ').slice(0, 19);
        setOrders(prev => prev.map(o =>
          o.orderid === orderId ? { ...o, status: newStatus, updatedat: nowIso } : o
        ));
        setSelOrder(prev => prev && prev.orderid === orderId ? { ...prev, status: newStatus, updatedat: nowIso } : prev);
      } else showToast('更新失敗：' + (result.error || ''), 'error');
    } catch (e) { showToast('操作失敗', 'error'); }
  };

  // ★ v6：管理員手動標記「線下尾款已收」
  const handleMarkBalancePaid = async (orderId) => {
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          action:'markBalancePaid',
          order_id: orderId,
          operatorUid: profile?.userId || '',
        })
      });
      const result = await res.json();
      if (result.success) {
        showToast('✅ 尾款已標記，佣金可請款');
        const nowIso = new Date().toISOString().replace('T', ' ').slice(0, 19);
        const patch = {
          balancestatus: 'paid_offline',
          balancepaidat: nowIso,
          balancemethod: 'offline',
          status: 'completed',
          commissionstatus: 'payable',
          commissionsettledat: nowIso,
          updatedat: nowIso,
        };
        setOrders(prev => prev.map(o => o.orderid === orderId ? { ...o, ...patch } : o));
        setSelOrder(prev => prev && prev.orderid === orderId ? { ...prev, ...patch } : prev);
      } else showToast('操作失敗：' + (result.error || ''), 'error');
    } catch (e) { showToast('網路錯誤', 'error'); }
  };

  // ── 客戶 ──
  const openCustomer = async (customer) => {
    setSelCustomer(customer);
    setLoadingCustOrders(true);
    setCustomerOrders([]);
    try {
      const res = await fetch(
        `${WORKER_URL}/api/itineraries?action=getCustomerOrders&uid=${profile.userId}&phone=${encodeURIComponent(customer.customerphone)}`
      ).then(r => r.json());
      setCustomerOrders(res?.data || []);
    } catch (e) { showToast('讀取訂單失敗', 'error'); }
    setLoadingCustOrders(false);
  };

  // ── 推薦碼/連結（業務專屬）──
  const copyInviteLink = () => {
    const code = distData?.inviteCode;
    if (!code) { showToast('尚無推薦碼', 'error'); return; }
    const base = window.location.origin + window.location.pathname.replace(/dashboard\.html|admin\.html|crm\.html$/, '');
    const url = `${base}index.html?invite=${code}`;
    navigator.clipboard.writeText(url).then(() => showToast('✅ 推薦連結已複製'));
  };
  const copyInviteCode = () => {
    const code = distData?.inviteCode;
    if (!code) return;
    navigator.clipboard.writeText(code).then(() => showToast('✅ 推薦碼已複製：' + code));
  };

  // ── 衍生統計 ──
  const thisMonth = new Date().toISOString().slice(0, 7);
  const monthOrders = useMemo(() =>
    orders.filter(o => String(o.createdat||'').startsWith(thisMonth)),
  [orders, thisMonth]);

  const adminStats = useMemo(() => ({
    pendingReview:   pendingItems.length,
    pendingOrders:   orders.filter(o => String(o.status).toLowerCase() === 'pending').length,
    monthRevenue:    monthOrders.reduce((s,o) => s + Number(o.price||0), 0),
    monthCommission: monthOrders.reduce((s,o) => s + Number(o.commissionamount||0), 0),
    totalDist:       distributors.length,
    pendingDist:     distributors.filter(d => String(d.status).toLowerCase() === 'pending').length,
    totalOrders:     orders.length,
    totalItems:      myItems.length,
  }), [pendingItems, orders, monthOrders, distributors, myItems]);

  const orderStats = useMemo(() => ({
    pendingCount:    orders.filter(o => String(o.status).toLowerCase() === 'pending').length,
    monthRevenue:    monthOrders.reduce((s,o) => s + Number(o.price||0), 0),
    monthCommission: monthOrders.reduce((s,o) => s + Number(o.commissionamount||0), 0),
    totalCount:      orders.length,
    completedCommission: orders
      .filter(o => String(o.status).toLowerCase() === 'completed')
      .reduce((s,o) => s + Number(o.commissionamount||0), 0),
  }), [orders, monthOrders]);

  const distCounts = useMemo(() => ({
    all:      distributors.length,
    pending:  distributors.filter(d => String(d.status).toLowerCase() === 'pending').length,
    approved: distributors.filter(d => String(d.status).toLowerCase() === 'approved').length,
  }), [distributors]);

  const orderCounts = useMemo(() => ({
    all:       orders.length,
    pending:   orders.filter(o => String(o.status).toLowerCase() === 'pending').length,
    confirmed: orders.filter(o => String(o.status).toLowerCase() === 'confirmed').length,
    completed: orders.filter(o => String(o.status).toLowerCase() === 'completed').length,
    cancelled: orders.filter(o => String(o.status).toLowerCase() === 'cancelled').length,
  }), [orders]);

  const filteredDist = useMemo(() => distributors.filter(d => {
    const matchStatus = distFilter === 'all' || String(d.status).toLowerCase() === distFilter;
    const matchSearch = !distSearch ||
      String(d.name  || '').toLowerCase().includes(distSearch.toLowerCase()) ||
      String(d.phone || '').includes(distSearch) ||
      String(d.companyname || d.companyName || '').toLowerCase().includes(distSearch.toLowerCase());
    return matchStatus && matchSearch;
  }), [distributors, distFilter, distSearch]);

  const filteredOrders = useMemo(() => orders.filter(o => {
    const matchStatus = orderFilter === 'all' || String(o.status).toLowerCase() === orderFilter;
    const matchSearch = !orderSearch ||
      String(o.orderid || '').toLowerCase().includes(orderSearch.toLowerCase()) ||
      String(o.itinerarytitle || '').toLowerCase().includes(orderSearch.toLowerCase()) ||
      String(o.customername || '').toLowerCase().includes(orderSearch.toLowerCase()) ||
      String(o.customerphone || '').includes(orderSearch);
    return matchStatus && matchSearch;
  }), [orders, orderFilter, orderSearch]);

  const filteredCustomers = useMemo(() => customers.filter(c => {
    if (!customerSearch) return true;
    const q = customerSearch.toLowerCase();
    return String(c.customername || '').toLowerCase().includes(q)
        || String(c.customerphone || '').includes(customerSearch);
  }), [customers, customerSearch]);

  // ════════════════════════════════════════════════════════════
  // 早期 return：checking / denied
  // ════════════════════════════════════════════════════════════
  if (authState === 'checking') {
    return (
      <div className="min-h-screen bg-slate-50 flex">
        <aside className="hidden md:block w-64 bg-white border-r border-slate-200 p-4 space-y-3">
          <div className="flex items-center gap-3 p-3">
            <div className="w-10 h-10 rounded-full bg-slate-200 animate-pulse"/>
            <div className="space-y-2 flex-1">
              <div className="h-3 w-24 bg-slate-200 rounded animate-pulse"/>
              <div className="h-2 w-16 bg-slate-100 rounded animate-pulse"/>
            </div>
          </div>
          {[1,2,3,4].map(i => <div key={i} className="h-10 bg-slate-100 rounded-xl animate-pulse"/>)}
        </aside>
        <main className="flex-1 p-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-6xl">
            {[1,2,3,4].map(i => <div key={i} className="bg-slate-200 animate-pulse h-28 rounded-[1.5rem]"/>)}
          </div>
        </main>
      </div>
    );
  }

  if (authState === 'denied') {
    return (
      <div className="flex items-center justify-center h-screen flex-col gap-3 p-8 text-center">
        <div className="text-6xl">🔒</div>
        <h2 className="text-2xl font-black text-slate-700">無存取權限</h2>
        <p className="text-slate-400 max-w-md">需要管理員身份或已核准的分銷商身份才能進入此頁。</p>
        <a href="index.html" className="mt-4 bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700">
          返回首頁
        </a>
      </div>
    );
  }

  // ════════════════════════════════════════════════════════════
  // 選單
  // ════════════════════════════════════════════════════════════
  const menu = buildMenu({
    isAdmin, canUpload,
    badges: {
      pendingOrders: orderCounts.pending,
      pendingDist:   distCounts.pending,
      pendingReview: pendingItems.length,
    }
  });

  // 點「新增/上稿」這種行為按鈕：直接開新增 modal，不切 view
  const handleMenuClick = (item) => {
    if (item.id === 'new') {
      setEditing(null);
      setCreating(true);
      // 同時導到 mine view 比較好回看
      goView('mine');
      return;
    }
    goView(item.id);
  };

  const SidebarBadge = ({ n }) =>
    n > 0 ? <span className="ml-auto text-[10px] bg-amber-500 text-white font-black px-2 py-0.5 rounded-full">{n}</span> : null;

  // ════════════════════════════════════════════════════════════
  return (
    <div className="min-h-screen bg-slate-50 md:flex">

      {/* ════════════════════════════════════════════════════════
          PC 左側 Sidebar
          ════════════════════════════════════════════════════════ */}
      <aside className="hidden md:flex md:flex-col md:w-64 md:h-screen md:sticky md:top-0 bg-white border-r border-slate-200">
        {/* 名片區 */}
        <div className="p-5 border-b border-slate-100">
          <div className="flex items-center gap-3 mb-3">
            {profile && <img src={profile.pictureUrl} className="w-11 h-11 rounded-full"/>}
            <div className="min-w-0 flex-1">
              <p className="font-black text-sm text-slate-900 truncate">{profile?.displayName}</p>
              <p className="text-[11px] text-slate-400 font-bold truncate">
                {isAdmin ? '管理員' : (canUpload ? '分銷商（可上稿）' : '分銷商')}
              </p>
            </div>
          </div>
          <a href="index.html"
            className="block w-full text-center bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold text-xs transition">
            ← 會員中心
          </a>
        </div>

        {/* 選單 */}
        <nav className="flex-1 overflow-y-auto p-3 space-y-1 no-scrollbar">
          {menu.map(item => (
            <button key={item.id}
              onClick={() => handleMenuClick(item)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold transition ${
                view === item.id && !item.isAction
                  ? 'bg-blue-50 text-blue-700'
                  : 'text-slate-600 hover:bg-slate-50'
              }`}>
              <span className="text-base">{item.icon}</span>
              <span className="flex-1 text-left">{item.label}</span>
              <SidebarBadge n={item.badge} />
            </button>
          ))}
        </nav>

        {/* 底部操作 */}
        <div className="p-3 border-t border-slate-100">
          <button onClick={handleRefreshAll}
            className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl font-bold text-xs transition">
            🔄 重新整理
          </button>
        </div>
      </aside>

      {/* ════════════════════════════════════════════════════════
          手機 頂部 Header（簡化版）+ 漢堡
          ════════════════════════════════════════════════════════ */}
      <div className="md:hidden glass sticky top-0 z-40 border-b border-slate-200">
        <div className="px-4 py-3 flex items-center gap-3">
          {profile && <img src={profile.pictureUrl} className="w-9 h-9 rounded-full"/>}
          <div className="min-w-0 flex-1">
            <p className="font-black text-sm text-slate-900 truncate">{profile?.displayName}</p>
            <p className="text-[10px] text-slate-400 font-bold truncate">
              {isAdmin ? '管理員' : (canUpload ? '分銷商（可上稿）' : '分銷商')}
            </p>
          </div>
          <a href="index.html" className="text-xs font-bold text-slate-500 px-2">← 會員</a>
        </div>
      </div>

      {/* ════════════════════════════════════════════════════════
          主內容
          ════════════════════════════════════════════════════════ */}
      <main className="flex-1 min-w-0 pb-24 md:pb-0">
        <div className="max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-8">

          {/* 頂部標題（隨 view 變動）*/}
          <div className="mb-6 flex items-center justify-between gap-3">
            <h1 className="font-black text-2xl md:text-3xl text-slate-900">
              {(menu.find(m => m.id === view) || menu[0]).icon}{' '}
              {(menu.find(m => m.id === view) || menu[0]).label}
            </h1>
            <button onClick={handleRefreshAll}
              className="md:hidden bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-blue-700 transition">
              重新整理
            </button>
          </div>

          {/* ── 總覽 ── */}
          {view === 'overview' && (
            <div className="space-y-8 anim">
              {/* 業務專屬：推薦碼卡片 */}
              {!isAdmin && distData?.inviteCode && (
                <div className="bg-gradient-to-br from-blue-600 to-purple-600 text-white p-6 rounded-[2rem] shadow-lg">
                  <div className="flex items-center justify-between gap-4 flex-wrap">
                    <div className="min-w-0">
                      <p className="text-xs font-bold opacity-80 uppercase tracking-widest mb-1">我的推薦碼</p>
                      <p className="text-4xl font-black tracking-widest font-mono">{distData.inviteCode}</p>
                      <p className="text-xs opacity-80 mt-2">
                        佣金率：{distData.commission || 0}% · 透過此碼成交的客戶會自動歸入您的客戶名單
                      </p>
                    </div>
                    <div className="flex gap-2 shrink-0">
                      <button onClick={copyInviteCode}
                        className="bg-white/20 hover:bg-white/30 backdrop-blur text-white px-4 py-2.5 rounded-xl font-black text-sm transition">
                        複製碼
                      </button>
                      <button onClick={copyInviteLink}
                        className="bg-white text-blue-600 hover:bg-slate-50 px-4 py-2.5 rounded-xl font-black text-sm transition shadow-lg">
                        複製推廣連結
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 數字儀表板 */}
              {isAdmin ? (
                <div>
                  <h2 className="font-black text-lg text-slate-900 mb-3">本月概況</h2>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <StatCard color="bg-amber-500"   num={adminStats.pendingReview}     label="待審核行程" hint="上稿審核佇列"   loading={loading}/>
                    <StatCard color="bg-red-500"     num={adminStats.pendingOrders}     label="待處理訂單" hint="新訂單未確認"   loading={loading}/>
                    <StatCard color="bg-emerald-600" num={fmt(adminStats.monthRevenue)} label="本月成交金額" hint={`${adminStats.totalOrders} 張總訂單`} loading={loading}/>
                    <StatCard color="bg-blue-600"    num={fmt(adminStats.monthCommission)} label="本月佣金支出" hint="累計待支付分銷商"  loading={loading}/>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">
                    <StatCard color="bg-slate-800" num={adminStats.totalDist}
                      label="分銷商總數"
                      hint={adminStats.pendingDist > 0 ? `${adminStats.pendingDist} 待審核` : '全部已核准'}
                      loading={loading}/>
                    <StatCard color="bg-slate-700" num={adminStats.totalItems} label="行程總數"  loading={loading}/>
                    <StatCard color="bg-slate-600" num={adminStats.totalOrders} label="累計訂單" loading={loading}/>
                  </div>
                </div>
              ) : (
                <div>
                  <h2 className="font-black text-lg text-slate-900 mb-3">本月業績</h2>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <StatCard color="bg-blue-600"    num={stats?.month?.count || 0}        label="本月成交筆數"  loading={loading}/>
                    <StatCard color="bg-emerald-600" num={fmt(stats?.month?.revenue)}      label="本月推廣金額"  loading={loading}/>
                    <StatCard color="bg-amber-500"   num={fmt(stats?.month?.commission)}   label="本月應得佣金" hint="含未完成訂單" loading={loading}/>
                    <StatCard color="bg-slate-800"   num={fmt(stats?.total?.completedCommission)} label="已賺取佣金" hint="僅計已完成訂單" loading={loading}/>
                  </div>
                  <h2 className="font-black text-lg text-slate-900 mb-3 mt-6">累計</h2>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <StatCard color="bg-slate-700" num={stats?.total?.count || 0}      label="累計成交筆數"  loading={loading}/>
                    <StatCard color="bg-slate-700" num={fmt(stats?.total?.revenue)}    label="累計推廣金額"  loading={loading}/>
                    <StatCard color="bg-purple-600" num={stats?.customerCount || customers.length} label="我的客戶數" loading={loading}/>
                  </div>
                </div>
              )}

              {/* 業務最近客戶 */}
              {!isAdmin && (loading || customers.length > 0) && (
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="font-black text-lg text-slate-900">最近客戶</h2>
                    {!loading && (
                      <button onClick={() => goView('customers')} className="text-blue-600 font-bold text-sm hover:underline">
                        全部 ({customers.length}) →
                      </button>
                    )}
                  </div>
                  <div className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden">
                    {loading ? (
                      [1,2,3].map(i => (
                        <div key={i} className="p-4 border-b border-slate-50 last:border-b-0 flex items-center justify-between gap-3">
                          <div className="space-y-2">
                            <div className="h-4 w-24 bg-slate-200 rounded animate-pulse"/>
                            <div className="h-3 w-32 bg-slate-100 rounded animate-pulse"/>
                          </div>
                          <div className="h-5 w-16 bg-slate-200 rounded animate-pulse"/>
                        </div>
                      ))
                    ) : customers.slice(0, 5).map((c, idx) => (
                      <div key={idx}
                        className="p-4 border-b border-slate-50 last:border-b-0 flex items-center justify-between gap-3 hover:bg-slate-50 transition cursor-pointer"
                        onClick={() => openCustomer(c)}>
                        <div className="min-w-0">
                          <p className="font-black text-slate-800 text-sm">{c.customername || '—'}</p>
                          <p className="text-xs text-slate-400 mt-0.5">{c.customerphone}</p>
                        </div>
                        <div className="text-right shrink-0">
                          <p className="font-black text-emerald-600">{fmt(c.totalamount)}</p>
                          <p className="text-xs text-slate-400 mt-0.5">{c.totalorders || 0} 筆</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 管理員：需要處理 */}
              {isAdmin && (pendingItems.length > 0 || adminStats.pendingDist > 0) && (
                <div>
                  <h2 className="font-black text-lg text-slate-900 mb-3">需要您處理</h2>
                  <div className="grid md:grid-cols-2 gap-4">
                    {pendingItems.length > 0 && (
                      <button onClick={()=>goView('review')}
                        className="text-left bg-amber-50 border-2 border-amber-200 p-5 rounded-[1.5rem] hover:bg-amber-100 transition">
                        <p className="text-3xl font-black text-amber-700">{pendingItems.length}</p>
                        <p className="font-bold text-amber-700 mt-1">待審核行程</p>
                        <p className="text-xs text-amber-600 mt-2">點擊去審核 →</p>
                      </button>
                    )}
                    {adminStats.pendingDist > 0 && (
                      <button onClick={()=>goView('distributors')}
                        className="text-left bg-blue-50 border-2 border-blue-200 p-5 rounded-[1.5rem] hover:bg-blue-100 transition">
                        <p className="text-3xl font-black text-blue-700">{adminStats.pendingDist}</p>
                        <p className="font-bold text-blue-700 mt-1">待審核分銷商</p>
                        <p className="text-xs text-blue-600 mt-2">點擊去審核 →</p>
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── 訂單 ── */}
          {view === 'orders' && (
            <div className="space-y-6 anim">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <StatCard color="bg-amber-500"   num={orderStats.pendingCount}       label="待處理訂單" loading={loading}/>
                <StatCard color="bg-blue-600"    num={fmt(orderStats.monthRevenue)}  label={isAdmin ? '本月成交金額' : '本月推廣金額'} loading={loading}/>
                <StatCard color="bg-emerald-600" num={fmt(isAdmin ? orderStats.monthCommission : orderStats.completedCommission)}
                  label={isAdmin ? '本月佣金支出' : '已賺取佣金（已完成）'} loading={loading}/>
                <StatCard color="bg-slate-800"   num={orderStats.totalCount} label="訂單總數" loading={loading}/>
              </div>

              <div className="flex flex-col md:flex-row gap-3">
                <div className="flex gap-1 bg-white border border-slate-200 rounded-xl p-1 overflow-x-auto">
                  {[
                    { key:'all',       label:'全部' },
                    { key:'pending',   label:'待處理' },
                    { key:'confirmed', label:'已確認' },
                    { key:'completed', label:'已完成' },
                    { key:'cancelled', label:'已取消' },
                  ].map(f => (
                    <button key={f.key} onClick={() => setOrderFilter(f.key)}
                      className={`px-3 py-2 rounded-lg text-xs font-black whitespace-nowrap transition ${
                        orderFilter === f.key ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-100'
                      }`}>
                      {f.label} <span className="ml-1 opacity-70">{orderCounts[f.key] || 0}</span>
                    </button>
                  ))}
                </div>
                <input value={orderSearch} onChange={e => setOrderSearch(e.target.value)}
                  placeholder="搜尋訂單號、行程、客戶姓名、電話..."
                  className="flex-1 p-3 border-2 border-slate-200 rounded-xl font-medium outline-none focus:border-blue-500 bg-white" />
              </div>

              <div className="bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm">
                {loading ? (
                  <div className="p-20 text-center">
                    <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
                    <p className="text-slate-400 font-bold text-sm">載入中...</p>
                  </div>
                ) : filteredOrders.length === 0 ? (
                  <div className="p-20 text-center text-slate-300 font-bold">
                    {orderSearch || orderFilter !== 'all'
                      ? '無符合條件的訂單'
                      : (isAdmin ? '目前無訂單資料' : '您尚未推廣出任何訂單')}
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead className="bg-slate-50 text-[10px] text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                        <tr>
                          <th className="p-4">訂單號 / 時間</th>
                          <th className="p-4">行程 / 客戶</th>
                          <th className="p-4">人數 / 出發日</th>
                          <th className="p-4 text-right">金額</th>
                          <th className="p-4 text-right">{isAdmin ? '應付佣金' : '我的佣金'}</th>
                          <th className="p-4">付款</th>
                          <th className="p-4">狀態</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredOrders.map((o, idx) => {
                          const ds = String(o.depositstatus || 'unpaid').toLowerCase();
                          const bs = String(o.balancestatus || 'unpaid').toLowerCase();
                          const pm = String(o.paymentmode || 'deposit').toLowerCase();
                          // 付款狀態彙總顯示
                          let payLabel, payCls;
                          if (ds === 'unpaid') {
                            payLabel = '未付款'; payCls = 'bg-slate-100 text-slate-500';
                          } else if (ds === 'awaiting_atm' || bs === 'awaiting_atm') {
                            payLabel = '等 ATM'; payCls = 'bg-amber-50 text-amber-700';
                          } else if (ds === 'failed') {
                            payLabel = '付款失敗'; payCls = 'bg-red-50 text-red-600';
                          } else if (pm === 'full') {
                            payLabel = '已付清'; payCls = 'bg-emerald-50 text-emerald-700';
                          } else if (bs === 'paid_online' || bs === 'paid_offline') {
                            payLabel = '已付清'; payCls = 'bg-emerald-50 text-emerald-700';
                          } else if (ds === 'paid') {
                            payLabel = '訂金已付'; payCls = 'bg-blue-50 text-blue-700';
                          } else {
                            payLabel = '—'; payCls = 'bg-slate-50 text-slate-400';
                          }
                          return (
                            <tr key={idx} className="hover:bg-slate-50 transition cursor-pointer"
                              onClick={() => setSelOrder(o)}>
                              <td className="p-4">
                                <p className="font-mono text-xs font-bold text-slate-700">{o.orderid}</p>
                                <p className="text-[10px] text-slate-400 mt-0.5">{fmtDate(o.createdat)}</p>
                              </td>
                              <td className="p-4 max-w-[200px]">
                                <p className="font-black text-sm text-slate-800 line-clamp-1">{o.itinerarytitle || '—'}</p>
                                <p className="text-xs text-slate-500 mt-0.5">
                                  {o.customername || '—'}{o.customerphone && ` · ${o.customerphone}`}
                                </p>
                              </td>
                              <td className="p-4 text-sm">
                                <p className="font-bold text-slate-700">{o.travelers || 1} 人</p>
                                <p className="text-xs text-slate-400 mt-0.5">{fmtTravelDate(o.traveldate)}</p>
                              </td>
                              <td className="p-4 text-right font-black text-red-600">{fmt(o.totalamount || o.price)}</td>
                              <td className="p-4 text-right font-bold text-emerald-600 text-sm">{fmt(o.commissionamount)}</td>
                              <td className="p-4">
                                <span className={`px-2.5 py-1 rounded-full text-[10px] font-black ${payCls}`}>
                                  {payLabel}
                                </span>
                              </td>
                              <td className="p-4"><OrderStatusBadge status={o.status} /></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── 我的客戶（業務）── */}
          {view === 'customers' && !isAdmin && (
            <div className="space-y-6 anim">
              <div className="grid grid-cols-3 gap-4">
                <StatCard color="bg-blue-600"    num={customers.length}
                  label="累計客戶數" loading={loading}/>
                <StatCard color="bg-emerald-600" num={fmt(customers.reduce((s,c)=>s+Number(c.totalamount||0),0))}
                  label="客戶累計貢獻" loading={loading}/>
                <StatCard color="bg-slate-800"   num={customers.length > 0
                    ? fmt(Math.round(
                        customers.reduce((s,c)=>s+Number(c.totalamount||0),0) /
                        Math.max(1, customers.reduce((s,c)=>s+Number(c.totalorders||0),0))
                      ))
                    : '$0'}
                  label="平均單價" loading={loading}/>
              </div>

              <input value={customerSearch} onChange={e => setCustomerSearch(e.target.value)}
                placeholder="搜尋客戶姓名、電話..."
                className="w-full p-4 border-2 border-slate-200 rounded-2xl font-medium outline-none focus:border-blue-500 bg-white" />

              <div className="bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm">
                {loading ? (
                  <div className="p-20 text-center">
                    <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
                    <p className="text-slate-400 font-bold text-sm">載入中...</p>
                  </div>
                ) : filteredCustomers.length === 0 ? (
                  <div className="p-20 text-center text-slate-300 font-bold">
                    {customerSearch ? '無符合條件的客戶' : '您尚未帶進任何客戶 · 透過推廣連結成交後客戶將出現在這裡'}
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead className="bg-slate-50 text-[10px] text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                        <tr>
                          <th className="p-4">客戶</th>
                          <th className="p-4">電話</th>
                          <th className="p-4 text-right">訂單數</th>
                          <th className="p-4 text-right">累計金額</th>
                          <th className="p-4">最後下單</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredCustomers.map((c, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 transition cursor-pointer"
                            onClick={() => openCustomer(c)}>
                            <td className="p-4">
                              <p className="font-black text-sm text-slate-800">{c.customername || '—'}</p>
                              {c.source === 'direct' && (
                                <p className="text-[10px] text-slate-400 mt-0.5">自然客</p>
                              )}
                            </td>
                            <td className="p-4">
                              <a href={`tel:${c.customerphone}`} onClick={(e) => e.stopPropagation()}
                                className="text-sm text-blue-600 hover:underline font-medium">
                                {c.customerphone || '—'}
                              </a>
                            </td>
                            <td className="p-4 text-right font-bold text-slate-700">{c.totalorders || 0}</td>
                            <td className="p-4 text-right font-black text-emerald-600">{fmt(c.totalamount)}</td>
                            <td className="p-4 text-xs text-slate-500">{fmtDate(c.lastorderat)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── 分銷商管理（管理員）── */}
          {view === 'distributors' && isAdmin && (
            <div className="space-y-6 anim">
              <div className="grid grid-cols-3 gap-4">
                {[
                  { label:'全部申請', key:'all',      color:'bg-slate-800',  num: distCounts.all },
                  { label:'待審核',   key:'pending',  color:'bg-amber-500',  num: distCounts.pending },
                  { label:'已核准',   key:'approved', color:'bg-emerald-600',num: distCounts.approved },
                ].map(c => (
                  <button key={c.key} onClick={() => setDistFilter(c.key)}
                    className={`${c.color} text-white p-5 rounded-[1.5rem] text-left transition ${distFilter===c.key ? 'ring-4 ring-offset-2 ring-slate-400' : 'opacity-90 hover:opacity-100'}`}>
                    {loading
                      ? <span className="inline-block bg-white/30 rounded animate-pulse w-12 h-9"/>
                      : <p className="text-3xl font-black">{c.num}</p>}
                    <p className="text-sm font-bold opacity-80 mt-1">{c.label}</p>
                  </button>
                ))}
              </div>

              <input value={distSearch} onChange={e => setDistSearch(e.target.value)}
                placeholder="搜尋姓名、電話、公司..."
                className="w-full p-4 border-2 border-slate-200 rounded-2xl font-medium outline-none focus:border-blue-500 bg-white" />

              <div className="bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm">
                {loading ? (
                  <div className="p-20 text-center">
                    <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
                    <p className="text-slate-400 font-bold text-sm">載入中...</p>
                  </div>
                ) : filteredDist.length === 0 ? (
                  <div className="p-20 text-center text-slate-300 font-bold">
                    {distSearch || distFilter !== 'all' ? '無符合條件的資料' : '目前無申請資料'}
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead className="bg-slate-50 text-[10px] text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                        <tr>
                          <th className="p-5">申請人</th>
                          <th className="p-5">公司/品牌</th>
                          <th className="p-5">推薦人</th>
                          <th className="p-5">累積業績</th>
                          <th className="p-5">上稿權</th>
                          <th className="p-5">狀態</th>
                          <th className="p-5 text-right">操作</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredDist.map((d, idx) => {
                          const canUp = String(d.canupload || d.canUpload || '').toUpperCase() === 'Y';
                          const isApproved = String(d.status).toLowerCase() === 'approved';
                          return (
                            <tr key={idx} className="hover:bg-slate-50 transition cursor-pointer"
                              onClick={() => setSelDist(d)}>
                              <td className="p-5">
                                <p className="font-black text-slate-800">{d.name || '未填寫'}</p>
                                <p className="text-xs text-slate-400 mt-0.5">{d.phone || '無電話'}</p>
                              </td>
                              <td className="p-5 text-sm text-slate-600">{d.companyname || d.companyName || '—'}</td>
                              <td className="p-5 font-mono text-[10px] text-slate-300 max-w-[80px] truncate"
                                title={d.ref_uid}>{d.ref_uid || '—'}</td>
                              <td className="p-5 font-black text-slate-700">
                                ${Number(d.salesrevenue || d.salesRevenue || 0).toLocaleString()}
                              </td>
                              <td className="p-5" onClick={e => e.stopPropagation()}>
                                {isApproved ? (
                                  <button onClick={() => handleToggleUpload(d.uid, !canUp)}
                                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition ${
                                      canUp ? 'bg-blue-600' : 'bg-slate-300'
                                    }`}
                                    title={canUp ? '已授權上稿（點擊撤銷）' : '未授權（點擊授權）'}>
                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition ${
                                      canUp ? 'translate-x-6' : 'translate-x-1'
                                    }`}/>
                                  </button>
                                ) : (
                                  <span className="text-xs text-slate-300">—</span>
                                )}
                              </td>
                              <td className="p-5"><StatusBadge status={d.status} /></td>
                              <td className="p-5 text-right" onClick={e => e.stopPropagation()}>
                                {!isApproved ? (
                                  <button onClick={() => handleApprove(d.uid)}
                                    className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-black hover:bg-emerald-700 transition">
                                    核准
                                  </button>
                                ) : (
                                  <button onClick={() => handleReject(d.uid)}
                                    className="text-slate-300 hover:text-red-500 transition text-xs font-bold px-2">
                                    撤銷
                                  </button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              <div className="bg-blue-50 border border-blue-100 rounded-[1.5rem] p-6 flex justify-between items-center flex-wrap gap-3">
                <div>
                  <p className="font-black text-blue-900">分銷商申請入口</p>
                  <p className="text-blue-600 text-sm font-medium mt-1">分享此連結給想申請的業務夥伴</p>
                </div>
                <button onClick={() => {
                  const url = `${window.location.origin}${window.location.pathname.replace(/dashboard\.html|admin\.html|crm\.html$/,'')}register.html?a=demo`;
                  navigator.clipboard.writeText(url).then(() => showToast('連結已複製！'));
                }} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm hover:bg-blue-700 transition">
                  複製申請連結
                </button>
              </div>
            </div>
          )}

          {/* ── 我的/全部行程 ── */}
          {view === 'mine' && (isAdmin || canUpload) && (
            <div className="space-y-3 anim">
              <div className="flex justify-between items-center mb-3">
                <h2 className="font-black text-lg text-slate-900">
                  共 {myItems.length} 筆
                </h2>
                <button onClick={()=>{ setCreating(true); setEditing(null); }}
                  className="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm hover:bg-blue-700 transition">
                  + 新增行程
                </button>
              </div>

              {myItems.length === 0 ? (
                <div className="p-20 bg-white rounded-[2rem] text-center border-2 border-dashed border-slate-200">
                  <p className="text-slate-300 font-bold mb-2">尚無行程</p>
                  <button onClick={()=>setCreating(true)}
                    className="text-blue-600 font-black hover:underline">+ 新增第一個行程</button>
                </div>
              ) : myItems.map(item => {
                const status = String(item.reviewstatus || 'published').toLowerCase();
                const statusCfg = {
                  published:      { label:'已上架', cls:'bg-emerald-50 text-emerald-700 border-emerald-200' },
                  pending_review: { label:'待審核', cls:'bg-amber-50 text-amber-600 border-amber-200' },
                  rejected:       { label:'已駁回', cls:'bg-red-50 text-red-600 border-red-200' },
                }[status] || { label:'已上架', cls:'bg-emerald-50 text-emerald-700 border-emerald-200' };

                return (
                  <div key={item.id||item.timestamp} className="bg-white rounded-[2rem] border border-slate-100 p-4 flex gap-4 hover:shadow-md transition">
                    {item.image && <img src={item.image} className="w-32 h-24 object-cover rounded-xl shrink-0" />}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <h3 className="font-black text-slate-900 line-clamp-1">{item.title}</h3>
                          <p className="text-xs text-slate-400 mt-0.5">
                            {item.region} · {item.days}天 · {fmt(item.price)}
                          </p>
                          {isAdmin && item.ownername && (
                            <p className="text-xs text-slate-500 mt-1">📝 上稿者：{item.ownername}</p>
                          )}
                        </div>
                        <span className={`px-3 py-1 rounded-full text-xs font-black border shrink-0 ${statusCfg.cls}`}>
                          {statusCfg.label}
                        </span>
                      </div>
                      {status === 'rejected' && item.reviewnote && (
                        <p className="text-xs text-red-600 mt-2 bg-red-50 px-3 py-2 rounded-lg">
                          ⚠️ 駁回理由：{item.reviewnote}
                        </p>
                      )}
                      <div className="mt-3 flex gap-2">
                        <button onClick={()=>{ setEditing(item); setCreating(false); }}
                          className="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded-lg text-xs font-bold">
                          ✏️ 編輯
                        </button>
                        <button onClick={()=>handleDelete(item)}
                          className="text-red-500 hover:bg-red-50 px-3 py-1 rounded-lg text-xs font-bold">
                          🗑️ 刪除
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* ── 待審核（管理員）── */}
          {view === 'review' && isAdmin && (
            <div className="space-y-3 anim">
              {pendingItems.length === 0 ? (
                <div className="p-20 bg-white rounded-[2rem] text-center border-2 border-dashed border-slate-200">
                  <p className="text-slate-300 font-bold">🎉 沒有待審核的行程</p>
                </div>
              ) : pendingItems.map(item => (
                <div key={item.id||item.timestamp} className="bg-white rounded-[2rem] border-2 border-amber-200 p-4 flex gap-4 hover:shadow-md transition cursor-pointer"
                  onClick={()=>{ setReviewing(item); setReviewNote(''); }}>
                  {item.image && <img src={item.image} className="w-32 h-24 object-cover rounded-xl shrink-0" />}
                  <div className="flex-1 min-w-0">
                    <h3 className="font-black text-slate-900 line-clamp-1">{item.title}</h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      {item.region} · {item.days}天 · {fmt(item.price)}
                    </p>
                    <p className="text-xs text-slate-600 mt-1">📝 上稿者：{item.ownername || '(未提供)'}</p>
                    <p className="text-xs text-slate-400 line-clamp-2 mt-2">
                      {String(item.description||'').replace(/!\[[^\]]*\]\([^)]+\)/g,'').slice(0, 100)}…
                    </p>
                    <button className="mt-3 bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-black hover:bg-blue-700">
                      🔍 開始審核
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

        </div>
      </main>

      {/* ════════════════════════════════════════════════════════
          手機底部 Tab Bar（fixed）
          ════════════════════════════════════════════════════════ */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 shadow-2xl">
        <div className="flex overflow-x-auto no-scrollbar">
          {menu.map(item => {
            const active = view === item.id && !item.isAction;
            return (
              <button key={item.id} onClick={() => handleMenuClick(item)}
                className={`flex-1 min-w-[64px] py-2.5 px-1 flex flex-col items-center justify-center gap-0.5 transition relative ${
                  active ? 'text-blue-600' : 'text-slate-400'
                }`}>
                <span className="text-lg">{item.icon}</span>
                <span className={`text-[10px] font-black truncate max-w-full px-0.5 ${active ? 'text-blue-600' : 'text-slate-500'}`}>
                  {item.label}
                </span>
                {item.badge > 0 && (
                  <span className="absolute top-1 right-1/2 translate-x-3 bg-amber-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full">
                    {item.badge > 99 ? '99+' : item.badge}
                  </span>
                )}
                {active && <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-blue-600 rounded-b-full"/>}
              </button>
            );
          })}
        </div>
      </nav>

      {/* ════════════════════════════════════════════════════════
          Modals
          ════════════════════════════════════════════════════════ */}

      {/* 新增/編輯 行程 */}
      {(creating || editing) && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={e => e.target===e.currentTarget && (saving ? null : (setCreating(false), setEditing(null)))}>
          <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim">
            <div className="p-6 border-b border-slate-100 sticky top-0 bg-white z-10 flex justify-between items-center">
              <h2 className="font-black text-xl">
                {editing ? '✏️ 編輯行程' : '📝 新增行程'}
              </h2>
              <button onClick={()=>{ if(saving) return; setCreating(false); setEditing(null); }}
                className="w-9 h-9 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="p-6">
              {!isAdmin && (
                <div className="bg-amber-50 border-2 border-amber-200 rounded-xl p-3 mb-5 text-xs font-bold text-amber-700">
                  ℹ️ 您是分銷商，{editing ? '修改' : '新增'}的行程需經管理員審核才會上架
                </div>
              )}
              <ItineraryForm
                initial={editing}
                onSave={handleSave}
                onCancel={()=>{ if(saving) return; setCreating(false); setEditing(null); }}
                saving={saving}
              />
            </div>
          </div>
        </div>
      )}

      {/* 審核 Modal */}
      {reviewing && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={e => e.target===e.currentTarget && setReviewing(null)}>
          <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim">
            <div className="p-6 border-b border-slate-100 sticky top-0 bg-white z-10 flex justify-between items-center">
              <h2 className="font-black text-xl">🔍 審核行程</h2>
              <button onClick={()=>setReviewing(null)}
                className="w-9 h-9 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="p-6 space-y-4">
              {reviewing.image && <img src={reviewing.image} className="w-full aspect-video object-cover rounded-2xl" />}
              <div>
                <h3 className="font-black text-2xl text-slate-900">{reviewing.title}</h3>
                <p className="text-sm text-slate-500 mt-1">
                  {reviewing.region} · {reviewing.days}天 · {fmt(reviewing.price)}
                </p>
                <p className="text-sm text-slate-600 mt-2">📝 上稿者：{reviewing.ownername}</p>
              </div>
              <div className="bg-slate-50 rounded-2xl p-4 max-h-64 overflow-y-auto">
                <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">行程內容</p>
                <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">
                  {String(reviewing.description||'').replace(/!\[([^\]]*)\]\([^)]+\)/g,'[圖片：$1]')}
                </p>
              </div>
              {reviewing.notes && (
