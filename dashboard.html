                <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl">
                  <p className="text-xs font-black text-amber-700 uppercase mb-1">注意事項</p>
                  <p className="text-sm text-amber-900">{reviewing.notes}</p>
                </div>
              )}
              <div>
                <label className="text-xs font-black text-slate-400 uppercase tracking-widest">審核備註（駁回時必填）</label>
                <textarea rows="2" value={reviewNote} onChange={e=>setReviewNote(e.target.value)}
                  placeholder="駁回時請說明原因…"
                  className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl text-sm outline-none focus:border-blue-500" />
              </div>
              <div className="flex gap-3 pt-2">
                <button onClick={()=>{
                  if (!reviewNote.trim()) { alert('駁回需要填寫理由'); return; }
                  if (confirm('確定駁回此行程？')) handleReview('rejected');
                }} disabled={saving}
                  className="flex-1 bg-red-50 text-red-600 font-black py-3 rounded-2xl hover:bg-red-100 transition disabled:opacity-50">
                  ❌ 駁回
                </button>
                <button onClick={()=>{ if (confirm('確定核准上架？')) handleReview('published'); }}
                  disabled={saving}
                  className="flex-[2] bg-emerald-600 text-white font-black py-3 rounded-2xl hover:bg-emerald-700 transition disabled:opacity-50">
                  ✅ 核准上架
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 分銷商詳情 */}
      {selDist && (
        <DistModal
          dist={selDist}
          onClose={() => setSelDist(null)}
          onApprove={handleApprove}
          onReject={handleReject}
        />
      )}

      {/* 訂單詳情 */}
      {selOrder && (
        <OrderModal
          order={selOrder}
          onClose={() => setSelOrder(null)}
          onUpdateStatus={handleUpdateOrderStatus}
          onMarkBalancePaid={handleMarkBalancePaid}
          canEditStatus={isAdmin}
        />
      )}

      {/* 客戶訂單明細 Modal */}
      {selCustomer && (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
          onClick={() => { setSelCustomer(null); setCustomerOrders([]); }}>
          <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim"
            onClick={(e) => e.stopPropagation()}>
            <div className="p-6 border-b border-slate-100 flex justify-between items-start sticky top-0 bg-white z-10">
              <div>
                <h3 className="font-black text-xl text-slate-900">{selCustomer.customername || '—'}</h3>
                <a href={`tel:${selCustomer.customerphone}`}
                  className="text-sm text-blue-600 hover:underline font-medium mt-1 block">
                  {selCustomer.customerphone}
                </a>
              </div>
              <button onClick={() => { setSelCustomer(null); setCustomerOrders([]); }}
                className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="p-6 grid grid-cols-3 gap-3 bg-slate-50 border-b border-slate-100">
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">訂單數</p>
                <p className="font-black text-2xl text-slate-900 mt-1">{selCustomer.totalorders || 0}</p>
              </div>
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">累計貢獻</p>
                <p className="font-black text-2xl text-emerald-600 mt-1">{fmt(selCustomer.totalamount)}</p>
              </div>
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">首次下單</p>
                <p className="font-bold text-xs text-slate-700 mt-2">{fmtDate(selCustomer.firstorderat)}</p>
              </div>
            </div>
            <div className="p-6">
              <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">訂單明細</p>
              {loadingCustOrders ? (
                <div className="p-10 text-center">
                  <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"/>
                </div>
              ) : customerOrders.length === 0 ? (
                <div className="p-10 text-center text-slate-300 font-bold text-sm">無訂單</div>
              ) : (
                <div className="space-y-2">
                  {customerOrders.map((o, idx) => (
                    <div key={idx}
                      className="border border-slate-100 rounded-xl p-4 hover:border-blue-300 cursor-pointer transition"
                      onClick={() => { setSelOrder(o); }}>
                      <div className="flex justify-between items-start gap-3">
                        <div className="flex-1 min-w-0">
                          <p className="font-black text-sm text-slate-800 line-clamp-1">{o.itinerarytitle || '—'}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5 font-mono">{o.orderid}</p>
                          <p className="text-xs text-slate-500 mt-1">
                            {o.travelers || 1} 人 · {fmtTravelDate(o.traveldate)} · {fmtDate(o.createdat)}
                          </p>
                        </div>
                        <div className="text-right shrink-0">
                          <p className="font-black text-red-600">{fmt(o.price)}</p>
                          <div className="mt-1"><OrderStatusBadge status={o.status} /></div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div className={`fixed bottom-24 md:bottom-8 right-4 md:right-8 z-[200] px-6 py-4 rounded-2xl shadow-2xl font-bold text-white anim ${
          toast.type==='error' ? 'bg-red-600' : 'bg-slate-900'
        }`}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ★ JSX 編譯快取載入器 v2（修：拿掉 env preset、加 setItem 後驗證） -->
<script>
(function(){
  const CACHE_KEY_PREFIX = 'tk-jsx-cache-v2:';
  const BABEL_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js';

  function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return (h>>>0).toString(36); }

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function execCode(code){ new Function(code)(); }

  async function boot(){
    const src = document.getElementById('app-source')?.textContent || '';
    if (!src.trim()) { console.error('[jsx-loader] no #app-source'); return; }

    const key = CACHE_KEY_PREFIX + hash(src);
    console.log('[jsx-loader] cache key:', key, '| source len:', src.length);

    try {
      const cached = localStorage.getItem(key);
      if (cached) {
        console.log('[jsx-loader] ✅ cache HIT, compiled len:', cached.length, '— skip babel');
        execCode(cached);
        return;
      } else {
        console.log('[jsx-loader] cache MISS（key 不存在）');
      }
    } catch(e) { console.warn('[jsx-loader] localStorage read failed', e); }

    const t0 = performance.now();
    try {
      await loadScript(BABEL_CDN);
      const t1 = performance.now();
      console.log('[jsx-loader] babel loaded in', (t1-t0).toFixed(0), 'ms');

      const compiled = Babel.transform(src, { presets: ['react'] }).code;
      const t2 = performance.now();
      console.log('[jsx-loader] compiled in', (t2-t1).toFixed(0), 'ms, output len:', compiled.length);

      try {
        localStorage.setItem(key, compiled);
        const verify = localStorage.getItem(key);
        if (verify === compiled) {
          console.log('[jsx-loader] ✅ cache write OK，下次進站秒開');
        } else {
          console.warn('[jsx-loader] ⚠️ cache write mismatch (verify=' + (verify?verify.length:'null') + ' vs ' + compiled.length + ')');
        }
      } catch(e) {
        console.warn('[jsx-loader] ⚠️ cache write FAILED:', e.name, e.message);
        try {
          let cleared = 0;
          for (let i=localStorage.length-1; i>=0; i--) {
            const k = localStorage.key(i);
            if (k && (k.startsWith('tk-jsx-cache-'))) { localStorage.removeItem(k); cleared++; }
          }
          console.log('[jsx-loader] cleared', cleared, 'old cache keys, retrying...');
          localStorage.setItem(key, compiled);
          console.log('[jsx-loader] ✅ cache write OK (retry)');
        } catch(e2) { console.warn('[jsx-loader] ⚠️ retry also failed:', e2.message); }
      }

      execCode(compiled);
    } catch(e) {
      console.error('[jsx-loader] babel load/compile failed:', e);
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;font-family:sans-serif"><h2>載入失敗</h2><p style="color:#888">請重新整理頁面，或清除瀏覽器快取</p></div>';
    }
  }

  if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') boot();
  else window.addEventListener('load', boot);
})();
</script>
