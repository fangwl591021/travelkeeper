// ══════════════════════════════════════════════════════════════
// Util
// ══════════════════════════════════════════════════════════════
const fmt = (n) => '$' + Number(n||0).toLocaleString();

const fmtDate = (raw) => {
  if (!raw) return '—';
  const s = String(raw).trim();
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const now = new Date();
  const today  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((today - target) / 86400000);
  const pad = (n) => String(n).padStart(2, '0');
  const hhmm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (diffDays === 0) return `今天 ${hhmm}`;
  if (diffDays === 1) return `昨天 ${hhmm}`;
  if (diffDays > 1 && diffDays <= 6) return `${diffDays} 天前`;
  if (d.getFullYear() !== now.getFullYear()) {
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hhmm}`;
  }
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hhmm}`;
};

const fmtTravelDate = (raw) => {
  if (!raw) return '未指定';
  const s = String(raw).trim();
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const pad = (n) => String(n).padStart(2, '0');
  const now = new Date();
  if (d.getFullYear() !== now.getFullYear()) {
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  }
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
};

// ══════════════════════════════════════════════════════════════
// 上稿 / 編輯表單
// ══════════════════════════════════════════════════════════════
function ItineraryForm({ initial, onSave, onCancel, saving, currentUser, isAdmin }) {
  // ★ v6：從 initial 讀 v6 金流欄位時，兼容小寫 key（GAS expandToObjects 把 header 都轉小寫）
  const _norm = (it) => {
    if (!it) return null;
    return {
      ...it,
      paymentMode:    it.paymentMode    || it.paymentmode    || 'deposit',
      depositRatio:   it.depositRatio   || it.depositratio   || 20,
      depositAmount:  it.depositAmount  || it.depositamount  || 0,
      balanceCollect: it.balanceCollect || it.balancecollect || 'online',
      expireAt:       it.expireAt       || it.expireat       || '',
    };
  };
  const [data, setData] = useState(_norm(initial) || {
    title: '', region: '亞洲', price: '', days: '',
    image: '', description: '', notes: '',
    // ── v6 金流預設 ──
    paymentMode: 'deposit',
    depositRatio: 20,
    depositAmount: '',
    balanceCollect: 'online',
    expireAt: '',
  });
  const [aiProgress, setAiProgress] = useState(null);
  const [aiMarkdownOpen, setAiMarkdownOpen] = useState(false);
  const [aiMarkdown, setAiMarkdown] = useState('');
  const [aiMarkdownFilename, setAiMarkdownFilename] = useState('');

  const loadPdfJs = async () => {
    if (window.__pdfjsLibPromise) return window.__pdfjsLibPromise;
    window.__pdfjsLibPromise = import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then((pdfjsLib) => {
      if (pdfjsLib?.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
      }
      return pdfjsLib;
    });
    return window.__pdfjsLibPromise;
  };

  const renderPdfPagesToImages = async (file, maxPages = 8, onProgress = () => {}) => {
    const pdfjsLib = await loadPdfJs();
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    const pageCount = Math.min(pdf.numPages, maxPages);
    const images = [];
    onProgress(0, pageCount);
    for (let i = 1; i <= pageCount; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.6 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      await page.render({ canvasContext: ctx, viewport }).promise;
      images.push(canvas.toDataURL('image/jpeg', 0.92));
      onProgress(i, pageCount);
    }
    return images;
  };

  const handleAIUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const setStage = (percent, label) => {
      setAiProgress({ percent: Math.max(0, Math.min(100, percent)), label });
    };
    setStage(5, '讀取檔案中...');
    try {
      let payload;
      if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) {
        setStage(12, '載入 PDF 解析器...');
        const images = await renderPdfPagesToImages(file, 8, (done, total) => {
          const pct = total ? 15 + Math.round((done / total) * 40) : 20;
          setStage(pct, done ? `PDF 轉圖片 ${done}/${total} 頁...` : '準備轉換 PDF 頁面...');
        });
        setStage(58, 'PDF 頁面已轉換，準備送交 AI...');
        payload = { images, filename: file.name };
      } else {
        setStage(18, '讀取圖片中...');
        const image = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = ev => resolve(ev.target.result);
          reader.onerror = () => reject(new Error('圖片讀取失敗'));
          reader.readAsDataURL(file);
        });
        setStage(48, '圖片已讀取，準備送交 AI...');
        payload = { image, filename: file.name };
      }
      setStage(68, 'AI 解析中，正在辨識標題、天數、價格與內文...');
      const res = await fetch(`${WORKER_URL}/api/upload-dm`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error || 'AI 解析失敗');
      setStage(90, '整理解析結果並填入表單...');
      setData(prev => ({ ...prev, ...result.data }));
      setStage(100, '解析完成，已帶入表單');
      setTimeout(() => setAiProgress(null), 900);
    } catch(err) {
      alert('AI 解析失敗：' + err.message);
      setAiProgress(null);
    }
    e.target.value = '';
  };

  const handleAIMarkdownParse = async () => {
    const markdown = String(aiMarkdown || '').trim();
    if (!markdown) {
      alert('請先貼上 MarkItDown 轉出的 Markdown 內容');
      return;
    }
    const setStage = (percent, label) => {
      setAiProgress({ percent: Math.max(0, Math.min(100, percent)), label });
    };
    setStage(12, '讀取 Markdown 內容...');
    try {
      setStage(55, 'AI 解析 Markdown，正在整理行程草稿...');
      const res = await fetch(`${WORKER_URL}/api/upload-dm`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ markdown, filename: aiMarkdownFilename || 'markitdown-itinerary.md' })
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error || 'AI 解析失敗');
      setStage(90, '整理解析結果並填入表單...');
      setData(prev => ({ ...prev, ...result.data }));
      setStage(100, '解析完成，已帶入表單');
      setAiMarkdown('');
      setAiMarkdownFilename('');
      setAiMarkdownOpen(false);
      setTimeout(() => setAiProgress(null), 900);
    } catch(err) {
      alert('AI 解析失敗：' + err.message);
      setAiProgress(null);
    }
  };

  const handleAIMarkdownFile = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      if (file.size > 1024 * 1024 * 2) throw new Error('Markdown 檔案超過 2MB，請先縮小內容');
      const text = await file.text();
      setAiMarkdown(text);
      setAiMarkdownFilename(file.name || 'markitdown-itinerary.md');
      setAiMarkdownOpen(true);
    } catch (err) {
      alert(err.message || 'Markdown 檔案讀取失敗');
    }
    e.target.value = '';
  };

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => resolve(String(ev.target.result || '').split(',')[1] || '');
    reader.onerror = () => reject(new Error('檔案讀取失敗'));
    reader.readAsDataURL(file);
  });

  const handleAIDocumentConvert = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const setStage = (percent, label) => {
      setAiProgress({ percent: Math.max(0, Math.min(100, percent)), label });
    };
    setStage(8, '讀取文件中...');
    try {
      if (!isAdmin) throw new Error('目前文件轉 Markdown 僅開放管理員使用');
      if (file.size > 8 * 1024 * 1024) throw new Error('文件超過 8MB，請先壓縮或拆分');
      const base64 = await fileToBase64(file);
      setStage(42, '後台轉換 Markdown 中...');
      const uid = currentUser?.userId || '';
      const res = await fetch(`${WORKER_URL}/api/convert-document-markdown?uid=${encodeURIComponent(uid)}`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          uid,
          filename: file.name || 'document',
          contentType: file.type || 'application/octet-stream',
          base64,
        })
      });
      const result = await res.json();
      const convertErrorMap = {
        ADMIN_REQUIRED: '需要管理員權限才能使用文件轉 Markdown',
        MARKITDOWN_SERVICE_NOT_CONFIGURED: '文件轉 Markdown 服務尚未設定，請先完成 MarkItDown 服務部署',
        MISSING_FILE_BASE64: '文件讀取失敗，請重新選擇檔案',
        FILE_TOO_LARGE: '文件過大，請先壓縮或拆分',
        EMPTY_MARKDOWN_RESULT: '轉檔完成但沒有取得 Markdown 內容',
      };
      if (!result.success) throw new Error(convertErrorMap[result.error] || result.error || '文件轉 Markdown 失敗');
      setAiMarkdown(result.data?.markdown || '');
      setAiMarkdownFilename(result.data?.filename || file.name || 'document.md');
      setAiMarkdownOpen(true);
      setStage(100, 'Markdown 已產生，可檢查後解析');
      setTimeout(() => setAiProgress(null), 900);
    } catch (err) {
      alert(err.message || '文件轉 Markdown 失敗');
      setAiProgress(null);
    }
    e.target.value = '';
  };

  const handleImageUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const res = await fetch(`${WORKER_URL}/api/upload-image`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ base64: ev.target.result, filename: file.name })
        });
        const result = await res.json();
        if (result.success) setData(prev => ({ ...prev, image: result.url }));
      } catch(err) { alert('上傳失敗'); }
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="space-y-5">
      <label className={`block ${aiProgress ? 'pointer-events-none opacity-90' : ''}`}>
        <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-2xl text-center font-black cursor-pointer hover:opacity-90 transition flex items-center justify-center gap-2">
          {aiProgress
            ? <><span className="spin inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full"></span>AI 解析中...</>
            : '🤖 AI 解析 DM'}
        </div>
        <input type="file" accept="image/*,.pdf,application/pdf" onChange={handleAIUpload} className="hidden" />
      </label>
      {aiProgress && (
        <div className="rounded-2xl border border-blue-100 bg-blue-50 px-4 py-3 -mt-2">
          <div className="flex items-center justify-between gap-3 text-xs font-bold text-blue-700 mb-2">
            <span>{aiProgress.label}</span>
            <span>{Math.round(aiProgress.percent)}%</span>
          </div>
          <div className="h-2.5 rounded-full bg-white overflow-hidden border border-blue-100">
            <div
              className="h-full rounded-full bg-gradient-to-r from-blue-600 to-purple-600 transition-all duration-300"
              style={{ width: `${aiProgress.percent}%` }}
            />
          </div>
        </div>
      )}
      <p className="text-xs text-center text-slate-400 font-medium -mt-3">支援 JPG、PNG、PDF，PDF 會自動轉成頁面圖片交給 AI 解析</p>

      <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 space-y-3">
        <button type="button"
          onClick={() => setAiMarkdownOpen(v => !v)}
          className="w-full flex items-center justify-between gap-3 text-left">
          <span>
            <span className="block text-sm font-black text-slate-800">MarkItDown 文件草稿</span>
            <span className="block text-xs text-slate-500 mt-1">可直接上傳文件轉 Markdown，或載入已轉好的 .md/.txt。</span>
          </span>
          <span className="text-xs font-black text-blue-600">{aiMarkdownOpen ? '收合' : '展開'}</span>
        </button>
        {aiMarkdownOpen && (
          <div className="space-y-3">
            <div className="flex items-center justify-between gap-3 flex-wrap">
              {isAdmin && (
                <label className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-blue-600 text-white text-sm font-bold cursor-pointer hover:bg-blue-700">
                  上傳文件轉 Markdown
                  <input type="file"
                    accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.html,.htm,.csv,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation"
                    onChange={handleAIDocumentConvert}
                    className="hidden" />
                </label>
              )}
              <label className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm font-bold text-slate-700 cursor-pointer hover:bg-slate-100">
                載入 .md/.txt
                <input type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" onChange={handleAIMarkdownFile} className="hidden" />
              </label>
              {aiMarkdownFilename && <span className="text-xs text-slate-500 font-bold truncate max-w-[240px]">{aiMarkdownFilename}</span>}
            </div>
            <textarea value={aiMarkdown}
              onChange={e => setAiMarkdown(e.target.value)}
              rows={7}
              placeholder="貼上 MarkItDown 轉出的 Markdown 行程內容..."
              className="w-full p-3 rounded-xl border-2 border-slate-100 outline-none focus:border-blue-500 bg-white text-sm leading-6"/>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <p className="text-xs text-slate-500">此功能只建立可編輯草稿，不會自動發布。</p>
              <button type="button"
                onClick={handleAIMarkdownParse}
                disabled={!!aiProgress || !String(aiMarkdown || '').trim()}
                className="px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-black hover:bg-slate-800 disabled:opacity-50">
                解析 Markdown
              </button>
            </div>
          </div>
        )}
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">封面圖</label>
        {data.image && <img src={data.image} className="w-full aspect-video object-cover rounded-2xl mt-2 mb-2" />}
        <div className="flex gap-2 mt-1">
          <input value={data.image||''} onChange={e=>setData({...data,image:e.target.value})}
            placeholder="https://…"
            className="flex-1 p-3 border-2 border-slate-100 rounded-xl text-sm font-medium outline-none focus:border-blue-500 bg-slate-50" />
          <label className="bg-slate-200 hover:bg-slate-300 px-4 py-3 rounded-xl text-sm font-bold cursor-pointer">
            📁
            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
          </label>
        </div>
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">行程標題</label>
        <input value={data.title||''} onChange={e=>setData({...data,title:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500" />
      </div>

      <div className="grid grid-cols-3 gap-3">
        <div>
          <label className="text-xs font-black text-slate-400 uppercase tracking-widest">地區</label>
          <select value={data.region||'亞洲'} onChange={e=>setData({...data,region:e.target.value})}
            className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500 bg-white">
            {['國旅','亞洲','歐洲','美洲','大洋洲','非洲'].map(r=><option key={r}>{r}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-black text-slate-400 uppercase tracking-widest">天數</label>
          <input type="number" value={data.days||''} onChange={e=>setData({...data,days:e.target.value})}
            className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500" />
        </div>
        <div>
          <label className="text-xs font-black text-slate-400 uppercase tracking-widest">價格</label>
          <input type="number" value={data.price||''} onChange={e=>setData({...data,price:e.target.value})}
            className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold text-red-600 outline-none focus:border-blue-500" />
        </div>
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">自動下架日期</label>
        <input type="date" value={data.expireAt || ''} onChange={e=>setData({...data, expireAt:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500" />
        <p className="text-[10px] text-slate-400 mt-1">留空代表不自動下架；日期過後會從前台與推廣列表隱藏，管理後台仍可編輯。</p>
      </div>

      {/* ★ v6：金流設定 */}
      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-3">
        <p className="text-xs font-black text-amber-700 uppercase tracking-widest">💰 付款方式設定</p>
        <div>
          <label className="text-xs font-bold text-slate-500">收費模式</label>
          <div className="flex gap-2 mt-1">
            {[
              { v:'deposit', label:'訂金 + 尾款', hint:'客戶先付一部分鎖位' },
              { v:'full',    label:'全額收款',    hint:'一次付清才能預約' },
            ].map(m => (
              <button key={m.v} type="button" onClick={()=>setData({...data, paymentMode: m.v})}
                className={`flex-1 p-3 rounded-xl text-xs font-black border-2 transition ${
                  (data.paymentMode || 'deposit') === m.v
                    ? 'bg-blue-600 text-white border-blue-600'
                    : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300'
                }`}>
                {m.label}<br/><span className="text-[10px] opacity-80 font-normal">{m.hint}</span>
              </button>
            ))}
          </div>
        </div>
        {(data.paymentMode || 'deposit') === 'deposit' && (
          <>
            <div>
              <label className="text-xs font-bold text-slate-500">每人訂金金額（NT$）</label>
              <input type="number" min="0" step="100" value={data.depositAmount || ''}
                onChange={e=>setData({...data, depositAmount: Math.max(0, Number(e.target.value)||0)})}
                className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500"/>
              <p className="text-[10px] text-slate-400 mt-1">
                例：每人團費 NT${Number(data.price||0).toLocaleString()}，每人訂金 = NT${Number(data.depositAmount||0).toLocaleString()}
              </p>
            </div>
            <div>
              <label className="text-xs font-bold text-slate-500">尾款收款方式</label>
              <div className="flex gap-2 mt-1">
                {[
                  { v:'online',  label:'線上補繳', hint:'客戶自己補刷藍新' },
                  { v:'offline', label:'線下收取', hint:'業務出發前收現金/匯款' },
                ].map(m => (
                  <button key={m.v} type="button" onClick={()=>setData({...data, balanceCollect: m.v})}
                    className={`flex-1 p-3 rounded-xl text-xs font-black border-2 transition ${
                      (data.balanceCollect || 'online') === m.v
                        ? 'bg-blue-600 text-white border-blue-600'
                        : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300'
                    }`}>
                    {m.label}<br/><span className="text-[10px] opacity-80 font-normal">{m.hint}</span>
                  </button>
                ))}
              </div>
            </div>
          </>
        )}
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">行程描述</label>
        <textarea rows="10" value={data.description||''} onChange={e=>setData({...data,description:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl text-sm outline-none focus:border-blue-500 leading-relaxed" />
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">注意事項</label>
        <textarea rows="3" value={data.notes||''} onChange={e=>setData({...data,notes:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl text-sm outline-none focus:border-blue-500" />
      </div>

      <div className="flex gap-3 pt-2">
        <button onClick={onCancel}
          className="flex-1 bg-slate-100 py-4 rounded-2xl font-black text-slate-600 hover:bg-slate-200">取消</button>
        <button onClick={() => onSave(data)} disabled={saving || !data.title}
          className="flex-[2] bg-blue-600 text-white font-black py-4 rounded-2xl hover:bg-blue-700 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
          {saving ? '儲存中…' : '提交'}
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// 分銷商詳情 Modal
// ══════════════════════════════════════════════════════════════
function DistModal({ dist, onClose, onApprove, onReject }) {
  if (!dist) return null;
  const fields = [
    ['LINE UID',   dist.uid],
    ['姓名',       dist.name],
    ['電話',       dist.phone],
    ['公司/品牌',  dist.companyname  || dist.companyName],
    ['統一編號',   dist.taxid        || dist.taxId],
    ['LINE 個人',  dist.linelink     || dist.lineLink],
    ['LINE@',      dist.lineatlink   || dist.lineAtLink],
    ['Facebook',   dist.fblink       || dist.fbLink],
    ['Instagram',  dist.iglink       || dist.igLink],
    ['網站',       dist.weblink      || dist.webLink],
    ['地圖連結',   dist.maplink      || dist.mapLink],
    ['佣金比例',   dist.commission   ? `${dist.commission}%` : '—'],
    ['累積業績',   (dist.salesrevenue||dist.salesRevenue) ? `$${Number(dist.salesrevenue||dist.salesRevenue).toLocaleString()}` : '$0'],
    ['加入時間',   fmtDate(dist.joindate || dist.joinDate)],
    ['推薦人 UID', dist.ref_uid],
    ['備註',       dist.note],
  ];
  return (
    <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="bg-white rounded-[2rem] w-full max-w-lg max-h-[90vh] overflow-y-auto anim">
        <div className="p-6 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white z-10">
          <div>
            <h3 className="font-black text-xl text-slate-900">{dist.name || '未填寫'}</h3>
            <StatusBadge status={dist.status} />
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
        </div>
        <div className="p-6 space-y-3">
          {fields.map(([label, val]) => val ? (
            <div key={label} className="flex gap-3">
              <span className="text-xs font-black text-slate-400 uppercase w-24 shrink-0 pt-0.5">{label}</span>
              <span className="text-sm font-medium text-slate-700 break-all">{String(val)}</span>
            </div>
          ) : null)}
        </div>
        <div className="p-6 pt-0 flex gap-3">
          {String(dist.status).toLowerCase() !== 'approved' ? (
            <button onClick={() => onApprove(dist.uid)}
              className="flex-1 bg-emerald-600 text-white font-black py-3 rounded-2xl hover:bg-emerald-700 transition">
              ✅ 核准加入
            </button>
          ) : (
            <button onClick={() => onReject(dist.uid)}
              className="flex-1 bg-slate-100 text-slate-500 font-black py-3 rounded-2xl hover:bg-red-50 hover:text-red-500 transition">
              撤銷資格
            </button>
          )}
          <button onClick={onClose}
            className="px-6 bg-slate-100 text-slate-600 font-black py-3 rounded-2xl hover:bg-slate-200 transition">
            關閉
          </button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// 訂單詳情 Modal
// ══════════════════════════════════════════════════════════════
function OrderModal({ order, onClose, onUpdateStatus, onMarkBalancePaid, canEditStatus }) {
  const [updating, setUpdating] = useState(false);
  const [markingBalance, setMarkingBalance] = useState(false);
  if (!order) return null;
  const handleStatusChange = async (newStatus) => {
    if (newStatus === order.status) return;
    if (!confirm(`確定要將狀態變更為「${ORDER_STATUS[newStatus]?.label || newStatus}」？`)) return;
    setUpdating(true);
    await onUpdateStatus(order.orderid, newStatus);
    setUpdating(false);
  };
  return (
    <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="bg-white rounded-[2rem] w-full max-w-xl max-h-[90vh] overflow-y-auto anim">
        <div className="p-6 border-b border-slate-100 flex justify-between items-start sticky top-0 bg-white z-10">
          <div>
            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">訂單編號</p>
            <h3 className="font-black text-lg text-slate-900 font-mono">{order.orderid}</h3>
            <div className="mt-2"><OrderStatusBadge status={order.status} /></div>
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
        </div>

        <div className="p-6 bg-gradient-to-br from-slate-50 to-white border-b border-slate-100">
          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">預訂行程</p>
          <h4 className="font-black text-xl text-slate-900 mb-3">{order.itinerarytitle || '—'}</h4>
          <div className="grid grid-cols-3 gap-3">
            <div>
              <p className="text-[10px] font-bold text-slate-400 uppercase">行程費用</p>
              <p className="font-black text-red-600 text-xl mt-1">{fmt(order.price)}</p>
            </div>
            <div>
              <p className="text-[10px] font-bold text-slate-400 uppercase">人數</p>
              <p className="font-black text-slate-900 text-xl mt-1">{order.travelers || 1} 人</p>
            </div>
            <div>
              <p className="text-[10px] font-bold text-slate-400 uppercase">出發日</p>
              <p className="font-bold text-slate-900 text-sm mt-1.5">{fmtTravelDate(order.traveldate)}</p>
            </div>
          </div>
        </div>

        <div className="p-6 border-b border-slate-100">
          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">客戶資訊</p>
          <div className="space-y-2">
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">姓名</span>
              <span className="text-sm font-bold text-slate-900">{order.customername || '—'}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">電話</span>
              <a href={`tel:${order.customerphone}`} className="text-sm font-bold text-blue-600 hover:underline">{order.customerphone || '—'}</a></div>
            {order.customerlineuid && (
              <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">LINE UID</span>
                <span className="text-xs font-mono text-slate-500 break-all">{order.customerlineuid}</span></div>
            )}
            {order.note && (
              <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">備註</span>
                <span className="text-sm text-slate-700">{order.note}</span></div>
            )}
          </div>
        </div>

        {/* ★ v6：金流明細 */}
        <div className="p-6 border-b border-slate-100 bg-gradient-to-br from-amber-50/40 to-white">
          <p className="text-[10px] font-black text-amber-700 uppercase tracking-widest mb-3">💰 金流明細</p>
          {(() => {
            const paymentMode    = String(order.paymentmode || 'deposit').toLowerCase();
            const balanceCollect = String(order.balancecollect || 'online').toLowerCase();
            const depositStatus  = String(order.depositstatus || 'unpaid').toLowerCase();
            const balanceStatus  = String(order.balancestatus || (paymentMode === 'full' ? 'not_required' : 'unpaid')).toLowerCase();

            const PAYMENT_LABEL = {
              credit_card:'信用卡', linepay:'LINE Pay', vacc:'ATM', offline:'線下繳款',
            };
            const STATUS_BADGE = {
              unpaid:        { label:'未付款',  cls:'bg-slate-100 text-slate-500' },
              awaiting_atm:  { label:'等待 ATM 繳款', cls:'bg-amber-50 text-amber-700' },
              paid:          { label:'已付款',  cls:'bg-emerald-50 text-emerald-700' },
              paid_online:   { label:'線上已收', cls:'bg-emerald-50 text-emerald-700' },
              paid_offline:  { label:'線下已收', cls:'bg-emerald-50 text-emerald-700' },
              not_required:  { label:'無需繳尾款', cls:'bg-slate-100 text-slate-400' },
              failed:        { label:'付款失敗', cls:'bg-red-50 text-red-600' },
            };

            return (
              <div className="space-y-3">
                {/* 總額 */}
                <div className="grid grid-cols-3 gap-2 mb-2">
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <p className="text-[10px] font-bold text-slate-400 uppercase">總金額</p>
                    <p className="text-base font-black text-slate-900 mt-1">{fmt(order.totalamount || order.price)}</p>
                  </div>
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <p className="text-[10px] font-bold text-slate-400 uppercase">訂金</p>
                    <p className="text-base font-black text-red-600 mt-1">{fmt(order.depositamount)}</p>
                  </div>
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <p className="text-[10px] font-bold text-slate-400 uppercase">尾款</p>
                    <p className="text-base font-black text-amber-600 mt-1">{fmt(order.balanceamount)}</p>
                  </div>
                </div>

                {/* 訂金狀態 */}
                <div className="bg-white rounded-xl p-3 border border-slate-100">
                  <div className="flex items-center justify-between mb-2">
                    <p className="text-xs font-black text-slate-700">訂金</p>
                    <span className={`px-3 py-1 rounded-full text-[11px] font-black ${(STATUS_BADGE[depositStatus]||STATUS_BADGE.unpaid).cls}`}>
                      {(STATUS_BADGE[depositStatus]||STATUS_BADGE.unpaid).label}
                    </span>
                  </div>
                  {depositStatus === 'paid' && (
                    <div className="text-xs text-slate-500 space-y-0.5">
                      <p>方式：{PAYMENT_LABEL[order.depositmethod] || order.depositmethod || '—'}</p>
                      <p>時間：{order.depositpaidat || '—'}</p>
                      {order.deposittradeno && <p className="font-mono text-[10px]">交易號：{order.deposittradeno}</p>}
                    </div>
                  )}
                </div>

                {/* 尾款狀態 */}
                {paymentMode !== 'full' && (
                  <div className="bg-white rounded-xl p-3 border border-slate-100">
                    <div className="flex items-center justify-between mb-2">
                      <p className="text-xs font-black text-slate-700">
                        尾款
                        <span className="ml-2 text-[10px] font-bold text-slate-400">
                          ({balanceCollect === 'offline' ? '線下收取' : '線上補繳'})
                        </span>
                      </p>
                      <span className={`px-3 py-1 rounded-full text-[11px] font-black ${(STATUS_BADGE[balanceStatus]||STATUS_BADGE.unpaid).cls}`}>
                        {(STATUS_BADGE[balanceStatus]||STATUS_BADGE.unpaid).label}
                      </span>
                    </div>
                    {(balanceStatus === 'paid_online' || balanceStatus === 'paid_offline') && (
                      <div className="text-xs text-slate-500 space-y-0.5">
                        <p>方式：{PAYMENT_LABEL[order.balancemethod] || order.balancemethod || '—'}</p>
                        <p>時間：{order.balancepaidat || '—'}</p>
                        {order.balancetradeno && <p className="font-mono text-[10px]">交易號：{order.balancetradeno}</p>}
                      </div>
                    )}
                    {/* 管理員可標記「線下尾款已收」（balance_collect=offline 才顯示） */}
                    {canEditStatus && balanceCollect === 'offline' && balanceStatus === 'unpaid' && depositStatus === 'paid' && (
                      <button
                        onClick={async () => {
                          if (!confirm('確定標記尾款已收？此操作會自動觸發佣金結算。')) return;
                          setMarkingBalance(true);
                          await onMarkBalancePaid(order.orderid);
                          setMarkingBalance(false);
                        }}
                        disabled={markingBalance}
                        className="w-full mt-3 bg-emerald-600 text-white font-black py-2.5 rounded-xl hover:bg-emerald-700 transition disabled:opacity-50">
                        {markingBalance ? '處理中…' : '✅ 標記尾款已收（線下）'}
                      </button>
                    )}
                  </div>
                )}

                {/* 佣金狀態 */}
                <div className="bg-white rounded-xl p-3 border border-slate-100 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-black text-slate-700">佣金</p>
                    <p className="text-[11px] text-slate-500 mt-0.5">{fmt(order.commissionamount)}</p>
                  </div>
                  {(() => {
                    const cs = String(order.commissionstatus || 'pending').toLowerCase();
                    const map = {
                      pending:  { label:'尚未結算', cls:'bg-slate-100 text-slate-500' },
                      payable:  { label:'可請款',   cls:'bg-blue-50 text-blue-700' },
                      paid_out: { label:'已匯款',   cls:'bg-emerald-50 text-emerald-700' },
                    };
                    const cfg = map[cs] || map.pending;
                    return (
                      <span className={`px-3 py-1 rounded-full text-[11px] font-black ${cfg.cls}`}>
                        {cfg.label}
                      </span>
                    );
                  })()}
                </div>
              </div>
            );
          })()}
        </div>

        <div className="p-6 border-b border-slate-100">
          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">業務歸屬</p>
          <div className="space-y-2">
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">分銷商</span>
              <span className="text-xs font-mono text-slate-500 break-all">{order.distributoruid || '—'}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">應付佣金</span>
              <span className="text-sm font-black text-emerald-600">{fmt(order.commissionamount)}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">建立時間</span>
              <span className="text-xs text-slate-500">{fmtDate(order.createdat)}</span></div>
            <div className="flex gap-3"><span className="text-xs font-bold text-slate-400 w-20 shrink-0 pt-0.5">最後更新</span>
              <span className="text-xs text-slate-500">{fmtDate(order.updatedat)}</span></div>
          </div>
        </div>

        {canEditStatus && (
          <div className="p-6 bg-slate-50">
            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">變更訂單狀態</p>
            <div className="grid grid-cols-2 gap-2">
              {Object.entries(ORDER_STATUS).map(([key, cfg]) => {
                const isCurrent = String(order.status).toLowerCase() === key;
                return (
                  <button key={key} onClick={() => handleStatusChange(key)}
                    disabled={isCurrent || updating}
                    className={`py-3 rounded-xl font-black text-sm transition border-2 ${
                      isCurrent
                        ? 'bg-slate-200 text-slate-400 border-slate-200 cursor-default'
                        : 'bg-white border-slate-200 hover:border-blue-400 text-slate-700'
                    }`}>
                    {isCurrent ? '✓ ' : ''}{cfg.label}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div className="p-6 pt-3">
          <button onClick={onClose}
            className="w-full bg-slate-100 text-slate-600 font-black py-3 rounded-2xl hover:bg-slate-200 transition">
            關閉
          </button>
        </div>
      </div>
    </div>
  );
}

// ★ v9 推廣 Flex Card Modal — 完整版
//   支援：多選行程、三種模式 (single/carousel/list)、聯絡按鈕、CTA 自訂

function PromoteModal({
  initialItems,        // 預選的 items 陣列（從卡片進入）
  allItems,            // 全部可選的 items（讓使用者再加幾筆）
  profile, inviteCode, agencySlug, distData,
  onClose, onPushFlex, onCopyLink, onDownloadImage,
  pushingFlex, genImageBusy
}) {
  const initialIds = (initialItems || []).map(i => String(i.id || i.timestamp));
  const [selectedIds, setSelectedIds] = useState(new Set(initialIds));
  const [mode, setMode] = useState('single');
  const [ctaText, setCtaText] = useState('\u67e5\u770b\u5b8c\u6574\u884c\u7a0b');
  const [centerText, setCenterText] = useState('\u5fc3\u52d5\u5c31\u8981\u884c\u52d5\uff01\u56de\u994b\u90fd\u5728\u9019');
  const [centerTextColor, setCenterTextColor] = useState('#ffffff');
  const [travel6BgColor, setTravel6BgColor] = useState('#15569a');
  const [showSelector, setShowSelector] = useState(false);
  const socialDistData = withDefaultSocialLinks(distData || {});
  const travel6BgPalette = [
    '#15569a', '#0f172a', '#0f766e', '#047857',
    '#b82337', '#c2410c', '#6d28d9', '#4338ca',
    '#111827', '#f59e0b'
  ];

  // 聯絡套件：依據 distData 有什麼欄位才顯示對應 toggle
  // 預設全部 OFF（使用者明確勾選才會出現在卡片底部）
  const SOC_OPTIONS = [
    { key: 'phone',      label: '📞 電話',      field: 'phone'      },
    { key: 'line',       label: '💬 LINE',      field: 'lineLink'   },
    { key: 'lineAt',     label: '📢 LINE@',     field: 'lineAtLink' },
    { key: 'fb',         label: '📘 Facebook',  field: 'fbLink'     },
    { key: 'ig',         label: '📸 Instagram', field: 'igLink'     },
    { key: 'web',        label: '🌐 網站',      field: 'webLink'    },
    { key: 'map',        label: '📍 地圖',      field: 'mapLink'    },
  ];
  const availableSocs = SOC_OPTIONS.filter(o => socialDistData?.[o.field]);
  const [enabledSocs, setEnabledSocs] = useState(new Set());

  const toggleId = (id) => {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const toggleSoc = (key) => {
    setEnabledSocs(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  };

  const selectedCount = selectedIds.size;
  const selectedItems = (allItems || []).filter(i => selectedIds.has(String(i.id || i.timestamp)));

  // 模式自動切換規則：
  //   1 筆 → 強制 single
  //   2+ 筆 → 不能 single（自動切 carousel）
  useEffect(() => {
    if (selectedCount === 1 && mode !== 'single') setMode('single');
    if (selectedCount >= 2 && mode === 'single') setMode('carousel');
    if (selectedCount !== 6 && mode === 'travel6') setMode(selectedCount >= 2 ? 'carousel' : 'single');
  }, [selectedCount, mode]);

  // 組 socFields 物件（同時包含 boolean key 跟 field 值）
  const buildSocFields = () => {
    const out = {};
    enabledSocs.forEach(key => {
      const def = SOC_OPTIONS.find(o => o.key === key);
      if (def && socialDistData?.[def.field]) {
        out[def.key] = true;
        out[def.field] = socialDistData[def.field];
      }
    });
    return out;
  };

  // 推送
  const handlePush = () => {
    if (selectedCount === 0) return;
    onPushFlex({
      ids: Array.from(selectedIds),
      mode,
      socFields: buildSocFields(),
      ctaText,
      centerText,
      centerTextColor,
      travel6BgColor,
    });
  };

  // 複製連結（單筆才有意義）— 取第一筆的 tour url
  const promoteUrl = (() => {
    if (selectedItems.length === 0) return '';
    const first = selectedItems[0];
    const base = window.location.origin + window.location.pathname.replace(/dashboard\.html|admin\.html|crm\.html$/, '');
    const id = first.id || first.timestamp;
    const params = new URLSearchParams();
    params.set('t', String(id));
    if (inviteCode) params.set('invite', inviteCode);
    if (profile?.userId) params.set('r', profile.userId);
    if (agencySlug) params.set('a', agencySlug);
    return `${base}tour.html?${params.toString()}`;
  })();

  // 下載圖片只在單筆時有意義
  const canDownload = selectedCount === 1 && !genImageBusy;
  const canCopyLink = selectedCount === 1;

  return (
    <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim">
        <div className="p-5 border-b border-slate-100 sticky top-0 bg-white z-10 flex justify-between items-center">
          <div>
            <p className="text-[10px] font-black text-emerald-600 uppercase tracking-widest">製作推廣卡片</p>
            <h2 className="font-black text-lg mt-0.5">推薦碼：<span className="font-mono text-emerald-600">{inviteCode || '(未取得)'}</span></h2>
          </div>
          <button onClick={onClose} className="w-9 h-9 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 shrink-0">✕</button>
        </div>

        {/* Step 1：選擇行程 */}
        <div className="p-5 border-b border-slate-100">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black text-slate-700 uppercase tracking-widest">
              ① 選擇行程
              <span className="ml-2 text-blue-600">已選 {selectedCount} 筆</span>
            </p>
            <button onClick={() => setShowSelector(s => !s)}
              className="text-xs font-black text-blue-600 hover:underline">
              {showSelector ? '收起' : '加 / 改'} 選擇
            </button>
          </div>

          {/* 已選的小卡片預覽 */}
          {selectedItems.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-4">尚未選擇行程</p>
          ) : (
            <div className="space-y-2">
              {selectedItems.map(it => (
                <div key={it.id || it.timestamp}
                  className="flex items-center gap-3 p-2 bg-slate-50 rounded-xl">
                  {it.image && <img src={it.image} className="w-12 h-12 object-cover rounded-lg shrink-0"/>}
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-sm text-slate-800 line-clamp-1">{it.title}</p>
                    <p className="text-[11px] text-slate-500">
                      {it.region} · {it.days}天 · NT$ {Number(it.price||0).toLocaleString()}
                    </p>
                  </div>
                  <button onClick={() => toggleId(String(it.id || it.timestamp))}
                    className="w-7 h-7 rounded-full bg-slate-200 hover:bg-red-100 hover:text-red-600 text-slate-500 text-sm shrink-0">✕</button>
                </div>
              ))}
            </div>
          )}

          {/* 選擇器（按了「加/改選擇」才展開） */}
          {showSelector && (
            <div className="mt-3 p-3 bg-slate-50 rounded-xl">
              <div className="flex justify-between items-center mb-2">
                <p className="text-[10px] font-black text-slate-500 uppercase">全部行程 ({(allItems||[]).length})</p>
                <div className="flex gap-2 text-[11px]">
                  <button onClick={() => setSelectedIds(new Set((allItems||[]).map(i => String(i.id || i.timestamp))))}
                    className="text-blue-600 font-black hover:underline">全選</button>
                  <button onClick={() => setSelectedIds(new Set())}
                    className="text-slate-500 font-black hover:underline">清除</button>
                </div>
              </div>
              <div className="max-h-64 overflow-y-auto space-y-1.5 pr-1">
                {(allItems || []).map(it => {
                  const id = String(it.id || it.timestamp);
                  const checked = selectedIds.has(id);
                  return (
                    <label key={id}
                      className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer transition ${
                        checked ? 'bg-blue-50 border border-blue-200' : 'bg-white border border-slate-100 hover:border-blue-200'
                      }`}>
                      <input type="checkbox" checked={checked} onChange={() => toggleId(id)}
                        className="w-4 h-4"/>
                      {it.image && <img src={it.image} className="w-8 h-8 object-cover rounded shrink-0"/>}
                      <div className="flex-1 min-w-0">
                        <p className="font-bold text-xs text-slate-800 line-clamp-1">{it.title}</p>
                        <p className="text-[10px] text-slate-500">{it.region} · NT$ {Number(it.price||0).toLocaleString()}</p>
                      </div>
                    </label>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* Step 2：卡片格式 */}
        <div className="p-5 border-b border-slate-100">
          <p className="text-xs font-black text-slate-700 uppercase tracking-widest mb-3">② 卡片格式</p>
          <div className="grid grid-cols-3 gap-2">
            {[
              { v:'single',   label:'\u55ae\u5f35',   hint:'1 \u7b46',     enabled: selectedCount === 1 },
              { v:'carousel', label:'\u8f2a\u64ad',   hint:'2-10 \u7b46',  enabled: selectedCount >= 2 },
              { v:'list',     label:'\u5217\u8868',   hint:'2-10 \u7b46',  enabled: selectedCount >= 2 },
            ].map(m => (
              <button key={m.v} type="button"
                onClick={() => m.enabled && setMode(m.v)}
                disabled={!m.enabled}
                className={`p-3 rounded-xl text-xs font-black border-2 transition ${
                  mode === m.v
                    ? 'bg-blue-600 text-white border-blue-600'
                    : m.enabled
                      ? 'bg-white text-slate-700 border-slate-200 hover:border-blue-300'
                      : 'bg-slate-50 text-slate-300 border-slate-100 cursor-not-allowed'
                }`}>
                {m.label}<br/><span className="text-[10px] opacity-80 font-normal">{m.hint}</span>
              </button>
            ))}
          </div>
          <button type="button"
            onClick={() => selectedCount === 6 && setMode(mode === 'travel6' ? 'carousel' : 'travel6')}
            disabled={selectedCount !== 6}
            className={`mt-3 w-full flex items-center gap-3 p-3 rounded-2xl border-2 text-left transition ${
              mode === 'travel6'
                ? 'bg-blue-50 border-blue-500 text-slate-900'
                : selectedCount === 6
                  ? 'bg-white border-slate-200 hover:border-blue-300 text-slate-700'
                  : 'bg-slate-50 border-slate-100 text-slate-300 cursor-not-allowed'
            }`}>
            <span className={`w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs font-black ${
              mode === 'travel6' ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-300'
            }`}>{mode === 'travel6' ? '\u2713' : ''}</span>
            <span className="flex-1">
              <span className="block text-sm font-black">Giga+ 旅遊六宮格</span>
              <span className="block text-[11px] font-medium opacity-70">勾選後使用 LINE Giga 大版型，需剛好 6 筆行程</span>
            </span>
          </button>
          {mode === 'travel6' && (
            <div className="mt-3 rounded-2xl border border-blue-100 bg-blue-50 p-3">
              <div className="flex items-center justify-between gap-3 mb-2">
                <label className="block text-xs font-black text-slate-700">中央主標文字</label>
                <label className="flex items-center gap-2 text-xs font-black text-slate-600">
                  文字顏色
                  <input type="color" value={centerTextColor} onChange={e => setCenterTextColor(e.target.value)}
                    className="w-9 h-8 rounded-lg border border-blue-100 bg-white cursor-pointer"/>
                </label>
              </div>
              <textarea value={centerText} onChange={e => setCenterText(e.target.value)}
                rows="3"
                placeholder="心動就要行動！&#10;回饋都在這"
                className="w-full p-3 border-2 border-blue-100 rounded-xl text-sm font-medium outline-none focus:border-blue-500 bg-white resize-y"/>
              <div className="mt-3">
                <div className="flex items-center justify-between gap-3 mb-2">
                  <span className="text-xs font-black text-slate-700">背景色調色盤</span>
                  <label className="flex items-center gap-2 text-xs font-black text-slate-600">
                    自訂
                    <input type="color" value={travel6BgColor} onChange={e => setTravel6BgColor(e.target.value)}
                      className="w-9 h-8 rounded-lg border border-blue-100 bg-white cursor-pointer"/>
                  </label>
                </div>
                <div className="grid grid-cols-10 gap-2">
                  {travel6BgPalette.map(color => (
                    <button key={color} type="button" title={color}
                      onClick={() => setTravel6BgColor(color)}
                      className={`h-8 rounded-lg border-2 transition ${travel6BgColor === color ? 'border-slate-900 ring-2 ring-slate-300' : 'border-white hover:border-slate-300'}`}
                      style={{ backgroundColor: color }} />
                  ))}
                </div>
              </div>
              <p className="text-[11px] text-slate-500 mt-2">此版型需要剛好 6 個行程；每格圖片以 1:1 顯示，建議上傳 1040x1040 正方形圖。中央只顯示上方輸入的文字，可換行。</p>
            </div>
          )}
        </div>

        {/* Step 3\uff1a\u9644\u52a0\u806f\u7d61\u6309\u9215 */}
        <div className="p-5 border-b border-slate-100">
          <p className="text-xs font-black text-slate-700 uppercase tracking-widest mb-3">
            ③ 附加聯絡按鈕 <span className="text-slate-400 font-normal">（選填）</span>
          </p>
          {availableSocs.length === 0 ? (
            <p className="text-xs text-slate-400 bg-slate-50 p-3 rounded-lg">
              您尚未填寫任何聯絡方式（電話、LINE、FB 等）。要顯示聯絡按鈕，請先到「我的社群」填寫。
            </p>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {availableSocs.map(o => {
                const checked = enabledSocs.has(o.key);
                return (
                  <label key={o.key}
                    className={`flex items-center gap-2 p-2.5 rounded-xl cursor-pointer transition ${
                      checked ? 'bg-emerald-50 border-2 border-emerald-300' : 'bg-white border-2 border-slate-100 hover:border-emerald-200'
                    }`}>
                    <input type="checkbox" checked={checked} onChange={() => toggleSoc(o.key)}
                      className="w-4 h-4"/>
                    <span className="text-sm font-bold">{o.label}</span>
                  </label>
                );
              })}
            </div>
          )}
        </div>

        {/* Step 4：CTA 文字 */}
        <div className="p-5 border-b border-slate-100">
          <p className="text-xs font-black text-slate-700 uppercase tracking-widest mb-2">④ CTA 文字</p>
          <input value={ctaText} onChange={e => setCtaText(e.target.value)}
            placeholder="查看完整行程"
            className="w-full p-3 border-2 border-slate-100 rounded-xl text-sm font-medium outline-none focus:border-blue-500"/>
          <p className="text-[10px] text-slate-400 mt-1">這是卡片底部「次要」按鈕的文字。主要按鈕固定為「立即預約」。</p>
        </div>

        {/* 預覽摘要 */}
        <div className="p-5 bg-slate-50 border-b border-slate-100">
          <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">預覽摘要</p>
          {selectedCount === 0 ? (
            <p className="text-sm text-slate-400">請先選擇行程</p>
          ) : (
            <div className="text-sm space-y-1">
              <p>📦 將推送 <span className="font-black">{selectedCount} 筆</span> 行程</p>
              <p>🎨 格式：<span className="font-black">{
                mode === 'single' ? '\u55ae\u5f35\u5361\u7247' : mode === 'carousel' ? '\u8f2a\u64ad\u5361\u7247' : mode === 'travel6' ? 'Giga+ \u516d\u5bae\u683c' : '\u5217\u8868\u5361\u7247'
              }</span></p>
              <p>📞 含 <span className="font-black">{enabledSocs.size}</span> 個聯絡按鈕</p>
              <p>🏷️ 推薦碼：<span className="font-mono font-black text-emerald-600">{inviteCode || '無'}</span></p>
            </div>
          )}
        </div>

        {/* 三個動作 */}
        <div className="p-5 space-y-3">
          <button onClick={handlePush}
            disabled={pushingFlex || selectedCount === 0 || !inviteCode}
            className="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg hover:shadow-xl transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            {pushingFlex
              ? <><div className="spin inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full"/>處理中…</>
              : <>📤 分享給客戶 / 群組</>
            }
          </button>
          <p className="text-xs text-slate-500 text-center -mt-1">會跳出 LINE 分享面板，您可以選任意朋友、群組</p>

          <div className="grid grid-cols-2 gap-3">
            <button onClick={() => onCopyLink(promoteUrl)}
              disabled={!canCopyLink}
              className="bg-blue-600 text-white font-black py-3.5 rounded-2xl hover:bg-blue-700 transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
              📋 複製連結
            </button>
            <button onClick={() => onDownloadImage(selectedItems[0])}
              disabled={!canDownload}
              className="bg-slate-700 text-white font-black py-3.5 rounded-2xl hover:bg-slate-900 transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
              {genImageBusy
                ? <><div className="spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"/>合成中</>
                : <>🖼️ 下載圖片</>
              }
            </button>
          </div>
          {(selectedCount > 1) && (
            <p className="text-[11px] text-slate-400 text-center">
              ※「複製連結」「下載圖片」僅單筆模式可用
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

      badge: badges.pendingOrders },

    { id:'payments',     icon:'💳', label:'金流明細',   show:true },
    { id:'wego-internal', icon:'📋', label:'內部專區', show: isAdmin,
      href:'wego-internal.html' },
    { id:'internal-accounting', icon:'🔍', label:'查帳', show: isAdmin,

    { id:'commission',   icon:'💰', label: isAdmin ? '佣金結算' : '我的佣金', show:true,

    // ★ v8：「我的行程」改名「我上稿的」（只看自己投稿的，含審核狀態）
    { id:'mine',         icon:'🗂️', label: isAdmin ? '我上稿的' : '我上稿的',
      show: isAdmin || canUpload },
    { id:'itinerary-maintenance-list', icon:'\u{1F6E0}\uFE0F', label:'\u884C\u7A0B\u7DAD\u8B77', show: isAdmin,
      href:'itinerary-maintenance-list.html' },
    { id:'line-oa-monitor', icon:'\u{1F4AC}', label:'LINE OA\u76E3\u770B', show: isAdmin,
      href:'line-oa-monitor.html' },
    { id:'rich-menu-manager', icon:'\u{1F5BC}\uFE0F', label:'\u5716\u6587\u9078\u55AE', show: isAdmin,
      href:'rich-menu-manager.html' },
    { id:'knowledge-base', icon:'\u{1F4DA}', label:'\u77E5\u8B58\u5EAB', show: isAdmin,
      href:'knowledge-base.html' },
    { id:'internal-ops', icon:'\u{1F3E2}', label:'\u5167\u90E8\u71DF\u904B', show: isAdmin,
      href:'internal-ops.html' },
    { id:'system-settings', icon:'⚙️', label:'系統參數', show: isAdmin },
    { id:'distributors', icon:'👥', label:'分銷商管理', show: isAdmin,
      badge: badges.pendingDist },
    { id:'review',       icon:'⚠️', label:'待審核行程', show: isAdmin,
      badge: badges.pendingReview },
    { id:'new',          icon:'📝', label: isAdmin ? '新增行程' : '上稿',
      show: isAdmin || canUpload, isAction:true },
  ];
  return items.filter(it => it.show);
}

// 主 App
// ══════════════════════════════════════════════════════════════
function App() {
  // 身份
  const [authState, setAuthState] = useState('checking'); // checking | login | denied | ready
  const [profile,   setProfile]   = useState(null);
  const [isAdmin,   setIsAdmin]   = useState(false);
  const [canUpload, setCanUpload] = useState(false);
  const [isDistApproved, setIsDistApproved] = useState(false);
  const [distData,  setDistData]  = useState(null);

  // 載入
  const [loading, setLoading] = useState(true);

  // 資料（依角色拉，未拉到的 array 保持 [])
  const [stats,         setStats]         = useState(null);    // 業務 getMyStats
  const [orders,        setOrders]        = useState([]);      // 管理員=全部、業務=自己的
  const [distributors,  setDistributors]  = useState([]);      // 管理員
  const [myItems,       setMyItems]       = useState([]);      // 管理員=自己上稿的、業務(canUpload)=自己上稿的
  const [pendingItems,  setPendingItems]  = useState([]);      // 管理員
  const [publishedItems, setPublishedItems] = useState([]);    // ★ v8：全平台已上架（推廣用，雙角色都拉）
  const [customers,     setCustomers]     = useState([]);      // 業務
  const [shareAnalytics,setShareAnalytics]= useState(null);    // share conversion funnel

  // 視圖狀態
  const [view, setView] = useState('overview');
  const [overviewMode, setOverviewMode] = useState('balanced');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // 上稿/編輯/審核

      msg.includes('token expired') ||
      msg.includes('unauthorized') ||
      msg.includes('401');

    if (!shouldRelogin) return false;

    showToast('LINE 登入已過期，正在重新驗證…', 'error');
    try {
      if (typeof liff !== 'undefined' && liff.login) {
        setTimeout(() => liff.login({ redirectUri: location.href }), 300);
        return true;
      }
    } catch (err) {
      console.error('liff relogin failed:', err);

    return false;

  const handleSave = async (data) => {
    setSaving(true);
    try {
      const isEdit = !!editing;
      const body = {
        action: isEdit ? 'updateItinerary' : 'addItinerary',
        ...data,
        ownerUid: profile.userId,
        ownerName: profile.displayName,
        operatorUid: profile.userId,
      };
      if (isEdit) body.id = editing.id || editing.timestamp;
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const result = await res.json();
      if (result.success) {
        const msg = isAdmin
          ? (isEdit ? '行程已更新' : '行程已上架')
          : (isEdit ? '已修改，待管理員重新審核' : '已提交，待管理員審核');
        showToast('✅ ' + msg);
        setEditing(null);
        setCreating(false);
        await reloadItineraries();
      } else {
        showToast('儲存失敗：' + (result.error||''), 'error');
      }
    } catch(e) { showToast('網路錯誤', 'error'); }
    setSaving(false);
  };

  const handleDelete = async (item) => {
    if (!confirm('確定隱藏這筆行程？隱藏後不會顯示在一般列表。')) return;
    try {
      const operatorUid = profile?.userId || '';
      if (!operatorUid) {
        showToast('隱藏失敗：尚未取得登入身分', 'error');
        return;
      }
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'hideItinerary', id: String(item.id||item.timestamp), uid: operatorUid, operatorUid })
      });
      const result = await res.json();

  //   (取代 v8/v9 的 push-to-self；省 LINE token、沒 quota、客戶直接收）
  const handlePushFlex = async (opts) => {
    if (!profile?.userId) { showToast('\u8eab\u4efd\u9a57\u8b49\u5931\u6557', 'error'); return; }
    const { ids = [], mode = 'single', socFields = {}, ctaText = '\u67e5\u770b\u5b8c\u6574\u884c\u7a0b', centerText = '\u5fc3\u52d5\u5c31\u8981\u884c\u52d5\uff01\u56de\u994b\u90fd\u5728\u9019', centerTextColor = '#ffffff', travel6BgColor = '#15569a' } = opts || {};
    if (ids.length === 0) { showToast('\u8acb\u5148\u9078\u64c7\u884c\u7a0b', 'error'); return; }
    if (mode === 'travel6' && ids.length !== 6) { showToast('\u65c5\u904a\u516d\u5bae\u683c\u9700\u8981\u525b\u597d 6 \u500b\u884c\u7a0b', 'error'); return; }

    // \u78ba\u8a8d LIFF \u74b0\u5883\u652f\u63f4 shareTargetPicker
    if (typeof liff === 'undefined' || !liff.isApiAvailable || !liff.isApiAvailable('shareTargetPicker')) {
      showToast('\u60a8\u7684 LINE \u74b0\u5883\u4e0d\u652f\u63f4\u5206\u4eab\u529f\u80fd\uff08\u8acb\u65bc LINE app \u958b\u555f\u6b64\u9801\uff09', 'error');
      return;
    }

    setPushingFlex(true);
    try {
      await ensureFreshLiffSession();

      const myInviteCode = distData?.inviteCode || '';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      let res;
      try {
        // 1. \u5148\u6253 worker /api/flex/build \u53d6\u5f97 Flex JSON
        res = await fetch(WORKER_URL + '/api/flex/build', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: profile.userId,
            itineraryIds: ids.map(String),
            mode,
            socFields,
            ctaText,
            centerText,
            centerTextColor,
            travel6BgColor,
            agencySlug: 'demo',
            inviteCode: myInviteCode,
          }),
          signal: controller.signal,
        });
      } finally {
        clearTimeout(timeoutId);
      }

      // \u517c\u5bb9\u8655\u7406\uff1aworker \u53ef\u80fd\u56de\u50b3\u932f\u8aa4\u9801\uff0c\u4e0d\u4e00\u5b9a\u662f JSON
      const text = await res.text();
      let result;
      try {
        result = JSON.parse(text);
      } catch (e) {
        console.error('flex build non-json:', text);
        showToast('\u5206\u4eab\u670d\u52d9\u56de\u61c9\u7570\u5e38\uff08HTTP ' + res.status + '\uff09', 'error');
        return;
      }

      if (!res.ok) {
        showToast('\u5206\u4eab\u670d\u52d9\u5931\u6557\uff08HTTP ' + res.status + '\uff09\uff1a' + (result.error || '\u8acb\u7a0d\u5f8c\u518d\u8a66'), 'error');
        return;
      }

      if (!result.success || !result.message) {
        showToast('\u7d44 Flex \u5931\u6557\uff1a' + (result.error || '\u627e\u4e0d\u5230\u5206\u4eab\u5167\u5bb9'), 'error');
        return;
      }

      // 2. \u7528 liff.shareTargetPicker \u559a\u8d77 LINE \u539f\u751f\u5206\u4eab\u9762\u677f
      const shareResult = await liff.shareTargetPicker([result.message]);
      if (result.shareId) {
        fetch(WORKER_URL + '/api/share/event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            share_id: result.shareId,
            distributor_uid: profile.userId,
            invite_code: myInviteCode,
            itinerary_id: ids[0] || '',
            event_type: shareResult ? 'card_sent' : 'card_cancelled',
            source: 'dashboard',
            target_url: window.location.href,
            metadata: { mode, itineraryIds: ids.map(String) },
          }),
        }).catch(err => console.warn('share event failed:', err));
      }
      if (shareResult) {
        showToast('\u2705 \u5df2\u5206\u4eab\u7d66 ' + (shareResult.status === 'success' ? '\u9078\u5b9a\u5c0d\u8c61' : ''));
        setSelPromote(null);
        setSelectingMode(false);
        setSelectedForPromote(new Set());
      } else {
        // \u4f7f\u7528\u8005\u6309\u53d6\u6d88\uff0cshareTargetPicker \u6703 resolve null
        showToast('\u5df2\u53d6\u6d88\u5206\u4eab');
      }
    } catch (e) {
      console.error('shareTargetPicker error:', e);
      if (e?.name === 'AbortError') {
        showToast('\u5206\u4eab\u670d\u52d9\u903e\u6642\uff0c\u8acb\u7a0d\u5f8c\u518d\u8a66', 'error');
      } else if (e?.message === 'LIFF_SESSION_REFRESHING' || e?.message === 'LIFF_LOGIN_REQUIRED') {

      }
    } finally {
      setPushingFlex(false);
    }
  };
