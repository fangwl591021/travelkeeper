const fmtDate = (raw) => {
  if (!raw) return '??;
  const s = String(raw).trim();
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const now = new Date();
  const today  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((today - target) / 86400000);
  const pad = (n) => String(n).padStart(2, '0');
  const hhmm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (diffDays === 0) return `隞予 ${hhmm}`;
  if (diffDays === 1) return `?典予 ${hhmm}`;
  if (diffDays > 1 && diffDays <= 6) return `${diffDays} 憭拙?`;
  if (d.getFullYear() !== now.getFullYear()) {
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hhmm}`;
  }
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${hhmm}`;
};

const fmtTravelDate = (raw) => {

  //   (?誨 v8/v9 ??push-to-self嚗? LINE token?? quota?恥?嗥?交嚗?
  const handlePushFlex = async (opts) => {
    if (!profile?.userId) { showToast('\u8eab\u4efd\u9a57\u8b49\u5931\u6557', 'error'); return; }
    const { ids = [], mode = 'single', socFields = {}, ctaText = '\u67e5\u770b\u5b8c\u6574\u884c\u7a0b' } = opts || {};
    if (ids.length === 0) { showToast('\u8acb\u5148\u9078\u64c7\u884c\u7a0b', 'error'); return; }

    // \u78ba\u8a8d LIFF \u74b0\u5883\u652f\u63f4 shareTargetPicker
    if (typeof liff === 'undefined' || !liff.isApiAvailable || !liff.isApiAvailable('shareTargetPicker')) {
      showToast('\u60a8\u7684 LINE \u74b0\u5883\u4e0d\u652f\u63f4\u5206\u4eab\u529f\u80fd\uff08\u8acb\u65bc LINE app \u958b\u555f\u6b64\u9801\uff09', 'error');
      return;
    }

    setPushingFlex(true);
    try {
      await ensureFreshLiffSession();

      const myInviteCode = distData?.inviteCode || '';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      let res;
      try {
        // 1. \u5148\u6253 worker /api/flex/build \u53d6\u5f97 Flex JSON
        res = await fetch(WORKER_URL + '/api/flex/build', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: profile.userId,
            itineraryIds: ids.map(String),
            mode,
            socFields,
            ctaText,
            agencySlug: 'demo',
            inviteCode: myInviteCode,
          }),
          signal: controller.signal,
        });
      } finally {
        clearTimeout(timeoutId);
      }

      // \u517c\u5bb9\u8655\u7406\uff1aworker \u53ef\u80fd\u56de\u50b3\u932f\u8aa4\u9801\uff0c\u4e0d\u4e00\u5b9a\u662f JSON
      const text = await res.text();
      let result;
      try {
        result = JSON.parse(text);
      } catch (e) {
        console.error('flex build non-json:', text);
        showToast('\u5206\u4eab\u670d\u52d9\u56de\u61c9\u7570\u5e38\uff08HTTP ' + res.status + '\uff09', 'error');
        return;
      }

      if (!res.ok) {
        showToast('\u5206\u4eab\u670d\u52d9\u5931\u6557\uff08HTTP ' + res.status + '\uff09\uff1a' + (result.error || '\u8acb\u7a0d\u5f8c\u518d\u8a66'), 'error');
        return;
      }

      if (!result.success || !result.message) {
        showToast('\u7d44 Flex \u5931\u6557\uff1a' + (result.error || '\u627e\u4e0d\u5230\u5206\u4eab\u5167\u5bb9'), 'error');
        return;
      }

      // 2. \u7528 liff.shareTargetPicker \u559a\u8d77 LINE \u539f\u751f\u5206\u4eab\u9762\u677f
      const shareResult = await liff.shareTargetPicker([result.message]);
      if (shareResult) {
        showToast('\u2705 \u5df2\u5206\u4eab\u7d66 ' + (shareResult.status === 'success' ? '\u9078\u5b9a\u5c0d\u8c61' : ''));
        setSelPromote(null);
        setSelectingMode(false);
        setSelectedForPromote(new Set());
      } else {
        // \u4f7f\u7528\u8005\u6309\u53d6\u6d88\uff0cshareTargetPicker \u6703 resolve null
        showToast('\u5df2\u53d6\u6d88\u5206\u4eab');
      }
    } catch (e) {

<!-- ??JSX 蝺刻陌敹怠?頛??v2嚗耨嚗??env preset?? setItem 敺?霅? -->
<script>
(function(){
  const CACHE_KEY_PREFIX = 'tk-jsx-cache-v2:';
  const BABEL_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js';

  function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return (h>>>0).toString(36); }

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function execCode(code){ new Function(code)(); }

  async function boot(){
    const src = document.getElementById('app-source')?.textContent || '';
    if (!src.trim()) { console.error('[jsx-loader] no #app-source'); return; }

    const key = CACHE_KEY_PREFIX + hash(src);
    console.log('[jsx-loader] cache key:', key, '| source len:', src.length);

    try {
      const cached = localStorage.getItem(key);
      if (cached) {
        console.log('[jsx-loader] ??cache HIT, compiled len:', cached.length, '??skip babel');
        execCode(cached);
        return;
      } else {
        console.log('[jsx-loader] cache MISS嚗ey 銝??剁?');
      }
    } catch(e) { console.warn('[jsx-loader] localStorage read failed', e); }

    const t0 = performance.now();
    try {
      await loadScript(BABEL_CDN);
      const t1 = performance.now();
      console.log('[jsx-loader] babel loaded in', (t1-t0).toFixed(0), 'ms');

      const compiled = Babel.transform(src, { presets: ['react'] }).code;
      const t2 = performance.now();
      console.log('[jsx-loader] compiled in', (t2-t1).toFixed(0), 'ms, output len:', compiled.length);

      try {
        localStorage.setItem(key, compiled);
