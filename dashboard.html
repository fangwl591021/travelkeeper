      <main className="flex-1 min-w-0 pb-24 md:pb-0">
        <div className="w-full max-w-[1680px] mx-auto px-5 md:px-10 py-6 md:py-8">

          {/* 頂部標題（隨 view 變動）*/}
          <div className="mb-6 flex items-center justify-between gap-3">
            <h1 className="font-black text-3xl md:text-[2.6rem] text-slate-900">
              {(menu.find(m => m.id === view) || menu[0]).icon}{' '}
              {(menu.find(m => m.id === view) || menu[0]).label}
            </h1>
            <button onClick={handleRefreshAll}
              className="md:hidden bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700 transition">
              重新整理
            </button>
          </div>

          {/* ── 總覽 ── */}
          {view === 'overview' && (
            <div className="space-y-8 anim">
              {/* 業務專屬：推薦碼卡片 */}
              {!isAdmin && distData?.inviteCode && (
                <div className="bg-gradient-to-br from-blue-600 to-purple-600 text-white p-6 rounded-[2rem] shadow-lg">
                  <div className="flex items-center justify-between gap-4 flex-wrap">
                    <div className="min-w-0">
                      <p className="text-xs font-bold opacity-80 uppercase tracking-widest mb-1">我的推薦碼</p>
                      <p className="text-4xl font-black tracking-widest font-mono">{distData.inviteCode}</p>
                      <p className="text-xs opacity-80 mt-2">
                        佣金率：{distData.commission || 0}% · 透過此碼成交的客戶會自動歸入您的客戶名單
                      </p>
                    </div>
                    <div className="flex gap-2 shrink-0">
                      <button onClick={copyInviteCode}
                        className="bg-white/20 hover:bg-white/30 backdrop-blur text-white px-4 py-2.5 rounded-xl font-black text-sm transition">
                        複製碼
                      </button>
                      <button onClick={copyInviteLink}
                        className="bg-white text-blue-600 hover:bg-slate-50 px-4 py-2.5 rounded-xl font-black text-sm transition shadow-lg">
                        複製推廣連結
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 數字儀表板 */}
              {isAdmin ? (
                <>
                  {/* ★ v7：本月財務（4 個關鍵數字） */}
                  <div>
                    <h2 className="font-black text-lg text-slate-900 mb-3">本月財務</h2>
                    <div className="grid grid-cols-2 xl:grid-cols-4 gap-5">
                      <StatCard color="bg-emerald-600" num={fmt(adminStats.monthRevenue)}
                        label="本月實收" hint={`${monthOrders.length} 張訂單`} loading={loading}/>
                      <StatCard color="bg-blue-600"    num={fmt(adminStats.monthGrossSales)}
                        label="本月成交金額" hint="含未付款" loading={loading}/>
                      <StatCard color="bg-amber-500"   num={fmt(adminStats.monthCommission)}
                        label="本月應付佣金" loading={loading}/>
                      <StatCard color="bg-purple-600"  num={fmt(adminStats.monthGross)}
                        label="本月毛利估算" hint="實收 − 已結佣金" loading={loading}/>
                    </div>
                  </div>

                  {/* ★ v7：近 6 個月趨勢圖（純 SVG，不依賴 chart 套件） */}
                  {!loading && (() => {
                    const trend = adminStats.trend || [];
                    if (trend.length === 0) return null;
                    const maxVal = Math.max(1, ...trend.map(t => Math.max(t.revenue, t.commission)));
                    const W = 600, H = 180, pad = { top:20, right:20, bottom:30, left:50 };
                    const innerW = W - pad.left - pad.right;
                    const innerH = H - pad.top - pad.bottom;
                    const barW = innerW / trend.length * 0.35;
                    const groupW = innerW / trend.length;
                    return (
                      <div className="bg-white rounded-2xl border border-slate-100 p-5">
                        <div className="flex items-center justify-between mb-3">
                          <h3 className="font-black text-base text-slate-900">近 6 個月趨勢</h3>
                          <div className="flex gap-3 text-xs">
                            <span className="flex items-center gap-1">
                              <span className="w-3 h-3 rounded bg-emerald-500"/>實收
                            </span>
                            <span className="flex items-center gap-1">
                              <span className="w-3 h-3 rounded bg-amber-500"/>佣金
                            </span>
                          </div>
                        </div>
                        <div className="overflow-x-auto">
                          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{minWidth: 360, height: 180}}>
                            {/* 水平格線 */}
                            {[0, 0.25, 0.5, 0.75, 1].map((r, i) => {
                              const y = pad.top + innerH * (1 - r);
                              return (
                                <g key={i}>
                                  <line x1={pad.left} y1={y} x2={W - pad.right} y2={y}
                                    stroke="#e2e8f0" strokeWidth="1" strokeDasharray="2 4"/>
                                  <text x={pad.left - 8} y={y + 3} textAnchor="end"
                                    fontSize="10" fill="#94a3b8">
                                    {Math.round(maxVal * r / 1000)}k
                                  </text>
                                </g>
                              );
                            })}

                            {trend.map((t, i) => {
                              const cx = pad.left + groupW * i + groupW / 2;
                              const revH = (t.revenue / maxVal) * innerH;
                              const commH = (t.commission / maxVal) * innerH;
                              return (
                                <g key={t.month}>
                                  {/* 實收 bar */}
                                  <rect x={cx - barW - 2} y={pad.top + innerH - revH}
                                    width={barW} height={revH}
                                    fill="#10b981" rx="2">
                                    <title>{t.label} 實收 {fmt(t.revenue)}</title>
                                  </rect>
                                  {/* 佣金 bar */}
                                  <rect x={cx + 2} y={pad.top + innerH - commH}
                                    width={barW} height={commH}
                                    fill="#f59e0b" rx="2">
                                    <title>{t.label} 佣金 {fmt(t.commission)}</title>
                                  </rect>
                                  {/* x 軸標籤 */}
                                  <text x={cx} y={H - 10} textAnchor="middle"
                                    fontSize="11" fontWeight="700" fill="#475569">
                                    {t.label}
                                  </text>
                                </g>
                              );
                            })}
                          </svg>
                        </div>
                      </div>
                    );
                  })()}

                  {/* 待處理 */}
                  <div>
                    <h2 className="font-black text-lg text-slate-900 mb-3">待處理</h2>
                    <div className="grid grid-cols-2 xl:grid-cols-4 gap-5">
                      <StatCard color="bg-amber-500" num={adminStats.pendingReview}
                        label="待審核行程" loading={loading}/>
                      <StatCard color="bg-red-500"   num={adminStats.pendingOrders}
                        label="待處理訂單" loading={loading}/>
                      <StatCard color="bg-blue-600"  num={fmt(adminStats.payableCommissionTotal)}
                        label="可請款佣金" hint="待月結匯款" loading={loading}/>
                      <StatCard color="bg-emerald-700" num={fmt(adminStats.paidCommissionTotal)}
                        label="累計已匯佣金" loading={loading}/>
                    </div>
                  </div>

                  {/* 統計 */}
                  <div>
                    <h2 className="font-black text-lg text-slate-900 mb-3">總體統計</h2>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                      <StatCard color="bg-slate-800" num={adminStats.totalDist}
                        label="分銷商總數"
                        hint={adminStats.pendingDist > 0 ? `${adminStats.pendingDist} 待審核` : '全部已核准'}
                        loading={loading}/>
                      <StatCard color="bg-slate-700" num={adminStats.totalItems} label="行程總數" loading={loading}/>
                      <StatCard color="bg-slate-600" num={adminStats.totalOrders} label="累計訂單" loading={loading}/>
                    </div>
                  </div>
                </>
              ) : (
                <div>
                  <h2 className="font-black text-lg text-slate-900 mb-3">本月業績</h2>
                  <div className="grid grid-cols-2 xl:grid-cols-4 gap-5">
                    <StatCard color="bg-blue-600"    num={stats?.month?.count || 0}        label="本月成交筆數"  loading={loading}/>
                    <StatCard color="bg-emerald-600" num={fmt(stats?.month?.revenue)}      label="本月推廣金額"  loading={loading}/>
                    <StatCard color="bg-amber-500"   num={fmt(stats?.month?.commission)}   label="本月應得佣金" hint="含未完成訂單" loading={loading}/>
                    <StatCard color="bg-slate-800"   num={fmt(stats?.total?.completedCommission)} label="已賺取佣金" hint="僅計已完成訂單" loading={loading}/>
                  </div>
                  <h2 className="font-black text-lg text-slate-900 mb-3 mt-6">累計</h2>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <StatCard color="bg-slate-700" num={stats?.total?.count || 0}      label="累計成交筆數"  loading={loading}/>
                    <StatCard color="bg-slate-700" num={fmt(stats?.total?.revenue)}    label="累計推廣金額"  loading={loading}/>
                    <StatCard color="bg-purple-600" num={stats?.customerCount || customers.length} label="我的客戶數" loading={loading}/>
                  </div>
                </div>
              )}

              {/* 業務最近客戶 */}
              {!isAdmin && (loading || customers.length > 0) && (
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="font-black text-lg text-slate-900">最近客戶</h2>
                    {!loading && (
                      <button onClick={() => goView('customers')} className="text-blue-600 font-bold text-sm hover:underline">
                        全部 ({customers.length}) →
                      </button>
                    )}
                  </div>
                  <div className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden">
                    {loading ? (
                      [1,2,3].map(i => (
                        <div key={i} className="p-4 border-b border-slate-50 last:border-b-0 flex items-center justify-between gap-3">
                          <div className="space-y-2">
                            <div className="h-4 w-24 bg-slate-200 rounded animate-pulse"/>
                            <div className="h-3 w-32 bg-slate-100 rounded animate-pulse"/>
                          </div>
                          <div className="h-5 w-16 bg-slate-200 rounded animate-pulse"/>
                        </div>
                      ))
                    ) : customers.slice(0, 5).map((c, idx) => (
                      <div key={idx}
                        className="p-4 border-b border-slate-50 last:border-b-0 flex items-center justify-between gap-3 hover:bg-slate-50 transition cursor-pointer"

            const filtered = publishedItems.filter(item => {
              if (promoteRegion !== 'all' && item.region !== promoteRegion) return false;
              if (promoteSearch) {
                const q = promoteSearch.toLowerCase();
                if (!String(item.title || '').toLowerCase().includes(q)
                    && !String(item.region || '').toLowerCase().includes(q)) return false;
              }
              return true;

            const regions = Array.from(new Set(publishedItems.map(i => i.region).filter(Boolean)));
            const myInviteCode = distData?.inviteCode || '';

              setSelectedForPromote(new Set());

            const exitSelectingMode = () => {

              setSelectedForPromote(new Set());

            const togglePromoteSelect = (id) => {

                if (next.has(id)) next.delete(id); else next.add(id);

              });

          {view === 'mine' && (isAdmin || canUpload) && (

                      {status === 'rejected' && item.reviewnote && (

                        </p>

                      <div className="mt-3 flex gap-2">
                        <a
                          href={`itinerary-maintenance-v2.html?id=${encodeURIComponent(String(item.id||item.timestamp||''))}`}
                          className="text-slate-700 hover:bg-slate-100 px-3 py-1 rounded-lg text-xs font-bold"

                          進入維護
                        </a>
                        <a

                        >
                          ✏️ 編輯

                        <button onClick={()=>handleDelete(item)}
                          className="text-red-500 hover:bg-red-50 px-3 py-1 rounded-lg text-xs font-bold">

                            🚀 推廣
                          </button>

                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* ── 待審核（管理員）── */}
          {view === 'review' && isAdmin && (
            <div className="space-y-3 anim">
              {pendingItems.length === 0 ? (
                <div className="p-20 bg-white rounded-[2rem] text-center border-2 border-dashed border-slate-200">
                  <p className="text-slate-300 font-bold">🎉 沒有待審核的行程</p>
                </div>
              ) : pendingItems.map(item => (
                <div key={item.id||item.timestamp} className="bg-white rounded-[2rem] border-2 border-amber-200 p-4 flex gap-4 hover:shadow-md transition cursor-pointer"
                  onClick={()=>{ setReviewing(item); setReviewNote(''); }}>
                  {item.image && <img src={item.image} className="w-32 h-24 object-cover rounded-xl shrink-0" />}
                  <div className="flex-1 min-w-0">
                    <h3 className="font-black text-slate-900 line-clamp-1">{item.title}</h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      {item.region} · {item.days}天 · {fmt(item.price)}
                    </p>
                    <p className="text-xs text-slate-600 mt-1">📝 上稿者：{item.ownername || '(未提供)'}</p>
                    <p className="text-xs text-slate-400 line-clamp-2 mt-2">

                    </p>
                    <button className="mt-3 bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-black hover:bg-blue-700">
                      🔍 開始審核
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── ★ v7：金流明細 view ── */}
          {view === 'payments' && (() => {
            // 把 orders 攤平成 payment events（每筆訂金/尾款各算一個事件）
            const events = [];
            const myUid = profile?.userId;
            orders.forEach(o => {
              if (!isAdmin && String(o.distributoruid) !== String(myUid)) return;
              const ds = String(o.depositstatus || 'unpaid').toLowerCase();
              const bs = String(o.balancestatus || 'unpaid').toLowerCase();
              // 訂金事件（任何狀態都列，這樣可以看到 unpaid / awaiting / failed）
              if (ds !== 'unpaid' || ds === 'unpaid') {
                events.push({
                  ts: o.depositpaidat || o.createdat,
                  order_id: o.orderid,
                  itinerary: o.itinerarytitle,
                  customer: o.customername,
                  customer_phone: o.customerphone,
                  leg: 'deposit',
                  amount: Number(o.depositamount || 0),
                  method: o.depositmethod,
                  status: ds,
                  trade_no: o.deposittradeno,
                  raw: o,
                });
              }
              // 尾款事件（不是 not_required 才有意義）
              if (String(o.balancecollect || '').toLowerCase() !== 'not_required'
                  && Number(o.balanceamount || 0) > 0) {
                events.push({
                  ts: o.balancepaidat || o.depositpaidat || o.createdat,
                  order_id: o.orderid,
                  itinerary: o.itinerarytitle,
                  customer: o.customername,
                  customer_phone: o.customerphone,
                  leg: 'balance',
                  amount: Number(o.balanceamount || 0),
                  method: o.balancemethod,
                  status: bs,
                  trade_no: o.balancetradeno,
                  raw: o,
                });
              }
            });

            // 日期區間篩選
            const now = new Date();
            const dateThreshold = (() => {
              if (paymentDateRange === 'all') return null;
              const days = { '7d': 7, '30d': 30, '90d': 90 }[paymentDateRange] || 30;
              return new Date(now.getTime() - days * 86400000);
            })();

            // 套篩選
            const filtered = events.filter(ev => {
              if (paymentFilter !== 'all' && String(ev.method || '').toLowerCase() !== paymentFilter) return false;
              if (paymentStatusFilter !== 'all') {
                const s = ev.status;
                if (paymentStatusFilter === 'paid' && !['paid', 'paid_online', 'paid_offline'].includes(s)) return false;
                if (paymentStatusFilter !== 'paid' && s !== paymentStatusFilter) return false;
              }
              if (dateThreshold && ev.ts) {
                const evDate = new Date(String(ev.ts).replace(' ', 'T'));
                if (!isNaN(evDate.getTime()) && evDate < dateThreshold) return false;
              }
              if (paymentSearch) {
                const q = paymentSearch.toLowerCase();
                if (!String(ev.order_id || '').toLowerCase().includes(q)
                    && !String(ev.itinerary || '').toLowerCase().includes(q)
                    && !String(ev.customer || '').toLowerCase().includes(q)
                    && !String(ev.customer_phone || '').includes(paymentSearch)
                    && !String(ev.trade_no || '').toLowerCase().includes(q)) return false;
              }
              return true;
            });

            // 依時間倒序
            filtered.sort((a, b) => String(b.ts || '').localeCompare(String(a.ts || '')));

            // 已收到的金額（只算 paid 狀態）
            const totalReceived = filtered
              .filter(e => ['paid', 'paid_online', 'paid_offline'].includes(e.status))
              .reduce((s, e) => s + e.amount, 0);
            const awaitingTotal = filtered
              .filter(e => e.status === 'awaiting_atm')
              .reduce((s, e) => s + e.amount, 0);
            const unpaidTotal = filtered
              .filter(e => e.status === 'unpaid')
              .reduce((s, e) => s + e.amount, 0);

            // 客戶電話遮罩（業務看不到完整號碼，管理員看得到）
            const maskPhone = (p) => {
              if (!p) return '—';
              if (isAdmin) return p;
              const s = String(p);
              if (s.length < 6) return s;
              return s.slice(0, 2) + '****' + s.slice(-3);
            };

            // CSV 匯出
            const exportCsv = () => {
              const headers = ['時間','訂單編號','行程','客戶','電話','階段','金額','付款方式','狀態','交易號'];
              const rows = filtered.map(e => [
                e.ts || '',
                e.order_id,
                e.itinerary || '',
                e.customer || '',
                isAdmin ? (e.customer_phone || '') : maskPhone(e.customer_phone),
                e.leg === 'deposit' ? '訂金' : '尾款',
                e.amount,
                ({ credit_card:'信用卡', linepay:'LINE Pay', vacc:'ATM', offline:'線下' }[e.method] || e.method || ''),
                ({ unpaid:'未付款', awaiting_atm:'等ATM', paid:'已付款', paid_online:'已付款', paid_offline:'已付款', failed:'付款失敗' }[e.status] || e.status),
                e.trade_no || '',
              ]);
              const escape = (v) => {
                const s = String(v ?? '');
                if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
                return s;
              };
              const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(escape).join(',')).join('\n');
              const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              const today = new Date().toISOString().slice(0, 10);
              a.href = url; a.download = `travelkeeper-payments-${today}.csv`;
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              URL.revokeObjectURL(url);
              showToast('✅ CSV 已下載');
            };

            const METHOD_LABEL = { credit_card:'信用卡', linepay:'LINE Pay', vacc:'ATM', offline:'線下' };
            const STATUS_BADGE = {
              unpaid:        { label:'未付款',  cls:'bg-slate-100 text-slate-500' },
              awaiting_atm:  { label:'等 ATM',  cls:'bg-amber-50 text-amber-700' },
              paid:          { label:'已付款',  cls:'bg-emerald-50 text-emerald-700' },
              paid_online:   { label:'已付款',  cls:'bg-emerald-50 text-emerald-700' },
              paid_offline:  { label:'已付款',  cls:'bg-emerald-50 text-emerald-700' },
              failed:        { label:'付款失敗', cls:'bg-red-50 text-red-600' },
            };

            return (
              <div className="space-y-6 anim">
                <div className="grid grid-cols-2 xl:grid-cols-4 gap-5">
                  <StatCard color="bg-emerald-600" num={fmt(totalReceived)} label="已收到金額"
                    hint={`${filtered.filter(e => ['paid','paid_online','paid_offline'].includes(e.status)).length} 筆`} loading={loading}/>
                  <StatCard color="bg-amber-500" num={fmt(awaitingTotal)} label="等待 ATM 繳款"
                    hint={`${filtered.filter(e => e.status === 'awaiting_atm').length} 筆`} loading={loading}/>
                  <StatCard color="bg-slate-700" num={fmt(unpaidTotal)} label="尚未付款"
                    hint={`${filtered.filter(e => e.status === 'unpaid').length} 筆`} loading={loading}/>
                  <StatCard color="bg-blue-600" num={filtered.length} label="總交易事件" loading={loading}/>
                </div>

                <div className="flex flex-col gap-3">
                  <input value={paymentSearch} onChange={e => setPaymentSearch(e.target.value)}
                    placeholder="搜尋訂單號 / 行程 / 客戶 / 交易號"
                    className="w-full p-3 border-2 border-slate-200 rounded-xl font-medium outline-none focus:border-blue-500 bg-white" />

                  <div className="flex flex-wrap gap-2">
                    <div className="flex gap-1 bg-white border border-slate-200 rounded-xl p-1">
                      {[
                        { k:'7d', l:'近 7 天' },
                        { k:'30d', l:'近 30 天' },
                        { k:'90d', l:'近 90 天' },
                        { k:'all', l:'全部' },
                      ].map(o => (
                        <button key={o.k} onClick={() => setPaymentDateRange(o.k)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-black transition ${
                            paymentDateRange === o.k ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-100'
                          }`}>{o.l}</button>
                      ))}
                    </div>

                    <div className="flex gap-1 bg-white border border-slate-200 rounded-xl p-1">
                      {[
                        { k:'all', l:'全部方式' },
                        { k:'credit_card', l:'信用卡' },
                        { k:'linepay', l:'LINE Pay' },
                        { k:'vacc', l:'ATM' },
                        { k:'offline', l:'線下' },
                      ].map(o => (
                        <button key={o.k} onClick={() => setPaymentFilter(o.k)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-black transition ${
                            paymentFilter === o.k ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-100'
                          }`}>{o.l}</button>
                      ))}
                    </div>

                    <div className="flex gap-1 bg-white border border-slate-200 rounded-xl p-1">
                      {[
                        { k:'all', l:'全部狀態' },
                        { k:'paid', l:'已付' },
                        { k:'awaiting_atm', l:'等 ATM' },
                        { k:'unpaid', l:'未付' },
                        { k:'failed', l:'失敗' },
                      ].map(o => (
                        <button key={o.k} onClick={() => setPaymentStatusFilter(o.k)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-black transition ${
                            paymentStatusFilter === o.k ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-100'
                          }`}>{o.l}</button>
                      ))}
                    </div>

                    <button onClick={exportCsv} disabled={filtered.length === 0}
                      className="ml-auto bg-emerald-600 text-white px-4 py-2 rounded-xl font-black text-xs hover:bg-emerald-700 transition disabled:opacity-40">
                      📥 匯出 CSV ({filtered.length})
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm">
                  {loading ? (
                    <div className="p-20 text-center">
                      <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
                      <p className="text-slate-400 font-bold text-sm">載入中…</p>
                    </div>
                  ) : filtered.length === 0 ? (
                    <div className="p-20 text-center text-slate-300 font-bold">無符合條件的交易紀錄</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left">
                        <thead className="bg-slate-50 text-[10px] text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                          <tr>
                            <th className="p-3">時間</th>
                            <th className="p-3">訂單 / 行程</th>
                            <th className="p-3">客戶</th>
                            <th className="p-3">階段</th>
                            <th className="p-3 text-right">金額</th>
                            <th className="p-3">方式</th>
                            <th className="p-3">狀態</th>
                            <th className="p-3">交易號</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filtered.map((e, idx) => {
                            const sCfg = STATUS_BADGE[e.status] || STATUS_BADGE.unpaid;
                            return (
                              <tr key={idx} className="hover:bg-slate-50 transition cursor-pointer"
                                onClick={() => setSelOrder(e.raw)}>
                                <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{fmtDate(e.ts) || '—'}</td>
                                <td className="p-3 max-w-[180px]">
                                  <p className="font-mono text-[10px] text-slate-500">{e.order_id}</p>
                                  <p className="font-bold text-sm text-slate-800 line-clamp-1">{e.itinerary || '—'}</p>
                                </td>
                                <td className="p-3 text-xs">
                                  <p className="font-bold text-slate-700">{e.customer || '—'}</p>
                                  <p className="text-slate-400 mt-0.5">{maskPhone(e.customer_phone)}</p>
                                </td>
                                <td className="p-3">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-black ${
                                    e.leg === 'deposit' ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'
                                  }`}>{e.leg === 'deposit' ? '訂金' : '尾款'}</span>
                                </td>
                                <td className="p-3 text-right font-black text-red-600">{fmt(e.amount)}</td>
                                <td className="p-3 text-xs font-bold text-slate-700">{METHOD_LABEL[e.method] || '—'}</td>
                                <td className="p-3">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-black ${sCfg.cls}`}>{sCfg.label}</span>
                                </td>
                                <td className="p-3 text-[10px] font-mono text-slate-400 max-w-[100px] truncate">{e.trade_no || '—'}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            );
          })()}

          {/* ── ★ v7：佣金結算 view ── */}
          {view === 'commission' && (() => {
            // 管理員視圖：依分銷商分組
            if (isAdmin) {
              const summary = commissionSummary || { groups: [], totals: { pending:0, payable:0, paid_out:0 } };

              // 計算選中的訂單數與金額
              const totalSelected = Object.values(selectedPayoutOrders).reduce((s, set) => s + (set?.size || 0), 0);
              const totalSelectedAmount = (() => {
                let amt = 0;
                summary.groups.forEach(g => {
                  const sel = selectedPayoutOrders[g.uid];
                  if (!sel) return;
                  g.payable.orders.forEach(o => {
                    if (sel.has(o.order_id)) amt += o.commission_amount;
                  });
                });
                return amt;
              })();

              const togglePayoutOrder = (uid, orderId) => {
                setSelectedPayoutOrders(prev => {
                  const next = { ...prev };
                  const set = new Set(next[uid] || []);
                  if (set.has(orderId)) set.delete(orderId);
                  else set.add(orderId);
                  next[uid] = set;
                  return next;
                });
              };

              const selectAllForDist = (group) => {
                setSelectedPayoutOrders(prev => {
                  const next = { ...prev };
                  const cur = next[group.uid] || new Set();
                  // 如果已經全選，就清空；否則全選
                  const allOrderIds = group.payable.orders.map(o => o.order_id);
                  const allSelected = allOrderIds.every(id => cur.has(id));
                  if (allSelected) {
                    next[group.uid] = new Set();
                  } else {
                    next[group.uid] = new Set(allOrderIds);
                  }
                  return next;
                });
              };

              const copyAmount = (amount, distName) => {
                navigator.clipboard.writeText(String(amount)).then(() => {
                  showToast(`✅ 已複製 ${fmt(amount)}（給 ${distName}）`);
                });
              };

              const handlePayout = async () => {
                const allIds = [];
                Object.values(selectedPayoutOrders).forEach(set => {
                  if (set) set.forEach(id => allIds.push(id));
                });
                if (allIds.length === 0) {
                  showToast('未選擇任何訂單', 'error');
                  return;
                }
                if (!confirm(`確定要把選中的 ${allIds.length} 筆訂單標記為「已匯款」？\n總金額：${fmt(totalSelectedAmount)}`)) return;

                setPayingOut(true);
                try {
                  const res = await fetch(`${WORKER_URL}/api/commission/payout`, {
                    method:'POST',
                    headers:{ 'Content-Type':'application/json' },
                    body: JSON.stringify({
                      order_ids: allIds,
                      operatorUid: profile.userId,
                    }),
                  });
                  const result = await res.json();
                  if (result.success) {
                    showToast(`✅ 已標記 ${result.updated} 筆訂單為已匯款`);
                    setSelectedPayoutOrders({});
                    // 重新拉資料
                    const [allOrdersRes, commRes] = await Promise.all([
                      fetch(`${WORKER_URL}/api/itineraries?action=getAllOrders`).then(r=>r.json()),
                      fetch(`${WORKER_URL}/api/commission/summary?uid=${profile.userId}`).then(r=>r.json()),
                    ]);
                    if (allOrdersRes?.data) setOrders(allOrdersRes.data);
                    if (commRes?.success) setCommissionSummary(commRes.data);
                  } else {
                    showToast('結算失敗：' + (result.error || ''), 'error');
                  }
                } catch (e) { showToast('網路錯誤', 'error'); }
                setPayingOut(false);
              };

              return (
                <div className="space-y-6 anim">
                  <div className="grid xl:grid-cols-3 gap-5">
                    <StatCard color="bg-amber-500"   num={fmt(summary.totals.pending)}   label="待結算"
                      hint="尾款未收完成" loading={loading}/>
                    <StatCard color="bg-blue-600"    num={fmt(summary.totals.payable)}   label="可請款"
                      hint="勾選後可批次匯款" loading={loading}/>
                    <StatCard color="bg-emerald-600" num={fmt(summary.totals.paid_out)} label="已匯款（累計）" loading={loading}/>
                  </div>

                  {totalSelected > 0 && (
                    <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 flex items-center justify-between flex-wrap gap-3">
                      <div>
                        <p className="font-black text-blue-900">已選擇 {totalSelected} 筆訂單</p>
                        <p className="text-sm text-blue-700 mt-1">
                          應匯總額：<span className="font-black text-lg">{fmt(totalSelectedAmount)}</span>
                        </p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setSelectedPayoutOrders({})}
                          className="bg-white text-slate-600 px-4 py-2 rounded-xl font-black text-sm hover:bg-slate-50 transition border border-slate-200">
                          清除選擇
                        </button>
                        <button onClick={handlePayout} disabled={payingOut}
                          className="bg-emerald-600 text-white px-5 py-2 rounded-xl font-black text-sm hover:bg-emerald-700 transition disabled:opacity-50">
                          {payingOut ? '處理中…' : '✅ 標記為已匯款'}
                        </button>
                      </div>
                    </div>
                  )}

                  {summary.groups.length === 0 ? (
                    <div className="bg-white rounded-[2rem] p-20 text-center border-2 border-dashed border-slate-200">
                      <p className="text-4xl mb-3">💸</p>
                      <p className="text-slate-400 font-bold">目前沒有需要結算的佣金</p>
                      <p className="text-slate-300 text-xs mt-2">當訂單尾款收齊（線上 paid 或線下標記已收），佣金會出現在這裡</p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {summary.groups.map(g => {
                        const expanded = !!expandedDist[g.uid];
                        const sel = selectedPayoutOrders[g.uid] || new Set();
                        const allSelected = g.payable.orders.length > 0
                          && g.payable.orders.every(o => sel.has(o.order_id));
                        return (
                          <div key={g.uid} className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
                            <div className="p-4 flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition"
                              onClick={() => setExpandedDist(prev => ({ ...prev, [g.uid]: !expanded }))}>
                              <div className="flex-1 min-w-0">
                                <p className="font-black text-slate-900">{g.name}</p>
                                <p className="text-xs text-slate-400 mt-0.5">
                                  佣金率 {g.commissionPct}% · {g.phone || '無電話'}
                                </p>
                              </div>
                              <div className="text-right shrink-0">
                                <p className="text-xs font-bold text-slate-400 uppercase">可請款</p>
                                <p className="text-xl font-black text-blue-600">{fmt(g.payable.total)}</p>
                                <p className="text-[10px] text-slate-400">{g.payable.count} 筆</p>
                              </div>
                              <div className="text-slate-300 text-sm">
                                {expanded ? '▲' : '▼'}
                              </div>
                            </div>

                            {expanded && (
                              <div className="border-t border-slate-100 bg-slate-50 p-4">
                                {g.payable.orders.length === 0 ? (
                                  <p className="text-center text-slate-300 text-sm py-4">無可請款訂單</p>
                                ) : (
                                  <>
                                    <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                                      <button onClick={() => selectAllForDist(g)}
                                        className="text-xs font-black text-blue-600 hover:underline">
                                        {allSelected ? '取消全選' : '全選此分銷商'}
                                      </button>
                                      <button onClick={() => copyAmount(g.payable.total, g.name)}
                                        className="bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-black hover:bg-slate-900 transition">
                                        📋 複製金額 {fmt(g.payable.total)}
                                      </button>
                                    </div>
                                    <div className="space-y-2">
                                      {g.payable.orders.map((o, idx) => (
                                        <label key={idx}
                                          className="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-100 cursor-pointer hover:border-blue-300 transition">
                                          <input type="checkbox" checked={sel.has(o.order_id)}
                                            onChange={() => togglePayoutOrder(g.uid, o.order_id)}
                                            className="w-4 h-4"/>
                                          <div className="flex-1 min-w-0">
                                            <p className="font-mono text-[10px] text-slate-400">{o.order_id}</p>
                                            <p className="text-sm font-bold text-slate-800 line-clamp-1">{o.itinerary_title || '—'}</p>
                                            <p className="text-xs text-slate-500 mt-0.5">
                                              {o.customer_name || '—'} · 訂單金額 {fmt(o.total_amount)} · 結算於 {o.settled_at}
                                            </p>
                                          </div>
                                          <div className="text-right shrink-0">
                                            <p className="font-black text-emerald-600">{fmt(o.commission_amount)}</p>
                                          </div>
                                        </label>
                                      ))}
                                    </div>
                                  </>
                                )}

                                {/* 已匯/待結算小提示 */}
                                <div className="mt-4 pt-3 border-t border-slate-200 grid grid-cols-2 gap-3 text-xs">
                                  <div>
                                    <span className="text-slate-400">待結算（尾款未收）：</span>
                                    <span className="font-black text-amber-600 ml-1">{fmt(g.pending.total)}</span>
                                    <span className="text-slate-300 ml-1">({g.pending.count})</span>
                                  </div>
                                  <div>
                                    <span className="text-slate-400">已匯款累計：</span>
                                    <span className="font-black text-emerald-600 ml-1">{fmt(g.paid_out.total)}</span>
                                    <span className="text-slate-300 ml-1">({g.paid_out.count})</span>
                                  </div>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            }

            // 分銷商視圖：自己的佣金三層 status
            const myOrders = orders.filter(o => String(o.distributoruid) === String(profile?.userId));
            const myCommission = {
              pending:  { count:0, total:0, orders:[] },
              payable:  { count:0, total:0, orders:[] },
              paid_out: { count:0, total:0, orders:[] },
            };
            myOrders.forEach(o => {
              const s = String(o.commissionstatus || 'pending').toLowerCase();
              const amt = Number(o.commissionamount || 0);
              if (myCommission[s]) {
                myCommission[s].count++;
                myCommission[s].total += amt;
                myCommission[s].orders.push(o);
              }
            });

            return (
              <div className="space-y-6 anim">
                <div className="grid xl:grid-cols-3 gap-5">
                  <StatCard color="bg-amber-500"   num={fmt(myCommission.pending.total)}  label="待結算"
                    hint={`${myCommission.pending.count} 筆 · 等尾款`} loading={loading}/>
                  <StatCard color="bg-blue-600"    num={fmt(myCommission.payable.total)}  label="可請款"
                    hint={`${myCommission.payable.count} 筆 · 等管理員匯款`} loading={loading}/>
                  <StatCard color="bg-emerald-600" num={fmt(myCommission.paid_out.total)} label="已領取"
                    hint={`${myCommission.paid_out.count} 筆 · 累計`} loading={loading}/>
                </div>

                <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4">
                  <p className="text-xs font-black text-blue-700 uppercase tracking-widest mb-2">💡 佣金結算說明</p>
                  <ul className="text-xs text-blue-900 space-y-1 list-disc list-inside leading-relaxed">
                    <li><span className="font-bold">待結算</span>：客戶已下單，但尾款還沒收完整（線上未付完 or 線下未確認收款）</li>
                    <li><span className="font-bold">可請款</span>：尾款收齊了，等管理員月結匯款</li>
                    <li><span className="font-bold">已領取</span>：管理員已將佣金匯入您指定的帳戶</li>
                  </ul>
                </div>

                {[
                  { key:'payable', label:'可請款訂單', cls:'bg-blue-50 border-blue-200', cfg: myCommission.payable },
                  { key:'pending', label:'待結算訂單', cls:'bg-amber-50 border-amber-200', cfg: myCommission.pending },
                  { key:'paid_out',label:'已領取訂單', cls:'bg-emerald-50 border-emerald-200', cfg: myCommission.paid_out },
                ].map(group => (
                  <div key={group.key}>
                    <h3 className="font-black text-slate-900 mb-3">
                      {group.label} <span className="text-slate-400 text-sm font-bold">({group.cfg.count})</span>
                    </h3>
                    {group.cfg.orders.length === 0 ? (
                      <div className={`p-8 rounded-2xl border-2 border-dashed ${group.cls.replace('bg-','border-')} text-center text-slate-400 text-sm`}>
                        無訂單
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {group.cfg.orders.slice(0, 10).map((o, idx) => (
                          <div key={idx}
                            className="bg-white border border-slate-100 rounded-xl p-3 flex items-center gap-3 hover:border-blue-200 transition cursor-pointer"
                            onClick={() => setSelOrder(o)}>
                            <div className="flex-1 min-w-0">
                              <p className="font-mono text-[10px] text-slate-400">{o.orderid}</p>
                              <p className="font-bold text-sm text-slate-800 line-clamp-1">{o.itinerarytitle || '—'}</p>
                              <p className="text-xs text-slate-500 mt-0.5">
                                {o.customername || '—'} · 訂單金額 {fmt(o.totalamount || o.price)}
                              </p>
                            </div>
                            <div className="text-right shrink-0">
                              <p className="font-black text-emerald-600">{fmt(o.commissionamount)}</p>
                              {o.commissionsettledat && (
                                <p className="text-[10px] text-slate-400">{fmtDate(o.commissionsettledat)}</p>
                              )}
                            </div>
                          </div>
                        ))}
                        {group.cfg.orders.length > 10 && (
                          <p className="text-center text-xs text-slate-400 mt-2">… 還有 {group.cfg.orders.length - 10} 筆</p>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            );
          })()}

        </div>
      </main>

      {/* ════════════════════════════════════════════════════════
          手機底部 Tab Bar（fixed）
          ════════════════════════════════════════════════════════ */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 shadow-2xl">
        <div className="flex overflow-x-auto no-scrollbar">
          {menu.map(item => {
            const active = view === item.id && !item.isAction;
            return (
              <button key={item.id} onClick={() => handleMenuClick(item)}
                className={`flex-1 min-w-[64px] py-2.5 px-1 flex flex-col items-center justify-center gap-0.5 transition relative ${
                  active ? 'text-blue-600' : 'text-slate-400'
                }`}>
                <span className="text-lg">{item.icon}</span>
                <span className={`text-[10px] font-black truncate max-w-full px-0.5 ${active ? 'text-blue-600' : 'text-slate-500'}`}>
                  {item.label}
                </span>
                {item.badge > 0 && (
                  <span className="absolute top-1 right-1/2 translate-x-3 bg-amber-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full">
                    {item.badge > 99 ? '99+' : item.badge}
                  </span>
                )}
                {active && <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-blue-600 rounded-b-full"/>}
              </button>
            );
          })}
        </div>
      </nav>

      {/* ════════════════════════════════════════════════════════
          Modals
          ════════════════════════════════════════════════════════ */}

      {/* 新增/編輯 行程 */}
      {(creating || editing) && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={e => e.target===e.currentTarget && (saving ? null : (setCreating(false), setEditing(null)))}>
          <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim">
            <div className="p-6 border-b border-slate-100 sticky top-0 bg-white z-10 flex justify-between items-center">
              <h2 className="font-black text-xl">
                {editing ? '✏️ 編輯行程' : '📝 新增行程'}
              </h2>
              <button onClick={()=>{ if(saving) return; setCreating(false); setEditing(null); }}
                className="w-9 h-9 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="p-6">
              {!isAdmin && (
                <div className="bg-amber-50 border-2 border-amber-200 rounded-xl p-3 mb-5 text-xs font-bold text-amber-700">
                  ℹ️ 您是分銷商，{editing ? '修改' : '新增'}的行程需經管理員審核才會上架
                </div>
              )}
              <ItineraryForm
                initial={editing}
                onSave={handleSave}
                onCancel={()=>{ if(saving) return; setCreating(false); setEditing(null); }}
                saving={saving}
              />
            </div>
          </div>
        </div>
      )}

      {/* 審核 Modal */}
      {reviewing && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={e => e.target===e.currentTarget && setReviewing(null)}>
          <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim">
            <div className="p-6 border-b border-slate-100 sticky top-0 bg-white z-10 flex justify-between items-center">
              <h2 className="font-black text-xl">🔍 審核行程</h2>
              <button onClick={()=>setReviewing(null)}
                className="w-9 h-9 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="p-6 space-y-4">
              {reviewing.image && <img src={reviewing.image} className="w-full aspect-video object-cover rounded-2xl" />}
              <div>
                <h3 className="font-black text-2xl text-slate-900">{reviewing.title}</h3>
                <p className="text-sm text-slate-500 mt-1">
                  {reviewing.region} · {reviewing.days}天 · {fmt(reviewing.price)}
                </p>
                <p className="text-sm text-slate-600 mt-2">📝 上稿者：{reviewing.ownername}</p>
              </div>
              <div className="bg-slate-50 rounded-2xl p-4 max-h-64 overflow-y-auto">
                <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">行程內容</p>
                <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">
                  {String(reviewing.description||'').replace(/!\[([^\]]*)\]\([^)]+\)/g,'[圖片：$1]')}
                </p>
              </div>
              {reviewing.notes && (
                <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl">
                  <p className="text-xs font-black text-amber-700 uppercase mb-1">注意事項</p>
                  <p className="text-sm text-amber-900">{reviewing.notes}</p>
                </div>
              )}
              <div>
                <label className="text-xs font-black text-slate-400 uppercase tracking-widest">審核備註（駁回時必填）</label>
                <textarea rows="2" value={reviewNote} onChange={e=>setReviewNote(e.target.value)}
                  placeholder="駁回時請說明原因…"
                  className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl text-sm outline-none focus:border-blue-500" />
              </div>
              <div className="flex gap-3 pt-2">
                <button onClick={()=>{
                  if (!reviewNote.trim()) { alert('駁回需要填寫理由'); return; }
                  if (confirm('確定駁回此行程？')) handleReview('rejected');
                }} disabled={saving}
                  className="flex-1 bg-red-50 text-red-600 font-black py-3 rounded-2xl hover:bg-red-100 transition disabled:opacity-50">
                  ❌ 駁回
                </button>
                <button onClick={()=>{ if (confirm('確定核准上架？')) handleReview('published'); }}
                  disabled={saving}
                  className="flex-[2] bg-emerald-600 text-white font-black py-3 rounded-2xl hover:bg-emerald-700 transition disabled:opacity-50">
                  ✅ 核准上架
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 分銷商詳情 */}
      {selDist && (
        <DistModal
          dist={selDist}
          onClose={() => setSelDist(null)}
          onApprove={handleApprove}
          onReject={handleReject}
        />
      )}

      {/* 訂單詳情 */}
      {selOrder && (
        <OrderModal
          order={selOrder}
          onClose={() => setSelOrder(null)}
          onUpdateStatus={handleUpdateOrderStatus}
          onMarkBalancePaid={handleMarkBalancePaid}
          canEditStatus={isAdmin}
        />
      )}

      {/* ★ v9：推廣 Modal（完整版） */}
      {selPromote && (
        <PromoteModal
          initialItems={Array.isArray(selPromote) ? selPromote : [selPromote]}
          allItems={publishedItems}
          profile={profile}
          inviteCode={distData?.inviteCode || ''}
          agencySlug="demo"
          distData={distData}
          onClose={() => setSelPromote(null)}
          onPushFlex={handlePushFlex}
          onCopyLink={handleCopyPromoteLink}
          onDownloadImage={handleDownloadPromoteImage}
          pushingFlex={pushingFlex}
          genImageBusy={genImageBusy}
        />
      )}

      {/* 客戶訂單明細 Modal */}
      {selCustomer && (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
          onClick={() => { setSelCustomer(null); setCustomerOrders([]); }}>
          <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto anim"
            onClick={(e) => e.stopPropagation()}>
            <div className="p-6 border-b border-slate-100 flex justify-between items-start sticky top-0 bg-white z-10">
              <div>
                <h3 className="font-black text-xl text-slate-900">{selCustomer.customername || '—'}</h3>
                <a href={`tel:${selCustomer.customerphone}`}
                  className="text-sm text-blue-600 hover:underline font-medium mt-1 block">
                  {selCustomer.customerphone}
                </a>
              </div>
              <button onClick={() => { setSelCustomer(null); setCustomerOrders([]); }}
                className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="p-6 grid grid-cols-3 gap-3 bg-slate-50 border-b border-slate-100">
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">訂單數</p>
                <p className="font-black text-2xl text-slate-900 mt-1">{selCustomer.totalorders || 0}</p>
              </div>
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">累計貢獻</p>
                <p className="font-black text-2xl text-emerald-600 mt-1">{fmt(selCustomer.totalamount)}</p>
              </div>
              <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">首次下單</p>
                <p className="font-bold text-xs text-slate-700 mt-2">{fmtDate(selCustomer.firstorderat)}</p>
              </div>
            </div>
            <div className="p-6">
              <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">訂單明細</p>
              {loadingCustOrders ? (
                <div className="p-10 text-center">
                  <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"/>
                </div>
              ) : customerOrders.length === 0 ? (
                <div className="p-10 text-center text-slate-300 font-bold text-sm">無訂單</div>
              ) : (
                <div className="space-y-2">
                  {customerOrders.map((o, idx) => (
                    <div key={idx}
                      className="border border-slate-100 rounded-xl p-4 hover:border-blue-300 cursor-pointer transition"
                      onClick={() => { setSelOrder(o); }}>
                      <div className="flex justify-between items-start gap-3">
                        <div className="flex-1 min-w-0">
                          <p className="font-black text-sm text-slate-800 line-clamp-1">{o.itinerarytitle || '—'}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5 font-mono">{o.orderid}</p>
                          <p className="text-xs text-slate-500 mt-1">
                            {o.travelers || 1} 人 · {fmtTravelDate(o.traveldate)} · {fmtDate(o.createdat)}
                          </p>
                        </div>
                        <div className="text-right shrink-0">
                          <p className="font-black text-red-600">{fmt(o.price)}</p>
                          <div className="mt-1"><OrderStatusBadge status={o.status} /></div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div className={`fixed bottom-24 md:bottom-8 right-4 md:right-8 z-[200] px-6 py-4 rounded-2xl shadow-2xl font-bold text-white anim ${
          toast.type==='error' ? 'bg-red-600' : 'bg-slate-900'
        }`}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ★ JSX 編譯快取載入器 v2（修：拿掉 env preset、加 setItem 後驗證） -->
<script>
(function(){
  const CACHE_KEY_PREFIX = 'tk-jsx-cache-v2:';
  const BABEL_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js';

  function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return (h>>>0).toString(36); }

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function execCode(code){ new Function(code)(); }

  async function boot(){
    const src = document.getElementById('app-source')?.textContent || '';
    if (!src.trim()) { console.error('[jsx-loader] no #app-source'); return; }

    const key = CACHE_KEY_PREFIX + hash(src);
    console.log('[jsx-loader] cache key:', key, '| source len:', src.length);

    try {
      const cached = localStorage.getItem(key);
      if (cached) {
        console.log('[jsx-loader] ✅ cache HIT, compiled len:', cached.length, '— skip babel');
        execCode(cached);
        return;
      } else {
        console.log('[jsx-loader] cache MISS（key 不存在）');
      }
    } catch(e) { console.warn('[jsx-loader] localStorage read failed', e); }

    const t0 = performance.now();
    try {
      await loadScript(BABEL_CDN);
      const t1 = performance.now();
      console.log('[jsx-loader] babel loaded in', (t1-t0).toFixed(0), 'ms');

      const compiled = Babel.transform(src, { presets: ['react'] }).code;
      const t2 = performance.now();
      console.log('[jsx-loader] compiled in', (t2-t1).toFixed(0), 'ms, output len:', compiled.length);

      try {
        localStorage.setItem(key, compiled);
        const verify = localStorage.getItem(key);
        if (verify === compiled) {
          console.log('[jsx-loader] ✅ cache write OK，下次進站秒開');
        } else {
          console.warn('[jsx-loader] ⚠️ cache write mismatch (verify=' + (verify?verify.length:'null') + ' vs ' + compiled.length + ')');
        }
      } catch(e) {
        console.warn('[jsx-loader] ⚠️ cache write FAILED:', e.name, e.message);
        try {
          let cleared = 0;
          for (let i=localStorage.length-1; i>=0; i--) {
            const k = localStorage.key(i);
            if (k && (k.startsWith('tk-jsx-cache-'))) { localStorage.removeItem(k); cleared++; }
          }
          console.log('[jsx-loader] cleared', cleared, 'old cache keys, retrying...');
          localStorage.setItem(key, compiled);
          console.log('[jsx-loader] ✅ cache write OK (retry)');
        } catch(e2) { console.warn('[jsx-loader] ⚠️ retry also failed:', e2.message); }
      }

      execCode(compiled);
    } catch(e) {
      console.error('[jsx-loader] babel load/compile failed:', e);
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;font-family:sans-serif"><h2>載入失敗</h2><p style="color:#888">請重新整理頁面，或清除瀏覽器快取</p></div>';
    }
  }

  if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') boot();
  else window.addEventListener('load', boot);
})();
</script>
