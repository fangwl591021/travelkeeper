<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#20998;&#20139;&#34892;&#31243; | TravelKeeper</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box {
      width: min(420px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .08);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: #64748b; line-height: 1.7; }
    button {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      background: #06c755;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <main class="box">
    <h1>&#20998;&#20139;&#34892;&#31243;</h1>
    <p id="status">&#27491;&#22312;&#28310;&#20633; LINE &#20998;&#20139;&#38754;&#26495;...</p>
    <button id="retry" type="button" hidden>&#37325;&#26032;&#38283;&#21855;&#20998;&#20139;</button>
  </main>

  <script>
    const LIFF_ID = '2009367829-BDZCGti8';
    const WORKER_URL = 'https://travelkeeper-worker.fangwl591021.workers.dev';
    const params = new URLSearchParams(location.search);
    const shareId = params.get('s') || params.get('id') || '';
    const statusEl = document.getElementById('status');
    const retryBtn = document.getElementById('retry');

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
    }

    async function trackShareEvent(eventType) {
      if (!shareId) return;
      try {
        await fetch(`${WORKER_URL}/api/share/event`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            share_id: shareId,
            event_type: eventType,
            source: 'flex-share',
            target_url: location.href,
          }),
        });
      } catch (err) {
        console.warn('share event failed:', err);
      }
    }

    async function loadMessage() {
      if (!shareId) throw new Error('\u7f3a\u5c11\u5206\u4eab\u4ee3\u78bc');
      const res = await fetch(`${WORKER_URL}/api/flex/share?id=${encodeURIComponent(shareId)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success || !data.message) {
        throw new Error(data.error || '\u8b80\u53d6\u5206\u4eab\u5361\u5931\u6557');
      }
      return data.message;
    }

    async function share() {
      retryBtn.hidden = true;
      setStatus('\u6b63\u5728\u6e96\u5099 LINE \u5206\u4eab\u9762\u677f...');
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }
        if (!liff.isApiAvailable('shareTargetPicker')) {
          throw new Error('\u76ee\u524d LINE \u74b0\u5883\u4e0d\u652f\u63f4\u5206\u4eab\u9762\u677f');
        }
        const message = await loadMessage();
        await trackShareEvent('share_panel_open');
        const result = await liff.shareTargetPicker([message]);
        if (result) {
          await trackShareEvent('card_sent');
          setStatus('\u5df2\u958b\u555f\u5206\u4eab\u4e26\u9001\u51fa\u3002');
          setTimeout(() => {
            if (liff.isInClient()) liff.closeWindow();
          }, 600);
        } else {
          await trackShareEvent('card_cancelled');
          setStatus('\u5df2\u53d6\u6d88\u5206\u4eab\u3002');
          retryBtn.hidden = false;
        }
      } catch (err) {
        setStatus(err.message || '\u5206\u4eab\u5931\u6557\uff0c\u8acb\u7a0d\u5f8c\u518d\u8a66\u3002', true);
        retryBtn.hidden = false;
      }
    }

    retryBtn.addEventListener('click', share);
    share();
  </script>
</body>
</html>
