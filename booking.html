<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程預約 | 旅遊管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Noto Sans TC',sans-serif; background:#f0f4ff; min-height:100vh; margin:0; }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 0%, rgba(16,185,129,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 90%, rgba(37,99,235,0.07) 0%, transparent 60%);
      pointer-events:none; z-index:0;
    }
    @keyframes fadeUp { from {opacity:0;transform:translateY(24px);} to {opacity:1;transform:translateY(0);} }
    .fade-up { animation: fadeUp 0.5s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.7s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect } = React;
    const WORKER_URL = 'https://travelkeeper.fangwl591021.workers.dev';

    const CheckIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{width:48,height:48}}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    );

    function Field({ label, hint, children }) {
      return (
        <div style={{marginBottom:22}}>
          <label style={{display:'block',fontSize:10,fontWeight:900,color:'#94a3b8',
            textTransform:'uppercase',letterSpacing:'0.15em',marginBottom:8}}>{label}</label>
          {children}
          {hint && <p style={{fontSize:11,color:'#94a3b8',marginTop:6,fontWeight:500}}>{hint}</p>}
        </div>
      );
    }

    const baseInput = {
      width:'100%',background:'#f8fafc',border:'2px solid #f1f5f9',borderRadius:14,
      padding:'15px 18px',fontSize:16,fontWeight:700,fontFamily:'Noto Sans TC,sans-serif',
      color:'#0f172a',outline:'none',boxSizing:'border-box',
      transition:'border-color .2s,box-shadow .2s,background .2s',
    };
    const focusOn = e => { e.target.style.borderColor='#10b981'; e.target.style.background='#fff'; e.target.style.boxShadow='0 0 0 4px rgba(16,185,129,.09)'; };
    const focusOff = e => { e.target.style.borderColor='#f1f5f9'; e.target.style.background='#f8fafc'; e.target.style.boxShadow='none'; };

    function Shell({ tenant, children }) {
      return (
        <div style={{position:'relative',zIndex:1,minHeight:'100vh',display:'flex',
          alignItems:'flex-start',justifyContent:'center',padding:'40px 16px 64px'}}>
          <div style={{background:'#fff',borderRadius:36,width:'100%',maxWidth:520,
            boxShadow:'0 32px 80px rgba(16,185,129,.09),0 2px 8px rgba(0,0,0,.04)',
            border:'1px solid rgba(16,185,129,.08)',overflow:'hidden'}}>
            <div style={{background:'linear-gradient(135deg,#065f46 0%,#10b981 60%,#2563eb 100%)',
              padding:'32px 40px 28px',position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',top:-40,right:-30,width:140,height:140,borderRadius:'50%',background:'rgba(255,255,255,.05)'}}/>
              <div style={{position:'absolute',bottom:-30,left:-20,width:100,height:100,borderRadius:'50%',background:'rgba(255,255,255,.04)'}}/>
              <div style={{position:'relative',zIndex:1}}>
                <span style={{display:'inline-block',background:'rgba(255,255,255,.18)',color:'rgba(255,255,255,.9)',
                  fontSize:10,fontWeight:900,letterSpacing:'0.15em',textTransform:'uppercase',
                  padding:'5px 14px',borderRadius:999,marginBottom:14}}>立即預約</span>
                <h1 style={{color:'#fff',fontSize:26,fontWeight:900,margin:0,lineHeight:1.3}}>
                  {tenant?.name || '旅遊管家'}
                </h1>
                <p style={{color:'rgba(255,255,255,.75)',fontSize:13,fontWeight:600,marginTop:6}}>
                  Travel Booking
                </p>
              </div>
            </div>
            <div style={{padding:'36px 40px 44px'}}>{children}</div>
          </div>
        </div>
      );
    }

    function App() {
      const p = new URLSearchParams(window.location.search);
      const agencySlug = p.get('a') || 'demo';
      const itineraryId = p.get('itinerary') || '';
      const distributorUid = p.get('ref') || '';
      // ★ v3：推薦碼（新版優先；統一轉大寫，避開大小寫差異）
      const inviteCode = (p.get('invite') || '').trim().toUpperCase();

      const [step, setStep] = useState('loading');
      const [tenant, setTenant] = useState(null);
      const [profile, setProfile] = useState(null);
      const [itinerary, setItinerary] = useState(null);
      const [referrer, setReferrer] = useState(null);  // ★ v3：推薦人資訊
      const [form, setForm] = useState({
        customer_name:'', customer_phone:'', travelers:2, travel_date:'', note:''
      });
      const [errMsg, setErr] = useState('');

      useEffect(() => {
        (async () => {
          try {
            console.log('[booking] 🚀 init start', { agencySlug, itineraryId, distributorUid, inviteCode });

            // ★ v3：歸屬驗證 — invite OR ref 任一存在即可
            if (!itineraryId || (!distributorUid && !inviteCode)) {
              console.error('[booking] ❌ 缺少參數', { itineraryId, distributorUid, inviteCode });
              setErr('缺少必要參數，請從推廣連結進入');
              setStep('error');
              return;
            }

            // 1. 載入租戶設定 + 推薦碼解析（並行）
            console.log('[booking] 1️⃣ fetching config + invite resolve in parallel...');
            const tasks = [
              fetch(`${WORKER_URL}/api/config?a=${agencySlug}`).then(r => r.json()),
              inviteCode
                ? fetch(`${WORKER_URL}/api/resolve-invite?code=${encodeURIComponent(inviteCode)}`).then(r => r.json())
                : Promise.resolve(null),
            ];
            const [cfgData, inviteData] = await Promise.all(tasks);

            console.log('[booking] 1️⃣ config response:', cfgData);
            if (!cfgData.success) {
              console.error('[booking] ❌ config failed:', cfgData);
              setErr('租戶設定載入失敗：' + (cfgData.error || '未知錯誤'));
              setStep('error');
              return;
            }
            setTenant(cfgData.data);

            // ★ v3：推薦碼解析結果（解不到就靜默忽略，仍可走 ref fallback）
            if (inviteData?.success && inviteData.data?.uid) {
              console.log('[booking] 1️⃣ invite resolved:', inviteData.data);
              setReferrer({ name: inviteData.data.name || '夥伴' });
            }

            // 2. LIFF 初始化
            console.log('[booking] 2️⃣ liff.init with ID:', cfgData.data.liff_id);
            await liff.init({ liffId: cfgData.data.liff_id });
            if (!liff.isLoggedIn()) {
              console.log('[booking] 2️⃣ not logged in, redirecting to login...');
              liff.login({ redirectUri: window.location.href });
              return;
            }

            const prof = await liff.getProfile();
            console.log('[booking] 2️⃣ profile:', prof.displayName);
            setProfile(prof);
            setForm(f => ({ ...f, customer_name: prof.displayName }));

            // 3. 載入行程資料（GAS 直接回 array，不是 {success, data}）
            console.log('[booking] 3️⃣ fetching itineraries...');
            const itRes = await fetch(`${WORKER_URL}/api/itineraries?action=getItineraries`);
            const itData = await itRes.json();
            const itList = Array.isArray(itData) ? itData : (itData.data || itData.itineraries || []);
            console.log('[booking] 3️⃣ itineraries count:', itList.length);

            const found = itList.find(x => String(x.id || x.timestamp || '') === String(itineraryId));
            if (found) {
              console.log('[booking] ✅ found itinerary:', found.title);
              setItinerary(found);
            } else {
              console.error('[booking] ❌ itinerary not found in list');
              setErr(`找不到行程 ID: ${itineraryId}`);
              setStep('error');
              return;
            }

            console.log('[booking] ✅ all checks passed, showing form');
            setStep('form');
          } catch (e) {
            console.error('[booking] 💥 caught exception:', e);
            setErr(e.message || '未知錯誤');
            setStep('error');
          }
        })();
      }, [agencySlug, itineraryId, distributorUid, inviteCode]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!form.customer_phone.trim()) { setErr('請填寫聯絡電話'); return; }
        if (!form.customer_name.trim()) { setErr('請填寫姓名'); return; }
        setErr(''); setStep('submitting');

        try {
          // ★ v3：送單時把 invite_code 也帶上；worker 會優先用它解析業務 uid
          //   兩個都帶，worker 內部 invite_code 優先，distributor_uid 為 fallback
          const body = {
            itinerary_id: itineraryId,
            customer_line_uid: profile.userId,
            customer_name: form.customer_name,
            customer_phone: form.customer_phone,
            travelers: Number(form.travelers) || 1,
            travel_date: form.travel_date,
            note: form.note,
          };
          if (inviteCode)      body.invite_code     = inviteCode;
          if (distributorUid)  body.distributor_uid = distributorUid;

          const res = await fetch(`${WORKER_URL}/api/orders/create?a=${agencySlug}`, {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(body),
          });
          const result = await res.json();
          if (result.success) { setStep('success'); }
          else { setErr(result.error || '送出失敗，請稍後重試'); setStep('form'); }
        } catch {
          setErr('網路連線失敗，請稍後重試');
          setStep('form');
        }
      };

      if (step === 'loading') return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
          <div className="spin" style={{width:44,height:44,border:'4px solid #e2e8f0',borderTopColor:'#10b981',borderRadius:'50%'}}/>
          <p style={{color:'#94a3b8',fontWeight:700,fontFamily:'Noto Sans TC,sans-serif'}}>載入中…</p>
        </div>
      );

      if (step === 'error') return (
        <Shell tenant={null}>
          <div style={{textAlign:'center',padding:'40px 0'}}>
            <div style={{fontSize:64,marginBottom:16}}>⛔</div>
            <h2 style={{fontSize:22,fontWeight:900,color:'#0f172a',marginBottom:12}}>無法載入</h2>
            <p style={{color:'#dc2626',fontWeight:700,fontSize:13,
              background:'#fef2f2',padding:'10px 16px',borderRadius:10,
              fontFamily:'monospace',wordBreak:'break-all',margin:'0 auto',maxWidth:'90%'}}>
              {errMsg || '未知錯誤'}
            </p>
            <p style={{color:'#94a3b8',fontWeight:600,fontSize:12,marginTop:14}}>
              請截圖此畫面並聯絡業務人員
            </p>
          </div>
        </Shell>
      );

      if (step === 'success') return (
        <Shell tenant={tenant}>
          <div className="fade-up" style={{textAlign:'center',padding:'32px 0'}}>
            <div style={{width:88,height:88,background:'linear-gradient(135deg,#d1fae5,#a7f3d0)',borderRadius:'50%',
              display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 24px',
              boxShadow:'0 8px 24px rgba(16,185,129,.2)'}}>
              <CheckIcon />
            </div>
            <h2 style={{fontSize:26,fontWeight:900,color:'#0f172a',marginBottom:10}}>預約已送出！🎉</h2>
            <p style={{color:'#64748b',fontWeight:600,lineHeight:1.8,marginBottom:28}}>
              感謝您的預約。<br/>
              業務專員將盡快與您聯繫確認行程細節。
            </p>
            <button onClick={() => liff.closeWindow()} style={{
              background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',
              padding:'14px 36px',borderRadius:14,fontWeight:900,fontSize:14,
              border:'none',cursor:'pointer',boxShadow:'0 10px 24px rgba(16,185,129,.25)'}}>
              關閉視窗
            </button>
          </div>
        </Shell>
      );

      const isSubmitting = step === 'submitting';
      return (
        <Shell tenant={tenant}>
          <form onSubmit={handleSubmit} className="fade-up">

            {/* ★ v3：推薦人 banner */}
            {referrer && (
              <div style={{background:'#ecfdf5',border:'2px solid #bbf7d0',borderRadius:14,
                padding:'12px 16px',marginBottom:22,fontSize:13,textAlign:'center'}}>
                <span style={{color:'#15803d',fontWeight:700}}>您是</span>
                <span style={{color:'#14532d',fontWeight:900,margin:'0 6px'}}>{referrer.name}</span>
                <span style={{color:'#15803d',fontWeight:700}}>推薦的客人 🎉</span>
              </div>
            )}

            {/* 行程資訊卡 */}
            {itinerary && (
              <div style={{background:'linear-gradient(135deg,#f0fdf4,#ecfdf5)',
                border:'2px solid #bbf7d0',borderRadius:18,padding:'18px 20px',marginBottom:26}}>
                {itinerary.image && (
                  <img src={itinerary.image} alt={itinerary.title}
                    style={{width:'100%',height:140,objectFit:'cover',borderRadius:12,marginBottom:14}}/>
                )}
                <p style={{fontSize:10,fontWeight:900,color:'#16a34a',textTransform:'uppercase',
                  letterSpacing:'0.12em',marginBottom:6}}>您正在預約</p>
                <h3 style={{fontSize:18,fontWeight:900,color:'#0f172a',marginBottom:8,lineHeight:1.4}}>
                  {itinerary.title}
                </h3>
                <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                  {itinerary.region && (
                    <span style={{background:'#dcfce7',color:'#15803d',padding:'4px 10px',
                      borderRadius:8,fontSize:11,fontWeight:900}}>📍 {itinerary.region}</span>
                  )}
                  {itinerary.days && (
                    <span style={{background:'#dbeafe',color:'#1d4ed8',padding:'4px 10px',
                      borderRadius:8,fontSize:11,fontWeight:900}}>📅 {itinerary.days} 天</span>
                  )}
                  <span style={{marginLeft:'auto',fontSize:18,fontWeight:900,color:'#dc2626'}}>
                    NT$ {Number(itinerary.price || 0).toLocaleString()}
                  </span>
                </div>
              </div>
            )}

            <hr style={{border:'none',borderTop:'1.5px solid #f1f5f9',margin:'0 0 26px'}}/>

            {/* LINE 已綁定 */}
            {profile && (
              <div style={{display:'flex',alignItems:'center',gap:14,background:'#f8fafc',
                borderRadius:14,padding:'12px 16px',marginBottom:26,border:'2px solid #f1f5f9'}}>
                <img src={profile.pictureUrl} style={{width:44,height:44,borderRadius:'50%',border:'2px solid #e2e8f0'}}/>
                <div>
                  <p style={{fontSize:10,fontWeight:900,color:'#94a3b8',textTransform:'uppercase',
                    letterSpacing:'0.12em',marginBottom:2}}>LINE 帳號</p>
                  <p style={{fontWeight:900,color:'#0f172a',fontSize:15}}>{profile.displayName}</p>
                </div>
              </div>
            )}

            <Field label="預約人姓名" hint="將用於行程出團名單">
              <input required style={baseInput} value={form.customer_name}
                onChange={e=>setForm({...form,customer_name:e.target.value})}
                placeholder="請輸入真實姓名"
                onFocus={focusOn} onBlur={focusOff}/>
            </Field>

            <Field label="聯絡電話" hint="業務專員確認預約時使用">
              <input required type="tel" style={baseInput} value={form.customer_phone}
                onChange={e=>setForm({...form,customer_phone:e.target.value})}
                placeholder="例如：0912-345-678"
                onFocus={focusOn} onBlur={focusOff}/>
            </Field>

            <Field label="預約人數">
              <input required type="number" min="1" max="50" style={baseInput} value={form.travelers}
                onChange={e=>setForm({...form,travelers:e.target.value})}
                onFocus={focusOn} onBlur={focusOff}/>
            </Field>

            <Field label="希望出發日期" hint="未確定可留空，由業務協助安排">
              <input type="date" style={baseInput} value={form.travel_date}
                onChange={e=>setForm({...form,travel_date:e.target.value})}
                onFocus={focusOn} onBlur={focusOff}/>
            </Field>

            <Field label="備註（選填）" hint="特殊飲食、住房需求等">
              <textarea rows="3" style={{...baseInput,resize:'vertical',minHeight:80}}
                value={form.note} onChange={e=>setForm({...form,note:e.target.value})}
                placeholder="例如：素食、需要嬰兒床"
                onFocus={focusOn} onBlur={focusOff}/>
            </Field>

            {errMsg && (
              <div style={{background:'#fef2f2',border:'2px solid #fecaca',borderRadius:14,
                padding:'12px 18px',marginBottom:18,color:'#dc2626',fontSize:13,fontWeight:700}}>
                ⚠️ {errMsg}
              </div>
            )}

            <button type="submit" disabled={isSubmitting} style={{
              width:'100%',border:'none',
              background:isSubmitting?'#94a3b8':'linear-gradient(135deg,#10b981,#059669)',
              color:'#fff',padding:'20px',borderRadius:16,fontSize:17,fontWeight:900,
              fontFamily:'Noto Sans TC,sans-serif',
              cursor:isSubmitting?'not-allowed':'pointer',
              boxShadow:isSubmitting?'none':'0 12px 32px rgba(16,185,129,.28)',
              letterSpacing:'0.04em',display:'flex',alignItems:'center',justifyContent:'center',gap:10
            }}>
              {isSubmitting
                ? <><div className="spin" style={{width:20,height:20,border:'3px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%'}}/>送出中…</>
                : '確認送出預約 →'
              }
            </button>

            <p style={{textAlign:'center',color:'#cbd5e1',fontSize:11,fontWeight:600,marginTop:14}}>
              送出後業務專員會盡快與您聯繫
            </p>
          </form>
        </Shell>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
