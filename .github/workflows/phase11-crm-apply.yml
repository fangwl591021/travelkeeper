name: Apply Phase 11 CRM page migration

on:
  push:
    branches:
      - agent/tenant-isolation-phase1
    paths:
      - .github/phase11-crm-apply.py
      - .github/phase11-version-patch.py
      - .github/phase11-crm-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tenant-isolation-phase1
          fetch-depth: 0

      - name: Apply CRM page patch
        run: python .github/phase11-crm-apply.py

      - name: Update Phase 11 header tests
        run: python .github/phase11-version-patch.py

      - name: Commit CRM page and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm.html tests
          if git diff --cached --quiet; then
            echo "No Phase 11 page changes to commit"
            exit 0
          fi
          git commit -m "Migrate CRM page to tenant CRM API"
          git push origin HEAD:agent/tenant-isolation-phase1
