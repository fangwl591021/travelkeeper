<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖文選單管理 | TravelKeeper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background: #f4f7fb; }
    [hidden] { display: none !important; }
    textarea, input, select { font: inherit; }
    .menu-preview { background-image: linear-gradient(90deg, rgba(15,23,42,.06) 1px, transparent 1px), linear-gradient(rgba(15,23,42,.06) 1px, transparent 1px); background-size: 36px 36px; }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <div class="mx-auto max-w-7xl px-4 py-6 md:px-6 md:py-8">
    <header class="mb-6 flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
      <div>
        <p class="text-xs font-bold tracking-[0.28em] text-slate-400">LINE OA</p>
        <h1 class="mt-1 text-3xl font-black md:text-4xl">圖文選單管理</h1>
        <p class="mt-2 text-sm leading-6 text-slate-500">讀取 MyCard Hub 模板，調整按鈕區域，先驗證再由 Worker 後端發布到 LINE。</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a href="./dashboard.html" class="rounded-2xl bg-white px-4 py-3 text-sm font-bold text-slate-700 shadow-sm ring-1 ring-slate-200 hover:bg-slate-50">回 Dashboard</a>
        <a href="./line-oa-monitor.html" class="rounded-2xl bg-slate-900 px-4 py-3 text-sm font-bold text-white hover:bg-slate-800">LINE OA 監看</a>
      </div>
    </header>

    <div id="toast" hidden class="fixed right-5 top-5 z-50 max-w-md rounded-2xl bg-slate-900 px-5 py-4 text-sm font-bold text-white shadow-2xl"></div>

    <main class="grid gap-5 xl:grid-cols-[360px_minmax(0,1fr)]">
      <aside class="space-y-4">
        <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between gap-3">
            <div>
              <h2 class="text-lg font-bold">模板</h2>
              <p class="mt-1 text-sm text-slate-500">選擇 LINE 常用尺寸。</p>
            </div>
            <button id="reload-templates" type="button" class="rounded-2xl bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-200">重載</button>
          </div>
          <select id="template-select" class="mt-4 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500"></select>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button id="load-basic" type="button" class="rounded-2xl bg-blue-600 px-3 py-3 text-sm font-bold text-white hover:bg-blue-700">2500 x 1686</button>
            <button id="load-compact" type="button" class="rounded-2xl bg-slate-900 px-3 py-3 text-sm font-bold text-white hover:bg-slate-800">2500 x 843</button>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="text-lg font-bold">基本設定</h2>
          <div class="mt-4 space-y-3">
            <label class="block">
              <span class="text-sm font-bold text-slate-600">選單名稱</span>
              <input id="config-name" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500" placeholder="例如：TravelKeeper 主選單">
            </label>
            <label class="block">
              <span class="text-sm font-bold text-slate-600">聊天列文字</span>
              <input id="config-chatbar" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500" placeholder="例如：選單">
            </label>
            <label class="flex items-center gap-3 rounded-2xl border border-slate-200 px-4 py-3">
              <input id="config-selected" type="checkbox" class="h-5 w-5 rounded border-slate-300">
              <span class="text-sm font-bold text-slate-700">預設展開圖文選單</span>
            </label>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="text-lg font-bold">選單圖片</h2>
          <p id="image-hint" class="mt-1 text-sm text-slate-500">圖片尺寸需符合模板尺寸。</p>
          <input id="menu-image" type="file" accept="image/png,image/jpeg" class="mt-4 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm">
          <div id="image-meta" class="mt-3 rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-600">尚未選擇圖片。</div>
          <label class="mt-3 flex items-center gap-3 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3">
            <input id="set-default" type="checkbox" class="h-5 w-5 rounded border-amber-300">
            <span class="text-sm font-bold text-amber-800">發布後設為官方帳號預設圖文選單</span>
          </label>
        </section>
      </aside>

      <section class="space-y-4">
        <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <h2 class="text-xl font-bold">按鈕區域</h2>
              <p class="mt-1 text-sm text-slate-500">調整每個熱區的動作。URI 會打開網址，訊息會送出文字。</p>
            </div>
            <button id="apply-area-table" type="button" class="rounded-2xl bg-slate-900 px-4 py-3 text-sm font-bold text-white hover:bg-slate-800">套用區域設定</button>
          </div>
          <div class="overflow-x-auto rounded-2xl border border-slate-200">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-50 text-left text-xs font-bold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-3 py-3">區塊</th>
                  <th class="px-3 py-3">座標</th>
                  <th class="px-3 py-3">動作</th>
                  <th class="px-3 py-3">內容</th>
                </tr>
              </thead>
              <tbody id="area-rows" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </section>

        <section class="grid gap-4 lg:grid-cols-2">
          <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h2 class="text-xl font-bold">設定 JSON</h2>
              <button id="format-config" type="button" class="rounded-xl bg-slate-100 px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-200">格式化</button>
            </div>
            <textarea id="config-json" rows="18" class="w-full rounded-2xl border border-slate-200 px-4 py-3 font-mono text-xs leading-5 outline-none focus:border-blue-500"></textarea>
          </div>

          <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h2 class="text-xl font-bold">產生結果</h2>
              <button id="copy-rendered" type="button" class="rounded-xl bg-slate-100 px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-200">複製</button>
            </div>
            <div id="validation-result" class="mb-3 rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-600">尚未驗證。</div>
            <textarea id="rendered-json" rows="14" readonly class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 font-mono text-xs leading-5 text-slate-700"></textarea>
            <div class="mt-4 grid gap-2 sm:grid-cols-3">
              <button id="validate-config" type="button" class="rounded-2xl bg-white px-4 py-3 text-sm font-bold text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50">驗證</button>
              <button id="render-config" type="button" class="rounded-2xl bg-blue-600 px-4 py-3 text-sm font-bold text-white hover:bg-blue-700">產生 JSON</button>
              <button id="publish-menu" type="button" class="rounded-2xl bg-emerald-500 px-4 py-3 text-sm font-bold text-white hover:bg-emerald-600">發布</button>
            </div>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h2 class="text-xl font-bold">圖片預覽</h2>
            <span id="preview-size" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-500">尚未載入模板</span>
          </div>
          <div class="menu-preview overflow-hidden rounded-3xl border border-slate-200 bg-slate-100">
            <div id="preview-shell" class="relative mx-auto aspect-[2500/843] max-h-[520px] w-full bg-white">
              <img id="preview-image" alt="圖文選單預覽" class="h-full w-full object-contain" hidden>
              <div id="preview-empty" class="grid h-full place-items-center text-sm font-bold text-slate-400">請先選擇圖文選單圖片。</div>
              <div id="preview-areas" class="absolute inset-0"></div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="module">
    import { createMyCardHub } from "https://myvard.fangwl591021.workers.dev/sdk/mycard-hub.js";

    const WORKER_URL = "https://travelkeeper-worker.fangwl591021.workers.dev";
    const LIFF_ID = "2009367829-BDZCGti8";
    const hub = createMyCardHub();
    const FALLBACK_TEMPLATES = [
      {
        template_id: "rich-menu-basic-2500",
        name: "標準圖文選單 2500 x 1686",
        sample_data: {
          name: "TravelKeeper 主選單",
          chatBarText: "選單",
          selected: true,
          size: { width: 2500, height: 1686 },
          areas: [
            { bounds: { x: 0, y: 0, width: 1250, height: 843 }, action: { type: "uri", uri: "https://fangwl591021.github.io/travelkeeper/" } },
            { bounds: { x: 1250, y: 0, width: 1250, height: 843 }, action: { type: "message", text: "查詢行程" } },
            { bounds: { x: 0, y: 843, width: 833, height: 843 }, action: { type: "message", text: "熱門推薦" } },
            { bounds: { x: 833, y: 843, width: 834, height: 843 }, action: { type: "message", text: "客服協助" } },
            { bounds: { x: 1667, y: 843, width: 833, height: 843 }, action: { type: "uri", uri: "https://fangwl591021.github.io/travelkeeper/line-oa-monitor.html" } }
          ]
        }
      },
      {
        template_id: "rich-menu-basic-2500x843",
        name: "精簡圖文選單 2500 x 843",
        sample_data: {
          name: "TravelKeeper 精簡選單",
          chatBarText: "選單",
          selected: true,
          size: { width: 2500, height: 843 },
          areas: [
            { bounds: { x: 0, y: 0, width: 1250, height: 843 }, action: { type: "uri", uri: "https://fangwl591021.github.io/travelkeeper/" } },
            { bounds: { x: 1250, y: 0, width: 1250, height: 843 }, action: { type: "message", text: "客服協助" } }
          ]
        }
      }
    ];

    let profile = null;
    let templates = [];
    let currentConfig = null;
    let imageBase64 = "";
    let renderedPayload = null;

    const $ = (id) => document.getElementById(id);
    const els = {
      toast: $("toast"),
      templateSelect: $("template-select"),
      configName: $("config-name"),
      configChatbar: $("config-chatbar"),
      configSelected: $("config-selected"),
      imageHint: $("image-hint"),
      menuImage: $("menu-image"),
      imageMeta: $("image-meta"),
      setDefault: $("set-default"),
      areaRows: $("area-rows"),
      configJson: $("config-json"),
      renderedJson: $("rendered-json"),
      validationResult: $("validation-result"),
      previewSize: $("preview-size"),
      previewShell: $("preview-shell"),
      previewImage: $("preview-image"),
      previewEmpty: $("preview-empty"),
      previewAreas: $("preview-areas"),
    };

    function showToast(message, type = "success") {
      els.toast.textContent = message;
      els.toast.className = `fixed right-5 top-5 z-50 max-w-md rounded-2xl px-5 py-4 text-sm font-bold text-white shadow-2xl ${type === "error" ? "bg-rose-500" : "bg-slate-900"}`;
      els.toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { els.toast.hidden = true; }, 2800);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value || {}));
    }

    function getFallbackTemplate(templateId) {
      return FALLBACK_TEMPLATES.find((template) => template.template_id === templateId) || FALLBACK_TEMPLATES[0];
    }

    function setTemplateOptions(list) {
      templates = list?.length ? list : FALLBACK_TEMPLATES;
      els.templateSelect.innerHTML = templates.map((template) =>
        `<option value="${escapeHtml(template.template_id)}">${escapeHtml(template.name || template.template_id)}</option>`
      ).join("");
    }

    function safeParseConfig() {
      try {
        return JSON.parse(els.configJson.value || "{}");
      } catch (err) {
        showToast(`JSON 格式錯誤：${err.message}`, "error");
        return null;
      }
    }

    function writeConfig(config, { syncForm = true } = {}) {
      currentConfig = clone(config);
      els.configJson.value = JSON.stringify(currentConfig, null, 2);
      if (syncForm) {
        els.configName.value = currentConfig.name || "";
        els.configChatbar.value = currentConfig.chatBarText || "";
        els.configSelected.checked = currentConfig.selected !== false;
      }
      renderAreaRows();
      renderPreview();
      renderedPayload = null;
      els.renderedJson.value = "";
      els.validationResult.textContent = "設定已更新，尚未驗證。";
      els.validationResult.className = "mb-3 rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-600";
    }

    function syncBasicsToConfig() {
      const config = safeParseConfig();
      if (!config) return null;
      config.name = els.configName.value.trim() || "TravelKeeper Rich Menu";
      config.chatBarText = els.configChatbar.value.trim() || "選單";
      config.selected = els.configSelected.checked;
      writeConfig(config, { syncForm: false });
      return config;
    }

    function areaActionValue(action = {}) {
      if (action.type === "message") return action.text || "";
      if (action.type === "richmenuswitch") return `${action.richMenuAliasId || ""}|${action.data || ""}`;
      return action.uri || "";
    }

    function renderAreaRows() {
      const areas = Array.isArray(currentConfig?.areas) ? currentConfig.areas : [];
      els.areaRows.innerHTML = areas.map((area, index) => {
        const bounds = area.bounds || {};
        const action = area.action || {};
        const type = action.type || "uri";
        const value = areaActionValue(action);
        return `
          <tr data-index="${index}">
            <td class="whitespace-nowrap px-3 py-3 font-bold text-slate-700">區塊 ${index + 1}</td>
            <td class="whitespace-nowrap px-3 py-3 text-xs text-slate-500">${bounds.x || 0}, ${bounds.y || 0}, ${bounds.width || 0} x ${bounds.height || 0}</td>
            <td class="px-3 py-3">
              <select data-area-type="${index}" class="w-36 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-500">
                <option value="uri" ${type === "uri" ? "selected" : ""}>開啟網址</option>
                <option value="message" ${type === "message" ? "selected" : ""}>送出文字</option>
                <option value="richmenuswitch" ${type === "richmenuswitch" ? "selected" : ""}>切換選單</option>
              </select>
            </td>
            <td class="px-3 py-3">
              <input data-area-value="${index}" value="${escapeHtml(value)}" class="min-w-[260px] w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-500" placeholder="網址、文字，或 alias|data">
            </td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="4" class="px-3 py-8 text-center text-sm font-bold text-slate-400">目前沒有熱區。</td></tr>`;
    }

    function applyAreaTable() {
      const config = syncBasicsToConfig();
      if (!config) return;
      config.areas = (config.areas || []).map((area, index) => {
        const type = document.querySelector(`[data-area-type="${index}"]`)?.value || "uri";
        const value = document.querySelector(`[data-area-value="${index}"]`)?.value.trim() || "";
        const next = { ...area, action: { type } };
        if (type === "message") next.action.text = value || `選單 ${index + 1}`;
        else if (type === "richmenuswitch") {
          const [richMenuAliasId, data] = value.split("|");
          next.action.richMenuAliasId = (richMenuAliasId || "").trim() || `MENU_${index + 1}`;
          next.action.data = (data || "").trim() || `switch-${index + 1}`;
        } else {
          next.action.uri = value || "https://fangwl591021.github.io/travelkeeper/";
        }
        return next;
      });
      writeConfig(config);
      showToast("已套用區域設定。");
    }

    function renderPreview() {
      const size = currentConfig?.size || { width: 2500, height: 843 };
      const width = Number(size.width || 2500);
      const height = Number(size.height || 843);
      els.previewShell.style.aspectRatio = `${width} / ${height}`;
      els.previewSize.textContent = `${width} x ${height}`;
      els.imageHint.textContent = `建議上傳 ${width} x ${height} 的 PNG 或 JPG。`;
      els.previewAreas.innerHTML = (currentConfig?.areas || []).map((area, index) => {
        const b = area.bounds || {};
        const left = (Number(b.x || 0) / width) * 100;
        const top = (Number(b.y || 0) / height) * 100;
        const w = (Number(b.width || 0) / width) * 100;
        const h = (Number(b.height || 0) / height) * 100;
        return `<div class="absolute grid place-items-center border-2 border-blue-500/70 bg-blue-500/10 text-xs font-black text-blue-700" style="left:${left}%;top:${top}%;width:${w}%;height:${h}%;">${index + 1}</div>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    async function loadTemplates() {
      els.templateSelect.innerHTML = `<option>讀取中...</option>`;
      try {
        const result = await hub.richMenu.listTemplates();
        setTemplateOptions(result.templates || []);
      } catch (err) {
        console.warn("rich menu template API failed, using fallback templates", err);
        setTemplateOptions(FALLBACK_TEMPLATES);
        showToast("模板 API 暫時讀不到，已使用本地保底模板。", "error");
      }
      if (templates[0]) writeConfig(templates[0].sample_data || {});
      showToast(`已載入 ${templates.length} 個模板。`);
    }

    async function loadTemplateById(templateId) {
      const fallback = getFallbackTemplate(templateId);
      if (fallback) {
        els.templateSelect.value = fallback.template_id;
        writeConfig(fallback.sample_data || {});
      }
      try {
        const result = await hub.richMenu.getTemplate(templateId);
        const template = result.template || result;
        els.templateSelect.value = template.template_id || templateId;
        writeConfig(template.sample_data || fallback.sample_data || {});
      } catch (err) {
        console.warn("rich menu template detail failed, using fallback template", err);
        if (!fallback) showToast(`模板讀取失敗：${err.message}`, "error");
      }
    }

    function localValidateConfig(config) {
      const issues = [];
      if (!config?.name) issues.push("缺少選單名稱");
      if (!config?.chatBarText) issues.push("缺少聊天列文字");
      if (!config?.size?.width || !config?.size?.height) issues.push("缺少尺寸");
      if (!Array.isArray(config?.areas) || config.areas.length === 0) issues.push("至少需要一個點擊區域");
      (config?.areas || []).forEach((area, index) => {
        if (!area.bounds) issues.push(`區塊 ${index + 1} 缺少座標`);
        if (!area.action?.type) issues.push(`區塊 ${index + 1} 缺少動作`);
        if (area.action?.type === "uri" && !area.action.uri) issues.push(`區塊 ${index + 1} 缺少網址`);
        if (area.action?.type === "message" && !area.action.text) issues.push(`區塊 ${index + 1} 缺少訊息文字`);
      });
      return { valid: issues.length === 0, issues, richMenu: buildLinePayload(config) };
    }

    function buildLinePayload(config) {
      return {
        size: config.size,
        selected: config.selected !== false,
        name: config.name || "TravelKeeper Rich Menu",
        chatBarText: config.chatBarText || "選單",
        areas: Array.isArray(config.areas) ? config.areas : []
      };
    }

    async function validateConfig() {
      const config = syncBasicsToConfig();
      if (!config) return null;
      let result = null;
      try {
        result = await hub.richMenu.validate(config);
      } catch (err) {
        console.warn("rich menu validate API failed, using local validation", err);
        result = localValidateConfig(config);
      }
      const issues = result.issues || [];
      const valid = result.valid !== false && issues.length === 0;
      els.validationResult.textContent = valid ? "驗證通過，可以產生 Rich Menu JSON。" : `驗證未通過：${issues.join("；") || "請檢查設定。"}`;
      els.validationResult.className = `mb-3 rounded-2xl px-4 py-3 text-sm ${valid ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-600"}`;
      return result;
    }

    async function renderRichMenu() {
      const validation = await validateConfig();
      if (!validation) return null;
      const config = safeParseConfig();
      try {
        const result = await hub.richMenu.render(config);
        renderedPayload = result.linePayload || result.richMenu || result;
      } catch (err) {
        console.warn("rich menu render API failed, using local renderer", err);
        renderedPayload = buildLinePayload(config);
      }
      els.renderedJson.value = JSON.stringify(renderedPayload, null, 2);
      showToast("已產生 LINE Rich Menu JSON。");
      return renderedPayload;
    }

    async function publishMenu() {
      const richMenu = renderedPayload || await renderRichMenu();
      if (!richMenu) return;
      if (!imageBase64) {
        showToast("請先上傳圖文選單圖片。", "error");
        return;
      }
      if (!profile?.userId) {
        showToast("尚未取得管理員 LINE 身分，請重新開啟頁面。", "error");
        return;
      }
      if (!confirm("確定要發布到 LINE 官方帳號？發布後會建立新的圖文選單。")) return;
      const res = await fetch(`${WORKER_URL}/api/line-oa/rich-menu/publish`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          uid: profile.userId,
          richMenu,
          imageBase64,
          setDefault: els.setDefault.checked,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        showToast(`發布失敗：${data.error || res.status}`, "error");
        console.error("publish rich menu failed", data);
        return;
      }
      showToast(`發布成功：${data.data?.richMenuId || ""}`);
    }

    function bindEvents() {
      $("reload-templates").addEventListener("click", () => loadTemplates().catch((err) => showToast(err.message, "error")));
      $("load-basic").addEventListener("click", () => loadTemplateById(hub.richMenu.ids.basic2500).catch((err) => showToast(err.message, "error")));
      $("load-compact").addEventListener("click", () => loadTemplateById(hub.richMenu.ids.basic2500x843).catch((err) => showToast(err.message, "error")));
      els.templateSelect.addEventListener("change", () => loadTemplateById(els.templateSelect.value).catch((err) => showToast(err.message, "error")));
      $("apply-area-table").addEventListener("click", applyAreaTable);
      $("format-config").addEventListener("click", () => {
        const config = safeParseConfig();
        if (config) writeConfig(config);
      });
      $("validate-config").addEventListener("click", () => validateConfig().catch((err) => showToast(err.message, "error")));
      $("render-config").addEventListener("click", () => renderRichMenu().catch((err) => showToast(err.message, "error")));
      $("publish-menu").addEventListener("click", () => publishMenu().catch((err) => showToast(err.message, "error")));
      $("copy-rendered").addEventListener("click", async () => {
        await navigator.clipboard.writeText(els.renderedJson.value || "");
        showToast("已複製產生結果。");
      });
      [els.configName, els.configChatbar, els.configSelected].forEach((el) => {
        el.addEventListener("change", syncBasicsToConfig);
      });
      els.menuImage.addEventListener("change", async () => {
        const file = els.menuImage.files?.[0];
        if (!file) return;
        imageBase64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        els.previewImage.src = imageBase64;
        els.previewImage.hidden = false;
        els.previewEmpty.hidden = true;
        const img = new Image();
        img.onload = () => {
          els.imageMeta.textContent = `${file.name}，${img.naturalWidth} x ${img.naturalHeight}，${Math.round(file.size / 1024)} KB`;
        };
        img.src = imageBase64;
      });
    }

    async function initAuth() {
      await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return false;
      }
      profile = await liff.getProfile();
      return true;
    }

    async function init() {
      bindEvents();
      try {
        await initAuth();
      } catch (err) {
        console.warn("LIFF init failed", err);
        showToast("LIFF 登入未完成，仍可先編輯與驗證，發布會需要管理員身分。", "error");
      }
      await loadTemplates();
    }

    init().catch((err) => {
      console.error(err);
      showToast(`讀取失敗：${err.message}`, "error");
    });
  </script>
</body>
</html>
