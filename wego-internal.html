<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeGo 內部營運專區</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background:#f4f7fb; }
    [hidden] { display:none !important; }
    input, select, textarea { background:white; }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <main class="max-w-[1680px] mx-auto p-4 md:p-6">
    <header class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between mb-5">
      <div>
        <p class="text-xs font-black tracking-[0.28em] text-blue-500">WEGO INTERNAL</p>
        <h1 class="text-3xl md:text-5xl font-black mt-2">內部訂單與業績管理</h1>
        <p class="text-slate-500 mt-2">獨立處理公司內部訂單、查帳、支出、薪資與報表，不混入原本行程預約資料流。</p>
      </div>
      <div class="flex flex-wrap gap-2 items-end">
        <label class="block">
          <span class="text-xs font-bold text-slate-500">管理員 UID</span>
          <input id="operator-uid" class="mt-1 w-80 max-w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="LINE UID">
        </label>
        <button id="save-uid" class="rounded-xl bg-slate-900 text-white px-4 py-2 font-bold">套用</button>
        <a href="./dashboard.html" class="rounded-xl bg-white border border-slate-200 px-4 py-2 font-bold">回首頁</a>
      </div>
    </header>

    <nav id="tabs" class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-5"></nav>
    <section id="view"></section>
  </main>

  <div id="toast" hidden class="fixed top-4 left-1/2 -translate-x-1/2 z-50 rounded-xl bg-slate-900 text-white px-4 py-3 font-bold shadow-xl"></div>

  <script>
    const WORKER_URL = 'https://travelkeeper-worker.fangwl591021.workers.dev';
    const LIFF_ID = '2009367829-BDZCGti8';
    const tabs = [
      ['orders', '內部訂單'],
      ['accounting', '查帳'],
      ['expenses', '支出'],
      ['salary', '薪資'],
      ['reports', '報表'],
      ['settings', '設定'],
    ];
    const state = {
      active: 'orders',
      uid: localStorage.getItem('wego-internal-uid') || '',
      orders: [],
      accounting: [],
      expenses: [],
      salary: [],
      reports: null,
      editingOrder: null,
      editingExpense: null,
      month: new Date().toISOString().slice(0, 7),
      reportFrom: '',
      reportTo: '',
    };

    const emptyOrder = () => ({
      orderDate: new Date().toISOString().slice(0, 10),
      departureDate: '',
      customer: '',
      phone: '',
      address: '',
      source: 'LINE@',
      supplier: '',
      salesUid: '',
      salesName: '',
      status: 'checking',
      items: [{ label:'大人', qty:1, net:0, price:0, discount:0 }],
      costs: [{ type:'preset', name:'行李束帶', qty:0, unitPrice:0 }],
      payments: [{ type:'訂金', date:new Date().toISOString().slice(0, 10), method:'transfer', amount:0, lastFive:'', authCode:'', status:'pending_check', note:'' }],
      travelers: [],
      note: '',
    });
    let draftOrder = emptyOrder();

    function $(id){ return document.getElementById(id); }
    function money(n){ return 'NT$' + Number(n || 0).toLocaleString('zh-TW'); }
    function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function toast(text, error=false){
      const el = $('toast');
      el.textContent = text;
      el.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 rounded-xl px-4 py-3 font-bold shadow-xl ${error ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;
      el.hidden = false;
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.hidden = true, 2400);
    }
    function uidParam(){ return encodeURIComponent(state.uid || ''); }
    async function api(path, options={}){
      const res = await fetch(`${WORKER_URL}${path}`, {
        ...options,
        headers: { 'Content-Type':'application/json', ...(options.headers || {}) },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function initLiffUid(){
      $('operator-uid').value = state.uid;
      if (state.uid || location.protocol === 'file:' || !window.liff) return;
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) return;
        const profile = await liff.getProfile();
        state.uid = profile.userId || '';
        $('operator-uid').value = state.uid;
        localStorage.setItem('wego-internal-uid', state.uid);
      } catch {}
    }

    function renderTabs(){
      $('tabs').innerHTML = tabs.map(([key, label]) => `
        <button data-tab="${key}" class="rounded-2xl px-4 py-3 font-black border text-left ${state.active === key ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-slate-200 text-slate-700'}">${label}</button>
      `).join('');
      document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = async () => {
        state.active = btn.dataset.tab;
        renderTabs();
        await loadCurrent();
      });
    }

    function card(title, body, aside=''){
      return `<section class="rounded-3xl bg-white border border-slate-200 overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between gap-3">
          <h2 class="text-xl font-black">${title}</h2>${aside}
        </div>${body}</section>`;
    }
    function stat(label, value, color='text-slate-900'){
      return `<div class="rounded-2xl bg-white border border-slate-200 p-4"><p class="text-xs font-bold text-slate-400">${label}</p><p class="mt-1 text-2xl font-black ${color}">${value}</p></div>`;
    }

    function calcDraft(){
      const net = draftOrder.items.reduce((s, i) => s + Number(i.qty||0) * Number(i.net||0), 0);
      const report = draftOrder.items.reduce((s, i) => s + Number(i.qty||0) * Math.max(0, Number(i.price||0) - Number(i.discount||0)), 0);
      const costs = draftOrder.costs.reduce((s, c) => s + Number(c.qty||0) * Number(c.unitPrice||0), 0);
      const fee = draftOrder.payments.reduce((s, p) => s + Number(p.fee||0), 0);
      const paid = draftOrder.payments.filter(p => p.status === 'received').reduce((s, p) => s + Number(p.amount||0), 0);
      const profit = report - net - costs - fee;
      return { net, report, costs, fee, paid, unpaid: Math.max(0, report - paid), profit, commission: Math.round(profit * 0.4) };
    }

    function input(value, path, type='text'){
      return `<input data-path="${path}" type="${type}" value="${esc(value)}" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-500">`;
    }
    function select(value, path, options){
      return `<select data-path="${path}" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-500 bg-white">
        ${options.map(o => `<option value="${esc(o[0])}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}
      </select>`;
    }
    function setPath(path, value){
      const parts = path.split('.');
      let obj = draftOrder;
      for (let i=0; i<parts.length-1; i++) obj = obj[parts[i]];
      obj[parts.at(-1)] = value;
    }

    function bindDraftInputs(){
      document.querySelectorAll('[data-path]').forEach(el => {
        const update = () => {
          const value = el.type === 'number' ? Number(el.value || 0) : el.value;
          setPath(el.dataset.path, value);
        };
        el.oninput = update;
        el.onchange = () => { update(); renderOrders(false); };
      });
      document.querySelectorAll('[data-add]').forEach(btn => btn.onclick = () => {
        const type = btn.dataset.add;
        if (type === 'item') draftOrder.items.push({ label:'其他', qty:1, net:0, price:0, discount:0 });
        if (type === 'cost') draftOrder.costs.push({ type:'other', name:'其他', qty:1, unitPrice:0 });
        if (type === 'payment') draftOrder.payments.push({ type:'尾款', date:new Date().toISOString().slice(0,10), method:'transfer', amount:0, lastFive:'', authCode:'', status:'pending_check', note:'' });
        if (type === 'traveler') draftOrder.travelers.push({ name:'', meals:[], customMeals:[], roomNote:'', docs:[] });
        renderOrders(false);
      });
      document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => {
        const [type, idx] = btn.dataset.del.split(':');
        draftOrder[type].splice(Number(idx), 1);
        renderOrders(false);
      });
      $('save-order').onclick = saveOrder;
      $('new-order').onclick = () => { draftOrder = emptyOrder(); state.editingOrder = null; renderOrders(false); };
    }

    function orderForm(){
      const c = calcDraft();
      return `<div class="p-5 space-y-5">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          ${stat('NET 總額', money(c.net))}
          ${stat('實報總額', money(c.report))}
          ${stat('利潤', money(c.profit), c.profit >= 0 ? 'text-emerald-600' : 'text-rose-600')}
          ${stat('業務業績 40%', money(c.commission), 'text-blue-600')}
        </div>
        <div class="rounded-2xl border border-slate-200 p-4">
          <h3 class="font-black mb-3">A 基本資料</h3>
          <div class="grid md:grid-cols-4 gap-3">
            <label>下單日${input(draftOrder.orderDate,'orderDate','date')}</label>
            <label>出發日${input(draftOrder.departureDate,'departureDate','date')}</label>
            <label>訂單來源${input(draftOrder.source,'source')}</label>
            <label>供應商${input(draftOrder.supplier,'supplier')}</label>
            <label>旅客姓名${input(draftOrder.customer,'customer')}</label>
            <label>電話${input(draftOrder.phone,'phone')}</label>
            <label>負責業務${input(draftOrder.salesName,'salesName')}</label>
            <label>狀態${select(draftOrder.status,'status',[['pending','待確認'],['checking','確認中'],['departed','已出發'],['cancelled','已取消']])}</label>
            <label class="md:col-span-4">地址${input(draftOrder.address,'address')}</label>
          </div>
        </div>
        <div class="rounded-2xl border border-slate-200 p-4 overflow-auto">
          <div class="flex justify-between mb-3"><h3 class="font-black">B 價格資訊</h3><button data-add="item" class="text-sm font-bold text-blue-600">新增項目</button></div>
          <table class="min-w-[760px] w-full text-sm"><thead><tr class="text-slate-400"><th>項目</th><th>數量</th><th>NET</th><th>原價</th><th>折讓</th><th>小計</th><th></th></tr></thead><tbody>
            ${draftOrder.items.map((it,i)=>`<tr><td>${input(it.label,`items.${i}.label`)}</td><td>${input(it.qty,`items.${i}.qty`,'number')}</td><td>${input(it.net,`items.${i}.net`,'number')}</td><td>${input(it.price,`items.${i}.price`,'number')}</td><td>${input(it.discount,`items.${i}.discount`,'number')}</td><td class="font-bold">${money(Number(it.qty||0)*Math.max(0,Number(it.price||0)-Number(it.discount||0)))}</td><td><button data-del="items:${i}" class="text-rose-600 font-bold">刪</button></td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="grid xl:grid-cols-2 gap-4">
          <div class="rounded-2xl border border-slate-200 p-4 overflow-auto">
            <div class="flex justify-between mb-3"><h3 class="font-black">C 公司成本</h3><button data-add="cost" class="text-sm font-bold text-blue-600">新增成本</button></div>
            ${draftOrder.costs.map((co,i)=>`<div class="grid grid-cols-[1fr,90px,120px,60px] gap-2 mb-2">${input(co.name,`costs.${i}.name`)}${input(co.qty,`costs.${i}.qty`,'number')}${input(co.unitPrice,`costs.${i}.unitPrice`,'number')}<button data-del="costs:${i}" class="text-rose-600 font-bold">刪</button></div>`).join('')}
          </div>
          <div class="rounded-2xl border border-slate-200 p-4 overflow-auto">
            <div class="flex justify-between mb-3"><h3 class="font-black">D 付款資訊</h3><button data-add="payment" class="text-sm font-bold text-blue-600">新增付款</button></div>
            ${draftOrder.payments.map((p,i)=>`<div class="grid md:grid-cols-7 gap-2 mb-2">
              ${input(p.type,`payments.${i}.type`)}${input(p.date,`payments.${i}.date`,'date')}${input(p.method,`payments.${i}.method`)}${input(p.amount,`payments.${i}.amount`,'number')}${input(p.lastFive||'',`payments.${i}.lastFive`)}${select(p.status,`payments.${i}.status`,[['pending_check','待查帳'],['received','已查收'],['processing','待處理']])}<button data-del="payments:${i}" class="text-rose-600 font-bold">刪</button>
            </div>`).join('')}
          </div>
        </div>
        <div class="rounded-2xl border border-slate-200 p-4">
          <div class="flex justify-between mb-3"><h3 class="font-black">F 旅客需求</h3><button data-add="traveler" class="text-sm font-bold text-blue-600">新增旅客</button></div>
          ${draftOrder.travelers.map((t,i)=>`<div class="grid md:grid-cols-4 gap-2 mb-2">${input(t.name,`travelers.${i}.name`)}${input((t.meals||[]).join(','),`travelers.${i}.meals`)}${input(t.roomNote||'',`travelers.${i}.roomNote`)}<button data-del="travelers:${i}" class="text-rose-600 font-bold">刪</button></div>`).join('')}
          <p class="text-xs text-slate-400">餐食可用逗號分隔，例如：不吃牛,蛋奶素。證件狀態可先記在備註，後續再細分欄位。</p>
        </div>
        <textarea data-path="note" rows="3" class="w-full rounded-2xl border border-slate-200 p-3" placeholder="備註">${esc(draftOrder.note||'')}</textarea>
        <div class="flex gap-3">
          <button id="save-order" class="flex-1 rounded-2xl bg-blue-600 text-white py-4 font-black">儲存內部訂單</button>
          <button id="new-order" class="rounded-2xl bg-slate-100 text-slate-700 px-6 py-4 font-black">清空</button>
        </div>
      </div>`;
    }

    function renderOrders(rebind=true){
      $('view').innerHTML = `<div class="grid xl:grid-cols-[1fr,420px] gap-5">
        ${card(state.editingOrder ? '編輯內部訂單' : '新增內部訂單', orderForm())}
        ${card('訂單列表', `<div class="divide-y divide-slate-100">${state.orders.map(o => `
          <article class="p-4 hover:bg-slate-50 cursor-pointer" data-edit-order="${esc(o.id)}">
            <div class="flex justify-between gap-3"><h3 class="font-black">${esc(o.customer || o.id)}</h3><span class="text-xs rounded-full bg-blue-50 text-blue-700 px-2 py-1">${esc(o.status)}</span></div>
            <p class="text-sm text-slate-500 mt-1">${esc(o.departureDate || '-')} · ${esc(o.salesName || '-')} · ${esc(o.supplier || '-')}</p>
            <p class="text-sm mt-2">實報 ${money(o.reportTotal)} / 已收 ${money(o.paidAmount)} / 利潤 <b class="${Number(o.profit)>=0?'text-emerald-600':'text-rose-600'}">${money(o.profit)}</b></p>
          </article>`).join('') || '<div class="p-8 text-center text-slate-400 font-bold">尚無內部訂單</div>'}</div>`)}
      </div>`;
      bindDraftInputs();
      document.querySelectorAll('[data-edit-order]').forEach(card => card.onclick = () => {
        const o = state.orders.find(x => x.id === card.dataset.editOrder);
        draftOrder = JSON.parse(JSON.stringify(o));
        state.editingOrder = o.id;
        renderOrders(false);
      });
    }

    async function saveOrder(){
      try {
        const payload = { ...draftOrder, operatorUid: state.uid };
        const res = await api('/api/wego/internal/orders', { method:'POST', body: JSON.stringify(payload) });
        toast('內部訂單已儲存');
        state.editingOrder = res.data.id;
        await loadOrders();
      } catch(e) { toast(e.message, true); }
    }

    async function loadOrders(){
      const data = await api(`/api/wego/internal/orders?uid=${uidParam()}`);
      state.orders = data.data || [];
      if (state.active === 'orders') renderOrders();
    }

    function renderAccounting(){
      $('view').innerHTML = card('查帳', `<div class="overflow-auto"><table class="min-w-[1080px] w-full text-sm">
        <thead class="bg-slate-50 text-slate-500"><tr><th class="p-3">日期</th><th>業務</th><th>客戶</th><th>方式</th><th class="text-right">金額</th><th>末五碼/授權碼</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody>${state.accounting.map(r => `<tr class="border-t border-slate-100">
          <td class="p-3">${esc((r.payment_date||'').slice(0,16))}</td><td>${esc(r.sales_name||'-')}</td><td>${esc(r.customer_name||'-')}<div class="text-xs text-slate-400">${esc(r.itinerary_title||r.order_id||'')}</div></td><td>${esc(r.method||'-')}</td><td class="text-right font-black">${money(r.amount)}</td><td>${esc(r.check_code||'-')}</td><td>${esc(r.accounting_status)}</td>
          <td class="space-x-1">${['received','processing','pending_check'].map(s=>`<button data-receipt="${esc(r.id)}" data-status="${s}" class="rounded-lg bg-slate-100 px-2 py-1 font-bold">${s==='received'?'已查收':s==='processing'?'待處理':'待查帳'}</button>`).join('')}</td>
        </tr>`).join('') || '<tr><td colspan="8" class="p-8 text-center text-slate-400 font-bold">沒有查帳資料</td></tr>'}</tbody></table></div>`);
      document.querySelectorAll('[data-receipt]').forEach(btn => btn.onclick = () => updateReceipt(btn.dataset.receipt, btn.dataset.status));
    }
    async function loadAccounting(){
      const data = await api(`/api/internal/accounting/receipts?uid=${uidParam()}&status=all`);
      state.accounting = data.data || [];
      if (state.active === 'accounting') renderAccounting();
    }
    async function updateReceipt(id, status){
      const row = state.accounting.find(r => r.id === id);
      try {
        await api('/api/internal/accounting/receipts/status', { method:'POST', body: JSON.stringify({ ...row, accounting_status: status, operatorUid: state.uid }) });
        toast('查帳狀態已更新');
        await loadAccounting();
        await loadOrders();
      } catch(e) { toast(e.message, true); }
    }

    function renderExpenses(){
      const e = state.editingExpense || { date:new Date().toISOString().slice(0,10), category:'其他', item:'', amount:0, method:'轉帳', note:'', booked:1 };
      $('view').innerHTML = `<div class="grid xl:grid-cols-[420px,1fr] gap-5">
        ${card('支出紀錄', `<div class="p-5 space-y-3">
          <label>日期<input id="exp-date" type="date" value="${esc(e.date)}" class="w-full rounded-xl border p-2"></label>
          <label>類別<input id="exp-category" value="${esc(e.category)}" class="w-full rounded-xl border p-2"></label>
          <label>項目<input id="exp-item" value="${esc(e.item)}" class="w-full rounded-xl border p-2"></label>
          <label>金額<input id="exp-amount" type="number" value="${esc(e.amount)}" class="w-full rounded-xl border p-2"></label>
          <label>付款方式<input id="exp-method" value="${esc(e.method)}" class="w-full rounded-xl border p-2"></label>
          <label>備註<textarea id="exp-note" class="w-full rounded-xl border p-2">${esc(e.note)}</textarea></label>
          <button id="save-expense" class="w-full rounded-2xl bg-blue-600 text-white py-3 font-black">儲存支出</button>
        </div>`)}
        ${card('支出列表', `<div class="divide-y">${state.expenses.map(x=>`<article class="p-4"><div class="flex justify-between"><b>${esc(x.item)}</b><b>${money(x.amount)}</b></div><p class="text-sm text-slate-500">${esc(x.date)} · ${esc(x.category)} · ${esc(x.method)}</p></article>`).join('') || '<div class="p-8 text-center text-slate-400 font-bold">尚無支出</div>'}</div>`)}
      </div>`;
      $('save-expense').onclick = saveExpense;
    }
    async function loadExpenses(){
      const data = await api(`/api/wego/internal/expenses?uid=${uidParam()}`);
      state.expenses = data.data || [];
      if (state.active === 'expenses') renderExpenses();
    }
    async function saveExpense(){
      try {
        await api('/api/wego/internal/expenses', { method:'POST', body: JSON.stringify({
          operatorUid: state.uid, date:$('exp-date').value, category:$('exp-category').value, item:$('exp-item').value,
          amount:Number($('exp-amount').value||0), method:$('exp-method').value, note:$('exp-note').value, booked:1
        })});
        toast('支出已儲存');
        await loadExpenses();
      } catch(e) { toast(e.message, true); }
    }

    function renderSalary(){
      $('view').innerHTML = card('薪資', `<div class="p-5"><div class="flex gap-2 mb-4"><input id="salary-month" type="month" value="${esc(state.month)}" class="rounded-xl border px-3 py-2"><button id="load-salary" class="rounded-xl bg-slate-900 text-white px-4 font-bold">查詢</button></div>
        <div class="overflow-auto"><table class="min-w-[900px] w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3">人員</th><th>訂單數</th><th>業績</th><th>應發</th><th>狀態</th><th></th></tr></thead><tbody>
        ${state.salary.map(s=>`<tr class="border-t"><td class="p-3 font-bold">${esc(s.salesName)}</td><td>${s.orderCount}</td><td>${money(s.commissionTotal)}</td><td class="font-black">${money(s.totalPay)}</td><td>${esc(s.status)}</td><td><button data-pay-salary="${esc(s.id)}" class="rounded-lg bg-blue-600 text-white px-3 py-2 font-bold">已發放</button></td></tr>`).join('') || '<tr><td colspan="6" class="p-8 text-center text-slate-400">尚無員工資料，請先到設定新增員工</td></tr>'}
        </tbody></table></div></div>`);
      $('load-salary').onclick = async () => { state.month = $('salary-month').value; await loadSalary(); };
      document.querySelectorAll('[data-pay-salary]').forEach(btn => btn.onclick = async () => {
        const row = state.salary.find(s => s.id === btn.dataset.paySalary);
        await api('/api/wego/internal/salary/pay', { method:'POST', body: JSON.stringify({ ...row, operatorUid: state.uid }) });
        toast('薪資已發放並記入支出');
        await loadSalary();
        await loadExpenses();
      });
    }
    async function loadSalary(){
      const data = await api(`/api/wego/internal/salary?uid=${uidParam()}&month=${encodeURIComponent(state.month)}`);
      state.salary = data.data || [];
      if (state.active === 'salary') renderSalary();
    }

    function renderReports(){
      const s = state.reports?.summary || {};
      const ledger = state.reports?.ledger || [];
      $('view').innerHTML = card('報表', `<div class="p-5">
        <div class="flex flex-wrap gap-2 mb-4"><input id="report-from" type="date" value="${esc(state.reportFrom)}" class="rounded-xl border px-3 py-2"><input id="report-to" type="date" value="${esc(state.reportTo)}" class="rounded-xl border px-3 py-2"><button id="load-reports" class="rounded-xl bg-slate-900 text-white px-4 font-bold">查詢</button></div>
        <div class="grid md:grid-cols-4 gap-3 mb-4">${stat('收入', money(s.totalIncome||0),'text-emerald-600')}${stat('支出', money(s.totalExpense||0),'text-rose-600')}${stat('淨利', money(s.netProfit||0),'text-blue-600')}${stat('筆數', s.count||0)}</div>
        <div class="overflow-auto"><table class="min-w-[900px] w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3">日期</th><th>類型</th><th>類別</th><th>項目</th><th class="text-right">金額</th></tr></thead><tbody>
        ${ledger.map(r=>`<tr class="border-t"><td class="p-3">${esc(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.category)}</td><td>${esc(r.item)}</td><td class="text-right font-black">${money(r.amount)}</td></tr>`).join('') || '<tr><td colspan="5" class="p-8 text-center text-slate-400">尚無流水帳</td></tr>'}
        </tbody></table></div></div>`);
      $('load-reports').onclick = async () => { state.reportFrom = $('report-from').value; state.reportTo = $('report-to').value; await loadReports(); };
    }
    async function loadReports(){
      const data = await api(`/api/wego/internal/reports?uid=${uidParam()}&from=${encodeURIComponent(state.reportFrom)}&to=${encodeURIComponent(state.reportTo)}`);
      state.reports = data.data;
      if (state.active === 'reports') renderReports();
    }

    function renderSettings(){
      $('view').innerHTML = card('設定', `<div class="p-5 grid md:grid-cols-2 gap-4">
        <a class="rounded-2xl border border-slate-200 p-5 hover:bg-slate-50" href="./internal-ops.html"><h3 class="font-black text-lg">內部營運設定</h3><p class="text-slate-500 mt-1">員工、供應商、成本項目、付款方式費率、訂單來源。</p></a>
        <a class="rounded-2xl border border-slate-200 p-5 hover:bg-slate-50" href="./internal-accounting.html"><h3 class="font-black text-lg">舊查帳頁</h3><p class="text-slate-500 mt-1">保留原本查帳畫面，方便過渡。</p></a>
      </div>`);
    }

    async function loadCurrent(){
      if (!state.uid && state.active !== 'settings') {
        $('view').innerHTML = '<div class="rounded-3xl bg-white border border-slate-200 p-8 text-center text-slate-500 font-bold">請先輸入管理員 UID。</div>';
        return;
      }
      try {
        if (state.active === 'orders') await loadOrders();
        if (state.active === 'accounting') await loadAccounting();
        if (state.active === 'expenses') await loadExpenses();
        if (state.active === 'salary') await loadSalary();
        if (state.active === 'reports') await loadReports();
        if (state.active === 'settings') renderSettings();
      } catch(e) {
        $('view').innerHTML = `<div class="rounded-3xl bg-white border border-rose-200 p-8 text-center text-rose-600 font-bold">${esc(e.message)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      renderTabs();
      await initLiffUid();
      $('save-uid').onclick = async () => {
        state.uid = $('operator-uid').value.trim();
        localStorage.setItem('wego-internal-uid', state.uid);
        await loadCurrent();
      };
      await loadCurrent();
    });
  </script>
</body>
</html>
