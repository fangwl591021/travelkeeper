<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儀表板 | 旅遊管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to { transform: rotate(360deg); } }
    .anim { animation: fadeUp .3s ease both; }
    .spin { animation: spin .7s linear infinite; }
    .glass { background: rgba(255,255,255,.92); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
<div id="root">
  <!-- 預設骨架（babel 編譯前/React mount 前的 placeholder） -->
  <div class="min-h-screen bg-slate-50">
    <div class="bg-white/90 sticky top-0 border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-slate-200 animate-pulse"></div>
        <div class="space-y-2">
          <div class="h-5 w-32 bg-slate-200 rounded animate-pulse"></div>
          <div class="h-3 w-20 bg-slate-100 rounded animate-pulse"></div>
        </div>
      </div>
    </div>
    <div class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-200 animate-pulse h-28 rounded-[1.5rem]"></div>
      <div class="bg-slate-200 animate-pulse h-28 rounded-[1.5rem]"></div>
      <div class="bg-slate-200 animate-pulse h-28 rounded-[1.5rem]"></div>
      <div class="bg-slate-200 animate-pulse h-28 rounded-[1.5rem]"></div>
    </div>
  </div>
</div>

<script type="text/jsx-cached" id="app-source">
const { useState, useEffect } = React;
const WORKER_URL = 'https://travelkeeper.fangwl591021.workers.dev';
const LIFF_ID    = '2009367829-BDZCGti8';
const fmt = (n) => '$' + Number(n||0).toLocaleString();

// ══════════════════════════════════════════════════════════════
// 上稿/編輯表單（共用，從原 admin.html 完整搬移）
// ══════════════════════════════════════════════════════════════
function ItineraryForm({ initial, onSave, onCancel, saving }) {
  const [data, setData] = useState(initial || {
    title: '', region: '亞洲', price: '', days: '',
    image: '', description: '', notes: ''
  });

  const handleAIUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      const btn = e.target.parentElement;
      btn.innerHTML = '<span class="spin inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full"></span> AI 解析中…';
      try {
        const res = await fetch(`${WORKER_URL}/api/upload-dm`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ image: ev.target.result })
        });
        const result = await res.json();
        if (result.success) {
          setData(prev => ({ ...prev, ...result.data }));
        }
      } catch(err) { alert('AI 解析失敗：' + err.message); }
      btn.innerHTML = '🤖 AI 解析 DM';
    };
    reader.readAsDataURL(file);
  };

  const handleImageUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const res = await fetch(`${WORKER_URL}/api/upload-image`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ base64: ev.target.result, filename: file.name })
        });
        const result = await res.json();
        if (result.success) setData(prev => ({ ...prev, image: result.url }));
      } catch(err) { alert('上傳失敗'); }
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="space-y-5">
      <label className="block">
        <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-2xl text-center font-black cursor-pointer hover:opacity-90 transition">
          🤖 AI 解析 DM
        </div>
        <input type="file" accept="image/*" onChange={handleAIUpload} className="hidden" />
      </label>
      <p className="text-xs text-center text-slate-400 font-medium -mt-3">上傳旅遊 DM 圖片，AI 自動填表</p>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">封面圖</label>
        {data.image && (
          <img src={data.image} className="w-full aspect-video object-cover rounded-2xl mt-2 mb-2" />
        )}
        <div className="flex gap-2 mt-1">
          <input value={data.image||''} onChange={e=>setData({...data,image:e.target.value})}
            placeholder="https://…"
            className="flex-1 p-3 border-2 border-slate-100 rounded-xl text-sm font-medium outline-none focus:border-blue-500 bg-slate-50" />
          <label className="bg-slate-200 hover:bg-slate-300 px-4 py-3 rounded-xl text-sm font-bold cursor-pointer">
            📁
            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
          </label>
        </div>
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">行程標題</label>
        <input value={data.title||''} onChange={e=>setData({...data,title:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500" />
      </div>

      <div className="grid grid-cols-3 gap-3">
        <div>
          <label className="text-xs font-black text-slate-400 uppercase tracking-widest">地區</label>
          <select value={data.region||'亞洲'} onChange={e=>setData({...data,region:e.target.value})}
            className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500 bg-white">
            {['國旅','亞洲','歐洲','美洲','大洋洲','非洲'].map(r=><option key={r}>{r}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-black text-slate-400 uppercase tracking-widest">天數</label>
          <input type="number" value={data.days||''} onChange={e=>setData({...data,days:e.target.value})}
            className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold outline-none focus:border-blue-500" />
        </div>
        <div>
          <label className="text-xs font-black text-slate-400 uppercase tracking-widest">價格</label>
          <input type="number" value={data.price||''} onChange={e=>setData({...data,price:e.target.value})}
            className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl font-bold text-red-600 outline-none focus:border-blue-500" />
        </div>
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">行程描述</label>
        <textarea rows="10" value={data.description||''} onChange={e=>setData({...data,description:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl text-sm outline-none focus:border-blue-500 leading-relaxed" />
      </div>

      <div>
        <label className="text-xs font-black text-slate-400 uppercase tracking-widest">注意事項</label>
        <textarea rows="3" value={data.notes||''} onChange={e=>setData({...data,notes:e.target.value})}
          className="w-full mt-1 p-3 border-2 border-slate-100 rounded-xl text-sm outline-none focus:border-blue-500" />
      </div>

      <div className="flex gap-3 pt-2">
        <button onClick={onCancel}
          className="flex-1 bg-slate-100 py-4 rounded-2xl font-black text-slate-600 hover:bg-slate-200">取消</button>
        <button onClick={() => onSave(data)} disabled={saving || !data.title}
          className="flex-[2] bg-blue-600 text-white font-black py-4 rounded-2xl hover:bg-blue-700 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
          {saving ? '儲存中…' : '提交'}
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// 骨架條（loading 占位用）
// ══════════════════════════════════════════════════════════════
function Skel({ w = 'w-20', h = 'h-8', cls = '' }) {
  return <span className={`inline-block bg-white/30 rounded animate-pulse ${w} ${h} ${cls}`} />;
}

// ══════════════════════════════════════════════════════════════
// 數字卡片（儀表板用）
// ══════════════════════════════════════════════════════════════
function StatCard({ color, num, label, hint, loading }) {
  return (
    <div className={`${color} text-white p-5 rounded-[1.5rem]`}>
      {loading
        ? <Skel w="w-16" h="h-9" cls="bg-white/30" />
        : <p className="text-3xl font-black leading-tight">{num}</p>}
      <p className="text-sm font-bold opacity-90 mt-1">{label}</p>
      {hint && <p className="text-[10px] opacity-70 mt-1">{hint}</p>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// 快速導航卡
// ══════════════════════════════════════════════════════════════
function NavCard({ href, onClick, icon, title, subtitle, badge }) {
  const isButton = !!onClick;
  const Tag = isButton ? 'button' : 'a';
  const props = isButton
    ? { onClick, type: 'button' }
    : { href };
  return (
    <Tag {...props}
      className="block w-full text-left bg-white p-5 rounded-[1.5rem] border border-slate-100 hover:border-blue-300 hover:shadow-md transition relative">
      {badge != null && badge > 0 && (
        <span className="absolute top-3 right-3 bg-amber-500 text-white text-xs font-black px-2 py-0.5 rounded-full">
          {badge}
        </span>
      )}
      <div className="text-3xl mb-2">{icon}</div>
      <p className="font-black text-slate-900">{title}</p>
      <p className="text-xs text-slate-400 font-medium mt-0.5">{subtitle}</p>
    </Tag>
  );
}

// ══════════════════════════════════════════════════════════════
// 主應用 — 統一儀表板
// ══════════════════════════════════════════════════════════════
function App() {
  // 身份
  const [authState, setAuthState] = useState('checking');  // checking | denied | ready
  const [profile,   setProfile]   = useState(null);
  const [isAdmin,   setIsAdmin]   = useState(false);
  const [canUpload, setCanUpload] = useState(false);
  const [isDistApproved, setIsDistApproved] = useState(false);
  const [distData,  setDistData]  = useState(null);  // 含 inviteCode、commission

  // ★ 載入旗標（非 auth）— 控制骨架條
  const [dataLoading, setDataLoading] = useState(true);

  // 儀表板數字
  const [stats, setStats] = useState(null);          // 業務視角：getMyStats 回傳
  const [allOrders, setAllOrders] = useState([]);    // 管理員視角
  const [allDist, setAllDist] = useState([]);        // 管理員視角
  const [myCustomers, setMyCustomers] = useState([]); // 業務視角

  // 上稿/審核（原 admin.html 功能）
  const [tab,          setTab]          = useState('overview');  // overview | mine | review | new
  const [myItems,      setMyItems]      = useState([]);
  const [pendingItems, setPendingItems] = useState([]);
  const [editing,      setEditing]      = useState(null);
  const [creating,     setCreating]     = useState(false);
  const [reviewing,    setReviewing]    = useState(null);
  const [reviewNote,   setReviewNote]   = useState('');
  const [saving,       setSaving]       = useState(false);
  const [toast,        setToast]        = useState(null);

  const showToast = (msg, type='success') => {
    setToast({ msg, type });
    setTimeout(()=>setToast(null), 3000);
  };

  // ── 初始化 ──
  //   階段 1：LIFF + 身份檢查 → setAuthState('ready')，版面骨架先出
  //   階段 2：所有資料並行拉 → setDataLoading(false)，骨架填數字
  useEffect(() => {
    (async () => {
      try {
        await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        const p = await liff.getProfile();
        setProfile(p);

        // 階段 1：身份檢查（最快）
        const statusRes = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${p.userId}`).then(r=>r.json());
        if (!statusRes.success) { setAuthState('denied'); return; }

        const _isAdmin = !!statusRes.data.isAdmin;
        const _canUpload = !!statusRes.data.canUpload;
        const _isDist = statusRes.data.role === 'distributor' && String(statusRes.data.status).toLowerCase() === 'approved';
        setIsAdmin(_isAdmin);
        setCanUpload(_canUpload);
        setIsDistApproved(_isDist);
        setDistData(statusRes.data.distributorData);

        if (!_isAdmin && !_isDist) {
          setAuthState('denied');
          return;
        }

        // ★ 身份就緒 → 版面立刻渲染（這時數字還沒進來，會顯示骨架）
        setAuthState('ready');

        // 階段 2：資料慢慢拉，依角色拉不同
        if (_isAdmin) {
          const [pendingRes, allOrdersRes, distRes, myItemsRes] = await Promise.all([
            fetch(`${WORKER_URL}/api/itineraries?action=getPendingReviews`).then(r=>r.json()),
            fetch(`${WORKER_URL}/api/itineraries?action=getAllOrders`).then(r=>r.json()),
            fetch(`${WORKER_URL}/api/itineraries?action=getDistributors`).then(r=>r.json()),
            fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&all=1`).then(r=>r.json()),
          ]);
          setPendingItems(pendingRes?.data || []);
          setAllOrders(allOrdersRes?.data || []);
          setAllDist(Array.isArray(distRes) ? distRes : []);
          setMyItems(Array.isArray(myItemsRes) ? myItemsRes : []);
        } else {
          const tasks = [
            fetch(`${WORKER_URL}/api/itineraries?action=getMyStats&uid=${p.userId}`).then(r=>r.json()).catch(()=>({data:null})),
            fetch(`${WORKER_URL}/api/itineraries?action=getMyCustomers&uid=${p.userId}`).then(r=>r.json()).catch(()=>({data:[]})),
          ];
          if (_canUpload) {
            tasks.push(fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&owner=${p.userId}`).then(r=>r.json()).catch(()=>[]));
          }
          const results = await Promise.all(tasks);
          setStats(results[0]?.data || null);
          setMyCustomers(results[1]?.data || []);
          if (_canUpload) {
            setMyItems(Array.isArray(results[2]) ? results[2] : []);
          }
        }

        setDataLoading(false);
      } catch(e) {
        console.error(e);
        setAuthState('denied');
      }
    })();
  }, []);

  // ── reload（部分資料）──
  const reload = async () => {
    if (!profile) return;
    if (isAdmin) {
      const [pendingRes, myItemsRes] = await Promise.all([
        fetch(`${WORKER_URL}/api/itineraries?action=getPendingReviews`).then(r=>r.json()),
        fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&all=1`).then(r=>r.json()),
      ]);
      setPendingItems(pendingRes?.data || []);
      setMyItems(Array.isArray(myItemsRes) ? myItemsRes : []);
    } else if (canUpload) {
      const myItemsRes = await fetch(`${WORKER_URL}/api/itineraries?action=getItineraries&owner=${profile.userId}`).then(r=>r.json());
      setMyItems(Array.isArray(myItemsRes) ? myItemsRes : []);
    }
  };

  // ── 新增/編輯儲存（原 admin.html 邏輯）──
  const handleSave = async (data) => {
    setSaving(true);
    try {
      const isEdit = !!editing;
      const body = {
        action: isEdit ? 'updateItinerary' : 'addItinerary',
        ...data,
        ownerUid: profile.userId,
        ownerName: profile.displayName,
        operatorUid: profile.userId,
      };
      if (isEdit) body.id = editing.id || editing.timestamp;

      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const result = await res.json();
      if (result.success) {
        const msg = isAdmin
          ? (isEdit ? '行程已更新' : '行程已上架')
          : (isEdit ? '已修改，待管理員重新審核' : '已提交，待管理員審核');
        showToast('✅ ' + msg);
        setEditing(null);
        setCreating(false);
        await reload();
      } else {
        showToast('儲存失敗：' + (result.error||''), 'error');
      }
    } catch(e) {
      showToast('網路錯誤', 'error');
    }
    setSaving(false);
  };

  const handleDelete = async (item) => {
    if (!confirm(`確定刪除「${item.title}」？`)) return;
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'deleteItinerary', id: String(item.id||item.timestamp) })
      });
      const result = await res.json();
      if (result.success) { showToast('已刪除'); await reload(); }
      else showToast('刪除失敗', 'error');
    } catch(e) { showToast('操作失敗', 'error'); }
  };

  const handleReview = async (status) => {
    if (!reviewing) return;
    setSaving(true);
    try {
      const res = await fetch(`${WORKER_URL}/api/itineraries`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          action:'reviewItinerary',
          id: String(reviewing.id || reviewing.timestamp),
          reviewStatus: status,
          reviewNote: reviewNote || '',
          operatorUid: profile.userId,
        })
      });
      const result = await res.json();
      if (result.success) {
        showToast(status === 'published' ? '✅ 已核准上架' : '已駁回');
        setReviewing(null); setReviewNote('');
        await reload();
      } else {
        showToast('審核失敗：' + (result.error||''), 'error');
      }
    } catch(e) { showToast('網路錯誤', 'error'); }
    setSaving(false);
  };

  // 複製推薦連結（業務用）
  const copyInviteLink = () => {
    const code = distData?.inviteCode;
    if (!code) { showToast('尚無推薦碼', 'error'); return; }
    const base = window.location.origin + window.location.pathname.replace(/admin\.html$/, '');
    const url = `${base}index.html?invite=${code}`;
    navigator.clipboard.writeText(url).then(() => showToast('✅ 推薦連結已複製'));
  };

  const copyInviteCode = () => {
    const code = distData?.inviteCode;
    if (!code) return;
    navigator.clipboard.writeText(code).then(() => showToast('✅ 推薦碼已複製：' + code));
  };

  // ════════════════════════════════════════════════════════════
  if (authState === 'checking') {
    return (
      <div className="min-h-screen bg-slate-50">
        <div className="glass sticky top-0 z-40 border-b border-slate-200">
          <div className="max-w-6xl mx-auto px-6 py-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-full bg-slate-200 animate-pulse"/>
              <div className="space-y-2">
                <div className="h-5 w-32 bg-slate-200 rounded animate-pulse"/>
                <div className="h-3 w-20 bg-slate-100 rounded animate-pulse"/>
              </div>
            </div>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-6 py-8">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {[1,2,3,4].map(i => (
              <div key={i} className="bg-slate-200 animate-pulse h-28 rounded-[1.5rem]"/>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (authState === 'denied') {
    return (
      <div className="flex items-center justify-center h-screen flex-col gap-3 p-8 text-center">
        <div className="text-6xl">🔒</div>
        <h2 className="text-2xl font-black text-slate-700">無存取權限</h2>
        <p className="text-slate-400 max-w-md">
          需要管理員身份或已核准的分銷商身份才能進入此頁。
        </p>
        <a href="index.html" className="mt-4 bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700">
          返回首頁
        </a>
      </div>
    );
  }

  // ── 管理員儀表板數字 ──
  const adminStats = (() => {
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthOrders = allOrders.filter(o => String(o.createdat||'').startsWith(thisMonth));
    return {
      pendingReview: pendingItems.length,
      pendingOrders: allOrders.filter(o => String(o.status).toLowerCase() === 'pending').length,
      monthRevenue: monthOrders.reduce((s,o) => s + Number(o.price||0), 0),
      monthCommission: monthOrders.reduce((s,o) => s + Number(o.commissionamount||0), 0),
      totalDist: allDist.length,
      pendingDist: allDist.filter(d => String(d.status).toLowerCase() === 'pending').length,
      totalOrders: allOrders.length,
      totalItems: myItems.length,
    };
  })();

  // ════ 主介面 ════
  return (
    <div className="min-h-screen bg-slate-50">
      {/* ════ Header ════ */}
      <div className="glass sticky top-0 z-40 border-b border-slate-200">
        <div className="max-w-6xl mx-auto px-6 py-4">
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-3 min-w-0">
              {profile && <img src={profile.pictureUrl} className="w-12 h-12 rounded-full shrink-0" />}
              <div className="min-w-0">
                <h1 className="font-black text-xl text-slate-900 truncate">
                  {isAdmin ? '🛠️ 管理員儀表板' : '👤 我的儀表板'}
                </h1>
                <p className="text-xs text-slate-400 font-medium truncate">
                  {profile?.displayName} · {isAdmin ? '管理員' : (canUpload ? '分銷商（可上稿）' : '分銷商')}
                </p>
              </div>
            </div>
            <a href="index.html"
              className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold text-sm transition shrink-0">
              ← 會員中心

<!-- ★ JSX 編譯快取載入器（替代 babel-standalone 的 type="text/babel" 自動執行）
     首次：載 babel-standalone → 編譯 → 存 localStorage → eval
     之後：localStorage 命中 → 直接 eval（省下載 babel + 省編譯時間）
     JSX 內容變了 → hash 不同 → 自動 invalidate -->
<script>
(function(){
  const CACHE_KEY_PREFIX = 'tk-jsx-cache-v1:';
  const BABEL_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js';

  // djb2 hash（簡單夠用，碰撞機率極低）
  function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return (h>>>0).toString(36); }

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function execCode(code){
    // 用 new Function 而非 eval，避免污染 strict mode；同時要能存取全域 React/ReactDOM
    // 但 new Function 是非 strict、全域 scope 的——React、ReactDOM 等都能讀到
    new Function(code)();
  }

  async function boot(){
    const src = document.getElementById('app-source')?.textContent || '';
    if (!src.trim()) { console.error('[jsx-loader] no #app-source'); return; }

    const key = CACHE_KEY_PREFIX + hash(src);

    // 1. 試讀快取
    try {
      const cached = localStorage.getItem(key);
      if (cached) {
        console.log('[jsx-loader] cache HIT, exec compiled code');
        execCode(cached);
        return;
      }
    } catch(e) { console.warn('[jsx-loader] localStorage read failed', e); }

    // 2. 沒快取 → 載 babel + 編譯
    console.log('[jsx-loader] cache MISS, loading babel...');
    const t0 = performance.now();
    try {
      await loadScript(BABEL_CDN);
      const t1 = performance.now();
      console.log('[jsx-loader] babel loaded in', (t1-t0).toFixed(0), 'ms; compiling...');
      const compiled = Babel.transform(src, { presets: ['react','env'] }).code;
      const t2 = performance.now();
      console.log('[jsx-loader] compiled in', (t2-t1).toFixed(0), 'ms');

      // 3. 存快取（失敗就算了，下次再編譯）
      try { localStorage.setItem(key, compiled); }
      catch(e) {
        // localStorage 滿了 → 清掉所有舊版本快取再試一次
        try {
          for (let i=localStorage.length-1; i>=0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith(CACHE_KEY_PREFIX)) localStorage.removeItem(k);
          }
          localStorage.setItem(key, compiled);
        } catch(_) { console.warn('[jsx-loader] cache write failed', e); }
      }

      execCode(compiled);
    } catch(e) {
      console.error('[jsx-loader] babel load/compile failed:', e);
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;font-family:sans-serif"><h2>載入失敗</h2><p style="color:#888">請重新整理頁面，或清除瀏覽器快取</p></div>';
    }
  }

  // 等 React/ReactDOM 載完才執行
  if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') boot();
  else window.addEventListener('load', boot);
})();
</script>

</body>
</html>
