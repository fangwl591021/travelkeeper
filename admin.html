<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家 - 管理員後台 (v4.1 旗艦版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;

    const WORKER_URL = 'https://travelkeeper.fangwl591021.workers.dev';
    const LIFF_ID = '2009367829-BDZCGti8'; 

    function AdminApp() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [liffProfile, setLiffProfile] = useState(null);
      const [isLiffReady, setIsLiffReady] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      
      const [ocrStatus, setOcrStatus] = useState('idle'); // idle, processing, done
      const [draftData, setDraftData] = useState({ id: null, title: '', region: '', price: '', days: '', description: '', image: '' });
      const [toast, setToast] = useState(null);

      useEffect(() => {
        const init = async () => {
          try {
            await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
            setIsLiffReady(true);
            if (liff.isLoggedIn()) {
              const profile = await liff.getProfile();
              setLiffProfile(profile);
              await checkAuth(profile.userId);
            } else {
              liff.login();
            }
          } catch (e) { console.error(e); }
          setIsLoading(false);
        };
        init();
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }, []);

      const checkAuth = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${uid}&_t=${Date.now()}`);
          const data = await res.json();
          if (data.success && data.data.isAdmin) {
            setIsAdmin(true);
          }
        } catch (e) { console.error(e); }
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // --- PDF 轉圖與 AI 傳送邏輯 ---
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setOcrStatus('processing');
        try {
          if (file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = async function() {
              const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
              const page = await pdf.getPage(1);
              const viewport = page.getViewport({ scale: 2 });
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = viewport.width; canvas.height = viewport.height;
              await page.render({ canvasContext: ctx, viewport: viewport }).promise;
              sendToAI(canvas.toDataURL('image/jpeg', 0.8));
            };
            reader.readAsArrayBuffer(file);
          } else {
            const reader = new FileReader();
            reader.onload = e => sendToAI(e.target.result);
            reader.readAsDataURL(file);
          }
        } catch (err) {
          setOcrStatus('idle');
          showToast('檔案解析失敗', 'error');
        }
      };

      const sendToAI = async (base64) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/upload-dm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 })
          });
          const result = await res.json();
          if (result.success) {
            setDraftData(result.data);
            setOcrStatus('done');
            showToast('AI 解析成功！請確認文案內容。');
          } else {
            throw new Error();
          }
        } catch (e) {
          setOcrStatus('idle');
          showToast('AI 解析發生錯誤', 'error');
        }
      };

      const handleSave = async () => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...draftData, action: 'addItinerary' })
          });
          const result = await res.json();
          if (result.success) {
            showToast('🎉 行程已成功上架！');
            setDraftData({ id: null, title: '', region: '', price: '', days: '', description: '', image: '' });
            setOcrStatus('idle');
          }
        } catch (e) { showToast('儲存失敗', 'error'); }
      };

      // --- UI 渲染 ---
      if (isLoading) return <div className="p-20 text-center font-bold text-gray-400">系統驗證中...</div>;

      if (!isAdmin) return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="bg-white p-10 rounded-3xl shadow-xl border max-w-md w-full text-center">
            <div className="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500 font-black text-4xl">!</div>
            <h1 className="text-2xl font-black mb-2">ACCESS DENIED</h1>
            <p className="text-gray-500 text-sm mb-6">您的帳號目前無管理員權限。</p>
            <div className="bg-gray-50 p-4 rounded-xl border border-dashed mb-6 text-left">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">您的專屬 UID</p>
              <p className="font-mono text-xs text-blue-600 break-all select-all">{liffProfile?.userId || '正在讀取...'}</p>
            </div>
            <p className="text-xs text-gray-400">請將上方 UID 複製並貼入 Google Apps Script 的 adminUIDs 清單中以完成授權。</p>
          </div>
        </div>
      );

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-10 animate-fade-in">
          <header className="mb-10 flex justify-between items-center">
            <div>
              <h1 className="text-3xl font-black text-slate-800">智能上稿系統</h1>
              <p className="text-slate-400 font-bold text-sm">單一企業旗艦版 v4.1</p>
            </div>
            <button onClick={() => window.location.href='index.html'} className="text-slate-400 hover:text-slate-800 font-bold text-sm">返回前台</button>
          </header>

          <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
            {/* 上傳區域 */}
            <div className="relative border-4 border-dashed border-slate-200 rounded-[2rem] p-16 text-center hover:border-blue-400 transition-all bg-slate-50 group">
              {ocrStatus === 'processing' ? (
                <div className="flex flex-col items-center">
                  <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                  <p className="font-black text-blue-600 animate-pulse">ChatGPT 視覺解析中...</p>
                </div>
              ) : (
                <>
                  <div className="text-5xl mb-4 group-hover:scale-110 transition-transform">📄</div>
                  <p className="text-xl font-black text-slate-600">點擊上傳 DM 圖片或 PDF</p>
                  <p className="text-sm text-slate-400 mt-1">系統將自動辨識行程標題、天數、價格與文案</p>
                  <input type="file" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*,application/pdf" />
                </>
              )}
            </div>

            {/* 解析結果預覽 */}
            {ocrStatus === 'done' && (
              <div className="mt-12 space-y-6 animate-fade-in-up">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-xs font-black text-slate-400 uppercase mb-2">行程標題</label>
                    <input value={draftData.title} onChange={e=>setDraftData({...draftData, title:e.target.value})} className="w-full p-4 border-2 rounded-2xl font-bold bg-white focus:border-blue-500 outline-none" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-black text-slate-400 uppercase mb-2">天數</label>
                      <input type="number" value={draftData.days} onChange={e=>setDraftData({...draftData, days:e.target.value})} className="w-full p-4 border-2 rounded-2xl font-bold bg-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-black text-slate-400 uppercase mb-2">價格</label>
                      <input type="number" value={draftData.price} onChange={e=>setDraftData({...draftData, price:e.target.value})} className="w-full p-4 border-2 rounded-2xl font-bold bg-white" />
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-400 uppercase mb-2">AI 擴寫行程文案 (可自行微調)</label>
                  <textarea value={draftData.description} onChange={e=>setDraftData({...draftData, description:e.target.value})} rows="10" className="w-full p-6 border-2 rounded-2xl leading-relaxed text-slate-600 bg-white focus:border-blue-500 outline-none custom-scrollbar" />
                </div>

                <div className="flex gap-4">
                  <button onClick={() => setOcrStatus('idle')} className="flex-1 bg-slate-100 py-5 rounded-2xl font-bold text-slate-500">重新解析</button>
                  <button onClick={handleSave} className="flex-[2] bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl text-xl hover:bg-blue-700 transition">確認發布此行程 🚀</button>
                </div>
              </div>
            )}
          </div>
          
          {toast && (
            <div className={`fixed bottom-10 right-10 z-[100] px-8 py-4 rounded-2xl shadow-2xl font-black animate-fade-in-up ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
