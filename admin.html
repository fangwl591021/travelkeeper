<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家 - 管理員後台 (v4.1 旗艦版)</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js](https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js](https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js](https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js)"></script>
  <script charset="utf-8" src="[https://static.line-scdn.net/liff/edge/2/sdk.js](https://static.line-scdn.net/liff/edge/2/sdk.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js)"></script>
  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;

    const WORKER_URL = '[https://travelkeeper.fangwl591021.workers.dev](https://travelkeeper.fangwl591021.workers.dev)';
    const LIFF_ID = '2009367829-BDZCGti8'; 

    function AdminApp() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [liffProfile, setLiffProfile] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [ocrStatus, setOcrStatus] = useState('idle'); 
      const [draftData, setDraftData] = useState({ id: null, title: '', region: '', price: '', days: '', description: '', image: '' });
      const [toast, setToast] = useState(null);

      useEffect(() => {
        const init = async () => {
          try {
            await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
            if (liff.isLoggedIn()) {
              const profile = await liff.getProfile();
              setLiffProfile(profile);
              await checkAuth(profile.userId);
            } else {
              liff.login();
            }
          } catch (e) { console.error(e); }
          setIsLoading(false);
        };
        init();
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = '[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js)';
      }, []);

      const checkAuth = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${uid}&_t=${Date.now()}`);
          const data = await res.json();
          // ★ 修正：回歸單店版判斷邏輯，不查 Tenant 表
          if (data.success && data.data.isAdmin) {
            setIsAdmin(true);
          }
        } catch (e) { console.error(e); }
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // --- PDF 轉圖與 AI 傳送邏輯 ---
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setOcrStatus('processing');
        try {
          if (file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = async function() {
              const loadingTask = pdfjsLib.getDocument(new Uint8Array(this.result));
              const pdf = await loadingTask.promise;
              const page = await pdf.getPage(1);
              const viewport = page.getViewport({ scale: 2 });
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = viewport.width; canvas.height = viewport.height;
              await page.render({ canvasContext: ctx, viewport: viewport }).promise;
              sendToAI(canvas.toDataURL('image/jpeg', 0.8));
            };
            reader.readAsArrayBuffer(file);
          } else {
            const reader = new FileReader();
            reader.onload = (ev) => sendToAI(ev.target.result);
            reader.readAsDataURL(file);
          }
        } catch (err) {
          setOcrStatus('idle');
          showToast('檔案載入失敗：' + err.message, 'error');
        }
      };

      const sendToAI = async (base64) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/upload-dm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 })
          });
          
          if (!res.ok) throw new Error('Worker 連線失敗 (' + res.status + ')');
          
          const result = await res.json();
          if (result.success) {
            setDraftData(result.data);
            setOcrStatus('done');
            showToast('✅ AI 解析成功！');
          } else {
            throw new Error(result.error || 'AI 無法解析此圖片');
          }
        } catch (e) {
          setOcrStatus('idle');
          showToast('❌ 錯誤：' + e.message, 'error');
        }
      };

      const handleSave = async () => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...draftData, action: 'addItinerary' })
          });
          const result = await res.json();
          if (result.success) {
            showToast('🎉 行程已成功上架！');
            setDraftData({ id: null, title: '', region: '', price: '', days: '', description: '', image: '' });
            setOcrStatus('idle');
          }
        } catch (e) { showToast('儲存失敗', 'error'); }
      };

      if (isLoading) return <div className="p-20 text-center font-bold text-gray-400 animate-pulse">權限驗證中...</div>;

      if (!isAdmin) return (
        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
          <div className="bg-white p-10 rounded-3xl shadow-xl border max-w-md w-full text-center animate-fade-in-up">
            <div className="text-5xl mb-6">🚫</div>
            <h1 className="text-2xl font-black mb-2">ACCESS DENIED</h1>
            <p className="text-gray-500 text-sm mb-6">您的 UID 不在管理員名單內</p>
            <div className="bg-slate-100 p-4 rounded-xl border border-dashed text-left">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">您的 UID (請複製解鎖)</p>
              <p className="font-mono text-xs text-blue-600 break-all select-all">{liffProfile?.userId || '讀取中'}</p>
            </div>
            <p className="text-xs text-gray-400 mt-6">請將上方 UID 貼入 Code.gs 的 adminUIDs 陣列中。</p>
          </div>
        </div>
      );

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-10 animate-fade-in">
          <header className="mb-10 flex justify-between items-center">
            <div>
              <h1 className="text-3xl font-black text-slate-800 tracking-tight">智能上稿中心</h1>
              <p className="text-slate-400 font-bold text-sm">旗艦單店版 v4.1</p>
            </div>
            <button onClick={() => window.location.href='index.html'} className="text-slate-500 hover:text-blue-600 font-bold text-sm transition">返回首頁</button>
          </header>

          <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-slate-100">
            {/* 上傳區 */}
            <div className={`relative border-4 border-dashed rounded-[2rem] p-16 text-center transition-all ${ocrStatus === 'processing' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-slate-50 hover:border-blue-400 group'}`}>
              {ocrStatus === 'processing' ? (
                <div className="flex flex-col items-center">
                  <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                  <p className="font-black text-blue-600 animate-pulse">ChatGPT 視覺解析中...</p>
                  <p className="text-xs text-blue-400 mt-2">正在自動擴寫行程並搜尋圖片</p>
                </div>
              ) : (
                <>
                  <div className="text-6xl mb-4 group-hover:scale-110 transition-transform">📁</div>
                  <p className="text-xl font-black text-slate-600">點擊上傳 DM 圖片或 PDF</p>
                  <p className="text-sm text-slate-400 mt-1">系統將自動分析並填寫下方表格</p>
                  <input type="file" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*,application/pdf" />
                </>
              )}
            </div>

            {/* 結果預覽區 */}
            {(ocrStatus === 'done' || draftData.title) && (
              <div className="mt-12 space-y-8 animate-fade-in-up">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="md:col-span-2">
                    <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">行程標題</label>
                    <input value={draftData.title} onChange={e=>setDraftData({...draftData, title:e.target.value})} className="w-full p-5 border-2 rounded-2xl font-bold text-xl focus:border-blue-500 outline-none transition" />
                  </div>
                  <div>
                    <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">天數</label>
                    <input type="number" value={draftData.days} onChange={e=>setDraftData({...draftData, days:e.target.value})} className="w-full p-5 border-2 rounded-2xl font-bold text-xl" />
                  </div>
                  <div>
                    <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">預估團費 (TWD)</label>
                    <input type="number" value={draftData.price} onChange={e=>setDraftData({...draftData, price:e.target.value})} className="w-full p-5 border-2 rounded-2xl font-bold text-xl text-red-600" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">詳細行程內容 (AI 已自動擴寫)</label>
                  <textarea value={draftData.description} onChange={e=>setDraftData({...draftData, description:e.target.value})} rows="12" className="w-full p-6 border-2 rounded-2xl leading-relaxed text-slate-600 focus:border-blue-500 outline-none custom-scrollbar" />
                </div>

                <div className="flex gap-4 pt-4">
                  <button onClick={() => {setOcrStatus('idle'); setDraftData({ id: null, title: '', region: '', price: '', days: '', description: '', image: '' });}} className="flex-1 bg-slate-100 py-6 rounded-3xl font-black text-slate-500 hover:bg-slate-200 transition">清空重新上傳</button>
                  <button onClick={handleSave} className="flex-[2] bg-blue-600 text-white font-black py-6 rounded-3xl shadow-2xl text-xl hover:bg-blue-700 transition">確認發布此行程 🚀</button>
                </div>
              </div>
            )}
          </div>
          
          {toast && (
            <div className={`fixed bottom-10 right-10 z-[100] px-10 py-5 rounded-[2rem] shadow-2xl font-black animate-fade-in-up ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'}`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
