<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儀表板 | 旅遊管家</title>
  <meta http-equiv="refresh" content="0; url=dashboard.html">
  <script>
    // ★ admin.html 已併入 dashboard.html
    // 保留此檔當作 redirect，向下相容舊連結 / 已發出的 Flex Message / 圖文選單
    // 把原本帶的任何 query / hash 也一併傳遞過去
    (function(){
      const search = location.search || '';
      const hash   = location.hash   || '';
      location.replace('dashboard.html' + search + hash);
    })();
  </script>
  <style>
    body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#64748b;background:#f8fafc}
    .box{text-align:center}
    .spin{display:inline-block;width:32px;height:32px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:s 0.8s linear infinite;margin-bottom:12px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>正在前往新版儀表板…</p>
    <p><a href="dashboard.html" style="color:#2563eb;font-weight:bold;text-decoration:none">點我手動前往 →</a></p>
  </div>
</body>
</html>
