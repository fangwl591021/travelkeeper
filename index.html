<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家 - 智能業務系統 (旗艦完全體)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.35s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .line-oa-style { border-radius: 2.5rem; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-gray-50 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const WORKER_URL = 'https://travelkeeper.fangwl591021.workers.dev';
    const LIFF_ID = '2009367829-BDZCGti8'; 

    function App() {
      // 1. 核心狀態
      const urlParams = new URLSearchParams(window.location.search);
      const [activeTab, setActiveTab] = useState(urlParams.get('tab') || 'home');
      const [isLoading, setIsLoading] = useState(true);
      const [itineraries, setItineraries] = useState([]);
      const [filteredResults, setFilteredResults] = useState([]); 
      const [liffProfile, setLiffProfile] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [distributorStatus, setDistributorStatus] = useState(null);
      const [distributorStats, setDistributorStats] = useState({ users: [], orders: [] });
      const [myOrders, setMyOrders] = useState([]);
      const [toast, setToast] = useState(null);
      const [selectedTourId, setSelectedTourId] = useState(urlParams.get('t') || null);
      
      const [searchRegion, setSearchRegion] = useState('');
      const [searchKeyword, setSearchKeyword] = useState('');
      const [bannerImage, setBannerImage] = useState('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80');

      const [ocrStatus, setOcrStatus] = useState('idle');
      const [draftData, setDraftData] = useState(null);

      // 2. 初始化 LIFF 與 資料
      useEffect(() => {
        const init = async () => {
          try {
            await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
            if (liff.isLoggedIn()) {
              const p = await liff.getProfile();
              setLiffProfile(p);
              await checkAuth(p.userId);
            }
          } catch (e) { console.error('LIFF Init Error', e); }
          await fetchData();
        };
        init();
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }, []);

      // 3. API 核心邏輯
      const checkAuth = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${uid}`);
          const data = await res.json();
          if (data.success) {
            if (data.data.isAdmin) setIsAdmin(true);
            if (data.data.role === 'distributor') {
              setDistributorStatus(data.data.status);
              fetchDistributorStats(uid);
            }
            fetchUserOrders(uid);
          }
        } catch (e) {}
      };

      const fetchData = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?_t=${Date.now()}`);
          const data = await res.json();
          const items = Array.isArray(data) ? data : (data.data || []);
          setItineraries(items); 
          setFilteredResults(items);
        } catch (e) {}
        setIsLoading(false);
      };

      const fetchUserOrders = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=getUserOrders&uid=${uid}`);
          const data = await res.json();
          if (data.success) setMyOrders(data.data || []);
        } catch (e) {}
      };

      const fetchDistributorStats = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=getDistributorPerformance&uid=${uid}`);
          const data = await res.json();
          if (data.success) setDistributorStats({ users: data.users || [], orders: data.orders || [] });
        } catch (e) {}
      };

      const handleSearch = () => {
        let res = itineraries;
        if (searchRegion) res = res.filter(i => i.region.includes(searchRegion));
        if (searchKeyword) res = res.filter(i => i.title.toLowerCase().includes(searchKeyword.toLowerCase()));
        setFilteredResults(res);
      };

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // 4. 渲染導覽列
      const renderNavBar = () => {
        let badge = <span className="bg-gray-100 text-gray-400 text-[10px] px-2 py-0.5 rounded font-medium border border-gray-200">訪客</span>;
        if (isAdmin) badge = <span className="bg-red-50 text-red-600 text-[10px] px-2 py-0.5 rounded font-medium border border-red-100">👑 管理員</span>;
        else if (distributorStatus === 'approved') badge = <span className="bg-emerald-50 text-emerald-600 text-[10px] px-2 py-0.5 rounded font-medium border border-emerald-100">💼 經銷商</span>;

        return (
          <nav className="glass-nav sticky top-0 z-50 h-16 flex items-center px-4 justify-between border-b border-gray-100">
            <div className="flex items-center cursor-pointer" onClick={() => { setSelectedTourId(null); setActiveTab('home'); }}>
              <svg className="w-8 h-8 text-blue-600 mr-2" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
              <span className="font-black text-xl text-blue-900 tracking-tight">旅遊管家</span>
            </div>
            <div className="flex items-center space-x-1">
              <button onClick={() => { setSelectedTourId(null); setActiveTab('home'); }} className={`px-3 py-2 rounded-xl text-sm font-medium transition ${activeTab === 'home' ? 'text-blue-700 bg-blue-50' : 'text-slate-500 hover:bg-gray-50'}`}>找行程</button>
              <button onClick={() => setActiveTab('member')} className={`px-3 py-2 rounded-xl text-sm font-medium transition ${activeTab === 'member' ? 'text-blue-700 bg-blue-50' : 'text-slate-500 hover:bg-gray-50'}`}>會員中心</button>
              {isAdmin && <button onClick={() => setActiveTab('admin')} className={`px-3 py-2 rounded-xl text-sm font-medium transition ${activeTab === 'admin' ? 'text-red-700 bg-red-50' : 'text-slate-500 hover:bg-gray-50'}`}>智能上稿</button>}
              <div className="hidden sm:flex items-center gap-2 pl-3 border-l ml-2">
                <div className="text-right">
                  <p className="text-[10px] font-bold leading-none mb-1">{liffProfile?.displayName || '未登入'}</p>
                  {badge}
                </div>
                <img src={liffProfile?.pictureUrl || 'https://aiwe.cc/wp-content/uploads/2026/03/avatar_placeholder.jpg'} className="w-8 h-8 rounded-full border shadow-sm" />
              </div>
            </div>
          </nav>
        );
      };

      // 5. 渲染首頁 (帶 Banner)
      const renderHomeTab = () => {
        if (selectedTourId) {
          const tour = itineraries.find(i => String(i.id) === String(selectedTourId));
          if (!tour) return <div className="p-20 text-center animate-pulse">載入中...</div>;
          return (
            <div className="animate-fade-in-up pb-20">
              <div className="w-full h-[50vh] relative"><img src={tour.image} className="w-full h-full object-cover" /><div className="absolute inset-0 bg-black/40 flex items-end p-10"><h1 className="text-4xl md:text-6xl font-black text-white leading-tight">{tour.title}</h1></div></div>
              <div className="max-w-7xl mx-auto py-10 px-6 flex flex-col lg:flex-row gap-10">
                <div className="flex-1 space-y-8">
                  {tour.description?.split('\n').map((line, i) => {
                    const imgMatch = line.match(/!\[(.*?)\]\((.*?)\)/);
                    if (imgMatch) return <img key={i} src={imgMatch[2]} className="w-full rounded-3xl shadow-lg aspect-[16/9] object-cover my-6" />;
                    return <p key={i} className="text-lg leading-relaxed text-slate-700">{line}</p>;
                  })}
                </div>
                <div className="w-full lg:w-96 sticky top-24 self-start bg-white p-8 line-oa-style text-center">
                  <p className="text-xs font-bold text-slate-400">專案特惠價</p>
                  <p className="text-5xl font-black text-red-600 my-4">${Number(tour.price).toLocaleString()}</p>
                  <button className="w-full bg-[#b82337] text-white font-black py-5 rounded-2xl shadow-xl hover:bg-red-700 transition">立即預約報名</button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="animate-fade-in pb-20">
            <div className="relative w-full h-[400px] md:h-[550px] overflow-hidden bg-slate-900">
               <img src={bannerImage} className="w-full h-full object-cover opacity-60" />
               <div className="absolute inset-0 flex flex-col items-center justify-center text-white p-6 text-center">
                  <h1 className="text-5xl md:text-8xl font-black mb-6 drop-shadow-2xl animate-fade-in-up">探索世界的美好</h1>
                  <p className="text-xl md:text-3xl font-light tracking-[0.5em] drop-shadow-lg opacity-90">發現您的下一個夢幻旅程</p>
               </div>
            </div>

            <div className="bg-white shadow-2xl max-w-6xl mx-auto -mt-12 relative z-10 rounded-[2.5rem] p-8 border border-gray-50 grid grid-cols-1 md:grid-cols-3 gap-6">
               <select value={searchRegion} onChange={e=>setSearchRegion(e.target.value)} className="p-4 border-2 rounded-2xl bg-slate-50 outline-none font-bold text-slate-700 focus:border-blue-500 transition">
                 <option value="">探索所有地區</option>
                 <option value="國旅">國旅 (台灣)</option><option value="亞洲">亞洲</option><option value="歐洲">歐洲</option>
               </select>
               <input value={searchKeyword} onChange={e=>setSearchKeyword(e.target.value)} placeholder="輸入行程關鍵字..." className="p-4 border-2 rounded-2xl bg-slate-50 outline-none font-bold focus:border-blue-500 transition" />
               <button onClick={handleSearch} className="bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-700 transition transform hover:-translate-y-1">搜尋行程</button>
            </div>

            <div className="max-w-7xl mx-auto px-6 py-16 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-10">
              {filteredResults.map(item => (
                <div key={item.id} onClick={() => { setSelectedTourId(item.id); window.history.pushState({}, '', `?t=${item.id}`); }} className="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-2xl transition duration-500 group flex flex-col h-full">
                  <div className="h-60 overflow-hidden"><img src={item.image} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" /></div>
                  <div className="p-7 flex-grow flex flex-col">
                    <p className="text-[10px] font-bold text-blue-600 mb-2 uppercase tracking-widest">{item.region}</p>
                    <h4 className="font-bold text-xl mb-4 line-clamp-2 h-14 text-slate-800 leading-tight">{item.title}</h4>
                    <div className="flex justify-between items-end border-t border-gray-50 pt-5 mt-auto">
                      <span className="text-slate-400 text-sm font-medium">{item.days}天精華</span>
                      <span className="text-red-600 font-black text-2xl">${Number(item.price).toLocaleString()}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // 6. 渲染會員中心 (分級復原版)
      const renderMemberTab = () => {
        const totalSales = distributorStats.orders.reduce((s, o) => s + Number(o.totalAmount || 0), 0);
        
        return (
          <div className="p-4 md:p-10 max-w-6xl mx-auto animate-fade-in space-y-12">
            {/* 會員基本資料區 */}
            <div className="flex items-center gap-6 pb-10 border-b border-gray-100">
               <img src={liffProfile?.pictureUrl} className="w-24 h-24 rounded-full border-4 border-white shadow-xl" />
               <div>
                  <h2 className="text-4xl font-black text-slate-900 tracking-tight">{liffProfile?.displayName}</h2>
                  <p className="text-slate-400 font-medium mt-1">
                    {distributorStatus === 'approved' ? '✨ 尊榮經銷夥伴' : '👤 一般旅遊會員'}
                  </p>
               </div>
            </div>

            {/* 經銷商專屬數據 - 只在身分為經銷商時顯示 */}
            {distributorStatus === 'approved' && (
              <section className="space-y-6">
                <div className="flex justify-between items-end">
                  <h3 className="text-2xl font-black text-slate-900 tracking-tight">經銷推廣數據</h3>
                  <button onClick={() => window.location.href='model.html'} className="text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-xl">開啟名片工具箱</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-emerald-600 p-8 line-oa-style text-white shadow-emerald-100 shadow-xl">
                    <p className="text-emerald-100 text-xs font-bold tracking-widest uppercase mb-1">累積推廣總額</p>
                    <p className="text-4xl font-black">${totalSales.toLocaleString()}</p>
                  </div>
                  <div className="bg-white p-8 line-oa-style border border-gray-100">
                    <p className="text-slate-400 text-xs font-bold tracking-widest uppercase mb-1">推薦會員總數</p>
                    <p className="text-4xl font-black text-slate-800">{distributorStats.users.length} <span className="text-lg font-medium text-slate-400">人</span></p>
                  </div>
                </div>
                
                {/* 推薦會員名單 */}
                <div className="bg-white line-oa-style border border-gray-100 overflow-hidden">
                   <div className="p-6 border-b border-gray-50 flex justify-between items-center"><span className="font-bold text-slate-800">最新推薦會員名單</span></div>
                   <div className="overflow-x-auto">
                     <table className="w-full text-left">
                        <thead className="bg-gray-50 text-[10px] text-slate-400 font-black uppercase tracking-tighter">
                          <tr><th className="p-4">會員姓名</th><th className="p-4">註冊時間</th><th className="p-4 text-right">推薦來源</th></tr>
                        </thead>
                        <tbody className="divide-y divide-gray-50">
                          {distributorStats.users.map((u,idx) => (
                            <tr key={idx} className="text-sm">
                              <td className="p-4 font-bold">{u.name}</td>
                              <td className="p-4 text-slate-400 font-mono">{u.regTime?.split(' ')[0]}</td>
                              <td className="p-4 text-right text-emerald-600 font-bold">經銷連結</td>
                            </tr>
                          ))}
                          {distributorStats.users.length === 0 && <tr><td colSpan="3" className="p-10 text-center text-slate-300 font-medium">尚無推薦會員</td></tr>}
                        </tbody>
                     </table>
                   </div>
                </div>
              </section>
            )}

            {/* 個人預約行程 (所有人都看得到) */}
            <section className="space-y-6">
              <h3 className="text-2xl font-black text-slate-900 tracking-tight">我的預約報名紀錄</h3>
              {myOrders.length === 0 ? (
                <div className="p-20 bg-white line-oa-style border border-gray-50 text-center text-slate-300 font-bold">您目前尚無預約行程</div>
              ) : (
                <div className="grid gap-4">
                  {myOrders.map(o => (
                    <div key={o.orderId} className="bg-white p-8 line-oa-style border border-gray-50 flex justify-between items-center hover:shadow-md transition">
                      <div>
                        <p className="font-black text-xl text-slate-800 mb-1">{o.tourTitle}</p>
                        <p className="text-xs text-slate-400 font-mono">訂單號: {o.orderId}</p>
                      </div>
                      <div className="text-right">
                        <p className="font-black text-red-600 text-2xl mb-1">${Number(o.totalAmount).toLocaleString()}</p>
                        <span className="text-[10px] bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-black uppercase">{o.orderStatus}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </div>
        );
      };

      // 7. 渲染智能上稿 (維持優化後介面)
      const handleFileUpload = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setOcrStatus('processing');
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const res = await fetch(`${WORKER_URL}/api/upload-dm`, { method: 'POST', body: JSON.stringify({ image: ev.target.result }) });
            const result = await res.json();
            if (result.success) { setDraftData(result.data); setOcrStatus('done'); showToast('AI 解析擴寫成功！'); }
            else throw new Error(result.error);
          } catch (e) { setOcrStatus('idle'); showToast('解析失敗: ' + e.message, 'error'); }
        };
        reader.readAsDataURL(file);
      };

      const renderAdminTab = () => (
        <div className="p-4 md:p-10 max-w-4xl mx-auto animate-fade-in-up">
          <div className="bg-white line-oa-style p-10">
            <h2 className="text-3xl font-black mb-8 text-slate-900 tracking-tight">🚀 智能上稿系統</h2>
            <div className={`relative border-4 border-dashed rounded-[3rem] p-16 text-center transition-all ${ocrStatus === 'processing' ? 'border-blue-500 bg-blue-50' : 'border-slate-100 bg-slate-50'}`}>
              {ocrStatus === 'processing' ? (
                <div className="flex flex-col items-center">
                  <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                  <p className="font-black text-blue-600 animate-pulse">AI 深度腦補擴寫中...</p>
                </div>
              ) : (
                <>
                  <p className="text-2xl font-black text-slate-600">點擊上傳旅遊 DM 圖片</p>
                  <p className="text-slate-400 mt-2 font-medium">AI 將自動產生精美擴寫內容與 16:9 高清圖</p>
                  <input type="file" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                </>
              )}
            </div>
            {draftData && (
              <div className="mt-12 space-y-8 animate-fade-in-up">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="md:col-span-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">行程標題</label><input value={draftData.title} onChange={e=>setDraftData({...draftData, title:e.target.value})} className="w-full p-5 border-2 border-slate-50 rounded-2xl font-black text-xl bg-slate-50/50" /></div>
                  <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">預估團費</label><input type="number" value={draftData.price} onChange={e=>setDraftData({...draftData, price:e.target.value})} className="w-full p-5 border-2 border-slate-50 rounded-2xl font-black text-xl text-red-600 bg-slate-50/50" /></div>
                  <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">天數</label><input type="number" value={draftData.days} onChange={e=>setDraftData({...draftData, days:e.target.value})} className="w-full p-5 border-2 border-slate-50 rounded-2xl font-black text-xl bg-slate-50/50" /></div>
                </div>
                <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">詳細腦補內容 (AI 已安插圖片)</label><textarea value={draftData.description} onChange={e=>setDraftData({...draftData, description:e.target.value})} rows="12" className="w-full p-6 border-2 border-slate-50 rounded-[2rem] leading-relaxed text-slate-600 text-lg bg-slate-50/50" /></div>
                <button onClick={async () => {
                   await fetch(`${WORKER_URL}/api/itineraries`, { method:'POST', body: JSON.stringify({...draftData, action:'addItinerary'}) });
                   showToast('行程已成功發布！'); fetchData(); setActiveTab('home');
                }} className="w-full bg-blue-600 text-white font-black py-6 rounded-3xl shadow-2xl text-xl hover:bg-blue-700 transition transform hover:-translate-y-1">確認發布此行程 🚀</button>
              </div>
            )}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 overflow-x-hidden">
          {renderNavBar()}
          <main className="flex-grow">
            {isLoading ? (
              <div className="p-40 text-center flex flex-col items-center">
                 <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-6"></div>
                 <p className="font-black text-slate-400 tracking-[0.3em] text-sm animate-pulse">核心系統安全連接中</p>
              </div>
            ) : (
              <>
                {activeTab === 'home' && renderHomeTab()}
                {activeTab === 'member' && renderMemberTab()}
                {activeTab === 'admin' && renderAdminTab()}
              </>
            )}
          </main>
          {toast && (<div className="fixed bottom-10 right-10 z-[100] px-10 py-5 rounded-[2rem] shadow-2xl font-black animate-fade-in-up bg-slate-900 text-white">{toast.msg}</div>)}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
