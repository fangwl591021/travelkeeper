<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家 - 智能業務系統 (v4.1 旗艦版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes run { 0% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-8px) rotate(5deg); } 50% { transform: translateY(0) rotate(0deg); } 75% { transform: translateY(-8px) rotate(-5deg); } 100% { transform: translateY(0) rotate(0deg); } }
    .animate-run { animation: run 0.5s infinite ease-in-out; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;

    // --- 圖示元件 ---
    const IconWrapper = ({ children, className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>;
    const Navigation = ({ className }) => <IconWrapper className={className}><polygon points="3 11 22 2 13 21 11 13 3 11"/></IconWrapper>;
    const Search = ({ className }) => <IconWrapper className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconWrapper>;
    const UploadCloud = ({ className }) => <IconWrapper className={className}><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></IconWrapper>;
    const RefreshCw = ({ className }) => <IconWrapper className={className}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></IconWrapper>;
    const AlertCircle = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconWrapper>;

    const WORKER_URL = 'https://travelkeeper.fangwl591021.workers.dev';
    const LIFF_ID = '2009367829-BDZCGti8'; 

    function App() {
      const [activeTab, setActiveTab] = useState(new URLSearchParams(window.location.search).get('tab') || 'home'); 
      const [isLoading, setIsLoading] = useState(true);
      const [itineraries, setItineraries] = useState([]);
      const [filteredResults, setFilteredResults] = useState([]);
      const [liffProfile, setLiffProfile] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [distributorStatus, setDistributorStatus] = useState(null);
      const [isGeneralMember, setIsGeneralMember] = useState(false);
      const [toast, setToast] = useState(null);
      const [selectedTourId, setSelectedTourId] = useState(new URLSearchParams(window.location.search).get('t') || null);
      const [ocrStatus, setOcrStatus] = useState('idle');
      const [draftData, setDraftData] = useState({ id: null, title: '', region: '', price: '', days: '', description: '', image: '' });

      useEffect(() => {
        const init = async () => {
          try {
            await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
            if (liff.isLoggedIn()) {
              const profile = await liff.getProfile();
              setLiffProfile(profile);
              await checkRole(profile.userId);
            }
          } catch (e) { console.error(e); }
          fetchData();
        };
        init();
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }, []);

      const checkRole = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${uid}&_t=${Date.now()}`);
          const data = await res.json();
          if (data.success) {
            if (data.data.isAdmin) setIsAdmin(true);
            if (data.data.role === 'distributor') setDistributorStatus(data.data.status);
            setIsGeneralMember(true);
          }
        } catch (e) {}
      };

      const fetchData = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?_t=${Date.now()}`);
          const data = await res.json();
          setItineraries(data || []);
          setFilteredResults(data || []);
        } catch (e) {}
        setIsLoading(false);
      };

      const renderNavBar = () => {
        let badge = <span className="bg-gray-100 text-gray-600 text-[11px] px-2 py-0.5 rounded font-bold border border-gray-200">訪客</span>;
        if (isAdmin) badge = <span className="bg-red-100 text-red-700 text-[11px] px-2 py-0.5 rounded font-bold border border-red-200">👑 管理員</span>;
        else if (distributorStatus === 'approved') badge = <span className="bg-emerald-100 text-emerald-700 text-[11px] px-2 py-0.5 rounded font-bold border border-emerald-200">💼 經銷商</span>;

        return (
          <nav className="bg-white shadow-sm sticky top-0 z-50 h-16 flex items-center px-4 justify-between border-b">
            <div className="flex items-center cursor-pointer" onClick={() => { setSelectedTourId(null); setActiveTab('home'); }}>
              <Navigation className="h-8 w-8 text-blue-600 mr-2" />
              <span className="font-bold text-xl text-blue-900">旅遊管家</span>
            </div>
            <div className="flex items-center space-x-2">
              <button onClick={() => { setSelectedTourId(null); setActiveTab('home'); }} className={`px-3 py-2 rounded-lg text-sm font-bold ${activeTab === 'home' ? 'text-blue-700 bg-blue-50' : 'text-gray-600'}`}>找行程</button>
              <button onClick={() => setActiveTab('member')} className={`px-3 py-2 rounded-lg text-sm font-bold ${activeTab === 'member' ? 'text-orange-700 bg-orange-50' : 'text-gray-600'}`}>會員中心</button>
              {isAdmin && <button onClick={() => setActiveTab('admin')} className={`px-3 py-2 rounded-lg text-sm font-bold ${activeTab === 'admin' ? 'text-red-700 bg-red-50' : 'text-gray-600'}`}>智能上稿</button>}
              <div className="hidden sm:flex items-center gap-2 pl-3 border-l ml-3">
                <div className="text-right">
                  <p className="text-xs font-bold leading-none mb-1">{liffProfile?.displayName || '未登入'}</p>
                  {badge}
                </div>
                <img src={liffProfile?.pictureUrl || 'https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=100'} className="w-10 h-10 rounded-full border shadow-sm" />
              </div>
            </div>
          </nav>
        );
      };

      const renderHomeTab = () => {
        if (selectedTourId) {
          const tour = itineraries.find(i => String(i.id) === String(selectedTourId));
          if (!tour) return <div className="p-20 text-center animate-pulse">載入中...</div>;
          return (
            <div className="animate-fade-in pb-20">
              <div className="w-full h-[50vh] relative"><img src={tour.image} className="w-full h-full object-cover" /><div className="absolute inset-0 bg-black/40 flex items-end p-10"><h1 className="text-4xl md:text-6xl font-black text-white">{tour.title}</h1></div></div>
              <div className="max-w-7xl mx-auto py-10 px-6 flex flex-col lg:flex-row gap-10">
                <div className="flex-1 space-y-6 text-lg leading-relaxed text-gray-700 whitespace-pre-wrap bg-white p-10 rounded-3xl border shadow-sm">{tour.description}</div>
                <div className="w-full lg:w-96 sticky top-24 self-start bg-white p-8 rounded-3xl shadow-xl border text-center">
                  <p className="text-sm font-bold text-gray-400">專案特惠價</p>
                  <p className="text-5xl font-black text-red-600 my-4">${Number(tour.price).toLocaleString()}</p>
                  <button className="w-full bg-[#b82337] text-white font-bold py-4 rounded-2xl shadow-lg">立即預約報名</button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="animate-fade-in pb-20">
            {/* ★ 首頁 Banner */}
            <div className="relative w-full h-[300px] md:h-[450px] overflow-hidden bg-gray-900">
               <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80" className="w-full h-full object-cover opacity-70" />
               <div className="absolute inset-0 flex flex-col items-center justify-center text-white p-6 text-center">
                  <h1 className="text-4xl md:text-6xl font-black mb-4 drop-shadow-lg">探索世界的美好</h1>
                  <p className="text-lg md:text-2xl font-light tracking-widest drop-shadow-md">發現您的下一個夢幻旅程</p>
               </div>
            </div>

            <div className="bg-white shadow-xl max-w-6xl mx-auto -mt-10 relative z-10 rounded-3xl p-8 border grid grid-cols-1 md:grid-cols-3 gap-6">
               <select className="p-4 border rounded-2xl bg-gray-50 outline-none font-bold"><option>探索所有地區</option><option>國旅 (台灣)</option><option>亞洲</option><option>歐洲</option></select>
               <input placeholder="輸入行程關鍵字..." className="p-4 border rounded-2xl bg-gray-50 outline-none font-bold" />
               <button className="bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-blue-700 transition">搜尋行程</button>
            </div>

            <div className="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
              {filteredResults.map(item => (
                <div key={item.id} onClick={() => setSelectedTourId(item.id)} className="bg-white rounded-[2rem] shadow-sm border overflow-hidden cursor-pointer hover:shadow-2xl transition duration-300">
                  <div className="h-56 overflow-hidden"><img src={item.image} className="w-full h-full object-cover" /></div>
                  <div className="p-6">
                    <p className="text-xs font-bold text-blue-500 mb-1">{item.region}</p>
                    <h4 className="font-bold text-lg mb-4 line-clamp-2 h-14">{item.title}</h4>
                    <div className="flex justify-between items-center border-t pt-4"><span className="text-gray-400 text-sm font-bold">{item.days}天精華</span><span className="text-red-600 font-black text-2xl">${Number(item.price).toLocaleString()}</span></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const renderAdminTab = () => {
        if (!isAdmin) return (
          <div className="p-20 text-center max-w-2xl mx-auto bg-white rounded-3xl mt-10 shadow-xl border">
            <AlertCircle className="w-20 h-20 text-red-500 mx-auto mb-6" />
            <h2 className="text-3xl font-black mb-4 uppercase">Access Denied</h2>
            <p className="text-gray-500 mb-2">您的帳號目前無管理員權限。</p>
            <p className="text-blue-600 font-mono text-sm bg-blue-50 p-3 rounded-xl border border-blue-100">UID: {liffProfile?.userId || '正在讀取...'}</p>
            <p className="text-xs text-gray-400 mt-4">請將上方 UID 複製並貼入後端 Code.gs 的 adminUIDs 名單中。</p>
          </div>
        );
        return (
          <div className="p-6 max-w-4xl mx-auto animate-fade-in pb-20">
            <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl border">
              <h2 className="text-3xl font-black mb-8 flex items-center gap-3 text-blue-900"><UploadCloud className="w-10 h-10" /> 智能上稿</h2>
              <div className="border-4 border-dashed rounded-[2rem] p-16 text-center bg-gray-50 relative border-gray-200 hover:border-blue-400 transition-all">
                {ocrStatus === 'processing' ? <RefreshCw className="animate-spin mx-auto w-12 h-12 text-blue-500" /> : <IconWrapper className="mx-auto w-20 h-20 text-gray-300"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconWrapper>}
                <p className="mt-6 font-black text-xl text-gray-500">點擊上傳 DM 圖片或 PDF 行程表</p>
                <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" />
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-gray-50">
          {renderNavBar()}
          <main className="flex-grow">
            {isLoading ? <div className="p-40 text-center animate-pulse font-black text-gray-400">系統安全連線中...</div> : (
              <>
                {activeTab === 'home' && renderHomeTab()}
                {activeTab === 'admin' && renderAdminTab()}
                {(activeTab === 'member' || activeTab === 'distributor') && <div className="p-20 text-center font-bold text-gray-400">模組開發中...</div>}
              </>
            )}
          </main>
          {toast && (<div className="fixed bottom-10 right-10 z-[100] bg-gray-900 text-white px-10 py-5 rounded-3xl shadow-2xl font-black">{toast}</div>)}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
