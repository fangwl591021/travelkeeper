<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM | 旅遊管家</title>
  <meta http-equiv="refresh" content="0; url=dashboard.html#orders">
  <script>
    // ★ crm.html 已併入 dashboard.html
    // 預設跳到 #orders（訂單頁），但若原本帶 query/hash 也保留
    (function(){
      const search = location.search || '';
      const hash   = location.hash || '#orders';   // 預設訂單頁
      location.replace('dashboard.html' + search + hash);
    })();
  </script>
  <style>
    body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#64748b;background:#f8fafc}
    .box{text-align:center}
    .spin{display:inline-block;width:32px;height:32px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:s 0.8s linear infinite;margin-bottom:12px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>正在前往新版儀表板…</p>
    <p><a href="dashboard.html#orders" style="color:#2563eb;font-weight:bold;text-decoration:none">點我手動前往 →</a></p>
  </div>
</body>
</html>
