<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家 - 智能業務系統 (旗艦完全體)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.35s ease-out forwards; }
    .line-oa-style { border-radius: 2.5rem; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-gray-50 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const WORKER_URL = 'https://travelkeeper.fangwl591021.workers.dev';
    const LIFF_ID = '2009367829-BDZCGti8'; 

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const [activeTab, setActiveTab] = useState(urlParams.get('tab') || 'home');
      const [isLoading, setIsLoading] = useState(true);
      const [itineraries, setItineraries] = useState([]);
      const [filteredResults, setFilteredResults] = useState([]); 
      const [liffProfile, setLiffProfile] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [distributorStatus, setDistributorStatus] = useState(null);
      const [distributorStats, setDistributorStats] = useState({ users: [], orders: [] });
      const [myOrders, setMyOrders] = useState([]);
      const [crmDistributors, setCrmDistributors] = useState([]); 
      const [selectedTourId, setSelectedTourId] = useState(urlParams.get('t') || null);
      const [searchRegion, setSearchRegion] = useState('');
      const [searchKeyword, setSearchKeyword] = useState('');
      const [bannerImage] = useState('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80');

      useEffect(() => {
        const init = async () => {
          try {
            await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
            if (liff.isLoggedIn()) {
              const p = await liff.getProfile();
              setLiffProfile(p);
              await checkAuth(p.userId);
            }
          } catch (e) { console.error('LIFF Error', e); }
          await fetchData();
        };
        init();
      }, []);

      useEffect(() => {
        if (activeTab === 'crm' && isAdmin) fetchCrmData();
      }, [activeTab, isAdmin]);

      const checkAuth = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${uid}`);
          const data = await res.json();
          if (data.success) {
            if (data.data.isAdmin) setIsAdmin(true);
            if (data.data.role === 'distributor') {
              setDistributorStatus(data.data.status);
              fetchDistributorStats(uid);
            }
            fetchUserOrders(uid);
          }
        } catch (e) {}
      };

      const fetchData = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?_t=${Date.now()}`);
          const data = await res.json();
          const items = Array.isArray(data) ? data : [];
          setItineraries(items); 
          setFilteredResults(items);
        } catch (e) {}
        setIsLoading(false);
      };

      const fetchUserOrders = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=getUserOrders&uid=${uid}`);
          const data = await res.json();
          if (data.success) setMyOrders(data.data || []);
        } catch (e) {}
      };

      const fetchDistributorStats = async (uid) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=getDistributorPerformance&uid=${uid}`);
          const data = await res.json();
          if (data.success) setDistributorStats({ users: data.users || [], orders: data.orders || [] });
        } catch (e) {}
      };

      const fetchCrmData = async () => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries?action=getDistributors`);
          const data = await res.json();
          setCrmDistributors(Array.isArray(data) ? data : []);
        } catch (e) {}
      };

      const handleDistributorApproval = async (uid, newStatus) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/itineraries`, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateDistributorStatus', uid, status: newStatus })
          });
          const result = await res.json();
          if (result.success) { fetchCrmData(); }
        } catch (e) {}
      };

      const handleSearch = () => {
        let res = itineraries;
        if (searchRegion) res = res.filter(i => String(i.region).includes(searchRegion));
        if (searchKeyword) res = res.filter(i => String(i.title).toLowerCase().includes(searchKeyword.toLowerCase()));
        setFilteredResults(res);
      };

      const renderNavBar = () => (
        <nav className="glass-nav sticky top-0 z-50 h-16 flex items-center px-4 justify-between border-b border-gray-100">
          <div className="flex items-center cursor-pointer" onClick={() => { setSelectedTourId(null); setActiveTab('home'); }}>
            <svg className="w-8 h-8 text-blue-600 mr-2" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
            <span className="font-black text-xl text-blue-900 tracking-tight">旅遊管家</span>
          </div>
          <div className="flex items-center space-x-1">
            <button onClick={() => setActiveTab('home')} className={`px-3 py-2 rounded-xl text-sm font-medium transition ${activeTab === 'home' ? 'text-blue-700 bg-blue-50' : 'text-slate-500'}`}>找行程</button>
            <button onClick={() => setActiveTab('member')} className={`px-3 py-2 rounded-xl text-sm font-medium transition ${activeTab === 'member' ? 'text-blue-700 bg-blue-50' : 'text-slate-500'}`}>會員中心</button>
            {isAdmin && <button onClick={() => setActiveTab('crm')} className={`px-3 py-2 rounded-xl text-sm font-medium transition ${activeTab === 'crm' ? 'text-purple-700 bg-purple-50' : 'text-slate-500'}`}>CRM 管理</button>}
            {isAdmin && <button onClick={() => window.location.href='admin.html'} className="px-3 py-2 rounded-xl text-sm font-medium text-red-700">智能上稿</button>}
            <img src={liffProfile?.pictureUrl || 'https://aiwe.cc/wp-content/uploads/2026/03/avatar_placeholder.jpg'} className="w-8 h-8 rounded-full border shadow-sm ml-2" />
          </div>
        </nav>
      );

      const renderHomeTab = () => {
        if (selectedTourId) {
          const tour = itineraries.find(i => String(i.id || i.timestamp) === String(selectedTourId));
          if (!tour) return <div className="p-20 text-center animate-pulse">行程資料載入中...</div>;
          return (
            <div className="animate-fade-in-up pb-20">
              <div className="w-full h-[50vh] relative"><img src={tour.image} className="w-full h-full object-cover" /><div className="absolute inset-0 bg-black/40 flex items-end p-10"><h1 className="text-4xl md:text-6xl font-black text-white leading-tight">{tour.title}</h1></div></div>
              <div className="max-w-7xl mx-auto py-10 px-6 flex flex-col lg:flex-row gap-10">
                <div className="flex-1 space-y-8">
                  {tour.description?.split('\n').map((line, i) => {
                    const imgMatch = line.match(/!\[(.*?)\]\((.*?)\)/);
                    if (imgMatch) return <img key={i} src={imgMatch[2]} className="w-full rounded-[2rem] shadow-lg aspect-[16/9] object-cover my-6" />;
                    return <p key={i} className="text-lg leading-relaxed text-slate-700">{line}</p>;
                  })}
                </div>
                <div className="w-full lg:w-96 sticky top-24 self-start bg-white p-8 line-oa-style text-center shadow-xl">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">限時優惠價</p>
                  <p className="text-5xl font-black text-red-600 my-4">${Number(tour.price).toLocaleString()}</p>
                  <button className="w-full bg-[#b82337] text-white font-black py-5 rounded-2xl shadow-xl hover:bg-red-700 transition">立即預約報名</button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="animate-fade-in pb-20">
            <div className="relative w-full h-[400px] md:h-[500px] overflow-hidden bg-slate-900">
               <img src={bannerImage} className="w-full h-full object-cover opacity-60" />
               <div className="absolute inset-0 flex flex-col items-center justify-center text-white p-6 text-center">
                  <h1 className="text-5xl md:text-8xl font-black mb-6 drop-shadow-2xl animate-fade-in-up tracking-tight">探索世界的美好</h1>
                  <p className="text-xl md:text-3xl font-light tracking-[0.5em] drop-shadow-lg opacity-90">發現您的下一個夢幻旅程</p>
               </div>
            </div>

            <div className="bg-white shadow-2xl max-w-6xl mx-auto -mt-12 relative z-10 rounded-[2.5rem] p-8 border border-gray-50 grid grid-cols-1 md:grid-cols-3 gap-6">
               <select value={searchRegion} onChange={e=>setSearchRegion(e.target.value)} className="p-4 border-2 rounded-2xl bg-slate-50 outline-none font-bold text-slate-700 focus:border-blue-500 transition">
                 <option value="">探索地區</option><option value="國旅">國旅 (台灣)</option><option value="亞洲">亞洲</option><option value="歐洲">歐洲</option>
               </select>
               <input value={searchKeyword} onChange={e=>setSearchKeyword(e.target.value)} placeholder="關鍵字搜尋..." className="p-4 border-2 rounded-2xl bg-slate-50 outline-none font-bold focus:border-blue-500 transition" />
               <button onClick={handleSearch} className="bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-700 transition transform hover:-translate-y-1">搜尋行程</button>
            </div>

            <div className="max-w-7xl mx-auto px-6 py-16 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-10">
              {filteredResults.map(item => (
                <div key={item.id || item.timestamp} onClick={() => { setSelectedTourId(item.id || item.timestamp); window.history.pushState({}, '', `?t=${item.id || item.timestamp}`); }} className="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-2xl transition duration-500 group flex flex-col h-full">
                  <div className="h-60 overflow-hidden"><img src={item.image} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" /></div>
                  <div className="p-7 flex-grow flex flex-col">
                    <p className="text-[10px] font-bold text-blue-600 mb-2 uppercase tracking-widest">{item.region}</p>
                    <h4 className="font-bold text-xl mb-4 line-clamp-2 h-14 text-slate-800 leading-tight">{item.title}</h4>
                    <div className="flex justify-between items-end border-t border-gray-50 pt-5 mt-auto">
                      <span className="text-slate-400 text-sm font-medium">{item.days}天精華</span>
                      <span className="text-red-600 font-black text-2xl">${Number(item.price).toLocaleString()}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const renderMemberTab = () => {
        const totalSales = distributorStats.orders.reduce((s, o) => s + Number(o.totalamount || 0), 0);
        return (
          <div className="p-4 md:p-10 max-w-6xl mx-auto animate-fade-in space-y-12">
            <div className="flex items-center gap-6 pb-10 border-b border-gray-100">
               <img src={liffProfile?.pictureUrl} className="w-24 h-24 rounded-full border-4 border-white shadow-xl" />
               <div><h2 className="text-4xl font-black text-slate-900 tracking-tight">{liffProfile?.displayName}</h2><p className="text-slate-400 font-medium mt-1">{distributorStatus === 'approved' ? '✨ 尊榮經銷夥伴' : '👤 一般旅遊會員'}</p></div>
            </div>

            {distributorStatus === 'approved' && (
              <section className="space-y-6 animate-fade-in-up">
                <div className="flex justify-between items-end px-2"><h3 className="text-2xl font-black text-slate-900 tracking-tight">經銷數據看板</h3><button onClick={() => window.location.href='model.html'} className="text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-xl">名片工具箱</button></div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-emerald-600 p-8 line-oa-style text-white shadow-emerald-100 shadow-xl"><p className="text-emerald-100 text-xs font-bold tracking-widest uppercase mb-1">成交總額</p><p className="text-4xl font-black">${totalSales.toLocaleString()}</p></div>
                  <div className="bg-white p-8 line-oa-style border border-gray-100"><p className="text-slate-400 text-xs font-bold tracking-widest uppercase mb-1">推薦人數</p><p className="text-4xl font-black text-slate-800">{distributorStats.users.length} <span className="text-lg font-medium text-slate-400">位</span></p></div>
                </div>
              </section>
            )}

            <section className="space-y-6">
              <h3 className="text-2xl font-black text-slate-900 tracking-tight px-2">預約報名紀錄</h3>
              {myOrders.length === 0 ? <div className="p-20 bg-white line-oa-style border border-gray-50 text-center text-slate-300 font-bold">目前無預約行程</div> : (
                <div className="grid gap-4">
                  {myOrders.map((o, idx) => (
                    <div key={idx} className="bg-white p-8 line-oa-style border border-gray-50 flex justify-between items-center hover:shadow-md transition">
                      <div><p className="font-black text-xl text-slate-800 mb-1">{o.tourtitle}</p><p className="text-xs text-slate-400 font-mono">單號: {o.orderid}</p></div>
                      <div className="text-right"><p className="font-black text-red-600 text-2xl mb-1">${Number(o.totalamount).toLocaleString()}</p><span className="text-[10px] bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-black uppercase">{o.orderstatus}</span></div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </div>
        );
      };

      const renderCrmTab = () => (
        <div className="p-4 md:p-10 max-w-6xl mx-auto animate-fade-in space-y-10">
          <header className="px-2"><h2 className="text-4xl font-black text-slate-900 tracking-tight">CRM 經銷商管理系統</h2><p className="text-slate-400 font-medium mt-1 text-sm">管理 Users 工作表中的經銷身份與狀態</p></header>
          <div className="bg-white line-oa-style overflow-hidden shadow-2xl">
             <div className="p-6 bg-slate-50/50 border-b border-gray-100 flex justify-between items-center px-8"><span className="font-black text-slate-700 tracking-widest text-xs uppercase">待核准名單</span><span className="text-[10px] font-bold text-slate-400">共 {crmDistributors.length} 位</span></div>
             <div className="overflow-x-auto">
               <table className="w-full text-left">
                  <thead className="bg-gray-50/50 text-[10px] text-slate-400 font-black uppercase tracking-widest border-b border-gray-100">
                    <tr><th className="p-6">經銷夥伴</th><th className="p-6">LINE UID</th><th className="p-6">狀態</th><th className="p-6 text-right">核准動作</th></tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {crmDistributors.map((d, idx) => (
                      <tr key={idx} className="hover:bg-slate-50 transition duration-300">
                        <td className="p-6"><p className="font-black text-slate-800 text-base">{d.name || '未命名'}</p><p className="text-xs text-slate-400">{d.phone}</p></td>
                        <td className="p-6 font-mono text-[10px] text-slate-300 break-all max-w-[120px]">{d.uid}</td>
                        <td className="p-6"><span className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ${String(d.status).toLowerCase() === 'approved' ? 'bg-emerald-50 text-emerald-600' : 'bg-orange-50 text-orange-600'}`}>{d.status}</span></td>
                        <td className="p-6 text-right">
                           {String(d.status).toLowerCase() !== 'approved' ? (
                             <button onClick={() => handleDistributorApproval(d.uid, 'approved')} className="bg-blue-600 text-white px-6 py-2.5 rounded-xl text-xs font-black shadow-lg hover:bg-blue-700 transition">核准加入</button>
                           ) : (
                             <button onClick={() => handleDistributorApproval(d.uid, 'pending')} className="text-slate-300 hover:text-red-500 transition text-xs font-bold">撤銷</button>
                           )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
               </table>
             </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 overflow-x-hidden">
          {renderNavBar()}
          <main className="flex-grow">
            {isLoading ? <div className="p-40 text-center animate-pulse font-black text-slate-400">系統連接中...</div> : (
              <>
                {activeTab === 'home' && renderHomeTab()}
                {activeTab === 'member' && renderMemberTab()}
                {activeTab === 'crm' && isAdmin && renderCrmTab()}
              </>
            )}
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
