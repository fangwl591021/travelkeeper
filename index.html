<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin   { to{transform:rotate(360deg)} }
    @keyframes shimmer { 0%{background-position:-468px 0} 100%{background-position:468px 0} }
    .afu  { animation: fadeUp .25s ease both; }
    .spin { animation: spin .7s linear infinite; }
    .glass{ background:rgba(255,255,255,.92); backdrop-filter:blur(16px); }
    /* 骨架條 */
    .skel { background: linear-gradient(to right, #f1f5f9 8%, #e2e8f0 18%, #f1f5f9 33%);
      background-size: 800px 100px; animation: shimmer 1.4s linear infinite; border-radius: 12px; }
    .promo-check { position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:6px;
      border:2.5px solid #fff;background:rgba(0,0,0,.35);display:flex;align-items:center;
      justify-content:center;cursor:pointer;transition:.15s;z-index:5; }
    .promo-check.on { background:#10b981;border-color:#10b981; }
    .modal-bg { position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);
      backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px; }
    .modal-bg:not(.hidden) { display:flex; }
    .modal-box { background:#fff;border-radius:24px;width:100%;max-width:680px;
      max-height:92vh;overflow:hidden;display:flex;flex-direction:column; }
    #editor-overlay { position:fixed;inset:0;z-index:300;background:#fff;flex-direction:column; }
    #editor-overlay:not(.hidden) { display:flex; }
    #toast { position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
      background:#1e293b;color:#fff;padding:12px 28px;border-radius:14px;
      font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:999;
      white-space:nowrap;pointer-events:none; }
    #toast.show{opacity:1} #toast.err{background:#dc2626}
    .nav-btn { padding:6px 12px;border-radius:12px;font-size:14px;font-weight:700;transition:.15s;color:#64748b; }
    .nav-btn:hover { background:#f1f5f9; }
    .nav-btn.active { background:#2563eb;color:#fff; }
    .ed-tool-btn { display:flex;align-items:center;gap:4px;padding:5px 12px;font-size:11px;font-weight:700;
      color:#475569;background:#f1f5f9;border-radius:8px;cursor:pointer;transition:.15s; }
    .ed-tool-btn:hover{background:#e2e8f0}
    .pmode-btn { background:#f1f5f9;color:#64748b; }
    .pmode-btn.active { background:#059669;color:#fff; }
  </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans">

<nav class="glass sticky top-0 z-50 h-14 flex items-center px-5 justify-between border-b border-slate-200 shadow-sm">
  <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('home')">
    <span class="text-xl">✈️</span>
    <span class="font-black text-lg text-blue-900 hidden sm:block">旅遊管家</span>
  </div>
  <div class="flex items-center gap-1" id="nav-tabs">
    <button onclick="switchTab('home')"   data-tab="home"   class="nav-btn active">找行程</button>
    <button onclick="switchTab('member')" data-tab="member" class="nav-btn hidden" id="nav-member">會員</button>
    <a href="admin.html" class="nav-btn hidden bg-slate-100 hover:bg-slate-200 !text-slate-700" id="nav-dashboard" style="text-decoration:none">← 儀表板</a>
    <img id="nav-avatar" src="" class="w-8 h-8 rounded-full border ml-2 hidden" />
  </div>
</nav>

<!-- ★ v3：推薦人 banner（?invite=XXXXXX 解析成功時顯示） -->
<div id="invite-banner" class="hidden bg-emerald-50 border-b border-emerald-200 px-5 py-2.5 text-center text-sm">
  <span class="text-emerald-700 font-bold">您是</span>
  <span id="invite-name" class="text-emerald-900 font-black mx-1">—</span>
  <span class="text-emerald-700 font-bold">推薦的客人 🎉</span>
</div>

<main id="main-content">
  <!-- ★ v3：骨架渲染（取代原本的「初始化中…」全螢幕 spinner） -->
  <div class="w-full px-4 py-5 space-y-4">
    <div class="flex gap-2 overflow-x-auto pb-1">
      <div class="skel h-9 w-20 shrink-0 rounded-2xl"></div>
      <div class="skel h-9 w-20 shrink-0 rounded-2xl"></div>
      <div class="skel h-9 w-20 shrink-0 rounded-2xl"></div>
      <div class="skel h-9 w-20 shrink-0 rounded-2xl"></div>
    </div>
    <div class="flex gap-2">
      <div class="skel h-12 flex-1 rounded-2xl"></div>
      <div class="skel h-12 w-20 rounded-2xl"></div>
    </div>
    <div class="space-y-2">
      <div class="skel h-20 w-full rounded-2xl"></div>
      <div class="skel h-20 w-full rounded-2xl"></div>
      <div class="skel h-20 w-full rounded-2xl"></div>
    </div>
  </div>
</main>

<div id="tour-modal" class="modal-bg hidden" onclick="if(event.target===this)closeTourModal()">
  <div class="modal-box afu">
    <div id="tour-modal-body" class="overflow-y-auto flex-1"></div>
  </div>
</div>

<div id="promo-modal" class="modal-bg hidden" onclick="if(event.target===this)closePromoModal()">
  <div class="modal-box afu" style="max-width:860px">
    <div class="p-5 border-b flex justify-between items-center shrink-0">
      <div>
        <h3 class="font-black text-lg text-slate-900">🚀 發送推廣名片</h3>
        <p class="text-xs text-slate-400 mt-0.5" id="promo-subtitle"></p>
      </div>
      <button onclick="closePromoModal()" class="w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">✕</button>
    </div>
    <div class="flex flex-col md:flex-row overflow-hidden flex-1 min-h-0">
      <div class="flex-1 p-5 overflow-y-auto space-y-5">
        <div>
          <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">發送模式</p>
          <div class="flex gap-2">
            <button onclick="setPromoMode('single')"   data-pmode="single"   class="pmode-btn active flex-1 py-2 rounded-xl text-xs font-black transition">單張名片</button>
            <button onclick="setPromoMode('carousel')" data-pmode="carousel" class="pmode-btn flex-1 py-2 rounded-xl text-xs font-black transition">橫向輪播</button>
            <button onclick="setPromoMode('multi')"    data-pmode="multi"    class="pmode-btn flex-1 py-2 rounded-xl text-xs font-black transition">列表多頁</button>
          </div>
        </div>
        <div>
          <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">聯絡按鈕</p>
          <div id="soc-options" class="grid grid-cols-2 gap-2"></div>
        </div>
        <div>
          <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">主按鈕文字</p>
          <input id="cta-text" value="查看行程 / 立即報名"
            class="w-full border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-emerald-500 bg-slate-50" />
        </div>
        <div class="pt-2 border-t space-y-2">
          <button onclick="copyFlexJson()" class="w-full bg-slate-100 hover:bg-slate-200 py-3 rounded-2xl font-bold text-sm transition">📋 複製 Flex JSON</button>
          <button onclick="sendFlex()" id="send-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-2xl font-black text-base shadow-lg transition">🚀 立即分享給好友</button>
        </div>
      </div>
      <div class="w-full md:w-64 shrink-0 bg-[#749cbd] p-4 flex flex-col items-center">
        <p class="text-white/70 text-[10px] font-bold mb-3 uppercase bg-black/20 px-3 py-1 rounded-full">LINE 預覽</p>
        <div id="promo-preview" class="w-full space-y-2 overflow-y-auto"></div>
      </div>
    </div>
  </div>
</div>

<div id="editor-overlay" class="hidden">
  <div class="shrink-0 border-b border-slate-200 px-5 py-3 flex items-center gap-3 flex-wrap bg-white">
    <select id="ed-region" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold outline-none bg-slate-50">
      <option>國旅</option><option>亞洲</option><option>歐洲</option><option>美洲</option><option>大洋洲</option><option>非洲</option>
    </select>
    <input id="ed-days"  type="number" placeholder="天數" class="w-20 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold outline-none bg-slate-50">
    <input id="ed-price" type="number" placeholder="價格" class="w-32 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold text-red-600 outline-none bg-slate-50">
    <div class="ml-auto flex gap-2">
      <button onclick="closeEditor()" class="px-4 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl text-sm">取消</button>
      <button onclick="saveEdit()" id="ed-save-btn" class="px-5 py-2 bg-blue-600 text-white font-black rounded-xl text-sm">✅ 儲存</button>
    </div>
  </div>
  <input id="ed-title" placeholder="行程標題…" class="shrink-0 px-10 py-4 text-2xl font-black outline-none border-b border-slate-100 placeholder:text-slate-300">
  <div class="shrink-0 flex items-center gap-3 px-10 py-2 border-b border-slate-100 bg-slate-50">
    <span class="text-xs font-black text-slate-400 uppercase whitespace-nowrap">封面圖</span>
    <input id="ed-image" placeholder="https://… 貼上圖片 URL" class="flex-1 text-sm outline-none bg-transparent text-slate-600">
    <img id="ed-image-preview" src="" class="w-12 h-8 object-cover rounded hidden">
    <label class="shrink-0 cursor-pointer bg-slate-200 hover:bg-slate-300 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg transition">
      📁 上傳
      <input type="file" accept="image/*" class="hidden" onchange="handleCoverUpload(event)">
    </label>
  </div>
  <div class="shrink-0 flex items-center gap-2 px-10 py-2 border-b border-slate-100 bg-white flex-wrap">
    <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest mr-1">插入</span>
    <button onclick="triggerImgUpload()" class="ed-tool-btn">🖼️ 圖片上傳</button>
    <button onclick="insertImgUrl()" class="ed-tool-btn">🔗 圖片URL</button>
    <input type="file" id="ed-img-file" accept="image/*" class="hidden" onchange="handleEditorImgUpload(event)">
    <button onclick="insertYT()"   class="ed-tool-btn">▶️ YouTube</button>
    <button onclick="insertDay()"  class="ed-tool-btn">📅 新增天</button>
    <button onclick="insertHr()"   class="ed-tool-btn">── 分隔線</button>
    <span id="ed-char-count" class="ml-auto text-xs text-slate-300">0 字</span>
  </div>
  <div class="flex flex-1 overflow-hidden">
    <textarea id="ed-desc" placeholder="第一天 出發！&#10;![圖片](https://...)&#10;&#10;行程描述...&#10;&#10;[youtube:VIDEO_ID]&#10;&#10;第二天 繼續旅程"
      class="flex-1 px-10 py-6 text-base text-slate-700 outline-none resize-none leading-relaxed"
      oninput="updateEditorPreview();document.getElementById('ed-char-count').textContent=this.value.length+' 字'">
    </textarea>
    <div id="ed-preview" class="w-96 shrink-0 overflow-y-auto bg-gray-50 p-6 hidden lg:block border-l border-slate-100">
      <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">即時預覽</p>
      <div id="ed-preview-body"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const WORKER   = 'https://travelkeeper.fangwl591021.workers.dev';
const LIFF_ID  = '2009367829-BDZCGti8';
const REGIONS  = ['所有地區','國旅','亞洲','歐洲','美洲','大洋洲','非洲'];
const REGION_EMOJI = {'所有地區':'🌏','國旅':'🇹🇼','亞洲':'🗺️','歐洲':'🏰','美洲':'🗽','大洋洲':'🦘','非洲':'🦁'};
const SOC_DEFS = [
  {key:'phone',label:'📞 電話',   field:'phone'},
  {key:'line', label:'💬 LINE',   field:'lineLink'},
  {key:'lineAt',label:'🟢 LINE@', field:'lineAtLink'},
  {key:'fb',   label:'👍 Facebook',field:'fbLink'},
  {key:'web',  label:'🌐 網站',   field:'webLink'},
  {key:'map',  label:'📍 地圖',   field:'mapLink'},
  {key:'tg',   label:'✈️ Telegram',field:'tgToken'},
];

let APP = {
  itineraries: [], user: null, orders: [], distStats: null, crmList: [],
  liffProfile: null, searchRegion: '', searchKeyword: '',
  expandedId: null, promoMode: false, promoSelected: new Set(),
  promoFlexMode: 'single', editItem: null, currentTab: 'home',
  // ★ v3：推薦碼相關
  inviteCode: '',     // ?invite=XXXXXX 從 URL 來的（客人視角）
  referrer: null,     // { uid, name } 解析後的推薦人資訊
  myInviteCode: '',   // 業務自己的推薦碼（從 distributorData.inviteCode）
  dataLoading: true,  // 骨架是否還在
};

const $  = id => document.getElementById(id);
const el = (tag, cls='', html='') => { const e = document.createElement(tag); e.className=cls; e.innerHTML=html; return e; };
const fmt = p => '$' + Number(p||0).toLocaleString();
const stripMd = t => String(t||'').replace(/!\[[^\]]*\]\([^)]+\)/g,'').replace(/\[youtube:[^\]]+\]/g,'').trim();
function toast(msg, isErr=false) {
  const t = $('toast'); t.textContent=msg; t.className=isErr?'err show':'show';
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3500);
}
function api(path, opts={}) { return fetch(WORKER+path, { headers:{'Content-Type':'application/json'}, ...opts }).then(r=>r.json()); }

// ★ v3：URL 參數讀取（支援 ?invite= 和舊版 ?ref=）
function readUrlParams() {
  const sp = new URLSearchParams(location.search);
  const invite = (sp.get('invite') || '').trim().toUpperCase();
  if (invite) APP.inviteCode = invite;
}

// ★ v3：解析推薦碼 → 顯示 banner
async function resolveInviteCode() {
  if (!APP.inviteCode) return;
  try {
    const r = await api(`/api/resolve-invite?code=${encodeURIComponent(APP.inviteCode)}`);
    if (r.success && r.data?.uid) {
      APP.referrer = { uid: r.data.uid, name: r.data.name || '夥伴' };
      $('invite-name').textContent = APP.referrer.name;
      $('invite-banner').classList.remove('hidden');
    } else {
      // 推薦碼無效就靜默忽略，不報錯
      APP.inviteCode = '';
    }
  } catch (e) { console.warn('resolveInvite failed:', e); APP.inviteCode = ''; }
}

window.addEventListener('load', async () => {
  // ★ v3：先讀 URL 參數，並行解析推薦碼（不阻塞首頁渲染）
  readUrlParams();
  const inviteTask = resolveInviteCode();

  // 先把骨架渲染掉（其實 main 已經有骨架，這邊不用動）
  // 等 LIFF 起來
  for (let i=0; i<30 && typeof liff==='undefined'; i++) await new Promise(r=>setTimeout(r,200));
  if (typeof liff==='undefined') { renderError('LIFF SDK 載入失敗'); return; }

  try {
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    APP.liffProfile = await liff.getProfile();
  } catch(e) { console.warn('LIFF', e); }

  try {
    const uid  = APP.liffProfile?.userId;
    const data = await api(`/api/app-init${uid ? '?uid='+uid : ''}`);
    if (data.success) {
      APP.itineraries = data.itineraries || [];
      APP.user        = data.user;
      APP.orders      = data.orders || [];
      APP.distStats   = data.distStats;
      APP.crmList     = data.crmList || [];
      // ★ v3：把自己的 inviteCode 撈出來（之後 sendFlex / copyFlex 要用）
      APP.myInviteCode = APP.user?.distributorData?.inviteCode || '';
    }
  } catch(e) { toast('資料讀取失敗','err'); }

  // 確保推薦碼解析也回來了
  await inviteTask;

  APP.dataLoading = false;
  setupNav();
  renderTab('home');
});

function setupNav() {
  const p = APP.liffProfile;
  if (p) {
    $('nav-member').classList.remove('hidden');
    $('nav-avatar').src = p.pictureUrl;
    $('nav-avatar').classList.remove('hidden');
  }
  // ★ v3：管理員 + 已授權上稿的分銷商，都看到「← 儀表板」連結
  if (APP.user?.isAdmin || APP.user?.distributorData?.canUpload) {
    $('nav-dashboard').classList.remove('hidden');
  }
}

function switchTab(tab) {
  APP.currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTab(tab);
}

function renderTab(tab) {
  const m = $('main-content');
  m.innerHTML = '';
  if (tab==='home')   renderHome(m);
  if (tab==='member') renderMember(m);
}

function renderHome(container) {
  const wrap = el('div','w-full px-4 py-5 space-y-4 afu');

  const tagRow = el('div','flex gap-2 overflow-x-auto pb-1');
  tagRow.style.cssText = 'scrollbar-width:none;-webkit-overflow-scrolling:touch';
  REGIONS.forEach(r => {
    const isActive = (r==='所有地區' && !APP.searchRegion) || r===APP.searchRegion;
    const btn = el('button',
      `shrink-0 flex items-center gap-1.5 px-4 py-2 rounded-2xl font-bold text-sm transition whitespace-nowrap border
       ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-400'}`,
      `${REGION_EMOJI[r]} ${r}`);
    btn.onclick = () => { APP.searchRegion = r==='所有地區'?'':r; renderTab('home'); };
    tagRow.appendChild(btn);
  });
  wrap.appendChild(tagRow);

  const searchRow = el('div','flex gap-2');
  const sel = el('select','border-2 border-slate-200 rounded-2xl px-3 py-3 font-bold text-slate-700 outline-none focus:border-blue-500 bg-white text-sm shrink-0');
  REGIONS.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r==='所有地區'?'':r; opt.textContent = r;
    if (opt.value === APP.searchRegion) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = e => { APP.searchRegion = e.target.value; renderTab('home'); };

  const inp = el('input','flex-1 p-3 border-2 border-slate-200 rounded-2xl font-bold outline-none focus:border-blue-500 bg-white text-sm min-w-0');
  inp.placeholder = '搜尋行程名稱…'; inp.value = APP.searchKeyword;
  inp.oninput = e => APP.searchKeyword = e.target.value;
  inp.onkeydown = e => { if(e.key==='Enter') renderTab('home'); };

  const srchBtn = el('button','bg-blue-600 text-white font-black px-5 rounded-2xl hover:bg-blue-700 transition text-sm shrink-0','搜尋');
  srchBtn.onclick = () => renderTab('home');
  searchRow.append(sel, inp, srchBtn);
  wrap.appendChild(searchRow);

  if (APP.liffProfile) {
    const promoBar = el('div',`rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 transition ${APP.promoMode ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-100 shadow-sm'}`);
    const promoLeft = el('div','flex items-center gap-3');
    const promoToggle = el('button',`px-4 py-2 rounded-xl font-black text-sm transition ${APP.promoMode ? 'bg-white text-emerald-700' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`,
      APP.promoMode ? '✕ 取消' : '📤 推廣行程');
    promoToggle.onclick = () => { APP.promoMode = !APP.promoMode; APP.promoSelected.clear(); renderTab('home'); };
    promoLeft.appendChild(promoToggle);
    if (APP.promoMode) {
      promoLeft.appendChild(el('span','font-bold text-sm', APP.promoSelected.size===0 ? '勾選行程（最多8個）' : `已選 ${APP.promoSelected.size} 個`));
    }
    promoBar.appendChild(promoLeft);
    if (APP.promoMode && APP.promoSelected.size > 0) {
      const sendBtn = el('button','bg-white text-emerald-700 font-black px-5 py-2 rounded-xl text-sm hover:bg-emerald-50 transition shadow-sm', `🚀 發送名片 (${APP.promoSelected.size})`);
      sendBtn.onclick = openPromoModal;
      promoBar.appendChild(sendBtn);
    }
    wrap.appendChild(promoBar);
  }

  let items = APP.itineraries;
  if (APP.searchRegion) items = items.filter(i => String(i.region||'').includes(APP.searchRegion));
  if (APP.searchKeyword) items = items.filter(i => String(i.title||'').toLowerCase().includes(APP.searchKeyword.toLowerCase()));

  // ★ v3：資料還在載入時顯示骨架，否則顯示「共 N 個行程」
  if (APP.dataLoading) {
    wrap.appendChild(el('div','skel h-4 w-24 rounded',''));
    const skList = el('div','space-y-2');
    for (let i=0; i<3; i++) skList.appendChild(el('div','skel h-20 w-full rounded-2xl',''));
    wrap.appendChild(skList);
  } else {
    wrap.appendChild(el('p','text-xs font-bold text-slate-400',`共 ${items.length} 個行程`));
    const list = el('div','space-y-2');
    if (items.length===0) {
      list.appendChild(el('div','py-20 text-center text-slate-300 font-bold','沒有符合條件的行程'));
    }
    items.forEach(item => list.appendChild(buildCard(item)));
    wrap.appendChild(list);
  }

  container.appendChild(wrap);
}

function buildCard(item) {
  const id     = String(item.id || item.timestamp || '');
  const isSel  = APP.promoSelected.has(id);
  const isOpen = APP.expandedId === id;

  row.append(thumb, info);
  row.onclick = () => { if(APP.promoMode) return; APP.expandedId = isOpen ? null : id; renderTab('home'); };

  if (isOpen && !APP.promoMode) {
    const expand = el('div','border-t border-slate-100 px-4 pb-4 pt-3 afu');
    expand.appendChild(el('p','text-sm text-slate-600 leading-relaxed line-clamp-4 mb-3',stripMd(item.description)));

  }
  return card;
}

// ★ v3：把當前的 invite/ref 參數帶到下一頁
function buildBookingUrl(itineraryId) {
  const params = new URLSearchParams({ a: 'demo', itinerary: itineraryId });
  // 推薦碼優先（v2+）；舊的 ref 也保留
  if (APP.inviteCode)       params.set('invite', APP.inviteCode);
  else if (APP.referrer?.uid) params.set('ref', APP.referrer.uid);
  // 走 LIFF（讓 booking.html 拿得到 customer LINE UID）
  return `https://liff.line.me/${LIFF_ID}/booking.html?${params.toString()}`;
}

function renderDescTo(container, text) {
  if (!text) return;
  text.split('\n').forEach(line => {
    const imgM = line.match(/^!\[([^\]]*)\]\((https?:\/\/[^)]+)\)$/);
    if (imgM) { const img = document.createElement('img'); img.src=imgM[2]; img.alt=imgM[1]; img.className='w-full rounded-2xl my-3 object-cover aspect-video'; container.appendChild(img); return; }
    const ytM = line.match(/^\[youtube:([A-Za-z0-9_-]{11})\]$/);
    if (ytM) { const wrap=el('div','aspect-video rounded-2xl overflow-hidden my-3 bg-black'); const iframe=document.createElement('iframe'); iframe.src=`https://www.youtube.com/embed/${ytM[1]}`; iframe.className='w-full h-full'; iframe.allowFullscreen=true; wrap.appendChild(iframe); container.appendChild(wrap); return; }
    if (line.trim()==='---') { container.appendChild(el('hr','border-slate-200 my-3')); return; }
    if (/^第.天/.test(line)) { container.appendChild(el('h3','font-black text-slate-900 text-base mt-5 mb-1',line)); return; }
    if (!line.trim()) { container.appendChild(document.createElement('br')); return; }
    container.appendChild(el('p','leading-relaxed text-slate-700 mb-1',line));
  });
}

// ★ v3：複製個人推薦連結
function copyInviteLink() {
  if (!APP.myInviteCode) { toast('尚未取得推薦碼','err'); return; }
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  const url  = `${base}index.html?invite=${APP.myInviteCode}`;
  try {
    navigator.clipboard.writeText(url).then(() => toast('✅ 推薦連結已複製'));
  } catch(e) {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('✅ 推薦連結已複製'); }
    catch(_) { toast('❌ 複製失敗', true); }
    finally { document.body.removeChild(ta); }
  }
}

async function handleCoverUpload(e) {
  const file = e.target.files[0]; if(!file) return;
  const lbl = e.target.parentElement;
  lbl.textContent = '⏳ 上傳中…';
  try {
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const res = await api('/api/upload-image', {
          method: 'POST',
          body: JSON.stringify({ base64: ev.target.result, filename: file.name })
        });
        if (res.success) {
          $('ed-image').value = res.url;
          const prev = $('ed-image-preview');
          prev.src = res.url; prev.classList.remove('hidden');
          updateEditorPreview();
          toast('✅ 封面圖已上傳至 R2');
        } else throw new Error(res.error||'上傳失敗');
      } catch(err) { toast('❌ '+err.message, true); }
      finally { lbl.innerHTML = '📁 上傳<input type="file" accept="image/*" class="hidden" onchange="handleCoverUpload(event)">'; e.target.value=''; }
    };
    reader.readAsDataURL(file);
  } catch(err) { toast('❌ '+err.message, true); }
}

  const items = Array.from(APP.promoSelected).map(id=>APP.itineraries.find(i=>String(i.id||i.timestamp||'')===id)).filter(Boolean);
  const prev  = $('promo-preview'); prev.innerHTML='';
  const mode  = APP.promoFlexMode;
  if (mode==='multi') {
    const box = el('div','bg-white rounded-2xl overflow-hidden shadow-xl');
    box.appendChild(el('div','bg-slate-900 px-4 py-3',`<p class="text-white font-black text-sm">✈️ 精選行程推薦</p><p class="text-slate-400 text-[10px] mt-0.5">共 ${items.length} 個行程</p>`));
    items.forEach((tour,i) => {
      const row = el('div',`flex gap-2 p-3 ${i>0?'border-t border-slate-100':''}`);
      if(tour.image) { const img=document.createElement('img'); img.src=tour.image; img.className='w-16 h-12 object-cover rounded-lg shrink-0'; row.appendChild(img); }
      const txt = el('div','min-w-0 flex flex-col justify-center');
      txt.appendChild(el('p','text-[11px] font-black text-slate-900 line-clamp-2',tour.title));
      txt.appendChild(el('p','text-[10px] text-slate-400 mt-0.5',(tour.region||'')+' · '+tour.days+'天'));
      txt.appendChild(el('p','text-[10px] text-red-600 font-black','TWD '+Number(tour.price).toLocaleString()));
      row.appendChild(txt); box.appendChild(row);
    });
    prev.appendChild(box);
  } else {
    items.forEach(tour => {
      const bub = el('div','bg-white rounded-2xl overflow-hidden shadow-xl mb-2');
      if(tour.image) { const img=document.createElement('img'); img.src=tour.image; img.className='w-full aspect-[20/13] object-cover'; bub.appendChild(img); }
      const body = el('div','p-3 space-y-1');
      body.appendChild(el('p','text-[11px] font-black text-slate-900 line-clamp-2',tour.title));
      body.appendChild(el('p','text-[11px] font-black text-red-600','TWD '+Number(tour.price).toLocaleString()));
      body.appendChild(el('div','bg-[#00B900] text-white text-center py-1.5 rounded-lg text-[10px] font-black mt-1',$('cta-text').value));
      bub.appendChild(body); prev.appendChild(bub);
    });
  }
}

// ════════════════════════════════════════════════════════════
// 修正版 sendFlex：支援新舊 LIFF SDK + 詳細 console log
//   ★ v3：傳 inviteCode 給 worker，URL 同時帶 ref + invite
// ════════════════════════════════════════════════════════════
async function sendFlex() {
  if (!liff.isLoggedIn()) { liff.login({redirectUri:location.href}); return; }
  const btn = $('send-btn'); btn.disabled=true; btn.textContent='組裝中…';

  try {
    const ids       = Array.from(APP.promoSelected);
    const uid       = APP.liffProfile?.userId||'';
    const dist      = APP.user?.distributorData||{};
    const ctaText   = $('cta-text').value;
    const socFields = {};
    SOC_DEFS.forEach(d => {
      const chk = document.getElementById('sc-'+d.key);
      if (chk?.checked) socFields[d.field] = dist[d.field]||'';
    });

    const res = await api('/api/build-flex', {
      method: 'POST',
      body: JSON.stringify({ ids, mode: APP.promoFlexMode, uid, ctaText, socFields, agencySlug: 'demo', inviteCode: APP.myInviteCode })
    });
    if (!res.success) throw new Error(res.error || '組裝失敗');

    console.log('[sendFlex] payload:', JSON.stringify(res.flex, null, 2));

    if (!liff.isApiAvailable('shareTargetPicker')) {
      throw new Error('此環境不支援分享給好友（請從 LINE 內開啟）');
    }

    btn.textContent = '發送中…';

    let result;
    try {
      result = await liff.shareTargetPicker([res.flex]);
      console.log('[sendFlex] shareTargetPicker result:', result);
    } catch (shareErr) {
      console.error('[sendFlex] share error:', shareErr);
      throw shareErr;
    }

    if (result && result.status === 'cancel') {
      toast('使用者取消分享');
    } else {
      toast('✅ 已開啟分享視窗，請確認對方是否收到');
      closePromoModal();
      APP.promoSelected.clear();
      APP.promoMode = false;
      renderTab('home');
    }

  } catch (e) {
    console.error('[sendFlex] error:', e);
    if (e.message?.toLowerCase().includes('not allowed')) {
      if (confirm('⚠️ 需要重新登入以取得分享權限，是否立即重新登入？')) {
        liff.logout();
        location.reload();
      }
    } else {
      toast('❌ ' + (e.message || '發送失敗'), true);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 立即分享給好友';
  }
}

// ════════════════════════════════════════════════════════════
// 修正版 copyFlexJson：加 fallback 解決 NotAllowedError
//   ★ v3：傳 inviteCode 給 worker
// ════════════════════════════════════════════════════════════
async function copyFlexJson() {
  const ids       = Array.from(APP.promoSelected);
  const uid       = APP.liffProfile?.userId||'';
  const dist      = APP.user?.distributorData||{};
  const ctaText   = $('cta-text').value;
  const socFields = {};
  SOC_DEFS.forEach(d => {
    const chk = document.getElementById('sc-'+d.key);
    if (chk?.checked) socFields[d.field] = dist[d.field]||'';
  });
  const res = await api('/api/build-flex', {
    method: 'POST',
    body: JSON.stringify({ ids, mode: APP.promoFlexMode, uid, ctaText, socFields, agencySlug: 'demo', inviteCode: APP.myInviteCode })
  });
  if (!res.success) { toast('組裝失敗','err'); return; }

  const text = JSON.stringify(res.flex, null, 2);

  try {
    if (document.hasFocus() && navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      toast('✅ Flex JSON 已複製');
      return;
    }
  } catch (e) {
    console.warn('clipboard API failed, fallback', e);
  }

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) toast('✅ Flex JSON 已複製');
    else toast('❌ 複製失敗，請手動選取', true);
  } catch (e) {
    console.error('fallback copy failed:', e);
    toast('❌ 複製失敗', true);
  }
}

function showSimpleModal(title, bodyHtml, onConfirm) {
  const overlay = el('div','modal-bg afi');
  overlay.onclick = e => { if(e.target===overlay) document.body.removeChild(overlay); };
  const box = el('div','bg-white rounded-[2rem] w-full p-8 afu space-y-5','');
  box.style.cssText='max-width:480px;max-height:92vh;overflow-y:auto';
  box.appendChild(el('h3','font-black text-xl',title));
  const bodyDiv = el('div','space-y-4'); bodyDiv.innerHTML=bodyHtml; box.appendChild(bodyDiv);
  const row = el('div','flex gap-3 pt-2');
  const cancel=el('button','flex-1 bg-slate-100 py-3 rounded-2xl font-black text-slate-600','取消');
  cancel.onclick=()=>document.body.removeChild(overlay);
  const ok=el('button','flex-[2] bg-emerald-600 text-white py-3 rounded-2xl font-black','儲存');
  ok.onclick=async()=>{ await onConfirm(); document.body.removeChild(overlay); };
  row.append(cancel,ok); box.appendChild(row);
  overlay.appendChild(box); document.body.appendChild(overlay);
}

function renderError(msg) {
  $('main-content').innerHTML=`<div class="flex flex-col items-center justify-center h-64 gap-3"><div class="text-4xl">⚠️</div><p class="font-black text-slate-600">${msg}</p><button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">重新整理</button></div>`;
}
</script>
