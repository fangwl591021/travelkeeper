<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE Channel 設定｜TravelKeeper</title>
  <link rel="stylesheet" href="./css/tenant-line-pages.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./js/tenant-api-client.js"></script>
  <script src="./js/tenant-page-client.js"></script>
  <script src="./js/tenant-line-client.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-3xl px-5 py-8">
    <div class="flex items-start justify-between gap-4">
      <div><p class="text-xs font-black tracking-widest text-emerald-600">LINE MESSAGING API</p><h1 class="mt-2 text-3xl font-black">租戶 Channel 設定</h1><p id="context" class="mt-2 text-sm text-slate-500"></p></div>
      <a id="back" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold">回聊天室監控</a>
    </div>

    <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div id="current" class="rounded-xl bg-slate-50 p-4 text-sm text-slate-600">讀取中…</div>
      <form id="form" class="mt-5 space-y-4">
        <label class="block text-sm font-bold">Channel ID<input id="channel-id" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" required></label>
        <label class="block text-sm font-bold">Bot Basic ID<input id="basic-id" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="@example"></label>
        <label class="block text-sm font-bold">Bot 顯示名稱<input id="display-name" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3"></label>
        <label class="block text-sm font-bold">Channel Secret<input id="channel-secret" type="password" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" autocomplete="new-password" placeholder="已設定時可留空保留原值"></label>
        <label class="block text-sm font-bold">Channel Access Token<textarea id="access-token" rows="5" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" autocomplete="new-password" placeholder="已設定時可留空保留原值"></textarea></label>
        <label class="flex items-center gap-3 rounded-xl border border-slate-200 p-4"><input id="enabled" type="checkbox" class="h-5 w-5"><span class="font-bold">啟用 Webhook</span></label>
        <div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">Webhook URL：<code id="webhook-url" class="break-all"></code><br>Secret 與 Access Token 只會加密保存，頁面不會回讀完整值。</div>
        <button id="save" class="w-full rounded-xl bg-emerald-600 px-5 py-3 font-black text-white">儲存設定</button>
        <p id="status" class="text-sm text-slate-500"></p>
      </form>
    </section>
  </main>
  <script>
  (function(){
    const page=window.TravelKeeperTenantPage, api=window.TravelKeeperTenantLine;
    const q=new URLSearchParams(location.search), el=id=>document.getElementById(id);
    const keep=new URLSearchParams();['tenant','worker','dev_uid'].forEach(k=>{if(q.get(k))keep.set(k,q.get(k))});
    el('back').href=`line-oa-monitor.html?${keep.toString()}`;
    el('webhook-url').textContent=`${page.workerUrl}/api/v2/line/webhook/${page.tenantSlug}`;
    function render(data){
      el('channel-id').value=data.channel_id||'';el('basic-id').value=data.bot_basic_id||'';el('display-name').value=data.bot_display_name||'';el('enabled').checked=!!data.enabled;
      el('current').textContent=data.configured?`已設定｜Secret ${data.channel_secret_masked||''}｜Token ${data.access_token_masked||''}｜${data.enabled?'已啟用':'已停用'}`:'尚未設定 LINE Channel';
    }
    async function init(){
      try{const session=await page.initLiffSession({fallbackLiffId:'2009367829-BDZCGti8',requireContext:true});el('context').textContent=`租戶 ${page.tenantSlug}｜角色 ${session.context?.role||''}`;render((await api.getChannel()).data||{});}
      catch(e){el('status').textContent=page.friendlyError?page.friendlyError(e):e.message;}
    }
    el('form').onsubmit=async e=>{e.preventDefault();el('save').disabled=true;el('status').textContent='儲存中…';try{const payload={channel_id:el('channel-id').value,bot_basic_id:el('basic-id').value,bot_display_name:el('display-name').value,channel_secret:el('channel-secret').value,channel_access_token:el('access-token').value,enabled:el('enabled').checked};const result=await api.saveChannel(payload);render(result.data||{});el('channel-secret').value='';el('access-token').value='';el('status').textContent='已儲存';}catch(err){el('status').textContent=page.friendlyError?page.friendlyError(err):err.message;}finally{el('save').disabled=false;}};
    init();
  })();
  </script>
</body>
</html>
