<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE OA 管理後台 | TravelKeeper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background: #eef3f8; }
    [hidden] { display: none !important; }
    .grid-bg {
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <div class="h-screen flex overflow-hidden">
    <aside class="w-[390px] shrink-0 border-r border-slate-200 bg-white flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-full bg-emerald-500 text-white grid place-items-center font-black text-xl">OA</div>
          <div class="min-w-0">
            <h1 class="text-2xl font-black">LINE OA 管理後台</h1>
            <p class="text-sm text-slate-500 mt-1">監看模式，不自動回覆</p>
          </div>
        </div>
      </div>

      <div id="preview-note" hidden class="mx-4 mt-4 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
        目前是本地預覽模式。要讀取真實聊天室，請使用 GitHub Pages 線上網址並完成 LIFF 登入。
      </div>

      <div class="px-4 py-4 border-b border-slate-200 space-y-4">
        <div>
          <label class="block text-sm font-black mb-2">聊天室搜尋</label>
          <input id="thread-search" class="w-full rounded-full border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="搜尋聊天、用戶名稱、用戶 ID、標籤">
        </div>
        <div class="flex gap-2">
          <button class="thread-filter rounded-full px-4 py-2 bg-slate-900 text-white text-sm font-black" data-filter="all">全部</button>
          <button class="thread-filter rounded-full px-4 py-2 bg-slate-100 text-slate-700 text-sm font-black" data-filter="open">待回覆</button>
          <button class="thread-filter rounded-full px-4 py-2 bg-slate-100 text-slate-700 text-sm font-black" data-filter="risk">高風險</button>
        </div>
      </div>

      <div id="thread-list" class="flex-1 overflow-y-auto p-3 pb-24 space-y-3"></div>

      <div class="border-t border-slate-200 bg-white">
        <button id="tools-toggle" type="button" class="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 transition">
          <div class="text-left">
            <p class="font-black text-sm text-slate-900">工具與手動匯入</p>
            <p class="text-xs text-slate-500 mt-1">平常收在底部，需要時再展開</p>
          </div>
          <span id="tools-toggle-label" class="text-slate-400 text-sm font-black">展開</span>
        </button>
        <div id="tools-panel" hidden class="px-4 pb-4 space-y-4 border-t border-slate-100 bg-slate-50/80">
          <div>
            <label class="block text-sm font-black mb-2">監看 Worker API</label>
            <input class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm bg-white text-slate-600" value="https://travelkeeper-worker.fangwl591021.workers.dev" readonly>
          </div>
          <div>
            <label class="block text-sm font-black mb-2">匯入名稱</label>
            <input id="import-title" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500 bg-white" placeholder="例如：2026-05-09 LINE OA 對話匯入">
          </div>
          <div>
            <label class="block text-sm font-black mb-2">匯入聊天室</label>
            <input id="import-file" type="file" accept=".txt,.json,.csv,.log,.md" class="block w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm bg-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button id="import-read" class="rounded-2xl bg-slate-100 text-slate-700 font-black py-3 hover:bg-slate-200">讀取檔案</button>
            <button id="import-save" class="rounded-2xl bg-emerald-500 text-white font-black py-3 hover:bg-emerald-600">匯入聊天室</button>
          </div>
          <textarea id="import-text" rows="5" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500 bg-white" placeholder="貼上對話紀錄後，可手動匯入成單一聊天室。這是輔助工具，不影響真實 webhook。"></textarea>
        </div>
      </div>
    </aside>

    <main class="min-w-0 flex-1 flex flex-col bg-white border-r border-slate-200">
      <div id="chat-empty" class="flex-1 grid place-items-center text-slate-400 font-black text-xl px-8 text-center">
        尚未選擇聊天室，或目前沒有任何真實對話可顯示。
      </div>

      <div id="chat-view" hidden class="flex-1 flex flex-col min-h-0">
        <div class="px-6 py-4 border-b border-slate-200 flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 id="chat-name" class="text-3xl font-black truncate"></h2>
              <span id="chat-risk-pill" class="px-3 py-1 rounded-full text-xs font-black bg-slate-100 text-slate-600">低風險</span>
            </div>
            <p id="chat-meta" class="text-sm text-slate-500 mt-2"></p>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <button id="mark-open" class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black">待處理</button>
            <button id="mark-pending" class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black">建議中</button>
            <button id="mark-closed" class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black">處理完畢</button>
          </div>
        </div>

        <div class="px-6 py-3 bg-slate-600 text-white text-sm font-bold">
          這裡只做監看、標註與建議回覆，不直接干擾目前真實客服回覆流程。
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto bg-slate-300/80 grid-bg px-6 py-6 space-y-4"></div>

        <div class="border-t border-slate-200 bg-white px-4 py-3">
          <div id="reply-suggestions" class="flex flex-wrap gap-3 mb-4"></div>
          <div class="flex items-end gap-3">
            <button class="w-11 h-11 rounded-full border border-slate-300 bg-white text-xl text-slate-500">☺</button>
            <button class="w-11 h-11 rounded-full border border-slate-300 bg-white text-xl text-slate-500">📎</button>
            <button class="w-11 h-11 rounded-full border border-slate-300 bg-white text-2xl text-slate-500">＋</button>
            <textarea id="draft-reply" rows="2" class="flex-1 rounded-3xl border border-slate-200 px-4 py-3 text-base outline-none focus:border-emerald-500" placeholder="AI 建議回覆會放在這裡，方便人工複製後貼回 LINE OA。"></textarea>
            <button id="copy-reply" class="rounded-2xl bg-emerald-500 text-white font-black px-6 py-3 hover:bg-emerald-600">複製</button>
          </div>
        </div>
      </div>
    </main>

    <aside class="w-[380px] shrink-0 bg-white flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="text-2xl font-black">AI 助理</h2>
            <p class="text-sm text-slate-500 mt-1">僅提供管理員參考</p>
          </div>
          <span id="status-chip" class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-black">監看中</span>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <p class="text-xl font-black">最新建議回覆</p>
            <span id="suggestion-count" class="text-slate-500 font-black">0</span>
          </div>
          <div id="suggestion-list" class="space-y-3"></div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <p class="text-xl font-black">對話標籤</p>
            <span id="thread-status-badge" class="px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-700">待回覆</span>
          </div>
          <div id="thread-tags" class="flex flex-wrap gap-2 mb-3"></div>
          <div class="flex gap-2">
            <input id="custom-tag" class="flex-1 rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="新增自訂標籤">
            <button id="add-tag" class="rounded-2xl bg-emerald-500 text-white font-black px-5 py-3 hover:bg-emerald-600">新增</button>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <p class="text-xl font-black mb-3">備註</p>
          <textarea id="internal-note" rows="5" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="內部備註，不會送給用戶。"></textarea>
          <button id="save-thread-meta" class="mt-3 w-full rounded-2xl bg-slate-900 text-white font-black py-3 hover:bg-slate-800">儲存備註與標籤</button>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <p class="text-xl font-black">重要訊息通報</p>
            <span id="risk-count" class="text-slate-500 font-black">0</span>
          </div>
          <div id="risk-summary" class="text-sm text-slate-600 leading-7">
            尚未選擇聊天室。
          </div>
        </section>
      </div>
    </aside>
  </div>

  <div id="toast" hidden class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-black shadow-2xl"></div>

  <script>
    const WORKER_URL = 'https://travelkeeper-worker.fangwl591021.workers.dev';
    const LIFF_ID = '2009367829-BDZCGti8';
    const NEGATIVE_KEYWORDS = ['退費', '退款', '客訴', '負評', '生氣', '失望', '取消', '抱怨', '投訴', '不滿'];
    const URGENT_KEYWORDS = ['緊急', '立刻', '馬上', '現在', '危險', '出事', '失聯', '找不到'];

    let profile = null;
    let userStatus = null;
    let currentFilter = 'all';
    let allThreads = [];
    let activeThreadId = '';

    const threadListEl = document.getElementById('thread-list');
    const threadSearchEl = document.getElementById('thread-search');
    const chatEmptyEl = document.getElementById('chat-empty');
    const chatViewEl = document.getElementById('chat-view');
    const chatNameEl = document.getElementById('chat-name');
    const chatMetaEl = document.getElementById('chat-meta');
    const chatRiskPillEl = document.getElementById('chat-risk-pill');
    const chatMessagesEl = document.getElementById('chat-messages');
    const suggestionListEl = document.getElementById('suggestion-list');
    const suggestionCountEl = document.getElementById('suggestion-count');
    const threadTagsEl = document.getElementById('thread-tags');
    const threadStatusBadgeEl = document.getElementById('thread-status-badge');
    const riskSummaryEl = document.getElementById('risk-summary');
    const riskCountEl = document.getElementById('risk-count');
    const internalNoteEl = document.getElementById('internal-note');
    const customTagEl = document.getElementById('custom-tag');
    const panelDraftEl = document.getElementById('draft-reply');
    const previewNoteEl = document.getElementById('preview-note');
    const importTitleEl = document.getElementById('import-title');
    const importFileEl = document.getElementById('import-file');
    const importTextEl = document.getElementById('import-text');
    const toolsPanelEl = document.getElementById('tools-panel');
    const toolsToggleLabelEl = document.getElementById('tools-toggle-label');

    function showToast(message, type = 'success') {
      const el = document.getElementById('toast');
      el.hidden = false;
      el.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-black shadow-2xl ' +
        (type === 'error' ? 'bg-red-500' : 'bg-emerald-500');
      el.textContent = message;
      setTimeout(() => { el.hidden = true; }, 2400);
    }

    function riskLabel(risk) {
      if (risk === 'high') return '高風險';
      if (risk === 'medium') return '中風險';
      return '低風險';
    }

    function riskClass(risk) {
      if (risk === 'high') return 'bg-rose-100 text-rose-700';
      if (risk === 'medium') return 'bg-amber-100 text-amber-700';
      return 'bg-emerald-100 text-emerald-700';
    }

    function statusLabel(status) {
      if (status === 'open') return '待回覆';
      if (status === 'pending') return '建議中';
      return '處理完畢';
    }

    function statusClass(status) {
      if (status === 'open') return 'bg-amber-100 text-amber-700';
      if (status === 'pending') return 'bg-blue-100 text-blue-700';
      return 'bg-slate-200 text-slate-700';
    }

    function formatTime(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function buildSuggestions(thread) {
      const haystack = (thread.messages || []).map(m => m.text || '').join('\n');
      const suggestions = [];
      if (/(價格|多少|費用|報價|預算|付款)/.test(haystack)) {
        suggestions.push('您好，這邊先幫您整理價格與付款方式，若方便的話我也可以再幫您確認最近可報名的日期。');
      }
      if (/(接送|集合|機場|飯店|時間)/.test(haystack)) {
        suggestions.push('收到，這題會影響旅程安排，我建議先確認出發日、集合地點與人數，再一次回覆完整資訊。');
      }
      if (NEGATIVE_KEYWORDS.some(k => haystack.includes(k)) || URGENT_KEYWORDS.some(k => haystack.includes(k))) {
        suggestions.push('先向您說明造成不便很抱歉，我們會立刻協助確認目前狀況，請先提供訂單資訊或出發日期，我們會優先處理。');
      }
      if (!suggestions.length) {
        suggestions.push('您好，收到您的訊息了，我們正在幫您確認最合適的行程與安排，稍後會整理後回覆您。');
      }
      return suggestions.slice(0, 3);
    }

    function getFilteredThreads() {
      const keyword = String(threadSearchEl.value || '').trim();
      return allThreads.filter(item => {
        if (currentFilter === 'open' && item.status !== 'open') return false;
        if (currentFilter === 'risk' && item.risk !== 'high') return false;
        if (!keyword) return true;
        const haystack = [item.name, item.userId, item.summary, item.assignedTo, ...(item.tags || [])].join(' ');
        return haystack.includes(keyword);
      });
    }

    async function readImportFile() {
      const file = importFileEl.files && importFileEl.files[0];
      if (!file) {
        showToast('請先選擇檔案', 'error');
        return;
      }
      const text = await file.text();
      importTextEl.value = text;
      if (!importTitleEl.value.trim()) {
        importTitleEl.value = file.name.replace(/\.[^.]+$/, '');
      }
      showToast('已載入檔案內容');
    }

    function syncToolsPanel() {
      toolsToggleLabelEl.textContent = toolsPanelEl.hidden ? '展開' : '收合';
    }

    function saveImportedThread() {
      const text = String(importTextEl.value || '').trim();
      if (!text) {
        showToast('請先貼上或讀取對話內容', 'error');
        return;
      }
      const title = importTitleEl.value.trim() || `手動匯入 ${new Date().toLocaleString('zh-TW')}`;
      const imported = {
        id: `manual:${Date.now()}`,
        name: title,
        userId: 'manual-import',
        summary: text.split('\n').find(Boolean) || '',
        unread: 0,
        risk: NEGATIVE_KEYWORDS.some(k => text.includes(k)) || URGENT_KEYWORDS.some(k => text.includes(k)) ? 'medium' : 'low',
        status: 'pending',
        assignedTo: '',
        tags: ['手動匯入'],
        note: '',
        lastMessageAt: new Date().toISOString(),
        messages: text.split('\n').filter(Boolean).map((line, index) => ({
          id: `manual-msg-${Date.now()}-${index}`,
          type: 'text',
          senderRole: 'user',
          senderId: 'manual-import',
          senderName: '匯入對話',
          text: line,
          createdAt: new Date(Date.now() + index * 60000).toISOString(),
        })),
      };
      allThreads = [imported, ...allThreads];
      activeThreadId = imported.id;
      importTitleEl.value = '';
      importTextEl.value = '';
      importFileEl.value = '';
      renderThreadList();
      renderActiveThread(imported);
      showToast('已匯入單一聊天室供人工檢視');
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      let data = null;
      try { data = await res.json(); } catch (_err) {}
      if (!res.ok || !data?.success) {
        throw new Error(data?.error || `HTTP ${res.status}`);
      }
      return data;
    }

    async function loadThreads() {
      const data = await fetchJson(`${WORKER_URL}/api/line-oa/threads?uid=${encodeURIComponent(profile.userId)}`);
      allThreads = Array.isArray(data.data) ? data.data : [];
      if (!activeThreadId && allThreads.length) activeThreadId = allThreads[0].id;
      renderThreadList();
      if (activeThreadId) await loadThreadDetail(activeThreadId);
      else renderActiveThread(null);
    }

    async function loadThreadDetail(threadId) {
      const data = await fetchJson(`${WORKER_URL}/api/line-oa/thread?uid=${encodeURIComponent(profile.userId)}&id=${encodeURIComponent(threadId)}`);
      const thread = data.data;
      const idx = allThreads.findIndex(item => item.id === thread.id);
      if (idx >= 0) allThreads[idx] = { ...allThreads[idx], ...thread };
      activeThreadId = thread.id;
      renderThreadList();
      renderActiveThread(thread);
    }

    function renderThreadList() {
      const rows = getFilteredThreads();
      threadListEl.innerHTML = '';
      if (!rows.length) {
        threadListEl.innerHTML = '<div class="rounded-3xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-400 font-bold">目前還沒有真實聊天室資料。</div>';
        return;
      }
      rows.forEach(item => {
        const active = activeThreadId === item.id;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `w-full text-left rounded-3xl border px-4 py-4 transition ${active ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white hover:bg-slate-50'}`;
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-14 h-14 rounded-full ${active ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-100 text-slate-700'} grid place-items-center font-black text-xl shrink-0">
              ${String(item.name || '?').trim().slice(0, 1)}
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="font-black text-lg truncate">${item.name || '未命名聊天室'}</p>
                  <p class="text-xs text-slate-400 truncate mt-0.5">${item.userId || ''}</p>
                </div>
                <p class="text-xs text-slate-400 shrink-0">${formatTime(item.lastMessageAt)}</p>
              </div>
              <p class="text-sm text-slate-600 mt-2 line-clamp-3">${item.summary || ''}</p>
              <div class="flex flex-wrap gap-2 mt-3">
                <span class="px-3 py-1 rounded-full text-xs font-black ${statusClass(item.status)}">${statusLabel(item.status)}</span>
                <span class="px-3 py-1 rounded-full text-xs font-black ${riskClass(item.risk)}">${riskLabel(item.risk)}</span>
                ${Number(item.unread || 0) > 0 ? `<span class="px-3 py-1 rounded-full text-xs font-black bg-slate-900 text-white">${item.unread} 則</span>` : ''}
              </div>
            </div>
          </div>
        `;
        card.addEventListener('click', () => { loadThreadDetail(item.id).catch(err => showToast(err.message, 'error')); });
        threadListEl.appendChild(card);
      });
    }

    function renderSuggestions(thread) {
      suggestionListEl.innerHTML = '';
      const suggestions = buildSuggestions(thread);
      suggestionCountEl.textContent = suggestions.length;
      suggestions.forEach((text, idx) => {
        const card = document.createElement('div');
        card.className = 'rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-4';
        card.innerHTML = `
          <div class="flex items-center justify-between gap-3 mb-2">
            <p class="font-black">建議回覆 ${idx + 1}</p>
            <button class="copy-suggestion text-sm font-black text-emerald-700" data-text="${encodeURIComponent(text)}">複製</button>
          </div>
          <p class="text-sm leading-7 text-slate-700">${text}</p>
        `;
        suggestionListEl.appendChild(card);
      });
      suggestionListEl.querySelectorAll('.copy-suggestion').forEach(button => {
        button.addEventListener('click', async () => {
          const text = decodeURIComponent(button.getAttribute('data-text') || '');
          try {
            await navigator.clipboard.writeText(text);
            panelDraftEl.value = text;
            showToast('已複製建議回覆');
          } catch (_err) {
            showToast('複製失敗', 'error');
          }
        });
      });
      panelDraftEl.value = suggestions[0] || '';
    }

    function renderTags(thread) {
      threadTagsEl.innerHTML = '';
      (thread?.tags || []).forEach(tag => {
        const pill = document.createElement('span');
        pill.className = 'px-3 py-1 rounded-full bg-slate-100 text-slate-700 text-sm font-black';
        pill.textContent = tag;
        threadTagsEl.appendChild(pill);
      });
      threadStatusBadgeEl.className = `px-3 py-1 rounded-full text-xs font-black ${statusClass(thread?.status || 'open')}`;
      threadStatusBadgeEl.textContent = statusLabel(thread?.status || 'open');
    }

    function renderActiveThread(thread) {
      if (!thread) {
        chatViewEl.hidden = true;
        chatEmptyEl.hidden = false;
        suggestionListEl.innerHTML = '';
        threadTagsEl.innerHTML = '';
        suggestionCountEl.textContent = '0';
        riskSummaryEl.textContent = '尚未選擇聊天室。';
        riskCountEl.textContent = '0';
        internalNoteEl.value = '';
        panelDraftEl.value = '';
        return;
      }

      chatViewEl.hidden = false;
      chatEmptyEl.hidden = true;
      chatNameEl.textContent = thread.name || '未命名聊天室';
      chatMetaEl.textContent = `共 ${thread.messages.length} 則訊息・用戶 ID ${thread.userId || ''}`;
      chatRiskPillEl.className = `px-3 py-1 rounded-full text-xs font-black ${riskClass(thread.risk || 'low')}`;
      chatRiskPillEl.textContent = riskLabel(thread.risk || 'low');
      chatMessagesEl.innerHTML = '';

      (thread.messages || []).forEach(msg => {
        const side = msg.senderRole === 'user' ? 'left' : 'right';
        const row = document.createElement('div');
        row.className = `flex ${side === 'right' ? 'justify-end' : 'justify-start'}`;
        row.innerHTML = `
          <div class="max-w-[72%] bg-white text-slate-900 border ${side === 'right' ? 'border-emerald-200' : 'border-slate-200'} rounded-[24px] px-5 py-4 shadow-sm">
            <p class="font-black text-xs text-slate-400 mb-2">${msg.senderName || (side === 'left' ? '用戶' : '客服')}</p>
            <p class="font-bold leading-7 whitespace-pre-wrap">${msg.text || ''}</p>
            <p class="text-xs text-slate-500 mt-3">${formatTime(msg.createdAt)}</p>
          </div>
        `;
        chatMessagesEl.appendChild(row);
      });

      renderSuggestions(thread);
      renderTags(thread);

      const merged = (thread.messages || []).map(msg => msg.text || '').join('\n');
      const hits = [
        ...NEGATIVE_KEYWORDS.filter(k => merged.includes(k)),
        ...URGENT_KEYWORDS.filter(k => merged.includes(k)),
      ];
      const uniqueHits = [...new Set(hits)];
      riskCountEl.textContent = String(uniqueHits.length);
      riskSummaryEl.textContent = uniqueHits.length
        ? `偵測到關鍵字：${uniqueHits.join('、')}。建議先由人工確認上下文，再決定是否升級處理。`
        : '目前未偵測到高風險關鍵字。';
      internalNoteEl.value = thread.note || '';
    }

    async function updateThreadMeta(patch) {
      const threadId = activeThreadId;
      if (!threadId) return;
      const result = await fetchJson(`${WORKER_URL}/api/line-oa/thread`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: profile.userId, id: threadId, ...patch }),
      });
      const updated = result.data;
      const idx = allThreads.findIndex(item => item.id === updated.id);
      if (idx >= 0) allThreads[idx] = { ...allThreads[idx], ...updated };
      renderThreadList();
      renderActiveThread(updated);
      showToast('已更新聊天室設定');
    }

    document.querySelectorAll('.thread-filter').forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter || 'all';
        document.querySelectorAll('.thread-filter').forEach(btn => {
          btn.className = 'thread-filter rounded-full px-4 py-2 bg-slate-100 text-slate-700 text-sm font-black';
        });
        button.className = 'thread-filter rounded-full px-4 py-2 bg-slate-900 text-white text-sm font-black';
        renderThreadList();
      });
    });

    threadSearchEl.addEventListener('input', renderThreadList);

    document.getElementById('copy-reply').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(panelDraftEl.value || '');
        showToast('已複製回覆草稿');
      } catch (_err) {
        showToast('複製失敗', 'error');
      }
    });

    document.getElementById('tools-toggle').addEventListener('click', () => {
      toolsPanelEl.hidden = !toolsPanelEl.hidden;
      syncToolsPanel();
    });

    document.getElementById('import-read').addEventListener('click', () => {
      readImportFile().catch(err => showToast(err.message, 'error'));
    });

    document.getElementById('import-save').addEventListener('click', saveImportedThread);

    document.getElementById('save-thread-meta').addEventListener('click', () => {
      const active = allThreads.find(item => item.id === activeThreadId);
      updateThreadMeta({
        note: internalNoteEl.value,
        tags: active?.tags || [],
      }).catch(err => showToast(err.message, 'error'));
    });

    document.getElementById('add-tag').addEventListener('click', () => {
      const tag = customTagEl.value.trim();
      if (!tag) return;
      const active = allThreads.find(item => item.id === activeThreadId);
      const tags = [...new Set([...(active?.tags || []), tag])];
      customTagEl.value = '';
      updateThreadMeta({ note: internalNoteEl.value, tags }).catch(err => showToast(err.message, 'error'));
    });

    document.getElementById('mark-open').addEventListener('click', () => updateThreadMeta({ status: 'open', note: internalNoteEl.value, tags: (allThreads.find(item => item.id === activeThreadId)?.tags || []) }).catch(err => showToast(err.message, 'error')));
    document.getElementById('mark-pending').addEventListener('click', () => updateThreadMeta({ status: 'pending', note: internalNoteEl.value, tags: (allThreads.find(item => item.id === activeThreadId)?.tags || []) }).catch(err => showToast(err.message, 'error')));
    document.getElementById('mark-closed').addEventListener('click', () => updateThreadMeta({ status: 'closed', note: internalNoteEl.value, tags: (allThreads.find(item => item.id === activeThreadId)?.tags || []) }).catch(err => showToast(err.message, 'error')));

    async function init() {
      if (location.protocol === 'file:') {
        previewNoteEl.hidden = false;
        threadListEl.innerHTML = '<div class="rounded-3xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-400 font-bold">本地模式不載入真實聊天室，請改用線上網址測試。</div>';
        return;
      }

      await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      profile = await liff.getProfile();
      userStatus = await fetchJson(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${encodeURIComponent(profile.userId)}`);
      if (!userStatus?.data?.isAdmin) {
        threadListEl.innerHTML = '<div class="rounded-3xl border border-dashed border-rose-300 bg-rose-50 p-8 text-center text-rose-500 font-bold">只有管理員可以使用這個監看頁。</div>';
        return;
      }
      await loadThreads();
    }

    init().catch(err => {
      threadListEl.innerHTML = `<div class="rounded-3xl border border-dashed border-rose-300 bg-rose-50 p-8 text-center text-rose-500 font-bold">${err.message}</div>`;
    });

    syncToolsPanel();
  </script>
</body>
</html>
