<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 官方帳號聊天室監看台 | TravelKeeper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, Arial, sans-serif; background: #eef3f8; }
    [hidden] { display: none !important; }
    .grid-bg {
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <div class="h-screen flex overflow-hidden">
    <aside class="w-[360px] shrink-0 border-r border-slate-200 bg-white flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-full bg-emerald-500 text-white grid place-items-center font-black text-xl">OA</div>
          <div>
            <h1 class="text-2xl font-black">LINE OA 管理後台</h1>
            <p class="text-sm text-slate-500 mt-1">監看模式，不自動回覆</p>
          </div>
        </div>
      </div>

      <div class="px-4 py-4 border-b border-slate-200 space-y-4">
        <div>
          <label class="block text-sm font-black mb-2">監看 Worker API</label>
          <input id="worker-url" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm bg-slate-50" value="https://travelkeeper-worker.fangwl591021.workers.dev" readonly>
        </div>
        <div>
          <label class="block text-sm font-black mb-2">匯入名稱</label>
          <input id="import-title" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="例如：2026-05-09 LINE OA 對話匯入">
        </div>
        <div>
          <label class="block text-sm font-black mb-2">匯入聊天檔</label>
          <input id="import-file" type="file" accept=".txt,.json,.csv,.log,.md" class="block w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm bg-white">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="import-read" class="rounded-2xl bg-slate-100 text-slate-700 font-black py-3 hover:bg-slate-200">讀取檔案</button>
          <button id="import-sample" class="rounded-2xl bg-slate-100 text-slate-700 font-black py-3 hover:bg-slate-200">載入範例</button>
        </div>
        <textarea id="import-text" rows="5" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="貼上 LINE 官方帳號聊天內容，例如：&#10;[09:21] 客人：請問集合地點在哪裡？&#10;[09:22] 客服：您好，我先幫您確認。"></textarea>
        <button id="import-save" class="w-full rounded-2xl bg-emerald-500 text-white font-black py-3 hover:bg-emerald-600">匯入聊天室</button>
        <p class="text-xs text-slate-500">目前聊天室數 <span id="thread-count-inline" class="font-black">0</span> 筆</p>
      </div>

      <div class="px-4 py-4 border-b border-slate-200 space-y-3">
        <input id="thread-search" class="w-full rounded-full border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="搜尋聊天、用戶名稱、用戶 ID、分類、標籤">
        <div class="flex gap-2">
          <button class="thread-filter rounded-full px-4 py-2 bg-slate-900 text-white text-sm font-black" data-filter="all">全部</button>
          <button class="thread-filter rounded-full px-4 py-2 bg-slate-100 text-slate-700 text-sm font-black" data-filter="open">待回覆</button>
          <button class="thread-filter rounded-full px-4 py-2 bg-slate-100 text-slate-700 text-sm font-black" data-filter="risk">高風險</button>
        </div>
      </div>

      <div id="thread-list" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
    </aside>

    <main class="min-w-0 flex-1 flex flex-col bg-white border-r border-slate-200">
      <div id="chat-empty" class="flex-1 grid place-items-center text-slate-400 font-black text-xl">
        請先從左側選擇一筆聊天室
      </div>

      <div id="chat-view" hidden class="flex-1 flex flex-col min-h-0">
        <div class="px-6 py-4 border-b border-slate-200 flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <h2 id="chat-name" class="text-3xl font-black"></h2>
              <span class="text-slate-400">🔊</span>
            </div>
            <p id="chat-meta" class="text-sm text-slate-500 mt-2"></p>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <button class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black">待處理</button>
            <button class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black">處理完畢</button>
            <button class="px-5 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-black">搜尋</button>
          </div>
        </div>

        <div class="px-6 py-3 bg-slate-600 text-white text-sm font-bold">
          手動聊天模式，可在本頁統一回覆策略、整理重點與監看風險。
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto bg-slate-300/80 grid-bg px-6 py-6 space-y-4"></div>

        <div class="border-t border-slate-200 bg-white px-4 py-3">
          <div id="reply-suggestions" class="flex flex-wrap gap-3 mb-4"></div>
          <div class="flex items-end gap-3">
            <button class="w-11 h-11 rounded-full border border-slate-300 bg-white text-xl text-slate-500">☺</button>
            <button class="w-11 h-11 rounded-full border border-slate-300 bg-white text-xl text-slate-500">📎</button>
            <button class="w-11 h-11 rounded-full border border-slate-300 bg-white text-2xl text-slate-500">＋</button>
            <textarea id="draft-reply" rows="2" class="flex-1 rounded-3xl border border-slate-200 px-4 py-3 text-base outline-none focus:border-emerald-500" placeholder="輸入回覆草稿（目前僅示意，不會真的送出）"></textarea>
            <button id="copy-reply" class="rounded-2xl bg-emerald-500 text-white font-black px-6 py-3 hover:bg-emerald-600">複製</button>
          </div>
        </div>
      </div>
    </main>

    <aside class="w-[360px] shrink-0 bg-white flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="text-2xl font-black">AI 助理</h2>
            <p class="text-sm text-slate-500 mt-1">僅提供管理員參考</p>
          </div>
          <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-black">建議中</span>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <p class="text-xl font-black">最新建議回覆</p>
            <span id="suggestion-count" class="text-slate-500 font-black">0</span>
          </div>
          <div id="suggestion-list" class="space-y-3"></div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <p class="text-xl font-black">對話標籤</p>
            <span id="thread-status-badge" class="px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-700">待回覆</span>
          </div>
          <div id="thread-tags" class="flex flex-wrap gap-2 mb-3"></div>
          <div class="flex gap-2">
            <input id="custom-tag" class="flex-1 rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="新增自訂標籤">
            <button id="add-tag" class="rounded-2xl bg-emerald-500 text-white font-black px-5 py-3 hover:bg-emerald-600">新增</button>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <p class="text-xl font-black mb-3">備註</p>
          <textarea id="internal-note" rows="5" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="內部備註，不會發送給用戶"></textarea>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <p class="text-xl font-black">重要訊息通報</p>
            <span id="risk-count" class="text-slate-500 font-black">0</span>
          </div>
          <div id="risk-summary" class="text-sm text-slate-600 leading-7 mb-4">目前尚未選擇聊天室。</div>
          <button class="w-full rounded-2xl bg-emerald-500 text-white font-black py-3 hover:bg-emerald-600">送出</button>
        </section>
      </div>
    </aside>
  </div>

  <div id="toast" hidden class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-black shadow-2xl"></div>

  <script>
    const previewThreads = [
      {
        id: 't1',
        name: '黃淑玲',
        userId: 'U05447e01e81b153b7613de49d49996a7',
        summary: '保健產品',
        source: 'LINE OA',
        assignedTo: 'Tonyfang',
        unread: 1,
        risk: 'medium',
        status: 'open',
        tags: ['產品問題', '待回覆'],
        note: '',
        suggestions: [
          '您好，感謝您的詢問。請問您需要了解哪一款產品的詳細資訊呢？我們有多種產品可以介紹。',
          '如果您有特定的保健需求或疑問，歡迎告訴我們，我們將為您提供詳細說明與建議。'
        ],
        messages: [
          { at: '05/08 下午07:04', from: '黃淑玲', text: '保健產品', side: 'left' }
        ]
      },
      {
        id: 't2',
        name: 'U322f7a26cf8ae9ff6c739149d555acb1',
        userId: 'U322f7a26cf8ae9ff6c739149d555acb1',
        summary: '行政問題',
        source: 'LINE OA',
        assignedTo: 'Tonyfang',
        unread: 2,
        risk: 'high',
        status: 'open',
        tags: ['行政問題', '待回覆', '負評'],
        note: '',
        suggestions: [
          '您好，抱歉讓您久等了，我先幫您確認目前的處理進度，稍後給您明確答覆。',
          '我理解您現在比較著急，我這邊會優先協助您釐清問題，並在最短時間內回覆。'
        ],
        messages: [
          { at: '05/09 下午07:27', from: '客人', text: '我剛剛一直找不到人，這樣處理很慢。', side: 'left' },
          { at: '05/09 下午07:29', from: '客服', text: '收到，我現在先幫您確認是哪一段卡住。', side: 'right' },
          { at: '05/09 下午07:31', from: '客人', text: '這樣真的讓人有點不滿。', side: 'left' }
        ]
      },
      {
        id: 't3',
        name: 'Tonyfang',
        userId: 'Udb7c5578b402bf6f1e0f7065fc57c17b',
        summary: '齊爾諾的核心成分為左旋精胺酸（L-Argini...',
        source: 'LINE OA',
        assignedTo: 'Amy',
        unread: 0,
        risk: 'low',
        status: 'closed',
        tags: ['會員', '處理完畢'],
        note: '',
        suggestions: [
          '目前對話已處理完畢，可保持簡短追蹤即可。'
        ],
        messages: [
          { at: '05/07 下午01:24', from: 'Tonyfang', text: '齊爾諾的核心成分為左旋精胺酸（L-Arginine）嗎？', side: 'left' },
          { at: '05/07 下午01:25', from: '客服', text: '是的，我幫您整理一下產品資訊。', side: 'right' }
        ]
      }
    ];

    const NEGATIVE_KEYWORDS = ['退款', '投訴', '生氣', '失望', '取消', '差', '延遲', '問題', '不滿', '延誤'];
    const URGENT_KEYWORDS = ['現在', '緊急', '立即', '馬上', '今天'];

    let allThreads = [];
    let activeThreadId = '';
    let currentFilter = 'all';

    const threadListEl = document.getElementById('thread-list');
    const threadSearchEl = document.getElementById('thread-search');
    const chatEmptyEl = document.getElementById('chat-empty');
    const chatViewEl = document.getElementById('chat-view');
    const chatNameEl = document.getElementById('chat-name');
    const chatMetaEl = document.getElementById('chat-meta');
    const chatMessagesEl = document.getElementById('chat-messages');
    const suggestionListEl = document.getElementById('suggestion-list');
    const suggestionCountEl = document.getElementById('suggestion-count');
    const threadTagsEl = document.getElementById('thread-tags');
    const threadStatusBadgeEl = document.getElementById('thread-status-badge');
    const riskSummaryEl = document.getElementById('risk-summary');
    const riskCountEl = document.getElementById('risk-count');
    const internalNoteEl = document.getElementById('internal-note');
    const panelDraftEl = document.getElementById('draft-reply');
    const copyReplyBtn = document.getElementById('copy-reply');
    const customTagEl = document.getElementById('custom-tag');

    function showToast(message, type = 'success') {
      const el = document.getElementById('toast');
      el.hidden = false;
      el.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-black shadow-2xl ' +
        (type === 'error' ? 'bg-red-500' : 'bg-emerald-500');
      el.textContent = message;
      setTimeout(() => { el.hidden = true; }, 2400);
    }

    function getStoredThreads() {
      try {
        return JSON.parse(localStorage.getItem('tk-line-oa-monitor-v2') || '[]');
      } catch (_err) {
        return [];
      }
    }

    function setStoredThreads(items) {
      allThreads = items;
      localStorage.setItem('tk-line-oa-monitor-v2', JSON.stringify(items));
    }

    function normalizeImportedText(text) {
      return String(text || '').replace(/\r\n/g, '\n').trim();
    }

    function parseImportedThread(title, text) {
      const normalized = normalizeImportedText(text);
      const lines = normalized.split('\n').filter(Boolean);
      const messages = lines.map((line, idx) => {
        const parts = line.split(/[:：]/);
        const speaker = parts.length > 1 ? parts[0].replace(/^\[[^\]]+\]\s*/, '').trim() : `訊息 ${idx + 1}`;
        const body = parts.length > 1 ? parts.slice(1).join('：').trim() : line.trim();
        return {
          at: `${String(9 + Math.floor(idx / 6)).padStart(2, '0')}:${String((idx * 4) % 60).padStart(2, '0')}`,
          from: speaker || `訊息 ${idx + 1}`,
          text: body || line.trim(),
          side: /客服|導遊|旅行社|管理員/.test(speaker) ? 'right' : 'left'
        };
      });
      const merged = messages.map(item => item.text).join(' ');
      const tags = [...new Set([...NEGATIVE_KEYWORDS.filter(k => merged.includes(k)), ...URGENT_KEYWORDS.filter(k => merged.includes(k))])];
      const risk = tags.some(tag => URGENT_KEYWORDS.includes(tag)) || tags.length >= 3 ? 'high' : tags.length >= 1 ? 'medium' : 'low';
      return {
        id: `thread-${Date.now()}`,
        name: title || `匯入聊天室 ${new Date().toLocaleTimeString()}`,
        userId: `manual-${Date.now()}`,
        summary: messages[0]?.text || '匯入對話',
        source: '手動匯入',
        assignedTo: '未指派',
        unread: messages.filter(item => item.side === 'left').length,
        risk,
        status: 'open',
        tags: tags.length ? tags : ['待回覆'],
        note: '',
        suggestions: risk === 'high'
          ? ['先致歉並立即確認影響範圍，再回覆明確處理時點。']
          : risk === 'medium'
            ? ['先接住情緒，再確認客人真正要問的問題。']
            : ['目前風險較低，可維持正常客服回覆節奏。'],
        messages
      };
    }

    function riskLabel(risk) {
      if (risk === 'high') return '高風險';
      if (risk === 'medium') return '中風險';
      return '低風險';
    }

    function riskClass(risk) {
      if (risk === 'high') return 'bg-rose-100 text-rose-700';
      if (risk === 'medium') return 'bg-amber-100 text-amber-700';
      return 'bg-emerald-100 text-emerald-700';
    }

    function statusLabel(status) {
      if (status === 'open') return '待回覆';
      if (status === 'closed') return '處理完畢';
      return '追蹤中';
    }

    function statusClass(status) {
      if (status === 'open') return 'bg-amber-100 text-amber-700';
      if (status === 'closed') return 'bg-slate-200 text-slate-700';
      return 'bg-blue-100 text-blue-700';
    }

    function getFilteredThreads() {
      const keyword = String(threadSearchEl.value || '').trim();
      return allThreads.filter(item => {
        if (currentFilter === 'open' && item.status !== 'open') return false;
        if (currentFilter === 'risk' && item.risk !== 'high') return false;
        if (!keyword) return true;
        const haystack = [item.name, item.userId, item.summary, item.assignedTo, ...(item.tags || [])].join(' ');
        return haystack.includes(keyword);
      });
    }

    function updateStats() {
      document.getElementById('stat-threads').textContent = allThreads.length;
      document.getElementById('stat-unread').textContent = allThreads.reduce((sum, item) => sum + Number(item.unread || 0), 0);
      document.getElementById('stat-risk').textContent = allThreads.filter(item => item.risk === 'high').length;
      document.getElementById('stat-agents').textContent = new Set(allThreads.map(item => item.assignedTo).filter(Boolean)).size;
      document.getElementById('thread-count-inline').textContent = allThreads.length;
    }

    function renderThreadList() {
      const rows = getFilteredThreads();
      threadListEl.innerHTML = '';
      if (!rows.length) {
        threadListEl.innerHTML = '<div class="rounded-3xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-400 font-bold">目前沒有符合條件的聊天室</div>';
        updateStats();
        return;
      }

      rows.forEach(item => {
        const active = activeThreadId === item.id;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `w-full text-left rounded-3xl border px-4 py-4 transition ${active ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white hover:bg-slate-50'}`;
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-14 h-14 rounded-full ${active ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-100 text-slate-700'} grid place-items-center font-black text-xl shrink-0">
              ${String(item.name || '?').trim().slice(0, 1)}
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="font-black text-lg truncate">${item.name}</p>
                  <p class="text-xs text-slate-400 truncate mt-0.5">${item.userId}</p>
                </div>
                <p class="text-xs text-slate-400 shrink-0">${item.messages[0]?.at || ''}</p>
              </div>
              <p class="text-sm text-slate-600 mt-2 line-clamp-3">${item.summary || ''}</p>
              <div class="flex flex-wrap gap-2 mt-3">
                <span class="px-3 py-1 rounded-full text-xs font-black ${statusClass(item.status)}">${statusLabel(item.status)}</span>
                <span class="px-3 py-1 rounded-full text-xs font-black ${riskClass(item.risk)}">${riskLabel(item.risk)}</span>
              </div>
            </div>
          </div>
        `;
        card.addEventListener('click', () => {
          activeThreadId = item.id;
          renderThreadList();
          renderActiveThread();
        });
        threadListEl.appendChild(card);
      });

      updateStats();
    }

    function renderSuggestions(thread) {
      suggestionListEl.innerHTML = '';
      const suggestions = thread?.suggestions || [];
      suggestionCountEl.textContent = suggestions.length;
      if (!suggestions.length) {
        suggestionListEl.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-300 p-4 text-sm text-slate-400 font-bold">目前沒有建議回覆</div>';
        return;
      }
      suggestions.forEach((text, idx) => {
        const card = document.createElement('div');
        card.className = 'rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-4';
        card.innerHTML = `
          <div class="flex items-center justify-between gap-3 mb-2">
            <p class="font-black">建議回覆 ${idx + 1}</p>
            <button class="copy-suggestion text-sm font-black text-emerald-700" data-text="${encodeURIComponent(text)}">複製</button>
          </div>
          <p class="text-sm leading-7 text-slate-700">${text}</p>
        `;
        suggestionListEl.appendChild(card);
      });
      suggestionListEl.querySelectorAll('.copy-suggestion').forEach(button => {
        button.addEventListener('click', async () => {
          const text = decodeURIComponent(button.getAttribute('data-text') || '');
          try {
            await navigator.clipboard.writeText(text);
            panelDraftEl.value = text;
            showToast('已複製建議回覆');
          } catch (_err) {
            showToast('複製失敗', 'error');
          }
        });
      });
    }

    function renderTags(thread) {
      threadTagsEl.innerHTML = '';
      (thread?.tags || []).forEach(tag => {
        const pill = document.createElement('span');
        pill.className = 'px-3 py-1 rounded-full bg-slate-100 text-slate-700 text-sm font-black';
        pill.textContent = tag;
        threadTagsEl.appendChild(pill);
      });
      threadStatusBadgeEl.className = `px-3 py-1 rounded-full text-xs font-black ${statusClass(thread?.status || 'open')}`;
      threadStatusBadgeEl.textContent = statusLabel(thread?.status || 'open');
    }

    function renderActiveThread() {
      const thread = allThreads.find(item => item.id === activeThreadId);
      if (!thread) {
        chatViewEl.hidden = true;
        chatEmptyEl.hidden = false;
        suggestionListEl.innerHTML = '';
        threadTagsEl.innerHTML = '';
        suggestionCountEl.textContent = '0';
        riskSummaryEl.textContent = '目前尚未選擇聊天室。';
        riskCountEl.textContent = '0';
        panelDraftEl.value = '';
        return;
      }

      chatViewEl.hidden = false;
      chatEmptyEl.hidden = true;
      chatNameEl.textContent = thread.name;
      chatMetaEl.textContent = `共 ${thread.messages.length} 則訊息 · 用戶ID ${thread.userId}`;
      chatMessagesEl.innerHTML = '';
      thread.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = `flex ${msg.side === 'right' ? 'justify-end' : 'justify-start'}`;
        row.innerHTML = `
          <div class="max-w-[70%] ${msg.side === 'right' ? 'bg-white text-slate-900 border border-emerald-200' : 'bg-white text-slate-900 border border-slate-200'} rounded-[24px] px-5 py-4 shadow-sm">
            <p class="font-black">${msg.text}</p>
            <p class="text-xs text-slate-500 mt-3">${msg.at}</p>
          </div>
        `;
        chatMessagesEl.appendChild(row);
      });

      renderSuggestions(thread);
      renderTags(thread);
      riskSummaryEl.textContent = thread.risk === 'high'
        ? '這筆對話包含高風險訊號，建議立即人工接手，並同步通報主管。'
        : thread.risk === 'medium'
          ? '這筆對話已有明顯問題訊號，建議優先跟進。'
          : '目前沒有重大風險訊號，可依正常客服節奏處理。';
      riskCountEl.textContent = String((thread.tags || []).filter(tag => NEGATIVE_KEYWORDS.includes(tag) || URGENT_KEYWORDS.includes(tag)).length);
      internalNoteEl.value = thread.note || '';
      panelDraftEl.value = thread.suggestions?.[0] || '';
    }

    async function readImportFile() {
      const file = document.getElementById('import-file').files && document.getElementById('import-file').files[0];
      if (!file) {
        showToast('請先選擇檔案', 'error');
        return;
      }
      const text = await file.text();
      document.getElementById('import-text').value = text;
      if (!document.getElementById('import-title').value.trim()) {
        document.getElementById('import-title').value = file.name.replace(/\.[^.]+$/, '');
      }
      showToast('已讀取檔案內容');
    }

    function saveImportedThread() {
      const title = document.getElementById('import-title').value.trim();
      const text = document.getElementById('import-text').value.trim();
      if (!text) {
        showToast('請先貼上或上傳對話', 'error');
        return;
      }
      const next = parseImportedThread(title, text);
      setStoredThreads([next, ...allThreads]);
      activeThreadId = next.id;
      document.getElementById('import-title').value = '';
      document.getElementById('import-text').value = '';
      document.getElementById('import-file').value = '';
      renderThreadList();
      renderActiveThread();
      showToast('已匯入聊天室');
    }

    function bindEvents() {
      document.getElementById('import-read').addEventListener('click', () => {
        readImportFile().catch(err => {
          console.error(err);
          showToast('無法讀取檔案', 'error');
        });
      });
      document.getElementById('import-sample').addEventListener('click', () => {
        document.getElementById('import-title').value = 'LINE OA 範例對話';
        document.getElementById('import-text').value = `[09:21] 客人：請問集合地點在哪裡？\n[09:22] 客服：您好，我先幫您確認。\n[09:25] 客人：司機好像遲到了，我們現在有點不滿。\n[09:26] 客服：收到，我立刻幫您追司機位置。`;
        showToast('已載入範例');
      });
      document.getElementById('import-save').addEventListener('click', saveImportedThread);
      threadSearchEl.addEventListener('input', renderThreadList);
      document.querySelectorAll('.thread-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.getAttribute('data-filter') || 'all';
          document.querySelectorAll('.thread-filter').forEach(other => {
            other.className = 'thread-filter rounded-full px-4 py-2 bg-slate-100 text-slate-700 text-sm font-black';
          });
          btn.className = 'thread-filter rounded-full px-4 py-2 bg-slate-900 text-white text-sm font-black';
          renderThreadList();
        });
      });
      copyReplyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(panelDraftEl.value || '');
          showToast('已複製回覆草稿');
        } catch (_err) {
          showToast('複製失敗', 'error');
        }
      });
      document.getElementById('add-tag').addEventListener('click', () => {
        const value = customTagEl.value.trim();
        if (!value) return;
        const idx = allThreads.findIndex(item => item.id === activeThreadId);
        if (idx < 0) return;
        const tags = new Set(allThreads[idx].tags || []);
        tags.add(value);
        allThreads[idx].tags = [...tags];
        setStoredThreads([...allThreads]);
        customTagEl.value = '';
        renderActiveThread();
        showToast('已新增標籤');
      });
      internalNoteEl.addEventListener('change', () => {
        const idx = allThreads.findIndex(item => item.id === activeThreadId);
        if (idx < 0) return;
        allThreads[idx].note = internalNoteEl.value;
        setStoredThreads([...allThreads]);
        showToast('已儲存備註');
      });
    }

    function boot() {
      allThreads = getStoredThreads();
      if (!allThreads.length) setStoredThreads(previewThreads);
      allThreads = getStoredThreads();
      activeThreadId = allThreads[0]?.id || '';
      bindEvents();
      renderThreadList();
      renderActiveThread();
      updateStats();
    }

    boot();
  </script>
</body>
</html>
