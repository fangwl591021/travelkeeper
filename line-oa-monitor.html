<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 聊天室監控｜TravelKeeper</title>
  <link rel="stylesheet" href="./css/tenant-line-pages.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./js/tenant-api-client.js"></script>
  <script src="./js/tenant-page-client.js"></script>
  <script src="./js/tenant-line-client.js"></script>
</head>
<body>
  <main class="layout">
    <aside class="sidebar flex flex-col border-r border-slate-200">
      <header class="border-b border-slate-200 p-5">
        <div class="flex items-start justify-between gap-3">
          <div><p class="text-xs font-black tracking-widest text-emerald-600">LINE OA</p><h1 class="mt-1 text-2xl font-black">聊天室監控</h1><p id="tenant-label" class="mt-1 text-sm text-slate-500"></p></div>
          <a id="settings-link" class="rounded-xl bg-slate-900 px-3 py-2 text-xs font-bold text-white">Channel 設定</a>
        </div>
        <input id="search" class="mt-4 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="搜尋姓名、UID、電話或標籤">
        <select id="assignee-filter" class="mt-3 w-full rounded-xl border border-slate-200 px-4 py-3 hidden"><option value="">All agents</option><option value="__unassigned">Unassigned</option></select>
        <div class="mt-3 flex flex-wrap gap-2"><button data-view="all" class="active-filter rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">全部案件</button><button data-view="mine" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">我的案件</button><button data-view="unassigned" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">未指派</button><button data-view="unread" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">有未讀</button></div><div class="mt-2 flex flex-wrap gap-2"><button data-status="all" class="active-filter rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">全部狀態</button><button data-status="open" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">open</button><button data-status="pending" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">pending</button><button data-status="closed" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">closed</button></div>
      </header>
      <section id="thread-list" class="scroll flex-1 space-y-2 p-3"></section>
    </aside>

    <section class="chat flex min-h-0 flex-col bg-slate-100">
      <header class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white p-5"><div><h2 id="chat-name" class="text-xl font-black">請選擇聊天室</h2><p id="chat-meta" class="mt-1 text-sm text-slate-500">訊息只讀取目前租戶。</p></div><div class="flex gap-2"><a id="crm-link" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold">客戶 CRM</a><a id="dashboard-link" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold">回後台</a></div></header>
      <section id="messages" class="scroll flex-1 space-y-3 p-5"><div class="empty-card">選擇左側聊天室查看訊息。</div></section>
            <footer id="composer" class="composer hidden border-t border-slate-200 bg-white p-4">
        <textarea id="reply-text" rows="3" class="w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="輸入 LINE 回覆內容，Enter 送出，Shift+Enter 換行" disabled></textarea>
        <div class="mt-3 flex items-center justify-between gap-3">
          <p id="reply-status" class="text-sm text-slate-500">請先選擇聊天室。</p>
          <button id="send-message" disabled class="rounded-xl bg-emerald-600 px-5 py-3 font-black text-white disabled:opacity-40">送出</button>
        </div>
      </footer>
    </section>

    <aside class="detail scroll border-l border-slate-200 p-5">
      <h2 class="text-lg font-black">聊天室設定</h2>
      <label class="mt-4 block text-sm font-bold">狀態<select id="status" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"><option value="open">待回覆</option><option value="pending">處理中</option><option value="closed">已完成</option></select></label>
      <label class="mt-4 block text-sm font-bold">風險<select id="risk" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label>
      <section id="assignment-panel" class="mt-4 rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-black">Agent assignment</h3>
        <p id="assignment-status" class="mt-1 text-sm text-slate-500">No thread selected.</p>
        <div id="admin-assignment-controls" class="mt-3 space-y-2">
          <input id="agent-search" class="w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="Search agent name or role">
          <select id="assignee-picker" class="w-full rounded-xl border border-slate-200 px-3 py-2" disabled><option value="">Loading agents...</option></select>
          <p id="agent-list-status" class="text-sm text-slate-500">Agents are not loaded yet.</p>
          <div class="grid grid-cols-2 gap-2"><button id="assign-thread" disabled class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-bold text-white disabled:opacity-40">Assign</button><button id="unassign-thread" disabled class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-bold disabled:opacity-40">Unassign</button></div>
        </div>
        <button id="claim-thread" disabled class="mt-2 w-full rounded-xl bg-emerald-600 px-3 py-2 text-sm font-bold text-white disabled:opacity-40">Claim</button>
        <button id="mark-read" disabled class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm font-bold disabled:opacity-40">Mark read</button>
      </section><label class="mt-4 block text-sm font-bold">摘要<textarea id="summary" rows="4" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"></textarea></label>
      <label class="mt-4 block text-sm font-bold">內部備註<textarea id="note" rows="5" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"></textarea></label>
      <label class="mt-4 block text-sm font-bold">標籤（逗號分隔）<input id="tags" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"></label>
      <button id="save" disabled class="mt-5 w-full rounded-xl bg-emerald-600 px-4 py-3 font-bold text-white disabled:opacity-40">儲存聊天室設定</button>
      <p id="save-status" class="mt-3 text-sm text-slate-500"></p>
    </aside>
  </main>
  <script src="./js/tenant-line-monitor-page.js"></script>
</body>
</html>
