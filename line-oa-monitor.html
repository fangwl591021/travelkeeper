<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 聊天室監控｜TravelKeeper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./js/tenant-api-client.js"></script>
  <script src="./js/tenant-page-client.js"></script>
  <script src="./js/tenant-line-client.js"></script>
  <style>
    body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.layout{display:grid;grid-template-columns:360px minmax(0,1fr) 320px;height:100vh}.sidebar,.detail,.chat{min-height:0}.sidebar,.detail{background:#fff}.scroll{overflow:auto}.thread-card{display:block;width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;text-align:left}.thread-card:hover,.thread-card.active{border-color:#10b981;background:#ecfdf5}.thread-head{display:flex;justify-content:space-between;gap:12px}.thread-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thread-head small{color:#94a3b8;white-space:nowrap}.thread-card p{margin:6px 0;color:#64748b;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pills{display:flex;gap:6px}.pills span{border-radius:999px;background:#f1f5f9;padding:3px 8px;font-size:11px}.message-row{display:flex;justify-content:flex-start}.message-row.outbound{justify-content:flex-end}.message-bubble{max-width:78%;border-radius:18px;background:#fff;padding:12px 15px;box-shadow:0 1px 3px rgba(15,23,42,.08)}.outbound .message-bubble{background:#059669;color:#fff}.message-bubble p{margin:0;white-space:pre-wrap;word-break:break-word}.message-bubble small{display:block;margin-top:8px;opacity:.6}.empty-card,.error-card{margin:16px;border-radius:14px;padding:18px;text-align:center;background:#fff;color:#64748b}.error-card{background:#fff1f2;color:#be123c}.active-filter{background:#0f172a!important;color:#fff!important}@media(max-width:1100px){.layout{grid-template-columns:320px 1fr}.detail{display:none}}@media(max-width:760px){.layout{display:block;height:auto}.sidebar{max-height:52vh}.chat{min-height:70vh}}
  </style>
</head>
<body>
  <main class="layout">
    <aside class="sidebar flex flex-col border-r border-slate-200">
      <header class="border-b border-slate-200 p-5">
        <div class="flex items-start justify-between gap-3">
          <div><p class="text-xs font-black tracking-widest text-emerald-600">LINE OA</p><h1 class="mt-1 text-2xl font-black">聊天室監控</h1><p id="tenant-label" class="mt-1 text-sm text-slate-500"></p></div>
          <a id="settings-link" class="rounded-xl bg-slate-900 px-3 py-2 text-xs font-bold text-white">Channel 設定</a>
        </div>
        <input id="search" class="mt-4 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="搜尋姓名、UID、電話或標籤">
        <div class="mt-3 flex flex-wrap gap-2"><button data-status="all" class="active-filter rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">全部</button><button data-status="open" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">待回覆</button><button data-status="pending" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">處理中</button><button data-status="closed" class="rounded-full bg-slate-100 px-3 py-2 text-xs font-bold">已完成</button></div>
      </header>
      <section id="thread-list" class="scroll flex-1 space-y-2 p-3"></section>
    </aside>

    <section class="chat flex min-h-0 flex-col bg-slate-100">
      <header class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white p-5"><div><h2 id="chat-name" class="text-xl font-black">請選擇聊天室</h2><p id="chat-meta" class="mt-1 text-sm text-slate-500">訊息只讀取目前租戶。</p></div><div class="flex gap-2"><a id="crm-link" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold">客戶 CRM</a><a id="dashboard-link" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold">回後台</a></div></header>
      <section id="messages" class="scroll flex-1 space-y-3 p-5"><div class="empty-card">選擇左側聊天室查看訊息。</div></section>
      <footer class="border-t border-slate-200 bg-white p-4"><div class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">Phase 13 為監看與管理模式，尚未開放直接推送 LINE 回覆。</div></footer>
    </section>

    <aside class="detail scroll border-l border-slate-200 p-5">
      <h2 class="text-lg font-black">聊天室設定</h2>
      <label class="mt-4 block text-sm font-bold">狀態<select id="status" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"><option value="open">待回覆</option><option value="pending">處理中</option><option value="closed">已完成</option></select></label>
      <label class="mt-4 block text-sm font-bold">風險<select id="risk" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label>
      <label class="mt-4 block text-sm font-bold">摘要<textarea id="summary" rows="4" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"></textarea></label>
      <label class="mt-4 block text-sm font-bold">內部備註<textarea id="note" rows="5" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"></textarea></label>
      <label class="mt-4 block text-sm font-bold">標籤（逗號分隔）<input id="tags" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2"></label>
      <button id="save" disabled class="mt-5 w-full rounded-xl bg-emerald-600 px-4 py-3 font-bold text-white disabled:opacity-40">儲存聊天室設定</button>
      <p id="save-status" class="mt-3 text-sm text-slate-500"></p>
    </aside>
  </main>
  <script src="./js/tenant-line-monitor-page.js"></script>
</body>
</html>
