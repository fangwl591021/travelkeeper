<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .panel { fill: #ffffff; stroke: #dce5f1; stroke-width: 1; }
      .soft { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .ink { fill: #0f172a; font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; }
      .muted { fill: #64748b; font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .h2 { font-size: 24px; font-weight: 800; }
      .h1 { font-size: 32px; font-weight: 900; }
      .num { font-size: 34px; font-weight: 900; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
      .white { fill: #fff; font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; }
      .nav { fill: #0f172a; }
      .blue { fill: #2563eb; }
      .green { fill: #10b981; }
      .amber { fill: #f59e0b; }
      .rose { fill: #ef4444; }
      .slate { fill: #334155; }
      .line { stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1000"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="276" height="1000" fill="#ffffff"/>
  <line x1="276" y1="0" x2="276" y2="1000" class="line"/>
  <circle cx="46" cy="48" r="24" fill="#10b981"/>
  <text x="46" y="56" class="white" text-anchor="middle" font-size="18" font-weight="900">OA</text>
  <text x="84" y="42" class="ink" font-size="21" font-weight="900">TravelKeeper</text>
  <text x="84" y="66" class="muted small">後台營運總覽</text>

  <rect x="24" y="112" width="228" height="44" rx="8" class="nav"/>
  <text x="58" y="140" class="white" font-size="15" font-weight="800">總覽</text>
  <rect x="24" y="168" width="228" height="44" rx="8" fill="#f1f5f9"/>
  <text x="58" y="196" class="muted" font-size="15" font-weight="700">訂單 / 付款</text>
  <rect x="24" y="224" width="228" height="44" rx="8" fill="#f1f5f9"/>
  <text x="58" y="252" class="muted" font-size="15" font-weight="700">行程管理</text>
  <rect x="24" y="280" width="228" height="44" rx="8" fill="#f1f5f9"/>
  <text x="58" y="308" class="muted" font-size="15" font-weight="700">LINE OA 監控</text>
  <rect x="24" y="336" width="228" height="44" rx="8" fill="#f1f5f9"/>
  <text x="58" y="364" class="muted" font-size="15" font-weight="700">知識庫 / AI</text>

  <!-- Header -->
  <text x="324" y="58" class="h1 ink">總覽</text>
  <text x="324" y="88" class="muted body">先看營運狀態，再處理待辦。把業績、待處理、LINE 商機放在同一個決策畫面。</text>
  <rect x="1128" y="38" width="96" height="38" rx="19" fill="#e8f7ef"/>
  <text x="1176" y="63" class="green" text-anchor="middle" font-size="14" font-weight="800">今日</text>
  <rect x="1238" y="38" width="150" height="38" rx="19" fill="#0f172a"/>
  <text x="1313" y="63" class="white" text-anchor="middle" font-size="14" font-weight="800">新增行程</text>

  <!-- KPI strip -->
  <rect x="324" y="124" width="252" height="132" rx="8" class="panel"/>
  <rect x="348" y="148" width="46" height="46" rx="8" fill="#dcfce7"/>
  <text x="371" y="178" class="green" text-anchor="middle" font-size="22" font-weight="900">$</text>
  <text x="348" y="215" class="num ink">NT$ 1,245,000</text>
  <text x="348" y="238" class="muted small">本月實收</text>

  <rect x="596" y="124" width="252" height="132" rx="8" class="panel"/>
  <rect x="620" y="148" width="46" height="46" rx="8" fill="#dbeafe"/>
  <text x="643" y="178" class="blue" text-anchor="middle" font-size="22" font-weight="900">↗</text>
  <text x="620" y="215" class="num ink">NT$ 1,680,000</text>
  <text x="620" y="238" class="muted small">本月成交金額</text>

  <rect x="868" y="124" width="252" height="132" rx="8" class="panel"/>
  <rect x="892" y="148" width="46" height="46" rx="8" fill="#fef3c7"/>
  <text x="915" y="178" class="amber" text-anchor="middle" font-size="22" font-weight="900">%</text>
  <text x="892" y="215" class="num ink">NT$ 126,000</text>
  <text x="892" y="238" class="muted small">本月應付佣金</text>

  <rect x="1140" y="124" width="248" height="132" rx="8" class="panel"/>
  <rect x="1164" y="148" width="46" height="46" rx="8" fill="#fee2e2"/>
  <text x="1187" y="178" class="rose" text-anchor="middle" font-size="22" font-weight="900">!</text>
  <text x="1164" y="215" class="num ink">18</text>
  <text x="1164" y="238" class="muted small">待處理事項</text>

  <!-- Main chart -->
  <rect x="324" y="280" width="704" height="332" rx="8" class="panel"/>
  <text x="352" y="322" class="h2 ink">近 6 個月業績趨勢</text>
  <text x="352" y="348" class="muted small">實收與佣金分開看，避免只看到成交金額而忽略現金流。</text>
  <line x1="366" y1="538" x2="988" y2="538" stroke="#e2e8f0"/>
  <line x1="366" y1="486" x2="988" y2="486" stroke="#e2e8f0" stroke-dasharray="4 6"/>
  <line x1="366" y1="434" x2="988" y2="434" stroke="#e2e8f0" stroke-dasharray="4 6"/>
  <line x1="366" y1="382" x2="988" y2="382" stroke="#e2e8f0" stroke-dasharray="4 6"/>
  <g>
    <rect x="400" y="468" width="24" height="70" rx="4" class="green"/>
    <rect x="430" y="508" width="24" height="30" rx="4" class="amber"/>
    <text x="427" y="568" class="muted tiny" text-anchor="middle">1月</text>
    <rect x="500" y="438" width="24" height="100" rx="4" class="green"/>
    <rect x="530" y="492" width="24" height="46" rx="4" class="amber"/>
    <text x="527" y="568" class="muted tiny" text-anchor="middle">2月</text>
    <rect x="600" y="410" width="24" height="128" rx="4" class="green"/>
    <rect x="630" y="482" width="24" height="56" rx="4" class="amber"/>
    <text x="627" y="568" class="muted tiny" text-anchor="middle">3月</text>
    <rect x="700" y="390" width="24" height="148" rx="4" class="green"/>
    <rect x="730" y="470" width="24" height="68" rx="4" class="amber"/>
    <text x="727" y="568" class="muted tiny" text-anchor="middle">4月</text>
    <rect x="800" y="354" width="24" height="184" rx="4" class="green"/>
    <rect x="830" y="462" width="24" height="76" rx="4" class="amber"/>
    <text x="827" y="568" class="muted tiny" text-anchor="middle">5月</text>
    <rect x="900" y="332" width="24" height="206" rx="4" class="green"/>
    <rect x="930" y="452" width="24" height="86" rx="4" class="amber"/>
    <text x="927" y="568" class="muted tiny" text-anchor="middle">6月</text>
  </g>
  <circle cx="842" cy="319" r="5" class="green"/>
  <text x="856" y="324" class="muted tiny">實收</text>
  <circle cx="912" cy="319" r="5" class="amber"/>
  <text x="926" y="324" class="muted tiny">佣金</text>

  <!-- Action queue -->
  <rect x="1052" y="280" width="336" height="332" rx="8" class="panel"/>
  <text x="1080" y="322" class="h2 ink">今日待處理</text>
  <text x="1080" y="348" class="muted small">把必須立刻處理的事集中。</text>
  <rect x="1080" y="378" width="280" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1100" y="401" class="ink small" font-weight="800">待審核行程</text>
  <text x="1338" y="402" class="amber" text-anchor="end" font-size="22" font-weight="900">5</text>
  <text x="1100" y="421" class="muted tiny">新上稿需確認價格與圖片</text>
  <rect x="1080" y="446" width="280" height="54" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1100" y="469" class="ink small" font-weight="800">待處理訂單</text>
  <text x="1338" y="470" class="rose" text-anchor="end" font-size="22" font-weight="900">7</text>
  <text x="1100" y="489" class="muted tiny">付款或名額狀態需確認</text>
  <rect x="1080" y="514" width="280" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1100" y="537" class="ink small" font-weight="800">LINE 待回覆</text>
  <text x="1338" y="538" class="blue" text-anchor="end" font-size="22" font-weight="900">6</text>
  <text x="1100" y="557" class="muted tiny">含 2 筆高風險對話</text>

  <!-- Lower grid -->
  <rect x="324" y="636" width="336" height="280" rx="8" class="panel"/>
  <text x="352" y="676" class="h2 ink">LINE 商機</text>
  <text x="352" y="704" class="muted small">從聊天監控轉成可追蹤案件。</text>
  <rect x="352" y="730" width="280" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="352" y="730" width="178" height="14" rx="7" class="green"/>
  <text x="352" y="772" class="ink" font-size="44" font-weight="900">42</text>
  <text x="426" y="771" class="muted small">本月新增商機</text>
  <text x="352" y="812" class="muted small">已報價 13 筆 · 付款中 4 筆 · 成交 6 筆</text>
  <rect x="352" y="844" width="144" height="42" rx="8" class="blue"/>
  <text x="424" y="871" class="white" font-size="14" font-weight="800" text-anchor="middle">進入 LINE 監控</text>

  <rect x="684" y="636" width="336" height="280" rx="8" class="panel"/>
  <text x="712" y="676" class="h2 ink">行程健康度</text>
  <text x="712" y="704" class="muted small">不要只看總數，要看可賣狀態。</text>
  <text x="712" y="756" class="ink" font-size="40" font-weight="900">128</text>
  <text x="792" y="755" class="muted small">上架行程</text>
  <text x="712" y="804" class="muted small">缺圖 9 · 價格待補 4 · 即將過期 12</text>
  <rect x="712" y="832" width="280" height="46" rx="8" class="soft"/>
  <text x="734" y="861" class="ink small" font-weight="800">建議優先修補：日本暑假團</text>

  <rect x="1044" y="636" width="344" height="280" rx="8" class="panel"/>
  <text x="1072" y="676" class="h2 ink">分銷 / 佣金</text>
  <text x="1072" y="704" class="muted small">把請款與實付分開看。</text>
  <text x="1072" y="756" class="ink" font-size="40" font-weight="900">NT$ 88,600</text>
  <text x="1072" y="784" class="muted small">目前可請款佣金</text>
  <text x="1072" y="830" class="muted small">待審分銷商 3 · 本月活躍 18 · 已匯 NT$ 220,000</text>
  <rect x="1072" y="856" width="148" height="42" rx="8" class="slate"/>
  <text x="1146" y="883" class="white" font-size="14" font-weight="800" text-anchor="middle">查看佣金</text>

  <!-- Notes -->
  <text x="324" y="960" class="muted tiny">設計方向：降低大色塊比例、把「財務 / 待辦 / LINE 商機 / 行程健康度」放到第一屏，操作入口集中在每個區塊底部。</text>
</svg>
