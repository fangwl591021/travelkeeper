<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wasabi 匯入資料預覽｜TravelKeeper</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe5f2;
      --soft: #f6f9fc;
      --blue: #2563eb;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f8fafc;
      color: var(--ink);
    }
    button, input, select {
      font: inherit;
    }
    button {
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      background: white;
      border-bottom: 1px solid var(--line);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border-radius: 14px;
      padding: 12px 16px;
      background: #eef3f9;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
    }
    .btn.primary {
      background: var(--blue);
      color: white;
    }
    .main {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 420px;
      min-height: 0;
    }
    .panel {
      background: white;
      border-right: 1px solid var(--line);
      min-height: calc(100vh - 104px);
      padding: 18px;
      overflow: auto;
    }
    .panel.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }
    .workspace {
      padding: 22px;
      overflow: auto;
      min-width: 0;
    }
    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
    label {
      color: var(--ink);
      font-weight: 800;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      color: var(--ink);
      background: white;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .notice {
      border: 1px solid #fed7aa;
      background: #fffbeb;
      color: #92400e;
      border-radius: 18px;
      padding: 14px 16px;
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      min-height: 106px;
    }
    .stat b {
      display: block;
      font-size: 34px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat span {
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
    }
    .group-list {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }
    .group-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f1f5f9;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .group-btn.active {
      background: var(--ink);
      color: white;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .08);
      color: inherit;
      font-size: 12px;
      font-weight: 900;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 160px 120px;
      gap: 10px;
      margin-bottom: 14px;
    }
    .records {
      display: grid;
      gap: 10px;
    }
    .record {
      width: 100%;
      text-align: left;
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .record:hover, .record.active {
      border-color: #86efac;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
    }
    .record-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }
    .record-title {
      font-size: 17px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .record-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .chip {
      padding: 5px 8px;
      border-radius: 999px;
      background: #eef6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 800;
    }
    .chip.warn {
      background: #fff7ed;
      color: #c2410c;
    }
    .empty {
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      padding: 36px;
      text-align: center;
      color: #94a3b8;
      font-weight: 800;
      background: rgba(255,255,255,.6);
    }
    .json-box {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      overflow: auto;
      max-height: 56vh;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.55;
    }
    .detail-title {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }
    .detail-meta {
      color: var(--muted);
      line-height: 1.7;
      overflow-wrap: anywhere;
      margin-bottom: 16px;
    }
    .key-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }
    .pager-buttons {
      display: flex;
      gap: 8px;
    }
    @media (max-width: 1180px) {
      .main { grid-template-columns: 280px minmax(0, 1fr); }
      .panel.right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); min-height: auto; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 18px; }
      .main { display: block; }
      .panel { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { padding: 16px; }
      .toolbar { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Wasabi Migration Staging</p>
        <h1>Wasabi 匯入資料預覽</h1>
        <p class="sub">只讀 staging 資料，先看欄位與內容，不直接寫入正式訂單、行程或經銷商表。</p>
      </div>
      <div class="actions">
        <a class="btn" href="./dashboard.html">回 Dashboard</a>
        <a class="btn" href="./itinerary-maintenance-list.html">行程維護</a>
        <button class="btn primary" id="refreshBtn">重新讀取</button>
      </div>
    </header>

    <main class="main">
      <aside class="panel">
        <div class="notice">
          目前是安全預覽模式。這裡看到的資料來自 Wasabi 匯入暫存表，還沒有合併到正式營運資料。
        </div>
        <div class="field">
          <label for="adminUid">管理員 UID</label>
          <input id="adminUid" placeholder="貼上管理員 LINE UID" autocomplete="off" />
        </div>
        <button class="btn primary" id="saveUidBtn" style="width:100%;margin-bottom:12px;">套用 UID</button>
        <div class="field">
          <label>資料類別</label>
          <div class="group-list" id="groupList">
            <button class="group-btn active" data-group="all"><span>全部</span><span class="badge">0</span></button>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <div class="stats">
          <div class="stat"><b id="statObjects">0</b><span>Wasabi 物件</span></div>
          <div class="stat"><b id="statRecords">0</b><span>暫存資料列</span></div>
          <div class="stat"><b id="statOrders">0</b><span>正式訂單</span></div>
          <div class="stat"><b id="statTours">0</b><span>正式行程</span></div>
          <div class="stat"><b id="statDists">0</b><span>正式經銷商</span></div>
        </div>

        <div class="toolbar">
          <input id="searchInput" placeholder="搜尋 object key、source id 或 JSON 內容..." />
          <select id="limitSelect">
            <option value="40">每頁 40 筆</option>
            <option value="80" selected>每頁 80 筆</option>
            <option value="120">每頁 120 筆</option>
            <option value="200">每頁 200 筆</option>
          </select>
          <button class="btn" id="searchBtn">搜尋</button>
        </div>

        <div class="records" id="records"></div>
        <div class="pager">
          <span id="pagerInfo">尚未讀取</span>
          <div class="pager-buttons">
            <button class="btn" id="prevBtn">上一頁</button>
            <button class="btn" id="nextBtn">下一頁</button>
          </div>
        </div>
      </section>

      <aside class="panel right">
        <h2 class="detail-title" id="detailTitle">尚未選取資料</h2>
        <div class="detail-meta" id="detailMeta">請從中間列表點一筆 Wasabi 暫存資料查看內容。</div>
        <div class="key-list" id="detailKeys"></div>
        <pre class="json-box" id="detailJson">{}</pre>
      </aside>
    </main>
  </div>

  <script>
    const API_BASE = 'https://travelkeeper-worker.fangwl591021.workers.dev';
    const state = {
      uid: new URLSearchParams(location.search).get('uid') || localStorage.getItem('travelkeeper_admin_uid') || '',
      group: 'all',
      search: '',
      limit: 80,
      offset: 0,
      total: 0,
      items: [],
      summary: null,
      selectedId: '',
    };

    const els = {
      adminUid: document.getElementById('adminUid'),
      saveUidBtn: document.getElementById('saveUidBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      groupList: document.getElementById('groupList'),
      searchInput: document.getElementById('searchInput'),
      limitSelect: document.getElementById('limitSelect'),
      searchBtn: document.getElementById('searchBtn'),
      records: document.getElementById('records'),
      pagerInfo: document.getElementById('pagerInfo'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      detailTitle: document.getElementById('detailTitle'),
      detailMeta: document.getElementById('detailMeta'),
      detailKeys: document.getElementById('detailKeys'),
      detailJson: document.getElementById('detailJson'),
      statObjects: document.getElementById('statObjects'),
      statRecords: document.getElementById('statRecords'),
      statOrders: document.getElementById('statOrders'),
      statTours: document.getElementById('statTours'),
      statDists: document.getElementById('statDists'),
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString('zh-TW');
    }

    function setLoading(message) {
      els.records.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
    }

    async function apiGet(path, params = {}) {
      if (!state.uid) throw new Error('請先輸入管理員 UID');
      const url = new URL(path, API_BASE);
      Object.entries({ uid: state.uid, ...params }).forEach(([key, value]) => {
        if (value !== undefined && value !== null && String(value) !== '') url.searchParams.set(key, value);
      });
      const res = await fetch(url.toString());
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch (_) { data = { success: false, error: text || `HTTP ${res.status}` }; }
      if (!res.ok || data.success === false) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data.data || data;
    }

    function renderSummary(summary) {
      state.summary = summary;
      const totals = summary.totals || {};
      els.statObjects.textContent = formatNumber(totals.objects);
      els.statRecords.textContent = formatNumber(totals.records);
      els.statOrders.textContent = formatNumber(totals.productionOrders);
      els.statTours.textContent = formatNumber(totals.productionItineraries);
      els.statDists.textContent = formatNumber(totals.productionDistributors);

      const rows = [{ source_group: 'all', records: totals.records || 0 }, ...(summary.records || [])];
      els.groupList.innerHTML = rows.map(row => {
        const group = row.source_group || 'unknown';
        const active = group === state.group ? ' active' : '';
        const label = group === 'all' ? '全部' : group;
        return `<button class="group-btn${active}" data-group="${escapeHtml(group)}">
          <span>${escapeHtml(label)}</span>
          <span class="badge">${formatNumber(row.records)}</span>
        </button>`;
      }).join('');
      els.groupList.querySelectorAll('.group-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.group = btn.dataset.group || 'all';
          state.offset = 0;
          loadRecords();
          renderSummary(state.summary);
        });
      });
    }

    function renderRecords(data) {
      state.total = data.total || 0;
      state.items = data.items || [];
      const start = state.total ? state.offset + 1 : 0;
      const end = Math.min(state.offset + state.limit, state.total);
      els.pagerInfo.textContent = `${formatNumber(start)}-${formatNumber(end)} / ${formatNumber(state.total)} 筆`;
      els.prevBtn.disabled = state.offset <= 0;
      els.nextBtn.disabled = state.offset + state.limit >= state.total;

      if (!state.items.length) {
        els.records.innerHTML = '<div class="empty">沒有符合條件的 Wasabi 暫存資料。</div>';
        return;
      }

      els.records.innerHTML = state.items.map(item => {
        const active = item.id === state.selectedId ? ' active' : '';
        const fields = (item.keys || []).slice(0, 8).map(key => `<span class="chip">${escapeHtml(key)}</span>`).join('');
        const nested = (item.nestedDataKeys || []).slice(0, 5).map(key => `<span class="chip warn">data.${escapeHtml(key)}</span>`).join('');
        return `<button class="record${active}" data-id="${escapeHtml(item.id)}">
          <div class="record-head">
            <div>
              <div class="record-title">${escapeHtml(item.sourceId || item.id)}</div>
              <div class="record-meta">${escapeHtml(item.objectKey)}</div>
              <div class="record-meta">類別：${escapeHtml(item.sourceGroup)}　狀態：${escapeHtml(item.status)}</div>
            </div>
            <span class="badge">${escapeHtml(item.note || 'staged')}</span>
          </div>
          <div class="chips">${fields}${nested}</div>
        </button>`;
      }).join('');

      els.records.querySelectorAll('.record').forEach(btn => {
        btn.addEventListener('click', () => selectRecord(btn.dataset.id));
      });

      if (!state.selectedId && state.items[0]) selectRecord(state.items[0].id);
    }

    function selectRecord(id) {
      const item = state.items.find(row => row.id === id);
      if (!item) return;
      state.selectedId = id;
      els.records.querySelectorAll('.record').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
      els.detailTitle.textContent = item.sourceId || item.id || 'Wasabi 暫存資料';
      els.detailMeta.innerHTML = [
        `類別：${escapeHtml(item.sourceGroup)}`,
        `Object：${escapeHtml(item.objectKey)}`,
        `Mapped：${escapeHtml(item.mappedTable || '-')}/${escapeHtml(item.mappedKey || '-')}`,
        `匯入時間：${escapeHtml(item.importedAt || '-')}`,
      ].join('<br>');
      const keys = [...(item.keys || []), ...(item.nestedDataKeys || []).map(key => `data.${key}`)];
      els.detailKeys.innerHTML = keys.length
        ? keys.map(key => `<span class="chip">${escapeHtml(key)}</span>`).join('')
        : '<span class="chip warn">沒有可列出的欄位</span>';
      els.detailJson.textContent = JSON.stringify(item.record || {}, null, 2);
    }

    async function loadSummary() {
      if (!state.uid) {
        setLoading('請先輸入管理員 UID。');
        return;
      }
      const summary = await apiGet('/api/wasabi/imports/summary');
      renderSummary(summary);
    }

    async function loadRecords() {
      if (!state.uid) {
        setLoading('請先輸入管理員 UID。');
        return;
      }
      setLoading('讀取 Wasabi 暫存資料中...');
      const data = await apiGet('/api/wasabi/imports', {
        group: state.group,
        search: state.search,
        limit: state.limit,
        offset: state.offset,
      });
      renderRecords(data);
    }

    async function refreshAll() {
      try {
        localStorage.setItem('travelkeeper_admin_uid', state.uid);
        await loadSummary();
        await loadRecords();
      } catch (err) {
        els.records.innerHTML = `<div class="empty">讀取失敗：${escapeHtml(err.message)}</div>`;
      }
    }

    els.adminUid.value = state.uid;
    els.saveUidBtn.addEventListener('click', () => {
      state.uid = els.adminUid.value.trim();
      state.offset = 0;
      refreshAll();
    });
    els.refreshBtn.addEventListener('click', refreshAll);
    els.searchBtn.addEventListener('click', () => {
      state.search = els.searchInput.value.trim();
      state.limit = Number(els.limitSelect.value || 80);
      state.offset = 0;
      refreshAll();
    });
    els.searchInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') els.searchBtn.click();
    });
    els.limitSelect.addEventListener('change', () => {
      state.limit = Number(els.limitSelect.value || 80);
      state.offset = 0;
      loadRecords();
    });
    els.prevBtn.addEventListener('click', () => {
      state.offset = Math.max(0, state.offset - state.limit);
      loadRecords();
    });
    els.nextBtn.addEventListener('click', () => {
      if (state.offset + state.limit < state.total) {
        state.offset += state.limit;
        loadRecords();
      }
    });

    refreshAll();
  </script>
</body>
</html>
