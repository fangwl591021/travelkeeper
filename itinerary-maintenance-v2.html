      notes: '\u793a\u610f\u6a21\u5f0f\u4e0d\u6703\u76f4\u63a5\u5beb\u5165\u6b63\u5f0f\u8cc7\u6599\u3002\n\u6b63\u5f0f\u4f7f\u7528\u6642\u8acb\u5f9e\u7dda\u4e0a\u5165\u53e3\u5e36 id \u9032\u5165\u3002',
      reviewStatus: 'published',
      commissionMode: 'amount',
      commissionAmount: 1500,
      commissionPercent: 10,
      paymentMode: 'deposit',
      depositRatio: 20,
      balanceCollect: 'online',
      seatLimit: 30,
      minGroupSize: 10,
      allowedPaymentMethods: ['credit_card', 'linepay', 'atm'],
      shareEnabled: true,
    };

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const errorTextEl = document.getElementById('error-text');
    const formEl = document.getElementById('form');
    const previewNoteEl = document.getElementById('preview-note');
    const adminControlsEl = document.getElementById('admin-controls');
    const saveBtn = document.getElementById('save-btn');
    const coverPreviewEl = document.getElementById('cover-preview');
    const titlePreviewEl = document.getElementById('title-preview');
    const metaPreviewEl = document.getElementById('meta-preview');
    const statusPillEl = document.getElementById('status-pill');
    const rolePillEl = document.getElementById('role-pill');
    const descriptionField = document.getElementById('description-field');
    const sectionsListEl = document.getElementById('sections-list');
    const sectionTemplate = document.getElementById('section-template');
    const legacyLinkEl = document.getElementById('legacy-link');

    let profile = null;
    let userStatus = null;
    let isAdmin = false;
    let sections = [];

    function t(el, value) {
      if (el) el.textContent = value;
    }

    function bootStaticText() {
      t(document.getElementById('heading-main'), UI.mainTitle);
      t(document.getElementById('page-subtitle'), UI.subtitle);
      t(document.getElementById('back-link'), UI.backMine);
      t(document.getElementById('legacy-link'), UI.legacyPage);
      t(document.getElementById('preview-title'), UI.previewTitle);
      t(document.getElementById('preview-body'), UI.previewBody);
      t(document.getElementById('loading'), UI.loading);
      t(document.getElementById('error-title'), UI.errorTitle);
      t(document.getElementById('basic-title'), UI.basicTitle);
      t(document.getElementById('basic-subtitle'), UI.basicSubtitle);
      t(document.getElementById('label-title'), UI.labelTitle);
      t(document.getElementById('label-cover'), UI.labelCover);
      t(document.getElementById('cover-upload-label'), UI.uploadFile);
      t(document.getElementById('label-region'), UI.labelRegion);
      t(document.getElementById('label-days'), UI.labelDays);
      t(document.getElementById('label-price'), UI.labelPrice);
      t(document.getElementById('label-description'), UI.labelDescription);
      t(document.getElementById('description-hint'), UI.descriptionHint);
      t(document.getElementById('label-notes'), UI.labelNotes);
      t(document.getElementById('sections-title'), UI.sectionsTitle);
      t(document.getElementById('sections-subtitle'), UI.sectionsSubtitle);
      t(document.getElementById('reparse-btn'), UI.reparse);
      t(document.getElementById('add-section-btn'), UI.addSection);
      t(document.getElementById('admin-title'), UI.adminTitle);
      t(document.getElementById('admin-subtitle'), UI.adminSubtitle);
      t(document.getElementById('label-commission-mode'), UI.commissionMode);
      t(document.getElementById('label-commission-amount'), UI.commissionAmount);
      t(document.getElementById('label-commission-percent'), UI.commissionPercent);
      t(document.getElementById('label-seat-limit'), UI.seatLimit);
      t(document.getElementById('label-min-group'), UI.minGroupSize);
      t(document.getElementById('label-payment-mode'), UI.paymentMode);
      t(document.getElementById('label-deposit-ratio'), UI.depositRatio);
      t(document.getElementById('label-balance-collect'), UI.balanceCollect);
      t(document.getElementById('label-allowed-payments'), UI.allowedPayments);
      t(document.getElementById('label-share-enabled'), UI.shareEnabled);
      t(document.getElementById('label-share-enabled-hint'), UI.shareEnabledHint);
      t(saveBtn, UI.save);
    }

    function showToast(message, type = 'success') {
      const el = document.getElementById('toast');
      el.hidden = false;
      el.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-semibold shadow-2xl ' +
        (type === 'error' ? 'bg-red-500' : 'bg-emerald-500');
      el.textContent = message;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { el.hidden = true; }, 2600);
    }

    function showError(message) {
      loadingEl.hidden = true;
      formEl.hidden = true;
      errorEl.hidden = false;
      errorTextEl.textContent = message;
    }

    function parseDescriptionToSections(rawText) {
      const text = String(rawText || '').replace(/\r\n/g, '\n').replace(/\\n/g, '\n').trim();
      if (!text) return [{ title: '', image: '', body: '' }];

      const lines = text.split('\n');
      const result = [];
      let current = null;
      const headingRegex = /^蝚枯s*\d+\s*憭?*$/;
      const imageRegex = /^!\[[^\]]*\]\(([^)]+)\)\s*$/;

      function pushCurrent() {
        if (!current) return;
        result.push({
          title: current.title.trim(),
          image: current.image.trim(),
          body: current.body.join('\n').trim(),
        });
      }

      for (const line of lines) {
        if (headingRegex.test(line.trim())) {
          pushCurrent();
          current = { title: line.trim(), image: '', body: [] };
          continue;
        }
        const imgMatch = line.trim().match(imageRegex);
        if (imgMatch && current) {
          current.image = imgMatch[1].trim();
          continue;
        }
        if (!current) current = { title: '', image: '', body: [] };
        current.body.push(line);
      }

      pushCurrent();
      return result.length ? result : [{ title: '', image: '', body: text }];
    }

    function serializeSections(list) {
      return list.map(section => {
        const parts = [];
        const title = String(section.title || '').trim();
        const image = String(section.image || '').trim();
        const body = String(section.body || '').trim();
        if (title) parts.push(title);
        if (image) parts.push(`![??](${image})`);
        if (body) parts.push(body);
        return parts.join('\n');
      }).filter(Boolean).join('\n\n').trim();
    }

    function syncDescriptionField() {
      descriptionField.value = serializeSections(sections);
    }

    function updateSectionPreview(index) {
      const wrap = sectionsListEl.children[index];
      if (!wrap) return;
      const img = wrap.querySelector('.section-preview');
      img.src = sections[index]?.image || 'https://via.placeholder.com/1200x700?text=No+Image';
    }

    async function uploadFileToR2(file) {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error(UI.readFail));
        reader.readAsDataURL(file);
      });

      const res = await fetch(`${WORKER_URL}/api/upload-image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          base64: dataUrl,
          filename: file.name || `image-${Date.now()}.jpg`,
        }),
      });
      const json = await res.json();
      if (!res.ok || !json?.success || !json?.url) throw new Error(json?.error || UI.uploadFail);
      return json.url;
    }

    function createEmptySection() {
      return { title: '', image: '', body: '' };
    }

    function renderSections() {
      sectionsListEl.innerHTML = '';
      sections.forEach((section, index) => {
        const node = sectionTemplate.content.firstElementChild.cloneNode(true);
        t(node.querySelector('.section-label'), `${UI.sectionPrefix} ${index + 1}`);
        t(node.querySelector('.remove-section-btn'), UI.removeSection);
        t(node.querySelector('.section-title-label'), UI.sectionTitle);
        t(node.querySelector('.section-image-label'), UI.sectionImage);
        t(node.querySelector('.section-body-label'), UI.sectionBody);
        t(node.querySelector('.section-upload-label'), UI.uploadFile);

        const titleInput = node.querySelector('.section-title');
        const imageInput = node.querySelector('.section-image');
        const bodyInput = node.querySelector('.section-body');
        const fileInput = node.querySelector('.section-file');
        const removeBtn = node.querySelector('.remove-section-btn');

        titleInput.value = section.title || '';
        imageInput.value = section.image || '';
        bodyInput.value = section.body || '';

        titleInput.addEventListener('input', () => {
          sections[index].title = titleInput.value;
          syncDescriptionField();
        });

        imageInput.addEventListener('input', () => {
          sections[index].image = imageInput.value;
          updateSectionPreview(index);
          syncDescriptionField();
        });

        bodyInput.addEventListener('input', () => {
          sections[index].body = bodyInput.value;
          syncDescriptionField();
        });

        fileInput.addEventListener('change', async () => {
          const file = fileInput.files?.[0];
          if (!file) return;
          const label = fileInput.parentElement;
          t(label, '\u4e0a\u50b3\u4e2d...');
          label.appendChild(fileInput);
          fileInput.classList.add('hidden');
          try {
            const url = await uploadFileToR2(file);
            sections[index].image = url;
            imageInput.value = url;
            updateSectionPreview(index);
            syncDescriptionField();
            showToast(UI.uploadSectionDone);
          } catch (err) {
            showToast(err.message || UI.uploadFail, 'error');
          } finally {
            t(label, UI.uploadFile);
            label.appendChild(fileInput);
            fileInput.classList.add('hidden');
            fileInput.value = '';
          }
        });

        removeBtn.addEventListener('click', () => {
          sections.splice(index, 1);
          if (!sections.length) sections = [createEmptySection()];
          renderSections();
          syncDescriptionField();
        });

        sectionsListEl.appendChild(node);
        updateSectionPreview(index);
      });
    }

    function setPreview(data) {
      coverPreviewEl.src = data.image || 'https://via.placeholder.com/1200x700?text=No+Image';
      titlePreviewEl.textContent = data.title || UI.noTitle;
      metaPreviewEl.textContent = `${data.region || '-'} · ${Number(data.days || 0)} 天 · NT$ ${Number(data.price || 0).toLocaleString()}`;
      statusPillEl.textContent = data.reviewStatus || data.review_status || 'published';
      rolePillEl.textContent = previewMode ? UI.previewRole : (isAdmin ? UI.adminRole : UI.distRole);
    }

    function syncCommissionMode() {
      const mode = String(formEl.elements.commissionMode.value || 'amount');
      document.getElementById('commission-amount-wrap').hidden = mode !== 'amount';
      document.getElementById('commission-percent-wrap').hidden = mode !== 'percent';
    }

    function fillForm(data) {
      formEl.elements.title.value = data.title || '';
      formEl.elements.image.value = data.image || '';
      formEl.elements.region.value = data.region || '';
      formEl.elements.days.value = data.days || '';
      formEl.elements.price.value = data.price || '';
      formEl.elements.description.value = data.description || '';
      formEl.elements.notes.value = data.notes || '';
      formEl.elements.commissionMode.value = data.commissionMode || 'amount';
      formEl.elements.commissionAmount.value = data.commissionAmount ?? 0;
      formEl.elements.commissionPercent.value = data.commissionPercent ?? 0;
      formEl.elements.paymentMode.value = data.paymentMode || 'deposit';
      formEl.elements.depositRatio.value = data.depositRatio ?? 20;
      formEl.elements.balanceCollect.value = data.balanceCollect || 'online';
      formEl.elements.seatLimit.value = data.seatLimit ?? 0;
      formEl.elements.minGroupSize.value = data.minGroupSize ?? 0;
      formEl.elements.shareEnabled.checked = !!data.shareEnabled;

      const allowed = new Set(Array.isArray(data.allowedPaymentMethods) ? data.allowedPaymentMethods : []);
      [...formEl.querySelectorAll('input[name="allowedPaymentMethods"]')].forEach(input => {
        input.checked = allowed.has(input.value);
      });

      sections = parseDescriptionToSections(data.description || '');
      renderSections();
      syncDescriptionField();
      syncCommissionMode();
      setPreview(data);
    }

    async function initAuthAndLoad() {
      if (!itineraryId && !previewMode) throw new Error(UI.missingId);

      if (previewMode) {
        previewNoteEl.hidden = false;
        adminControlsEl.hidden = false;
        isAdmin = true;
        fillForm(previewData);
        loadingEl.hidden = true;
        formEl.hidden = false;
        return;
      }

      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }

      profile = await liff.getProfile();
      userStatus = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${encodeURIComponent(profile.userId)}`).then(r => r.json());
      isAdmin = !!userStatus?.data?.isAdmin;
      adminControlsEl.hidden = !isAdmin;

      const detail = await fetch(`${WORKER_URL}/api/itinerary/detail?id=${encodeURIComponent(itineraryId)}&uid=${encodeURIComponent(profile.userId)}`).then(r => r.json());
      if (!detail?.success || !detail?.data) throw new Error(detail?.error || UI.notFound);

      fillForm(detail.data);
      loadingEl.hidden = true;
      formEl.hidden = false;
      legacyLinkEl.href = `itinerary-maintenance.html?id=${encodeURIComponent(itineraryId)}`;
    }

    const coverUploadInput = document.getElementById('cover-upload');
    if (coverUploadInput) coverUploadInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const url = await uploadFileToR2(file);
        formEl.elements.image.value = url;
        setPreview({
          title: formEl.elements.title.value,
          image: url,
          region: formEl.elements.region.value,
          days: formEl.elements.days.value,
          price: formEl.elements.price.value,
          reviewStatus: statusPillEl.textContent,
        });
        showToast(UI.uploadCoverDone);
      } catch (err) {
        showToast(err.message || UI.uploadFail, 'error');
      } finally {
        e.target.value = '';
      }
    });

    if (formEl.elements.image) formEl.elements.image.addEventListener('input', () => {
      setPreview({
        title: formEl.elements.title.value,
        image: formEl.elements.image.value,
        region: formEl.elements.region.value,
        days: formEl.elements.days.value,
        price: formEl.elements.price.value,
        reviewStatus: statusPillEl.textContent,
      });
    });

    if (formEl.elements.title) formEl.elements.title.addEventListener('input', () => {
      titlePreviewEl.textContent = formEl.elements.title.value || UI.noTitle;
    });

    ['region', 'days', 'price'].forEach(name => {
      if (!formEl.elements[name]) return;
      formEl.elements[name].addEventListener('input', () => {
        metaPreviewEl.textContent = `${formEl.elements.region.value || '-'} · ${Number(formEl.elements.days.value || 0)} 天 · NT$ ${Number(formEl.elements.price.value || 0).toLocaleString()}`;
      });
    });

    if (formEl.elements.commissionMode) formEl.elements.commissionMode.addEventListener('change', syncCommissionMode);

    const reparseBtn = document.getElementById('reparse-btn');
    if (reparseBtn) reparseBtn.addEventListener('click', () => {
      sections = parseDescriptionToSections(descriptionField.value);
      renderSections();
      syncDescriptionField();
      showToast(UI.reparseDone);
    });

    const addSectionBtn = document.getElementById('add-section-btn');
    if (addSectionBtn) addSectionBtn.addEventListener('click', () => {
      sections.push(createEmptySection());
      renderSections();
      syncDescriptionField();
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      syncDescriptionField();

      if (previewMode) {
        showToast(UI.previewNoWrite);
        return;
      }

      saveBtn.disabled = true;
      t(saveBtn, UI.saving);

      try {
        const allowedPaymentMethods = [...formEl.querySelectorAll('input[name="allowedPaymentMethods"]:checked')].map(input => input.value);
        const payload = {
          id: itineraryId,
          uid: profile.userId,
          title: formEl.elements.title.value.trim(),
          image: formEl.elements.image.value.trim(),
          region: formEl.elements.region.value.trim(),
          days: Number(formEl.elements.days.value || 0),
          price: Number(formEl.elements.price.value || 0),
          description: descriptionField.value.trim(),
          notes: formEl.elements.notes.value.trim(),
          paymentMode: formEl.elements.paymentMode.value,
          depositRatio: Number(formEl.elements.depositRatio.value || 0),
          balanceCollect: formEl.elements.balanceCollect.value,
          allowedPaymentMethods,
        };

        if (isAdmin) {
          payload.commissionMode = formEl.elements.commissionMode.value;
          payload.commissionAmount = Number(formEl.elements.commissionAmount.value || 0);
          payload.commissionPercent = Number(formEl.elements.commissionPercent.value || 0);
          payload.seatLimit = Number(formEl.elements.seatLimit.value || 0);
          payload.minGroupSize = Number(formEl.elements.minGroupSize.value || 0);
          payload.shareEnabled = formEl.elements.shareEnabled.checked;
        }

        const res = await fetch(`${WORKER_URL}/api/itinerary/detail`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const json = await res.json();
        if (!res.ok || !json?.success) throw new Error(json?.error || UI.saveFail);

        fillForm(json.data || payload);
        showToast(UI.saveDone);
      } catch (err) {
        showToast(err.message || UI.saveFail, 'error');
      } finally {
        saveBtn.disabled = false;
        t(saveBtn, UI.save);
      }
    });

    bootStaticText();
    initAuthAndLoad().catch(err => {
      showError(err.message || UI.loadFail);
    });
  </script>
</body>
</html>
