<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊管家 · 推廣工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; }
    :root { --emerald: #10b981; --green: #00B900; --red: #b82337; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:99px; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes popIn  { 0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
    @keyframes spin   { to{transform:rotate(360deg)} }

    .anim-fade-up { animation: fadeUp .35s ease both; }
    .anim-pop-in  { animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both; }
    .spin { animation: spin .7s linear infinite; }

    .tour-card { position:relative; background:#fff; border:2px solid #e2e8f0; border-radius:14px; overflow:hidden; cursor:pointer; transition:all .2s; user-select:none; }
    .tour-card:hover { border-color:#94a3b8; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.08); }
    .tour-card.selected { border-color:var(--emerald); box-shadow:0 0 0 3px rgba(16,185,129,.2); }
    .card-check { position:absolute; top:8px; left:8px; z-index:5; width:22px; height:22px; border-radius:6px; border:2.5px solid #fff; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .tour-card.selected .card-check { background:var(--emerald); border-color:var(--emerald); }

    .modal-overlay { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.65); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .25s; }
    .modal-overlay.open { opacity:1; pointer-events:auto; }
    .modal-sheet { background:#fff; border-radius:24px; width:100%; max-width:960px; max-height:92vh; overflow:hidden; display:flex; flex-direction:column; transform:scale(.94); transition:.3s; }
    .modal-overlay.open .modal-sheet { transform:scale(1); }

    .preview-chat-bg { background-color:#749cbd; }
    .preview-bubble { flex:0 0 260px; scroll-snap-align:start; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.25); }
    .preview-bubble-multi { background:#fff; border-radius:12px; overflow:hidden; margin-bottom:8px; box-shadow:0 2px 8px rgba(0,0,0,.2); }

    #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:12px 28px; border-radius:14px; font-size:14px; font-weight:bold; opacity:0; transition:.3s; z-index:999; white-space:nowrap; }
    #toast.show { opacity:1; }
    #toast.error { background:#dc2626; }
  </style>
</head>
<body class="bg-gray-50 pb-28">

<!-- ── 全頁 Loading 遮罩（初始化完成前顯示） ── -->
<div id="app-loading" style="position:fixed;inset:0;z-index:999;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
  <div style="width:48px;height:48px;border:4px solid #d1fae5;border-top-color:#10b981;border-radius:50%;animation:spin .7s linear infinite;"></div>
  <p id="loading-msg" style="font-family:'Noto Sans TC',sans-serif;font-weight:700;color:#94a3b8;font-size:14px;">初始化中，請稍候…</p>
  <p style="font-family:'Noto Sans TC',sans-serif;font-weight:500;color:#cbd5e1;font-size:12px;">旅遊管家 · 推廣工具箱</p>
</div>

<!-- ── Nav ── -->
<nav class="sticky top-0 z-40 bg-white/92 backdrop-blur border-b border-slate-200 shadow-sm h-16 flex items-center px-4 justify-between gap-4">
  <div class="flex items-center gap-2 shrink-0">
    <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="font-black text-xl text-slate-800">推廣工具箱</span>
  </div>

  <!-- 模式切換 -->
  <div class="flex bg-slate-100 rounded-xl p-1 text-xs font-bold">
    <button id="mode-single"   onclick="setMode('single')"   class="px-3 py-1.5 rounded-lg bg-white shadow-sm">單張名片</button>
    <button id="mode-carousel" onclick="setMode('carousel')" class="px-3 py-1.5 rounded-lg text-slate-500">橫向輪播</button>
    <button id="mode-multi"    onclick="setMode('multi')"    class="px-3 py-1.5 rounded-lg text-slate-500">列表多頁</button>
  </div>

  <!-- 我的資料按鈕 -->
  <button onclick="openProfileModal()" class="shrink-0 flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-xl font-bold text-sm hover:bg-emerald-100 transition">
    ✏️ 我的名片資料
  </button>
</nav>

<!-- ── 搜尋 ── -->
<div class="max-w-6xl mx-auto px-4 py-4">
  <input id="search-input" type="text" placeholder="搜尋行程標題..." oninput="renderCards()"
    class="w-full border-2 border-slate-200 rounded-2xl px-5 py-3 text-sm font-medium outline-none focus:border-emerald-500 transition bg-white" />
</div>

<!-- ── 行程卡片 ── -->
<main class="max-w-6xl mx-auto px-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" id="cards-grid"></main>

<!-- ── 底部多選列 ── -->
<div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white p-4 hidden">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <span id="selected-hint" class="font-bold text-emerald-400">已選 0 個行程</span>
    <div class="flex gap-2">
      <button onclick="clearSelection()" class="bg-slate-700 px-4 py-2 rounded-xl font-bold text-sm">清除</button>
      <button onclick="openPromoModal()" class="bg-emerald-500 px-6 py-2 rounded-xl font-bold text-sm">準備發送名片 🚀</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     發送名片 Modal
══════════════════════════════════════════ -->
<div id="promo-modal" class="modal-overlay" onclick="closeModal(event,'promo-modal')">
  <div class="modal-sheet anim-pop-in">
    <div class="p-5 border-b flex justify-between items-center shrink-0">
      <h3 id="modal-title" class="font-black text-lg">發送推廣名片</h3>
      <button onclick="closeById('promo-modal')" class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
    </div>

    <div class="flex flex-col md:flex-row overflow-hidden flex-1 min-h-0">
      <!-- 左：設定 -->
      <div class="flex-1 p-6 overflow-y-auto space-y-6">

        <!-- 聯絡按鈕 -->
        <div>
          <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">選擇顯示的聯絡按鈕</p>
          <div id="soc-options" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- 自訂行動按鈕文字 -->
        <div>
          <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-2">主行動按鈕文字</p>
          <input id="cta-text" value="查看行程 / 立即報名"
            class="w-full border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-emerald-500 bg-slate-50" />
        </div>

        <div class="pt-4 border-t space-y-3">
          <button onclick="copyFlexJson()" class="w-full bg-slate-100 hover:bg-slate-200 py-3 rounded-2xl font-bold text-sm transition">
            📋 複製 Flex JSON（貼到 LINE OA）
          </button>
          <button onclick="sendTargetPicker()" id="send-btn"
            class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:bg-emerald-600 transition">
            🚀 立即分享給好友（通訊錄）
          </button>
        </div>
      </div>

      <!-- 右：LINE 預覽 -->
      <div class="w-full md:w-[340px] preview-chat-bg p-5 flex flex-col items-center shrink-0">
        <p class="text-white/70 text-[10px] font-bold mb-4 uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">
          LINE 預覽效果
        </p>
        <div id="flex-preview-container"
          class="w-full flex gap-3 overflow-x-auto pb-3"
          style="scroll-snap-type:x mandatory;">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     分銷商資料編輯 Modal
══════════════════════════════════════════ -->
<div id="profile-modal" class="modal-overlay" onclick="closeModal(event,'profile-modal')">
  <div class="modal-sheet anim-pop-in" style="max-width:520px">
    <div class="p-5 border-b flex justify-between items-center shrink-0">
      <h3 class="font-black text-lg">✏️ 我的名片資料</h3>
      <button onclick="closeById('profile-modal')" class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
    </div>
    <div class="p-6 overflow-y-auto space-y-4 flex-1">
      <p class="text-xs text-slate-400 font-medium">填寫後，推廣名片的聯絡按鈕將自動帶入這些資料。</p>

      <div id="profile-fields" class="space-y-3"></div>

      <button onclick="saveProfile()" id="save-profile-btn"
        class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-emerald-700 transition mt-2">
        儲存名片資料
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- ══════════════════════════════════════════ SCRIPT ══ -->
<script>
const LIFF_ID      = '2009367829-BDZCGti8';
const WORKER_URL   = 'https://travelkeeper.fangwl591021.workers.dev';
const ENDPOINT_URL = 'https://fangwl591021.github.io/travelkeeper/';

let itineraries = [];
let selectedIds = new Set();
let mode        = 'single';
let liffProfile = null;
let distData    = null;   // distributorData from GAS

// ── 初始化 ────────────────────────────────────────────────────
function setLoadingMsg(msg) {
  const el = document.getElementById('loading-msg');
  if (el) el.innerText = msg;
}
function hideLoading() {
  const el = document.getElementById('app-loading');
  if (el) { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400); }
}
function showLoadingError(msg) {
  const el = document.getElementById('app-loading');
  if (!el) return;
  el.innerHTML = `<div style="text-align:center;padding:32px;font-family:'Noto Sans TC',sans-serif;"><div style="font-size:48px;margin-bottom:16px;">⚠️</div><p style="font-weight:900;color:#0f172a;font-size:18px;margin-bottom:8px;">${msg}</p><p style="color:#94a3b8;font-size:13px;margin-bottom:24px;">請確認已登入 LINE，或在 LINE 內開啟此頁面</p><button onclick="location.reload()" style="background:#10b981;color:#fff;padding:12px 32px;border-radius:12px;font-weight:900;border:none;cursor:pointer;font-size:15px;">重新整理</button></div>`;
}

window.onload = async function() {
  setLoadingMsg('載入 LIFF SDK…');
  let retries = 0;
  while (typeof liff === 'undefined' && retries < 20) {
    await new Promise(r => setTimeout(r, 200));
    retries++;
  }
  if (typeof liff === 'undefined') { showLoadingError('LIFF SDK 載入失敗'); return; }
  try {
    setLoadingMsg('身份驗證中…');
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    if (!liff.isLoggedIn()) {
      setLoadingMsg('導向 LINE 登入…');
      liff.login({ redirectUri: window.location.href });
      return;
    }
    setLoadingMsg('取得用戶資料…');
    liffProfile = await liff.getProfile();
    setLoadingMsg('載入分銷商資料…');
    await fetchDistData();
    setLoadingMsg('載入行程資料…');
    await fetchItineraries();
    hideLoading();
  } catch (e) {
    console.error('Init error:', e);
    showLoadingError('初始化失敗：' + e.message);
  }
};

async function fetchDistData() {
  const res  = await fetch(`${WORKER_URL}/api/itineraries?action=checkUserStatus&uid=${liffProfile.userId}`);
  const data = await res.json();
  if (data.success && data.data.role === 'distributor') {
    distData = data.data.distributorData || {};
  }
}

async function fetchItineraries() {
  const res = await fetch(`${WORKER_URL}/api/itineraries`);
  const raw = await res.json();
  itineraries = Array.isArray(raw) ? raw : [];
  renderCards();
}

// ── 行程卡片 ──────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  selectedIds.clear();
  ['single','carousel','multi'].forEach(id => {
    const btn = document.getElementById(`mode-${id}`);
    btn.className = `px-3 py-1.5 rounded-lg transition-all ${mode === id ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`;
  });
  document.getElementById('bottom-bar').classList.toggle('hidden', m === 'single');
  renderCards();
}

function renderCards() {
  const kw        = document.getElementById('search-input').value.toLowerCase();
  const container = document.getElementById('cards-grid');

  const visible = itineraries.filter(i => String(i.title || '').toLowerCase().includes(kw));

  if (visible.length === 0) {
    container.innerHTML = `<div class="col-span-5 py-20 text-center text-slate-300 font-bold text-sm">沒有找到行程</div>`;
    return;
  }

  container.innerHTML = visible.map(item => {
    const id    = String(item.id || item.timestamp || '');
    const isSel = selectedIds.has(id);
    const img   = item.image
      ? `<img src="${item.image}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full text-3xl\\'>✈️</div>'">`
      : `<div class="flex items-center justify-center h-full text-3xl">✈️</div>`;

    return `
      <div class="tour-card ${isSel ? 'selected' : ''} anim-fade-up" onclick="handleCardClick('${id}')">
        <div class="card-check" style="${mode === 'single' ? 'display:none' : ''}">
          ${isSel ? `<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
        </div>
        <div class="h-32 bg-slate-100 overflow-hidden">${img}</div>
        <div class="p-3">
          <p class="text-xs font-bold text-gray-800 line-clamp-2 h-8 mb-1">${item.title || ''}</p>
          <div class="flex justify-between items-center mt-1">
            <span class="text-[10px] text-gray-400">${item.days || ''}天</span>
            <span class="text-xs font-black text-red-600">$${Number(item.price || 0).toLocaleString()}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function handleCardClick(id) {
  if (mode === 'single') {
    selectedIds.clear();
    selectedIds.add(id);
    openPromoModal();
  } else {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else if (selectedIds.size < 8) selectedIds.add(id);
    else { showToast('最多選 8 個行程'); return; }
    document.getElementById('selected-hint').innerText = `已選 ${selectedIds.size} 個行程`;
    renderCards();
  }
}

function clearSelection() {
  selectedIds.clear();
  document.getElementById('selected-hint').innerText = '已選 0 個行程';
  renderCards();
}

// ── 發送名片 Modal ────────────────────────────────────────────
function openPromoModal() {
  if (selectedIds.size === 0) return;
  document.getElementById('modal-title').innerText =
    mode === 'single' ? '發送單張名片' : mode === 'carousel' ? '發送輪播名片' : '發送列表名片';
  buildSocOptions();
  renderPreview();
  document.getElementById('promo-modal').classList.add('open');
}

// ── 聯絡按鈕選項 ─────────────────────────────────────────────
const SOC_DEFS = [
  { key:'phone',  label:'📞 電話',   field:'phone',      prefix:'tel:' },
  { key:'line',   label:'💬 LINE',   field:'lineLink',   prefix:'' },
  { key:'lineAt', label:'🟢 LINE@',  field:'lineAtLink', prefix:'' },
  { key:'fb',     label:'👍 Facebook',field:'fbLink',    prefix:'' },
  { key:'web',    label:'🌐 網站',   field:'webLink',    prefix:'' },
  { key:'map',    label:'📍 地圖導航',field:'mapLink',   prefix:'' },
  { key:'tg',     label:'✈️ Telegram',field:'tgToken',  prefix:'' },
];

function buildSocOptions() {
  document.getElementById('soc-options').innerHTML = SOC_DEFS.map(opt => {
    const val = distData?.[opt.field] || '';
    const dis = !val;
    return `
      <label class="flex items-center gap-2 p-3 border-2 rounded-xl text-xs font-bold cursor-pointer transition
        ${dis ? 'opacity-30 border-slate-100' : 'border-slate-200 hover:border-emerald-400'}">
        <input type="checkbox" id="check-${opt.key}" ${dis ? 'disabled' : 'checked'}
          onchange="renderPreview()" class="w-4 h-4 accent-emerald-500 shrink-0" />
        ${opt.label}
        ${dis ? '<span class="text-slate-300 ml-auto">未設定</span>' : ''}
      </label>`;
  }).join('');
}

// 取得勾選的聯絡按鈕，回傳 LINE Flex button 陣列
function getCheckedSocButtons() {
  const uid = liffProfile?.userId || '';
  return SOC_DEFS
    .filter(opt => {
      const el = document.getElementById(`check-${opt.key}`);
      return el && el.checked;
    })
    .map(opt => {
      const raw = distData?.[opt.field] || '';
      const uri = opt.prefix ? `${opt.prefix}${raw}` : raw;
      return {
        type: 'button', style: 'secondary', height: 'sm',
        action: { type: 'uri', label: opt.label.replace(/^\S+\s/, ''), uri }
      };
    });
}

// ── 預覽 ─────────────────────────────────────────────────────
function renderPreview() {
  const items = Array.from(selectedIds)
    .map(id => itineraries.find(i => String(i.id || i.timestamp || '') === id))
    .filter(Boolean);
  const container = document.getElementById('flex-preview-container');
  const cta = document.getElementById('cta-text')?.value || '查看行程 / 立即報名';

  if (mode === 'multi') {
    container.innerHTML = items.map(tour => `
      <div class="preview-bubble-multi w-full flex gap-3 p-3">
        <img src="${tour.image || ''}" class="w-20 h-14 object-cover rounded-lg shrink-0" onerror="this.style.display='none'">
        <div class="min-w-0">
          <p class="text-xs font-black text-slate-900 line-clamp-1">${tour.title}</p>
          <p class="text-[10px] text-red-600 font-black mt-0.5">$${Number(tour.price).toLocaleString()}</p>
          <p class="text-[10px] text-slate-400">${tour.days}天 · ${tour.region || ''}</p>
        </div>
      </div>`).join('');
    return;
  }

  // single / carousel
  container.innerHTML = items.map(tour => `
    <div class="preview-bubble">
      <img src="${tour.image || ''}" class="aspect-[20/13] w-full object-cover" onerror="this.style.display='none'">
      <div class="p-3 space-y-1">
        <p class="text-[11px] font-black text-slate-900 line-clamp-2">${tour.title}</p>
        <p class="text-[11px] font-black text-red-600">TWD ${Number(tour.price).toLocaleString()}</p>
        <div class="bg-[#00B900] text-white text-center py-2 rounded-lg text-[10px] font-black mt-2">${cta}</div>
      </div>
    </div>`).join('');
}

// ── 組裝最終 Flex JSON ────────────────────────────────────────
function buildFinalFlex(items) {
  const uid      = liffProfile?.userId || '';
  const cta      = document.getElementById('cta-text')?.value || '查看行程 / 立即報名';
  const socBtns  = getCheckedSocButtons();

  // ── 單頁 / 輪播 Bubble ──
  const makeBubble = (tour) => {
    const tourId = String(tour.id || tour.timestamp || '');
    const uri    = `${ENDPOINT_URL}?t=${tourId}&r=${uid}`;
    return {
      type: 'bubble', size: 'mega',
      hero: {
        type: 'image', url: tour.image || 'https://via.placeholder.com/800x520',
        size: 'full', aspectRatio: '20:13', aspectMode: 'cover',
        action: { type: 'uri', uri }
      },
      body: {
        type: 'box', layout: 'vertical', spacing: 'md', paddingAll: '20px',
        contents: [
          { type: 'text', text: tour.title,  weight: 'bold', size: 'lg', wrap: true, color: '#0f172a' },
          { type: 'text', text: `${tour.region || ''} · ${tour.days}天`, size: 'sm', color: '#64748b', margin: 'sm' },
          { type: 'text', text: `TWD ${Number(tour.price).toLocaleString()}`, weight: 'bold', size: 'xl', color: '#b82337', margin: 'md' },
        ]
      },
      footer: {
        type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '16px',
        contents: [
          { type: 'button', style: 'primary', color: '#00B900', height: 'md',
            action: { type: 'uri', label: cta, uri } },
          ...socBtns
        ]
      }
    };
  };

  // ── 列表模式：一個 Bubble 包含多行 ──
  const makeListBubble = (items) => ({
    type: 'bubble', size: 'mega',
    header: {
      type: 'box', layout: 'vertical', backgroundColor: '#0f172a', paddingAll: '20px',
      contents: [
        { type: 'text', text: '✈️ 精選行程推薦', weight: 'bold', color: '#ffffff', size: 'lg' },
        { type: 'text', text: `共 ${items.length} 條行程`, color: '#94a3b8', size: 'sm', margin: 'sm' }
      ]
    },
    body: {
      type: 'box', layout: 'vertical', spacing: 'md', paddingAll: '16px',
      contents: items.map(tour => {
        const tourId = String(tour.id || tour.timestamp || '');
        const uri    = `${ENDPOINT_URL}?t=${tourId}&r=${uid}`;
        return {
          type: 'box', layout: 'horizontal', spacing: 'md',
          action: { type: 'uri', uri },
          contents: [
            {
              type: 'image',
              url: tour.image || 'https://via.placeholder.com/200x140',
              flex: 2, aspectRatio: '4:3', aspectMode: 'cover', cornerRadius: '8px'
            },
            {
              type: 'box', layout: 'vertical', flex: 3, spacing: 'xs',
              contents: [
                { type: 'text', text: tour.title, weight: 'bold', size: 'sm', wrap: true, maxLines: 2, color: '#0f172a' },
                { type: 'text', text: `${tour.region || ''} · ${tour.days}天`, size: 'xxs', color: '#64748b' },
                { type: 'text', text: `TWD ${Number(tour.price).toLocaleString()}`, weight: 'bold', size: 'sm', color: '#b82337' },
              ]
            }
          ]
        };
      })
    },
    footer: {
      type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '16px',
      contents: socBtns.length ? socBtns : [
        { type: 'text', text: '點擊各行程查看詳情', size: 'xs', color: '#94a3b8', align: 'center' }
      ]
    }
  });

  if (mode === 'multi') {
    // 每 6 筆一個 Bubble，超過 6 筆自動分頁
    const chunks = [];
    for (let i = 0; i < items.length; i += 6) chunks.push(items.slice(i, i + 6));
    const bubbles = chunks.map(makeListBubble);
    return {
      type: 'flex',
      altText: `精選行程推薦：${items[0].title} 等 ${items.length} 條`,
      contents: bubbles.length === 1 ? bubbles[0] : { type: 'carousel', contents: bubbles }
    };
  }

  const bubbles = items.map(makeBubble);
  return {
    type: 'flex',
    altText: `推薦行程：${items[0].title}`,
    contents: mode === 'carousel' ? { type: 'carousel', contents: bubbles } : bubbles[0]
  };
}

// ── 發送 ─────────────────────────────────────────────────────
async function sendTargetPicker() {
  const items = Array.from(selectedIds)
    .map(id => itineraries.find(i => String(i.id || i.timestamp || '') === id))
    .filter(Boolean);
  if (items.length === 0) { showToast('請先選取行程'); return; }

  // 確保已登入（PC 外部瀏覽器也支援，SDK 會自動用 POST 換 OTT 開小視窗）
  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: window.location.href });
    return;
  }

  const flexMsg = buildFinalFlex(items);
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full mr-2"></span>發送中...';

  try {
    // 完全信任官方 SDK：不論手機或 PC，SDK 自動用 POST 換 OTT，
    // 即使是 10 頁 Carousel 也能正常運作。
    const res = await liff.shareTargetPicker([flexMsg]);
    if (res) {
      showToast('✅ 名片已成功發送！');
      closeById('promo-modal');
      clearSelection();
    }
  } catch (e) {
    console.error('ShareTargetPicker error:', e);

    // 終極防呆：若報 not allowed，99% 是瀏覽器快取了舊 Token
    // 後台剛開啟 Share Target Picker 權限時最常發生
    if (e.message && e.message.toLowerCase().includes('not allowed')) {
      if (confirm('⚠️ 系統權限已更新，需要重新登入以取得最新權限。
是否立即重新登入？')) {
        liff.logout();
        window.location.reload();
      }
    } else {
      showToast('發送取消或發生未知錯誤：' + e.message, true);
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🚀 立即分享給好友（通訊錄）';
  }
}

// ── 複製 Flex JSON ────────────────────────────────────────────
function copyFlexJson() {
  const items = Array.from(selectedIds)
    .map(id => itineraries.find(i => String(i.id || i.timestamp || '') === id))
    .filter(Boolean);
  if (items.length === 0) { showToast('請先選取行程'); return; }

  const json = JSON.stringify(buildFinalFlex(items), null, 2);
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(json).then(() => showToast('✅ Flex JSON 已複製到剪貼簿'));
  } else {
    // 降級方案
    const ta = document.createElement('textarea');
    ta.value = json;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ Flex JSON 已複製到剪貼簿');
  }
}

// ── 分銷商資料編輯 Modal ──────────────────────────────────────
const PROFILE_FIELDS = [
  { key:'phone',      label:'聯絡電話',       placeholder:'0912-345-678', type:'tel' },
  { key:'lineLink',   label:'LINE 個人連結',  placeholder:'https://line.me/ti/p/~xxx', type:'url' },
  { key:'lineAtLink', label:'LINE@ 連結',     placeholder:'https://line.me/R/ti/p/@xxx', type:'url' },
  { key:'fbLink',     label:'Facebook 連結',  placeholder:'https://facebook.com/yourpage', type:'url' },
  { key:'webLink',    label:'個人/公司網站',  placeholder:'https://yoursite.com', type:'url' },
  { key:'mapLink',    label:'Google 地圖導航',placeholder:'https://maps.app.goo.gl/xxx', type:'url' },
  { key:'tgToken',    label:'Telegram 連結',  placeholder:'https://t.me/username', type:'url' },
];

function openProfileModal() {
  const container = document.getElementById('profile-fields');
  container.innerHTML = PROFILE_FIELDS.map(f => `
    <div>
      <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${f.label}</label>
      <input id="pf-${f.key}" type="${f.type}" value="${distData?.[f.key] || ''}"
        placeholder="${f.placeholder}"
        class="w-full mt-1 border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-emerald-500 bg-slate-50 transition" />
    </div>`).join('');
  document.getElementById('profile-modal').classList.add('open');
}

async function saveProfile() {
  const btn = document.getElementById('save-profile-btn');
  btn.disabled = true; btn.innerText = '儲存中...';

  const updates = {};
  PROFILE_FIELDS.forEach(f => {
    updates[f.key] = document.getElementById(`pf-${f.key}`)?.value?.trim() || '';
  });

  // 更新本地 distData
  distData = { ...(distData || {}), ...updates };

  try {
    // POST 更新到 GAS Distributors 表
    const res    = await fetch(`${WORKER_URL}/api/itineraries`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'updateDistributorProfile',
        uid:    liffProfile.userId,
        ...updates
      })
    });
    const result = await res.json();
    if (result.success) {
      showToast('✅ 名片資料已儲存');
      closeById('profile-modal');
    } else {
      showToast('⚠️ 儲存失敗：' + (result.error || ''), true);
    }
  } catch (e) {
    showToast('⚠️ 網路錯誤，資料僅暫存於本次使用', true);
    closeById('profile-modal');
  } finally {
    btn.disabled = false; btn.innerText = '儲存名片資料';
  }
}

// ── 工具 ──────────────────────────────────────────────────────
function closeById(id) { document.getElementById(id).classList.remove('open'); }
function closeModal(e, id) { if (e.target.id === id) closeById(id); }

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = isError ? 'error show' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3000);
}
</script>
