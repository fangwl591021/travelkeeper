<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客戶 CRM | TravelKeeper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./js/tenant-api-client.js"></script>
  <script src="./js/tenant-page-client.js"></script>
  <script src="./js/tenant-crm-client.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background: #f4f7fb; }
    [hidden] { display:none !important; }
    .scrollbar::-webkit-scrollbar { width:8px; height:8px; }
    .scrollbar::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
    .shell { display:grid; grid-template-columns:minmax(660px,1fr) minmax(360px,440px); gap:18px; align-items:start; }
    @media (max-width:1100px) { .shell { grid-template-columns:1fr; } #detail-panel { position:static !important; max-height:none !important; } }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <div class="mx-auto max-w-[1760px] px-4 py-5 md:px-6">
    <header class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
      <div>
        <p class="text-xs font-black tracking-[0.25em] text-slate-400">TENANT CRM · PHASE 11</p>
        <h1 class="mt-2 text-3xl font-black">客戶 CRM</h1>
        <p id="tenant-label" class="mt-2 text-sm text-slate-500">正在確認租戶與權限…</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a id="dashboard-link" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50">回後台</a>
        <button id="reload-btn" class="rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-blue-700">重新載入</button>
        <button id="csv-btn" class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-bold text-white hover:bg-slate-800">匯出 CSV</button>
      </div>
    </header>

    <div id="notice" hidden class="mt-4 rounded-2xl border px-4 py-3 text-sm font-bold"></div>

    <section class="mt-5 grid grid-cols-2 gap-3 md:grid-cols-5">
      <div class="rounded-2xl bg-slate-900 p-4 text-white"><p class="text-xs text-slate-300">客戶數</p><p id="stat-customers" class="mt-2 text-3xl font-black">0</p></div>
      <div class="rounded-2xl bg-blue-600 p-4 text-white"><p class="text-xs text-blue-100">有聯絡資料</p><p id="stat-identities" class="mt-2 text-3xl font-black">0</p></div>
      <div class="rounded-2xl bg-emerald-600 p-4 text-white"><p class="text-xs text-emerald-100">累計消費</p><p id="stat-revenue" class="mt-2 text-2xl font-black">NT$ 0</p></div>
      <div class="rounded-2xl bg-amber-500 p-4 text-white"><p class="text-xs text-amber-50">訂單數</p><p id="stat-orders" class="mt-2 text-3xl font-black">0</p></div>
      <div class="col-span-2 rounded-2xl bg-rose-500 p-4 text-white md:col-span-1"><p class="text-xs text-rose-100">待跟進</p><p id="stat-followups" class="mt-2 text-3xl font-black">0</p></div>
    </section>

    <section class="mt-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-3 md:grid-cols-6">
        <label class="md:col-span-2"><span class="mb-1 block text-xs font-bold text-slate-500">搜尋</span><input id="search" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 outline-none focus:border-blue-500" placeholder="姓名、電話、LINE UID、備註、需求"></label>
        <label><span class="mb-1 block text-xs font-bold text-slate-500">來源</span><select id="source" class="w-full rounded-xl border border-slate-200 px-3 py-2.5"><option value="all">全部</option><option value="order">訂單</option><option value="line">LINE</option><option value="manual">手動</option><option value="import">匯入</option></select></label>
        <label><span class="mb-1 block text-xs font-bold text-slate-500">狀態</span><select id="status" class="w-full rounded-xl border border-slate-200 px-3 py-2.5"><option value="all">全部</option><option value="open">待回覆</option><option value="pending">處理中</option><option value="closed">已處理</option></select></label>
        <label><span class="mb-1 block text-xs font-bold text-slate-500">風險</span><select id="risk" class="w-full rounded-xl border border-slate-200 px-3 py-2.5"><option value="all">全部</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label>
        <label><span class="mb-1 block text-xs font-bold text-slate-500">商機階段</span><select id="stage" class="w-full rounded-xl border border-slate-200 px-3 py-2.5"><option value="all">全部</option><option value="new">新客</option><option value="qualified">確認需求</option><option value="quoted">已報價</option><option value="payment">付款中</option><option value="won">成交</option><option value="lost">流失</option></select></label>
      </div>
    </section>

    <section class="shell mt-5">
      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <div><h2 class="text-lg font-black">客戶名單</h2><p id="result-count" class="mt-1 text-xs text-slate-400">0 筆</p></div>
        </div>
        <div class="max-h-[72vh] overflow-auto scrollbar">
          <table class="min-w-[980px] w-full text-left text-sm">
            <thead class="sticky top-0 bg-slate-50 text-xs font-bold text-slate-400"><tr><th class="px-5 py-3">客戶</th><th class="px-4 py-3">聯絡</th><th class="px-4 py-3">商機</th><th class="px-4 py-3 text-right">消費</th><th class="px-4 py-3">最近互動</th><th class="px-4 py-3">操作</th></tr></thead>
            <tbody id="customer-rows" class="divide-y divide-slate-100"></tbody>
          </table>
          <div id="empty" hidden class="p-12 text-center font-bold text-slate-400">沒有符合條件的 CRM 客戶。</div>
        </div>
      </div>

      <aside id="detail-panel" class="sticky top-4 max-h-[calc(100vh-32px)] overflow-auto rounded-2xl border border-slate-200 bg-white shadow-sm scrollbar">
        <div id="detail" class="p-5 text-sm text-slate-500">請從左側選擇客戶。</div>
      </aside>
    </section>
  </div>

  <div id="toast" hidden class="fixed left-1/2 top-4 z-50 -translate-x-1/2 rounded-xl px-5 py-3 font-bold text-white shadow-2xl"></div>

<script>
(function () {
  'use strict';
  const tenantPage = window.TravelKeeperTenantPage;
  const crmApi = window.TravelKeeperTenantCrm;
  const LIFF_ID = '2009367829-BDZCGti8';
  const state = { session:null, customers:[], filtered:[], selectedId:'' };
  const el = id => document.getElementById(id);
  const fmt = n => 'NT$ ' + Math.round(Number(n || 0)).toLocaleString();
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const labels = {
    status:{open:'待回覆',pending:'處理中',closed:'已處理'},
    risk:{low:'低',medium:'中',high:'高'},
    stage:{new:'新客',qualified:'確認需求',quoted:'已報價',payment:'付款中',won:'成交',lost:'流失'},
  };

  function toast(message, error=false) {
    const node = el('toast');
    node.hidden = false;
    node.textContent = message;
    node.className = 'fixed left-1/2 top-4 z-50 -translate-x-1/2 rounded-xl px-5 py-3 font-bold text-white shadow-2xl ' + (error ? 'bg-red-600' : 'bg-emerald-600');
    setTimeout(() => { node.hidden = true; }, 2600);
  }

  function showNotice(message, error=false) {
    const node = el('notice');
    node.hidden = false;
    node.textContent = message;
    node.className = 'mt-4 rounded-2xl border px-4 py-3 text-sm font-bold ' + (error ? 'border-red-200 bg-red-50 text-red-700' : 'border-blue-200 bg-blue-50 text-blue-700');
  }

  function customerSearch(customer) {
    return [customer.name, customer.userId, customer.phone, customer.email, customer.summary, customer.note,
      customer.identityNote, customer.preferenceNote, customer.tabooNote, customer.opportunityNote,
      ...(customer.tags || []), ...(customer.visitorRecords || []).flatMap(r => [r.category,r.content,r.status,r.priority]),
      ...(customer.orders || []).flatMap(o => [o.title,o.customerName,o.phone,o.status])].join(' ').toLowerCase();
  }

  function applyFilters() {
    const q = el('search').value.trim().toLowerCase();
    const source = el('source').value;
    const status = el('status').value;
    const risk = el('risk').value;
    const stage = el('stage').value;
    state.filtered = state.customers.filter(c => {
      if (q && !customerSearch(c).includes(q)) return false;
      if (source !== 'all' && c.source !== source) return false;
      if (status !== 'all' && c.status !== status) return false;
      if (risk !== 'all' && c.risk !== risk) return false;
      if (stage !== 'all' && c.opportunityStage !== stage) return false;
      return true;
    });
    renderStats();
    renderRows();
  }

  function renderStats() {
    el('stat-customers').textContent = state.filtered.length;
    el('stat-identities').textContent = state.filtered.filter(c => c.hasIdentity).length;
    el('stat-revenue').textContent = fmt(state.filtered.reduce((sum,c) => sum + Number(c.totalAmount || 0), 0));
    el('stat-orders').textContent = state.filtered.reduce((sum,c) => sum + Number(c.orderCount || 0), 0);
    el('stat-followups').textContent = state.filtered.filter(c => c.risk === 'high' || (c.visitorRecords || []).some(r => r.status === 'follow_up' || r.priority === 'high')).length;
  }

  function badge(text, tone) {
    const map = {blue:'bg-blue-50 text-blue-700',green:'bg-emerald-50 text-emerald-700',amber:'bg-amber-50 text-amber-700',red:'bg-red-50 text-red-700',slate:'bg-slate-100 text-slate-600'};
    return `<span class="rounded-full px-2 py-1 text-[11px] font-bold ${map[tone] || map.slate}">${esc(text)}</span>`;
  }

  function renderRows() {
    el('result-count').textContent = `${state.filtered.length} 筆`;
    el('empty').hidden = state.filtered.length > 0;
    el('customer-rows').innerHTML = state.filtered.map(c => {
      const selected = c.id === state.selectedId ? 'bg-blue-50' : 'hover:bg-slate-50';
      const riskTone = c.risk === 'high' ? 'red' : c.risk === 'medium' ? 'amber' : 'green';
      return `<tr class="${selected}">
        <td class="px-5 py-4"><p class="font-black text-slate-900">${esc(c.name)}</p><p class="mt-1 font-mono text-[11px] text-slate-400">${esc(c.customerId || c.id)}</p>${badge(c.source || 'order','slate')}</td>
        <td class="px-4 py-4"><p class="font-bold text-slate-700">${esc(c.phone || '無電話')}</p><p class="mt-1 text-xs text-slate-400">${esc(c.email || c.userId || '無 Email / LINE UID')}</p></td>
        <td class="px-4 py-4"><div class="flex flex-wrap gap-1">${badge(labels.stage[c.opportunityStage] || c.opportunityStage,'blue')}${badge(labels.risk[c.risk] || c.risk,riskTone)}</div><p class="mt-2 max-w-[240px] truncate text-xs text-slate-500">${esc(c.opportunityNote || c.summary || '尚未建立需求')}</p></td>
        <td class="px-4 py-4 text-right"><p class="font-black text-slate-900">${fmt(c.totalAmount)}</p><p class="text-xs text-slate-400">${Number(c.orderCount || 0)} 筆訂單</p></td>
        <td class="px-4 py-4"><p class="text-xs text-slate-500">${esc(c.lastMessageAt || c.lastOrderAt || '-')}</p><p class="mt-1 max-w-[220px] truncate text-xs text-slate-400">${esc(c.latestRecord?.content || '')}</p></td>
        <td class="px-4 py-4"><button data-id="${esc(c.id)}" class="open-detail rounded-lg bg-slate-900 px-3 py-2 text-xs font-bold text-white">查看</button></td>
      </tr>`;
    }).join('');
    document.querySelectorAll('.open-detail').forEach(btn => btn.addEventListener('click', () => selectCustomer(btn.dataset.id)));
  }

  function input(label, id, value='', type='text') {
    return `<label class="block"><span class="mb-1 block text-xs font-bold text-slate-500">${label}</span><input id="${id}" type="${type}" value="${esc(value)}" class="w-full rounded-xl border border-slate-200 px-3 py-2 outline-none focus:border-blue-500"></label>`;
  }

  function textarea(label, id, value='', rows=2) {
    return `<label class="block"><span class="mb-1 block text-xs font-bold text-slate-500">${label}</span><textarea id="${id}" rows="${rows}" class="w-full rounded-xl border border-slate-200 px-3 py-2 outline-none focus:border-blue-500">${esc(value)}</textarea></label>`;
  }

  function selectCustomer(id) {
    state.selectedId = id;
    renderRows();
    const c = state.customers.find(item => item.id === id);
    if (!c) return;
    const records = c.visitorRecords || [];
    const orders = c.orders || [];
    el('detail').innerHTML = `
      <div class="flex items-start justify-between gap-3"><div><p class="text-xs font-bold tracking-widest text-slate-400">CRM PROFILE</p><h2 class="mt-1 text-2xl font-black text-slate-900">${esc(c.name)}</h2><p class="mt-1 font-mono text-xs text-slate-400">${esc(c.id)}</p></div>${badge(labels.status[c.status] || c.status,'blue')}</div>
      <section class="mt-5 space-y-3">
        <div class="grid grid-cols-2 gap-3">${input('姓名','f-name',c.name)}${input('電話','f-phone',c.phone)}</div>
        <div class="grid grid-cols-2 gap-3">${input('Email','f-email',c.email,'email')}${input('生日','f-birthday',c.birthday,'date')}</div>
        ${input('地址','f-address',c.address)}
        <div class="grid grid-cols-2 gap-3"><label><span class="mb-1 block text-xs font-bold text-slate-500">處理狀態</span><select id="f-status" class="w-full rounded-xl border border-slate-200 px-3 py-2">${['open','pending','closed'].map(v=>`<option value="${v}" ${c.status===v?'selected':''}>${labels.status[v]}</option>`).join('')}</select></label><label><span class="mb-1 block text-xs font-bold text-slate-500">風險</span><select id="f-risk" class="w-full rounded-xl border border-slate-200 px-3 py-2">${['low','medium','high'].map(v=>`<option value="${v}" ${c.risk===v?'selected':''}>${labels.risk[v]}</option>`).join('')}</select></label></div>
        <label><span class="mb-1 block text-xs font-bold text-slate-500">商機階段</span><select id="f-stage" class="w-full rounded-xl border border-slate-200 px-3 py-2">${['new','qualified','quoted','payment','won','lost'].map(v=>`<option value="${v}" ${c.opportunityStage===v?'selected':''}>${labels.stage[v]}</option>`).join('')}</select></label>
        ${input('預估金額','f-value',c.opportunityValue,'number')}
        ${textarea('商機備註','f-opportunity',c.opportunityNote)}
        ${textarea('證件／個資備註','f-identity',c.identityNote)}
        ${textarea('旅遊偏好','f-preference',c.preferenceNote)}
        ${textarea('禁忌／注意事項','f-taboo',c.tabooNote)}
        ${textarea('一般備註','f-note',c.note)}
        <button id="save-profile" class="w-full rounded-xl bg-blue-600 px-4 py-3 font-black text-white hover:bg-blue-700">儲存 CRM 主檔</button>
      </section>
      <section class="mt-6 border-t border-slate-100 pt-5"><h3 class="font-black">新增重要紀錄</h3><div class="mt-3 space-y-2"><div class="grid grid-cols-2 gap-2">${input('分類','r-category','需求')}${input('到期日','r-due','', 'date')}</div>${textarea('內容','r-content','',3)}<div class="grid grid-cols-2 gap-2"><label><span class="mb-1 block text-xs font-bold text-slate-500">狀態</span><select id="r-status" class="w-full rounded-xl border border-slate-200 px-3 py-2"><option value="open">一般</option><option value="follow_up">待跟進</option><option value="done">完成</option></select></label><label><span class="mb-1 block text-xs font-bold text-slate-500">優先度</span><select id="r-priority" class="w-full rounded-xl border border-slate-200 px-3 py-2"><option value="normal">一般</option><option value="high">高</option><option value="low">低</option></select></label></div><button id="add-record" class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-black text-white hover:bg-emerald-700">新增紀錄</button></div></section>
      <section class="mt-6 border-t border-slate-100 pt-5"><h3 class="font-black">重要紀錄</h3><div class="mt-3 space-y-2">${records.length ? records.map(r=>`<div class="rounded-xl border border-slate-200 p-3"><div class="flex justify-between gap-2"><p class="text-xs font-bold text-slate-400">${esc(r.category)} · ${esc(r.status)} · ${esc(r.priority)}</p><button data-record="${esc(r.id)}" class="delete-record text-xs font-bold text-red-500">刪除</button></div><p class="mt-2 whitespace-pre-wrap text-slate-700">${esc(r.content)}</p><p class="mt-2 text-[11px] text-slate-400">${esc(r.createdAt || r.created_at || '')}</p></div>`).join('') : '<p class="rounded-xl border border-dashed border-slate-200 p-4 text-slate-400">尚無重要紀錄。</p>'}</div></section>
      <section class="mt-6 border-t border-slate-100 pt-5"><h3 class="font-black">訂單歷程</h3><div class="mt-3 space-y-2">${orders.length ? orders.slice(0,20).map(o=>`<div class="rounded-xl border border-slate-200 p-3"><div class="flex justify-between gap-3"><p class="font-bold text-slate-800">${esc(o.title || o.itinerary_title)}</p><p class="font-black">${fmt(o.amount || o.total_amount)}</p></div><p class="mt-1 text-xs text-slate-400">${esc(o.order_id || o.id)} · ${esc(o.status)} · ${esc(o.createdAt || o.created_at || '')}</p></div>`).join('') : '<p class="rounded-xl border border-dashed border-slate-200 p-4 text-slate-400">尚無訂單。</p>'}</div></section>`;

    el('save-profile').addEventListener('click', () => saveProfile(c));
    el('add-record').addEventListener('click', () => addRecord(c));
    document.querySelectorAll('.delete-record').forEach(btn => btn.addEventListener('click', () => deleteRecord(c, btn.dataset.record)));
  }

  async function saveProfile(c) {
    try {
      const payload = {
        customer_id:c.customerId || c.customer_id || '', line_user_uid:c.userId || '', owner_uid:c.ownerUid || c.owner_uid || '',
        display_name:el('f-name').value, phone:el('f-phone').value, email:el('f-email').value, birthday:el('f-birthday').value,
        address:el('f-address').value, status:el('f-status').value, risk:el('f-risk').value,
        opportunity_stage:el('f-stage').value, opportunity_value:Number(el('f-value').value || 0), opportunity_note:el('f-opportunity').value,
        identity_note:el('f-identity').value, preference_note:el('f-preference').value, taboo_note:el('f-taboo').value,
        note:el('f-note').value, source:c.source || 'manual', tags:c.tags || [], last_message_at:c.lastMessageAt || ''
      };
      await crmApi.saveProfile(payload, c.profileId || c.id);
      toast('CRM 主檔已儲存');
      await loadCrm(c.id);
    } catch (error) { toast(tenantPage.friendlyError(error), true); }
  }

  async function addRecord(c) {
    const content = el('r-content').value.trim();
    if (!content) { toast('請輸入紀錄內容', true); return; }
    try {
      await crmApi.saveRecord({ profile_id:c.profileId || c.id, thread_id:c.lineThreadId || '', category:el('r-category').value, content, status:el('r-status').value, priority:el('r-priority').value, due_at:el('r-due').value });
      toast('重要紀錄已新增');
      await loadCrm(c.id);
    } catch (error) { toast(tenantPage.friendlyError(error), true); }
  }

  async function deleteRecord(c, recordId) {
    if (!confirm('確定刪除此紀錄？')) return;
    try { await crmApi.deleteRecord(recordId); toast('紀錄已刪除'); await loadCrm(c.id); }
    catch (error) { toast(tenantPage.friendlyError(error), true); }
  }

  async function loadCrm(reselect='') {
    el('reload-btn').disabled = true;
    try {
      const result = await crmApi.load();
      state.customers = result.data || [];
      state.selectedId = reselect || state.selectedId;
      applyFilters();
      if (state.selectedId) selectCustomer(state.selectedId);
      el('tenant-label').textContent = `租戶：${result.tenantSlug}｜角色：${result.role}｜CRM 主檔、對話與訂單皆為租戶隔離`;
      showNotice(`已載入 ${state.customers.length} 筆 CRM 客戶。`);
    } catch (error) {
      state.customers = []; applyFilters();
      const message = tenantPage.friendlyError(error);
      showNotice(message, true);
      el('tenant-label').textContent = `租戶：${tenantPage.tenantSlug}｜無法載入 CRM`;
    } finally { el('reload-btn').disabled = false; }
  }

  function csvCell(value) { return `"${String(value ?? '').replace(/\r?\n/g,' ').replace(/"/g,'""')}"`; }
  function downloadCsv() {
    const header = ['客戶ID','姓名','LINE UID','電話','Email','來源','狀態','風險','商機階段','訂單數','總消費','最近互動'];
    const rows = state.filtered.map(c => [c.customerId || c.id,c.name,c.userId,c.phone,c.email,c.source,labels.status[c.status]||c.status,labels.risk[c.risk]||c.risk,labels.stage[c.opportunityStage]||c.opportunityStage,c.orderCount,c.totalAmount,c.lastMessageAt||c.lastOrderAt]);
    const csv = '\ufeff' + [header,...rows].map(row=>row.map(csvCell).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a'); a.href=url; a.download=`travelkeeper-crm-${tenantPage.tenantSlug}-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(url);
  }

  async function init() {
    try {
      state.session = await tenantPage.initLiffSession({ fallbackLiffId:LIFF_ID, requireContext:true });
      const query = new URLSearchParams(location.search);
      el('dashboard-link').href = `./dashboard.html?${query.toString()}`;
      await loadCrm();
    } catch (error) {
      if (String(error?.message || '') !== 'LIFF_LOGIN_REQUIRED') showNotice(tenantPage.friendlyError(error), true);
    }
  }

  ['input','change'].forEach(eventName => ['search','source','status','risk','stage'].forEach(id => el(id).addEventListener(eventName, applyFilters)));
  el('reload-btn').addEventListener('click', () => loadCrm());
  el('csv-btn').addEventListener('click', downloadCsv);
  init();
})();
</script>
</body>
</html>
